<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Детектор информационной тишины — Crucix</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a0f;
      color: #c8d0d8;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', monospace;
      font-size: 13px;
      line-height: 1.5;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .topbar {
      position: fixed; top: 0; left: 0; right: 0; height: 60px;
      background: rgba(10, 10, 20, 0.92); backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.04); z-index: 100;
      display: flex; justify-content: space-between; align-items: center; padding: 0 20px;
    }
    .topbar-left { display: flex; align-items: center; gap: 12px; }
    .topbar-brand { font-size: 14px; font-weight: 700; color: #5bc0f8; text-transform: uppercase; letter-spacing: 2px; }
    .topbar-status { font-size: 11px; color: #ffd700; }

    .topbar-right { display: flex; align-items: center; gap: 6px; }
    .topbar-btn {
      height: 28px; padding: 0 12px; border: 1px solid rgba(255,255,255,0.08); border-radius: 4px;
      background: rgba(255,255,255,0.03); color: #888; font-size: 11px; font-weight: 500;
      text-transform: uppercase; cursor: pointer; transition: all 0.2s;
      display: flex; align-items: center; gap: 4px;
    }
    .topbar-btn:hover { background: rgba(255,255,255,0.06); transform: translateY(-1px); }
    .btn-home { color: #5bc0f8; border-color: rgba(91,192,248,0.2); background: rgba(91,192,248,0.06); }
    .btn-home:hover { background: rgba(91,192,248,0.15); }
    .btn-copy { color: #5bc0f8; border-color: rgba(91,192,248,0.15); background: rgba(91,192,248,0.06); }
    .btn-copy:hover { background: rgba(91,192,248,0.15); }
    .btn-grid { color: #9c27b0; border-color: rgba(156,39,176,0.15); background: rgba(156,39,176,0.06); }
    .btn-grid:hover { background: rgba(156,39,176,0.15); }
    .btn-grid.active { background: rgba(156,39,176,0.2); border-color: rgba(156,39,176,0.3); }

    .lang-switch {
      display: flex; gap: 2px; padding: 2px;
      background: rgba(255,255,255,0.03); border-radius: 4px; border: 1px solid rgba(255,255,255,0.06);
    }
    .lang-btn { padding: 2px 8px; border: none; background: transparent; color: #666; font-size: 11px; font-weight: 500; cursor: pointer; border-radius: 3px; transition: all 0.2s; }
    .lang-btn:hover { color: #888; background: rgba(255,255,255,0.05); }
    .lang-btn.active { color: #5bc0f8; background: rgba(91,192,248,0.1); }

    .main-content { padding-top: 76px; max-width: 1200px; margin: 0 auto; padding-left: 20px; padding-right: 20px; padding-bottom: 40px; }
    .page-title { font-size: 24px; font-weight: 700; color: #e8f0f8; margin-bottom: 20px; }

    .stats-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 16px;
    }
    .stat-card {
      background: rgba(10,10,20,0.5); border: 1px solid rgba(255,255,255,0.04); border-radius: 8px;
      padding: 12px 16px; text-align: center; transition: all 0.2s; cursor: default;
    }
    .stat-card:hover { border-color: rgba(255,255,255,0.08); }
    .stat-card .stat-label { font-size: 10px; text-transform: uppercase; color: #666; letter-spacing: 0.5px; display: block; }
    .stat-card .stat-value { font-size: 24px; font-weight: 700; color: #e8f0f8; display: block; margin: 4px 0; }
    .stat-card .stat-sub { font-size: 10px; color: #666; display: block; }

    .regions-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; margin-bottom: 16px;
    }
    .region-card {
      background: rgba(10,10,20,0.5); border: 1px solid rgba(255,255,255,0.04); border-radius: 8px; padding: 12px 16px;
      border-left: 3px solid #4caf50; transition: all 0.2s;
    }
    .region-card:hover { border-color: rgba(255,255,255,0.12); transform: translateY(-2px); }
    .region-card .name { font-size: 14px; font-weight: 600; color: #e8f0f8; }
    .region-card .status { font-size: 12px; }
    .region-card .details { font-size: 11px; color: #888; margin-top: 4px; }
    .region-card .score { font-size: 13px; font-weight: 700; }
    .region-card.critical { border-left-color: #f44336; }
    .region-card.high { border-left-color: #f26522; }
    .region-card.medium { border-left-color: #ffd700; }
    .region-card.low { border-left-color: #4caf50; }
    .region-card.none { border-left-color: #4caf50; }

    .alert-item {
      display: flex; align-items: center; gap: 12px; padding: 8px 16px;
      background: rgba(10,10,20,0.3); border: 1px solid rgba(255,255,255,0.03); border-radius: 4px;
      margin-bottom: 6px; border-left: 3px solid #f44336;
    }
    .alert-item .info { flex: 1; }
    .alert-item .info .title { font-size: 13px; color: #e8f0f8; }
    .alert-item .info .desc { font-size: 11px; color: #888; }
    .alert-item .severity { font-size: 10px; font-weight: 600; padding: 2px 10px; border-radius: 12px; text-transform: uppercase; }
    .alert-item .severity.critical { background: rgba(244,67,54,0.2); color: #f44336; }
    .alert-item .severity.high { background: rgba(242,101,34,0.2); color: #f26522; }
    .alert-item .severity.medium { background: rgba(255,215,0,0.2); color: #ffd700; }

    .chart-container {
      background: rgba(10,10,20,0.5); border: 1px solid rgba(255,255,255,0.04); border-radius: 8px; padding: 16px; height: 220px; margin-bottom: 16px;
    }
    .chart-container canvas { width: 100% !important; height: calc(100% - 30px) !important; }
    .chart-container .title { font-size: 12px; color: #666; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }

    #coordinate-grid {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 99999;
      background-image: linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
      background-size: 50px 50px; display: none;
    }
    #coordinate-grid.visible { display: block; }
    #grid-coords {
      position: fixed; bottom: 12px; right: 12px; background: rgba(0,0,0,0.7);
      color: #00ff00; font-family: monospace; font-size: 11px; padding: 4px 10px; border-radius: 4px;
      z-index: 100000; pointer-events: none; display: none;
    }
    #grid-coords.visible { display: block; }

    .notification {
      position: fixed; bottom: 60px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.85); color: #fff; padding: 8px 20px; border-radius: 6px;
      font-size: 13px; z-index: 100001; border: 1px solid rgba(255,255,255,0.1);
      animation: notif-fade 2.5s forwards;
    }
    @keyframes notif-fade {
      0% { opacity: 0; transform: translateX(-50%) translateY(10px); }
      10% { opacity: 1; transform: translateX(-50%) translateY(0); }
      80% { opacity: 1; transform: translateX(-50%) translateY(0); }
      100% { opacity: 0; transform: translateX(-50%) translateY(-20px); }
    }

    @media (max-width: 768px) {
      .topbar { padding: 0 12px; height: 52px; }
      .topbar-brand { font-size: 12px; }
      .topbar-status { display: none; }
      .topbar-btn { font-size: 10px; padding: 0 8px; height: 24px; }
      .main-content { padding-top: 68px; padding-left: 12px; padding-right: 12px; }
      .page-title { font-size: 18px; }
      .regions-grid { grid-template-columns: 1fr 1fr; }
    }
    @media (max-width: 480px) {
      .topbar { padding: 0 8px; height: 46px; }
      .topbar-brand { font-size: 10px; letter-spacing: 1px; }
      .topbar-btn { font-size: 9px; padding: 0 6px; height: 20px; }
      .topbar-btn .btn-text { display: none; }
      .lang-btn { font-size: 9px; padding: 1px 5px; }
      .main-content { padding-top: 62px; padding-left: 8px; padding-right: 8px; }
      .page-title { font-size: 16px; }
      .regions-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <header class="topbar">
    <div class="topbar-left">
      <span class="topbar-brand">⚡ CRUCIX MONITOR</span>
      <span class="topbar-status">МОДУЛЬ №18</span>
    </div>
    <div class="topbar-right">
      <button class="topbar-btn btn-home" onclick="window.location.href='/jarvis'">← НА ГЛАВНУЮ</button>
      <button class="topbar-btn btn-help" onclick="showHelp()">❓ HELP</button>
    <button class="topbar-btn btn-copy" id="copy-btn">📋 КОПИРОВАТЬ</button>
      <button class="topbar-btn btn-grid" id="grid-toggle">📐 СЕТКА</button>
      <div class="lang-switch">
        <button class="lang-btn active" data-lang="ru" onclick="switchLang('ru')">RU</button>
        <button class="lang-btn" data-lang="en" onclick="switchLang('en')">EN</button>
      </div>
    </div>
  </header>

  <main class="main-content">
    <h1 class="page-title" id="page-title">🔇 Детектор информационной тишины</h1>

    <div class="stats-grid" id="stats-grid">
      <div class="stat-card"><span class="stat-label">Регионов</span><span class="stat-value blue" id="stat-regions">—</span><span class="stat-sub">всего</span></div>
      <div class="stat-card"><span class="stat-label">Тишина</span><span class="stat-value red" id="stat-silent">—</span><span class="stat-sub">регионов</span></div>
      <div class="stat-card"><span class="stat-label">Оповещений</span><span class="stat-value orange" id="stat-alerts">—</span><span class="stat-sub">активных</span></div>
      <div class="stat-card"><span class="stat-label">Средняя активность</span><span class="stat-value yellow" id="stat-avg">—</span><span class="stat-sub">баллов</span></div>
    </div>

    <div class="regions-grid" id="regions-grid"></div>

    <h2 style="color:#888;font-size:14px;margin:8px 0;">📈 Динамика активности</h2>
    <div class="chart-container">
      <div class="title">Активность по регионам</div>
      <canvas id="activity-chart"></canvas>
    </div>

    <h2 style="color:#888;font-size:14px;margin:8px 0;">🚨 Активные оповещения</h2>
    <div id="alerts-list"></div>

  </main>

  <div id="coordinate-grid"></div>
  <div id="grid-coords">X: 0  Y: 0</div>

  <script>
    // ============================================================
    // 1. ПЕРЕКЛЮЧАТЕЛЬ ЯЗЫКА
    // ============================================================
    let currentLang = localStorage.getItem('crucix-lang') || 'ru';

    function switchLang(lang) {
      currentLang = lang;
      localStorage.setItem('crucix-lang', lang);
      document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.dataset.lang === lang));
      showNotification(`🌐 Язык: ${lang.toUpperCase()}`);
      updateTexts(lang);
    }

    document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.dataset.lang === currentLang));

    function updateTexts(lang) {
      const texts = {
        ru: { title: '🔇 Детектор информационной тишины' },
        en: { title: '🔇 Information Silence Detector' }
      };
      const t = texts[lang] || texts.ru;
      document.getElementById('page-title').textContent = t.title;
    }

    updateTexts(currentLang);

    // ============================================================
    // 2. КООРДИНАТНАЯ СЕТКА
    // ============================================================
    let gridVisible = false;
    document.addEventListener('keydown', function(e) {
      if (e.ctrlKey && e.shiftKey && e.key === 'G') { e.preventDefault(); toggleGrid(); }
    });
    document.getElementById('grid-toggle').addEventListener('click', toggleGrid);

    function toggleGrid() {
      gridVisible = !gridVisible;
      document.getElementById('coordinate-grid').classList.toggle('visible', gridVisible);
      document.getElementById('grid-coords').classList.toggle('visible', gridVisible);
      document.getElementById('grid-toggle').classList.toggle('active', gridVisible);
      if (gridVisible) {
        showNotification('⊞ Сетка включена (Ctrl+Shift+G для выключения)');
        document.addEventListener('mousemove', updateCoords);
      } else {
        showNotification('⊞ Сетка выключена');
        document.removeEventListener('mousemove', updateCoords);
      }
    }

    function updateCoords(e) {
      document.getElementById('grid-coords').textContent = `X: ${e.clientX}  Y: ${e.clientY}`;
    }

    function showNotification(msg) {
      const el = document.createElement('div');
      el.className = 'notification';
      el.textContent = msg;
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 2500);
    }

    // ============================================================
    // 3. ОСНОВНЫЕ ФУНКЦИИ
    // ============================================================
    let chart = null;

    async function loadData() {
      try {
        const resp = await fetch('/api/silence/regions');
        const data = await resp.json();
        if (data.success) {
          renderRegions(data.regions);
          renderStats(data.regions);
          renderChart(data.regions);
        }
      } catch(e) { console.error('[Silence] Ошибка загрузки:', e); }
    }

    async function loadAlerts() {
      try {
        const resp = await fetch('/api/silence/alerts');
        const data = await resp.json();
        if (data.success) {
          renderAlerts(data.alerts);
        }
      } catch(e) { console.error('[Silence] Ошибка загрузки оповещений:', e); }
    }

    function renderRegions(regions) {
      const container = document.getElementById('regions-grid');
      let html = '';
      const severityLabels = {
        critical: '🔴 ПОЛНАЯ ТИШИНА',
        high: '🟠 ИНФОРМАЦИОННЫЙ ВАКУУМ',
        medium: '🟡 ПОНИЖЕННАЯ АКТИВНОСТЬ',
        low: '🟢 НОРМАЛЬНАЯ АКТИВНОСТЬ',
        none: '🟢 АКТИВНО'
      };
      for (const r of regions) {
        const s = r.silence;
        const cls = s.severity || 'none';
        html += `
          <div class="region-card ${cls}">
            <div class="name">${r.name}</div>
            <div class="status">${s.emoji || '🟢'} ${s.label || 'Активно'}</div>
            <div class="details">Новости: ${r.activity.news} | Спутники: ${r.activity.satellite}</div>
            <div class="score">Всего: ${r.activity.total}</div>
          </div>
        `;
      }
      container.innerHTML = html;
    }

    function renderStats(regions) {
      const total = regions.length;
      const silent = regions.filter(r => r.silence.severity === 'critical' || r.silence.severity === 'high').length;
      const avg = Math.round(regions.reduce((s, r) => s + r.activity.total, 0) / total);
      document.getElementById('stat-regions').textContent = total;
      document.getElementById('stat-silent').textContent = silent;
      document.getElementById('stat-avg').textContent = avg;

      // Загружаем оповещения отдельно
      loadAlerts().then(() => {
        document.getElementById('stat-alerts').textContent = document.querySelectorAll('.alert-item').length || 0;
      });
    }

    function renderAlerts(alerts) {
      const container = document.getElementById('alerts-list');
      if (!alerts || !alerts.length) {
        container.innerHTML = '<div style="text-align:center;color:#666;padding:10px;">Оповещений нет</div>';
        return;
      }
      let html = '';
      for (const a of alerts) {
        html += `
          <div class="alert-item">
            <div class="info">
              <div class="title">${a.regionName} — ${a.message}</div>
              <div class="desc">${a.type} · ${new Date(a.timestamp).toLocaleString()}</div>
            </div>
            <span class="severity ${a.severity}">${a.severity}</span>
          </div>
        `;
      }
      container.innerHTML = html;
      document.getElementById('stat-alerts').textContent = alerts.length;
    }

    function renderChart(regions) {
      const ctx = document.getElementById('activity-chart').getContext('2d');
      if (chart) { chart.destroy(); }

      const labels = regions.map(r => r.name);
      const data = regions.map(r => r.activity.total);
      const colors = data.map(v =>
        v < 30 ? '#f44336' :
        v < 50 ? '#f26522' :
        v < 80 ? '#ffd700' : '#4caf50'
      );

      chart = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: labels,
          datasets: [{
            label: 'Информационная активность',
            data: data,
            backgroundColor: colors,
            borderColor: '#5bc0f8',
            borderWidth: 1
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { display: false }
          },
          scales: {
            y: {
              min: 0,
              max: 200,
              ticks: { color: '#666', font: { size: 9 } },
              grid: { color: 'rgba(255,255,255,0.03)' }
            },
            x: {
              ticks: { color: '#666', font: { size: 9 }, maxRotation: 45 },
              grid: { display: false }
            }
          }
        }
      });
    }

    // ============================================================
    // 4. КНОПКА КОПИРОВАНИЯ
    // ============================================================
    function copyPageData() {
      const regions = document.querySelectorAll('.region-card');
      let text = `=== Детектор информационной тишины ===\n`;
      text += `Дата: ${new Date().toLocaleString()}\n\n`;
      text += `--- РЕГИОНЫ ---\n`;
      for (const el of regions) {
        const name = el.querySelector('.name')?.textContent || '';
        const status = el.querySelector('.status')?.textContent || '';
        const details = el.querySelector('.details')?.textContent || '';
        const score = el.querySelector('.score')?.textContent || '';
        text += `${name}: ${status} (${details}, ${score})\n`;
      }
      text += `\n--- ОПОВЕЩЕНИЯ ---\n`;
      const alerts = document.querySelectorAll('.alert-item');
      for (const el of alerts) {
        const title = el.querySelector('.title')?.textContent || '';
        const desc = el.querySelector('.desc')?.textContent || '';
        text += `${title} (${desc})\n`;
      }

      navigator.clipboard.writeText(text).then(() => {
        showNotification('✅ Данные скопированы');
      }).catch(() => {
        const area = document.createElement('textarea');
        area.value = text;
        document.body.appendChild(area);
        area.select();
        document.execCommand('copy');
        document.body.removeChild(area);
        showNotification('✅ Данные скопированы');
      });
    }

    document.getElementById('copy-btn').addEventListener('click', copyPageData);

    // ============================================================
    // 5. ЗАГРУЗКА
    // ============================================================
    document.addEventListener('DOMContentLoaded', function() {
      loadData();
      setInterval(loadData, 60000);
    });
  </script>
<script src="/js/help.js"></script>
</body>
</html>
