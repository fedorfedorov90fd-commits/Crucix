<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Deepfake Detection — Crucix</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0a0a1a;
      color: #e0e0e0;
      min-height: 100vh;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 20px;
      background: rgba(10, 10, 30, 0.95);
      border-bottom: 1px solid rgba(255,255,255,0.06);
      z-index: 100;
      height: 48px;
    }
    .header h1 { font-size: 18px; font-weight: 700; color: #fff; }
    .header h1 span { color: #44ccff; }
    .header .nav-links {
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .header .nav-links a {
      color: #888;
      text-decoration: none;
      font-size: 13px;
      padding: 4px 12px;
      border-radius: 4px;
      transition: all 0.2s;
    }
    .header .nav-links a:hover { background: rgba(255,255,255,0.05); color: #e0e0e0; }
    .header .nav-links a.home { color: #2196f3; }
    .header .nav-links a.active { color: #44ccff; background: rgba(68,204,255,0.1); }
    .btn-copy {
      padding: 4px 12px;
      background: rgba(33,150,243,0.2);
      border: 1px solid rgba(33,150,243,0.3);
      border-radius: 4px;
      color: #2196f3;
      cursor: pointer;
      font-size: 12px;
      transition: all 0.2s;
    }
    .btn-copy:hover { background: rgba(33,150,243,0.3); }

    .main-content {
      padding: 16px 20px;
      max-width: 1400px;
      margin: 0 auto;
    }
    .page-title { font-size: 24px; font-weight: 700; color: #e8f0f8; margin-bottom: 4px; }
    .page-subtitle { color: #666; font-size: 14px; margin-bottom: 16px; }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 12px;
      margin-bottom: 16px;
    }
    .stat-card {
      background: rgba(10,10,20,0.5);
      border: 1px solid rgba(255,255,255,0.04);
      border-radius: 8px;
      padding: 12px 16px;
      text-align: center;
    }
    .stat-card .label { font-size: 10px; text-transform: uppercase; color: #666; letter-spacing: 0.5px; }
    .stat-card .value { font-size: 22px; font-weight: 700; color: #e8f0f8; margin-top: 2px; }
    .stat-card .value.green { color: #4caf50; }
    .stat-card .value.blue { color: #5bc0f8; }
    .stat-card .value.orange { color: #f97316; }
    .stat-card .value.red { color: #ef4444; }
    .stat-card .value.yellow { color: #ffd700; }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 16px;
    }
    .btn {
      padding: 6px 14px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
      transition: all 0.2s;
    }
    .btn:hover { transform: translateY(-1px); opacity: 0.9; }
    .btn-primary { background: #2196f3; color: #fff; }
    .btn-secondary { background: #444; color: #fff; }
    .btn-danger { background: #ef4444; color: #fff; }
    .btn-success { background: #22c55e; color: #fff; }
    .btn-warning { background: #eab308; color: #fff; }
    .status-label {
      padding: 4px 12px;
      border-radius: 4px;
      font-size: 12px;
      background: rgba(255,255,255,0.05);
      color: #888;
      margin-left: auto;
    }

    .grid-2col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 16px;
    }

    .panel {
      background: rgba(10,10,20,0.5);
      border: 1px solid rgba(255,255,255,0.04);
      border-radius: 8px;
      padding: 16px;
    }
    .panel .title { font-size: 14px; font-weight: 600; color: #e8f0f8; margin-bottom: 8px; }

    .media-item {
      padding: 10px 12px;
      border-bottom: 1px solid rgba(255,255,255,0.03);
      margin-bottom: 4px;
      background: rgba(255,255,255,0.02);
      border-radius: 4px;
    }
    .media-item .title { font-weight: 500; color: #e8f0f8; }
    .media-item .meta { font-size: 11px; color: #666; }
    .media-item .status-pending { color: #eab308; }
    .media-item .status-analyzed { color: #5bc0f8; }
    .media-item .status-verified_authentic { color: #22c55e; }
    .media-item .status-verified_fake { color: #ef4444; }

    .result-item {
      padding: 8px 10px;
      border-left: 3px solid #5bc0f8;
      margin-bottom: 4px;
      background: rgba(255,255,255,0.02);
      border-radius: 2px;
    }
    .result-item .verdict { font-weight: 600; }
    .result-item .verdict.authentic { color: #22c55e; }
    .result-item .verdict.suspicious { color: #ef4444; }
    .result-item .verdict.uncertain { color: #eab308; }

    .method-item {
      display: flex;
      justify-content: space-between;
      padding: 4px 8px;
      border-bottom: 1px solid rgba(255,255,255,0.03);
      font-size: 12px;
    }
    .method-item .name { color: #888; }
    .method-item .score { font-weight: 600; }
    .method-item .score.high { color: #ef4444; }
    .method-item .score.medium { color: #eab308; }
    .method-item .score.low { color: #22c55e; }

    .trust-bar {
      height: 20px;
      background: rgba(255,255,255,0.05);
      border-radius: 10px;
      overflow: hidden;
      margin: 8px 0;
    }
    .trust-fill {
      height: 100%;
      border-radius: 10px;
      transition: width 0.5s ease;
      background: linear-gradient(90deg, #ef4444, #eab308, #22c55e);
    }

    .loading { padding: 20px; text-align: center; color: #666; font-size: 14px; }
    .notification {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.85);
      color: #fff;
      padding: 8px 20px;
      border-radius: 6px;
      font-size: 13px;
      z-index: 100001;
      border: 1px solid rgba(255,255,255,0.1);
      animation: notif-fade 2.5s forwards;
    }
    @keyframes notif-fade {
      0% { opacity: 0; transform: translateX(-50%) translateY(10px); }
      10% { opacity: 1; transform: translateX(-50%) translateY(0); }
      80% { opacity: 1; transform: translateX(-50%) translateY(0); }
      100% { opacity: 0; transform: translateX(-50%) translateY(-20px); }
    }

    @media (max-width: 768px) {
      .grid-2col { grid-template-columns: 1fr; }
      .header { padding: 6px 12px; height: 42px; }
      .header h1 { font-size: 15px; }
      .main-content { padding: 10px; }
      .stats-grid { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>
  <header class="header">
    <h1>🎭 <span>Deepfake</span> Detection</h1>
    <div class="nav-links">
      <a href="/jarvis" class="home">🏠 Главная</a>
      <a href="/deepfake" class="active">🎭 Дипфейки</a>
      <button class="btn-copy" id="copy-btn">📋 Копировать</button>
    </div>
  </header>

  <div class="main-content">
    <h1 class="page-title">🎭 Обнаружение дипфейков</h1>
    <p class="page-subtitle">Анализ видео, аудио и изображений на признаки подделки</p>

    <div class="stats-grid" id="stats-grid">
      <div class="stat-card">
        <div class="label">Медиа</div>
        <div class="value blue" id="stat-media">0</div>
      </div>
      <div class="stat-card">
        <div class="label">Проанализировано</div>
        <div class="value green" id="stat-analyzed">0</div>
      </div>
      <div class="stat-card">
        <div class="label">Подозрительных</div>
        <div class="value red" id="stat-suspicious">0</div>
      </div>
      <div class="stat-card">
        <div class="label">Доверие</div>
        <div class="value yellow" id="stat-trust">0%</div>
      </div>
    </div>

    <div class="controls">
      <button class="btn btn-primary" id="btn-analyze">🔬 Запустить анализ</button>
      <button class="btn btn-secondary" id="btn-refresh">🔄 Обновить</button>
      <span class="status-label" id="status-label">⏹ Готов</span>
    </div>

    <div class="grid-2col">
      <div class="panel">
        <div class="title">📁 Медиа-контент</div>
        <div id="media-content">
          <div class="loading">Загрузка...</div>
        </div>
      </div>
      <div class="panel">
        <div class="title">📊 Результаты анализа</div>
        <div id="results-content">
          <div class="loading">Загрузка...</div>
        </div>
      </div>
    </div>

    <div class="panel">
      <div class="title">🛡️ Рейтинг доверия</div>
      <div id="trust-content">
        <div class="loading">Загрузка...</div>
      </div>
    </div>
  </div>

  <script>
    console.log('🎭 Deepfake Detection загружается...');

    async function loadData() {
      await Promise.all([loadStats(), loadMedia(), loadResults(), loadTrust()]);
    }

    async function loadStats() {
      try {
        const res = await fetch('/api/deepfake/status');
        const data = await res.json();
        if (data.success) {
          document.getElementById('stat-media').textContent = data.stats.total_media || 0;
          document.getElementById('stat-analyzed').textContent = data.stats.analyzed || 0;
          document.getElementById('stat-suspicious').textContent = data.stats.suspicious || 0;
          document.getElementById('stat-trust').textContent = (data.stats.trust_score || 0) + '%';
        }
      } catch (e) { console.error('[Deepfake] Ошибка загрузки статистики:', e); }
    }

    async function loadMedia() {
      try {
        const res = await fetch('/api/deepfake/media');
        const data = await res.json();
        if (data.success) {
          const container = document.getElementById('media-content');
          let html = '';
          for (const media of data.media) {
            const statusClass = media.status === 'pending' ? 'status-pending' :
                               media.status === 'verified_fake' ? 'status-verified_fake' :
                               media.status === 'verified_authentic' ? 'status-verified_authentic' : 'status-analyzed';
            const statusLabel = media.status === 'pending' ? '⏳ Ожидает' :
                               media.status === 'verified_fake' ? '🚫 Дипфейк' :
                               media.status === 'verified_authentic' ? '✅ Подлинный' : '🔬 Проанализирован';
            html += `
              <div class="media-item">
                <div class="title">${media.title}</div>
                <div class="meta">${media.type} · ${media.source} · <span class="${statusClass}">${statusLabel}</span></div>
              </div>
            `;
          }
          container.innerHTML = html || '<div class="loading">Нет медиа</div>';
        }
      } catch (e) { console.error('[Deepfake] Ошибка загрузки медиа:', e); }
    }

    async function loadResults() {
      try {
        const res = await fetch('/api/deepfake/results?limit=5');
        const data = await res.json();
        if (data.success) {
          const container = document.getElementById('results-content');
          if (data.results.length === 0) {
            container.innerHTML = '<div class="loading">Нет результатов</div>';
            return;
          }
          let html = '';
          for (const result of data.results) {
            const verdictClass = result.status === 'verified_authentic' ? 'authentic' :
                                result.status === 'verified_fake' ? 'suspicious' : 'uncertain';
            html += `
              <div class="result-item">
                <div class="verdict ${verdictClass}">${result.verdict || '—'}</div>
                <div style="font-size:12px;color:#888;">${result.title} · ${result.type} · ${result.overall_score}%</div>
              </div>
            `;
          }
          container.innerHTML = html;
        }
      } catch (e) { console.error('[Deepfake] Ошибка загрузки результатов:', e); }
    }

    async function loadTrust() {
      try {
        const res = await fetch('/api/deepfake/trust');
        const data = await res.json();
        if (data.success) {
          const container = document.getElementById('trust-content');
          const trust = data.trust;
          const globalScore = trust.global || 75;
          let html = `
            <div style="display:flex;justify-content:space-between;align-items:center;">
              <span>Глобальный рейтинг доверия</span>
              <span style="font-size:20px;font-weight:700;color:${globalScore > 70 ? '#22c55e' : globalScore > 40 ? '#eab308' : '#ef4444'};">${globalScore}%</span>
            </div>
            <div class="trust-bar">
              <div class="trust-fill" style="width:${globalScore}%;"></div>
            </div>
          `;
          if (trust.sources) {
            html += `<div style="margin-top:8px;font-size:12px;color:#888;">Источников: ${Object.keys(trust.sources).length}</div>`;
          }
          container.innerHTML = html;
        }
      } catch (e) { console.error('[Deepfake] Ошибка загрузки доверия:', e); }
    }

    async function analyzeAll() {
      const btn = document.getElementById('btn-analyze');
      const label = document.getElementById('status-label');
      btn.textContent = '⏳ Анализ...';
      btn.disabled = true;
      label.textContent = '⏳ Анализ медиа...';
      label.className = 'status-label';

      try {
        const res = await fetch('/api/deepfake/analyze', { method: 'POST' });
        const data = await res.json();
        if (data.success) {
          showNotification(`✅ Анализ завершён! Проанализировано: ${data.result.analyzed}`);
          await loadData();
        } else {
          showNotification('❌ Ошибка анализа');
        }
      } catch (e) {
        showNotification('❌ Ошибка: ' + e.message);
      } finally {
        btn.textContent = '🔬 Запустить анализ';
        btn.disabled = false;
        label.textContent = '⏹ Готов';
        label.className = 'status-label';
      }
    }

    function showNotification(msg) {
      document.querySelectorAll('.notification').forEach(el => el.remove());
      const el = document.createElement('div');
      el.className = 'notification';
      el.textContent = msg;
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 2500);
    }

    document.getElementById('copy-btn').addEventListener('click', function() {
      const text = `=== CRUCIX — DEEPFAKE DETECTION ===
Дата: ${new Date().toLocaleString()}

--- СТАТИСТИКА ---
Медиа: ${document.getElementById('stat-media').textContent}
Проанализировано: ${document.getElementById('stat-analyzed').textContent}
Подозрительных: ${document.getElementById('stat-suspicious').textContent}
Доверие: ${document.getElementById('stat-trust').textContent}

--- МЕДИА ---
${document.getElementById('media-content').textContent}

--- РЕЗУЛЬТАТЫ ---
${document.getElementById('results-content').textContent}

--- ДОВЕРИЕ ---
${document.getElementById('trust-content').textContent}

--- CRUCIX OSINT TERMINAL ---
🌐 http://localhost:3117/deepfake`;

      navigator.clipboard.writeText(text).then(() => {
        showNotification('✅ Данные скопированы');
      }).catch(() => {
        const area = document.createElement('textarea');
        area.value = text;
        document.body.appendChild(area);
        area.select();
        document.execCommand('copy');
        document.body.removeChild(area);
        showNotification('✅ Данные скопированы');
      });
    });

    document.addEventListener('DOMContentLoaded', function() {
      document.getElementById('btn-analyze').addEventListener('click', analyzeAll);
      document.getElementById('btn-refresh').addEventListener('click', loadData);
      loadData();
    });
  </script>
</body>
</html>
