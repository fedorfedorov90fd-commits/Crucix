<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CRUCIX MONITOR — JARVIS</title>
    <style>
        /* ============================================================
           ГЛОБАЛЬНЫЕ СТИЛИ (JARVIS)
           ============================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0f;
            color: #c8d0d8;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', monospace;
            font-size: 13px;
            line-height: 1.5;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ============================================================
           ВЕРХНЯЯ ПАНЕЛЬ (TOP BAR)
           ============================================================ */
        .topbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: rgba(10, 10, 20, 0.92);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
        }

        .topbar-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .topbar-brand {
            font-size: 14px;
            font-weight: 700;
            color: #5bc0f8;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 20px rgba(91, 192, 248, 0.15);
        }

        .topbar-status {
            font-size: 11px;
            color: #ffd700;
            text-shadow: 0 0 15px rgba(255, 215, 0, 0.1);
        }

        .topbar-right {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .topbar-btn {
            height: 28px;
            padding: 0 12px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 4px;
            background: rgba(255, 255, 255, 0.03);
            color: #888;
            font-size: 11px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .topbar-btn:hover {
            background: rgba(255, 255, 255, 0.06);
            transform: translateY(-1px);
        }

        .btn-home {
            color: #5bc0f8;
            border-color: rgba(91, 192, 248, 0.2);
            background: rgba(91, 192, 248, 0.06);
        }
        .btn-home:hover {
            background: rgba(91, 192, 248, 0.15);
        }

        .btn-copy {
            color: #5bc0f8;
            border-color: rgba(91, 192, 248, 0.15);
            background: rgba(91, 192, 248, 0.06);
        }
        .btn-copy:hover {
            background: rgba(91, 192, 248, 0.15);
        }

        .btn-rss {
            color: #f26522;
            border-color: rgba(242, 101, 34, 0.2);
            background: rgba(242, 101, 34, 0.06);
        }
        .btn-rss:hover {
            background: rgba(242, 101, 34, 0.15);
        }

        .btn-ai {
            color: #4caf50;
            border-color: rgba(76, 175, 80, 0.15);
            background: rgba(76, 175, 80, 0.06);
        }
        .btn-ai:hover {
            background: rgba(76, 175, 80, 0.15);
        }

        .btn-map {
            color: #5bc0f8;
            border-color: rgba(91, 192, 248, 0.15);
            background: rgba(91, 192, 248, 0.06);
        }
        .btn-map:hover {
            background: rgba(91, 192, 248, 0.15);
        }

        .btn-index {
            color: #ffd700;
            border-color: rgba(255, 215, 0, 0.15);
            background: rgba(255, 215, 0, 0.06);
        }
        .btn-index:hover {
            background: rgba(255, 215, 0, 0.15);
        }

        .btn-basket {
            color: #2196f3;
            border-color: rgba(33, 150, 243, 0.15);
            background: rgba(33, 150, 243, 0.06);
        }
        .btn-basket:hover {
            background: rgba(33, 150, 243, 0.15);
        }

        .btn-grid {
            color: #9c27b0;
            border-color: rgba(156, 39, 176, 0.15);
            background: rgba(156, 39, 176, 0.06);
        }
        .btn-grid:hover {
            background: rgba(156, 39, 176, 0.15);
        }
        .btn-grid.active {
            background: rgba(156, 39, 176, 0.2);
            border-color: rgba(156, 39, 176, 0.3);
        }

        .btn-alert {
            color: #ffffff;
            background: #f44336;
            border-color: #f44336;
            animation: alert-pulse 2s infinite;
        }
        .btn-alert:hover {
            background: #d32f2f;
        }

        @keyframes alert-pulse {
            0%,
            100% {
                box-shadow: 0 0 0 0 rgba(244, 67, 54, 0.3);
            }
            50% {
                box-shadow: 0 0 0 6px rgba(244, 67, 54, 0);
            }
        }

        .lang-switch {
            display: flex;
            gap: 2px;
            padding: 2px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .lang-btn {
            padding: 2px 8px;
            border: none;
            background: transparent;
            color: #666;
            font-size: 11px;
            font-weight: 500;
            cursor: pointer;
            border-radius: 3px;
            transition: all 0.2s;
        }

        .lang-btn:hover {
            color: #888;
            background: rgba(255, 255, 255, 0.05);
        }
        .lang-btn.active {
            color: #5bc0f8;
            background: rgba(91, 192, 248, 0.1);
        }

        .topbar-time {
            font-size: 11px;
            color: #666;
            font-variant-numeric: tabular-nums;
        }

        .topbar-sources {
            font-size: 11px;
            color: #4caf50;
        }

        /* ============================================================
           ВТОРАЯ СТРОКА КНОПОК (ПОД TOPBAR)
           ============================================================ */
        .topbar-second-row {
            position: fixed;
            top: 60px;
            left: 0;
            right: 0;
            height: 36px;
            background: rgba(10, 10, 20, 0.85);
            backdrop-filter: blur(8px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            z-index: 99;
            display: flex;
            align-items: center;
            padding: 0 20px;
        }

        .topbar-second-row-inner {
            display: flex;
            align-items: center;
            gap: 6px;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
        }

        .topbar-second-row .topbar-btn {
            height: 26px;
            padding: 0 12px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 4px;
            background: rgba(255, 255, 255, 0.03);
            color: #888;
            font-size: 10px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .topbar-second-row .topbar-btn:hover {
            background: rgba(255, 255, 255, 0.06);
            transform: translateY(-1px);
        }

        .btn-safecast {
            color: #f97316;
            border-color: rgba(249, 115, 22, 0.2);
            background: rgba(249, 115, 22, 0.06);
        }
        .btn-safecast:hover {
            background: rgba(249, 115, 22, 0.15);
        }

        .btn-kiwisdr {
            color: #8b5cf6;
            border-color: rgba(139, 92, 246, 0.2);
            background: rgba(139, 92, 246, 0.06);
        }
        .btn-kiwisdr:hover {
            background: rgba(139, 92, 246, 0.15);
        }

        /* ============================================================
           ОСНОВНОЙ КОНТЕНТ
           ============================================================ */
        .main-content {
            padding-top: 112px;
            max-width: 1400px;
            margin: 0 auto;
            padding-left: 20px;
            padding-right: 20px;
            padding-bottom: 40px;
        }

        .page-title {
            font-size: 24px;
            font-weight: 700;
            color: #e8f0f8;
            letter-spacing: -0.5px;
            margin-bottom: 20px;
            text-shadow: 0 0 30px rgba(91, 192, 248, 0.05);
        }

        /* ============================================================
           КООРДИНАТНАЯ СЕТКА (СКРЫТА)
           ============================================================ */
        #coordinate-grid {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 99999;
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            display: none;
        }
        #coordinate-grid.visible {
            display: block;
        }

        #grid-coords {
            position: fixed;
            bottom: 12px;
            right: 12px;
            background: rgba(0, 0, 0, 0.7);
            color: #00ff00;
            font-family: monospace;
            font-size: 11px;
            padding: 4px 10px;
            border-radius: 4px;
            z-index: 100000;
            pointer-events: none;
            display: none;
        }
        #grid-coords.visible {
            display: block;
        }

        /* ============================================================
           УВЕДОМЛЕНИЯ
           ============================================================ */
        .notification {
            position: fixed;
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.85);
            color: #ffffff;
            padding: 8px 20px;
            border-radius: 6px;
            font-size: 13px;
            z-index: 100001;
            border: 1px solid rgba(255, 255, 255, 0.1);
            animation: notif-fade 2.5s forwards;
        }

        @keyframes notif-fade {
            0% {
                opacity: 0;
                transform: translateX(-50%) translateY(10px);
            }
            10% {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
            80% {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
            100% {
                opacity: 0;
                transform: translateX(-50%) translateY(-20px);
            }
        }

        /* ============================================================
           АДАПТИВНОСТЬ
           ============================================================ */
        @media (max-width: 768px) {
            .topbar {
                padding: 0 12px;
                height: 52px;
            }
            .topbar-brand {
                font-size: 12px;
            }
            .topbar-status {
                display: none;
            }
            .topbar-btn {
                font-size: 10px;
                padding: 0 8px;
                height: 24px;
            }
            .topbar-time {
                display: none;
            }
            .topbar-second-row {
                top: 52px;
                height: 32px;
                padding: 0 12px;
            }
            .topbar-second-row .topbar-btn {
                font-size: 9px;
                padding: 0 6px;
                height: 22px;
            }
            .main-content {
                padding-top: 100px;
                padding-left: 12px;
                padding-right: 12px;
            }
            .page-title {
                font-size: 18px;
            }
        }

        @media (max-width: 480px) {
            .topbar {
                padding: 0 8px;
                height: 46px;
            }
            .topbar-brand {
                font-size: 10px;
                letter-spacing: 1px;
            }
            .topbar-btn {
                font-size: 9px;
                padding: 0 6px;
                height: 20px;
            }
            .topbar-btn .btn-text {
                display: none;
            }
            .lang-btn {
                font-size: 9px;
                padding: 1px 5px;
            }
            .topbar-second-row {
                top: 46px;
                height: 28px;
                padding: 0 8px;
            }
            .topbar-second-row .topbar-btn {
                font-size: 8px;
                padding: 0 5px;
                height: 18px;
            }
            .main-content {
                padding-top: 90px;
                padding-left: 8px;
                padding-right: 8px;
            }
            .page-title {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>

    <!-- ============================================================
         ВЕРХНЯЯ ПАНЕЛЬ (TOP BAR)
         ============================================================ -->
    <header class="topbar">
        <div class="topbar-left">
            <span class="topbar-brand">⚡ CRUCIX MONITOR</span>
            <span class="topbar-status">WARTIME STAGFLATION RISK</span>
        </div>
        <div class="topbar-right">
            <span class="topbar-time" id="topbar-time">SWEEP 30.1s</span>
            <span class="topbar-time" id="topbar-date">APR 3, 2026 07:18 PM</span>
            <span class="topbar-sources">SOURCES 28/29</span>

            <button class="topbar-btn btn-home" onclick="window.location.href='/'">← НА ГЛАВНУЮ</button>
            <button class="topbar-btn btn-copy" id="copy-btn">📋 КОПИРОВАТЬ</button>
            <button class="topbar-btn btn-rss" onclick="window.location.href='/rss-feed'">📡 RSS</button>
            <button class="topbar-btn btn-ai" onclick="window.location.href='/ai-chat'">🧠 AI Чат</button>
            <button class="topbar-btn btn-map" onclick="window.location.href='/geo-map'">🌍 КАРТА</button>
            <button class="topbar-btn btn-index" onclick="window.location.href='/global-index'">📊 ИНДЕКС</button>
            <button class="topbar-btn btn-basket" onclick="window.location.href='/basket'">📦 КОРЗИНА</button>
            <button class="topbar-btn btn-grid" id="grid-toggle" title="Ctrl+Shift+G">📐 СЕТКА</button>

            <div class="lang-switch">
                <button class="lang-btn active" data-lang="ru" onclick="switchLang('ru')">RU</button>
                <button class="lang-btn" data-lang="en" onclick="switchLang('en')">EN</button>
            </div>

            <button class="topbar-btn btn-alert">🔴 HIGH ALERT</button>
        </div>
    </header>

    <!-- ============================================================
         ВТОРАЯ СТРОКА КНОПОК (ПОД TOPBAR)
         ============================================================ -->
    <div class="topbar-second-row">
        <div class="topbar-second-row-inner">
            <button class="topbar-btn btn-safecast" onclick="window.location.href='/safecast'">☢️ SAFECAST</button>
            <button class="topbar-btn btn-kiwisdr" onclick="window.location.href='/kiwisdr'">📻 KIIWISDR</button>
        </div>
    </div>

    <!-- ============================================================
         ОСНОВНОЙ КОНТЕНТ
         ============================================================ -->
    <main class="main-content">
        <h1 class="page-title">🚀 CRUCIX JARVIS — Интерфейс управления</h1>
        <p style="color: #666; font-size: 14px;">
            Добро пожаловать в CRUCIX Monitor. Используйте кнопки выше для навигации.
        </p>
    </main>

    <!-- ============================================================
         КООРДИНАТНАЯ СЕТКА
         ============================================================ -->
    <div id="coordinate-grid"></div>
    <div id="grid-coords">X: 0  Y: 0</div>

    <script>
        // ============================================================
        // ВРЕМЯ
        // ============================================================
        function updateTopbar() {
            const now = new Date();
            const dateStr = now.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }).toUpperCase();
            const timeStr = now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: true });
            document.getElementById('topbar-date').textContent = `${dateStr} ${timeStr}`;
        }
        updateTopbar();
        setInterval(updateTopbar, 60000);

        // ============================================================
        // ПЕРЕКЛЮЧАТЕЛЬ ЯЗЫКА
        // ============================================================
        let currentLang = localStorage.getItem('crucix-lang') || 'ru';

        function switchLang(lang) {
            currentLang = lang;
            localStorage.setItem('crucix-lang', lang);
            document.querySelectorAll('.lang-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.lang === lang);
            });
            showNotification(`🌐 Язык: ${lang.toUpperCase()}`);
        }

        document.querySelectorAll('.lang-btn').forEach(btn => {
            btn.classList.toggle('active', btn.dataset.lang === currentLang);
        });

        // ============================================================
        // КОПИРОВАНИЕ
        // ============================================================
        document.getElementById('copy-btn').addEventListener('click', function() {
            copyPageData();
        });

        function copyPageData() {
            let text = `=== CRUCIX MONITOR ===\n`;
            text += `Дата: ${new Date().toLocaleString()}\n\n`;
            text += `Доступные страницы:\n`;
            text += `- Главная: /\n`;
            text += `- RSS: /rss-feed\n`;
            text += `- AI Чат: /ai-chat\n`;
            text += `- Карта: /geo-map\n`;
            text += `- Индекс: /global-index\n`;
            text += `- Корзина: /basket\n`;
            text += `- Инфраструктура: /infrastructure\n`;
            text += `- Радиация (Safecast): /safecast\n`;
            text += `- Радиомониторинг (KiwiSDR): /kiwisdr\n`;

            navigator.clipboard.writeText(text).then(() => {
                showNotification('✅ Данные скопированы');
            }).catch(() => {
                const area = document.createElement('textarea');
                area.value = text;
                document.body.appendChild(area);
                area.select();
                document.execCommand('copy');
                document.body.removeChild(area);
                showNotification('✅ Данные скопированы');
            });
        }

        // ============================================================
        // СЕТКА (Ctrl+Shift+G)
        // ============================================================
        let gridVisible = false;
        const gridEl = document.getElementById('coordinate-grid');
        const coordsEl = document.getElementById('grid-coords');
        const gridBtn = document.getElementById('grid-toggle');

        document.addEventListener('keydown', function(e) {
            if (e.ctrlKey && e.shiftKey && e.key === 'G') {
                e.preventDefault();
                toggleGrid();
            }
        });

        gridBtn.addEventListener('click', toggleGrid);

        function toggleGrid() {
            gridVisible = !gridVisible;
            gridEl.classList.toggle('visible', gridVisible);
            coordsEl.classList.toggle('visible', gridVisible);
            gridBtn.classList.toggle('active', gridVisible);

            if (gridVisible) {
                showNotification('⊞ Сетка включена (Ctrl+Shift+G для выключения)');
                document.addEventListener('mousemove', updateCoords);
            } else {
                showNotification('⊞ Сетка выключена');
                document.removeEventListener('mousemove', updateCoords);
            }
        }

        function updateCoords(e) {
            coordsEl.textContent = `X: ${e.clientX}  Y: ${e.clientY}`;
        }

        // ============================================================
        // УВЕДОМЛЕНИЯ
        // ============================================================
        function showNotification(msg) {
            const el = document.createElement('div');
            el.className = 'notification';
            el.textContent = msg;
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 2500);
        }
    </script>

</body>
</html>
