<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Автономные агенты — Crucix</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0a0a1a;
      color: #e0e0e0;
      min-height: 100vh;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 20px;
      background: rgba(10, 10, 30, 0.95);
      border-bottom: 1px solid rgba(255,255,255,0.06);
      z-index: 100;
      height: 48px;
    }
    .header h1 { font-size: 18px; font-weight: 700; color: #fff; }
    .header h1 span { color: #44ccff; }
    .header .nav-links {
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .header .nav-links a {
      color: #888;
      text-decoration: none;
      font-size: 13px;
      padding: 4px 12px;
      border-radius: 4px;
      transition: all 0.2s;
    }
    .header .nav-links a:hover { background: rgba(255,255,255,0.05); color: #e0e0e0; }
    .header .nav-links a.home { color: #2196f3; }
    .header .nav-links a.active { color: #44ccff; background: rgba(68,204,255,0.1); }
    .btn-copy {
      padding: 4px 12px;
      background: rgba(33,150,243,0.2);
      border: 1px solid rgba(33,150,243,0.3);
      border-radius: 4px;
      color: #2196f3;
      cursor: pointer;
      font-size: 12px;
      transition: all 0.2s;
    }
    .btn-copy:hover { background: rgba(33,150,243,0.3); }

    .main-content {
      padding: 16px 20px;
      max-width: 1400px;
      margin: 0 auto;
    }
    .page-title { font-size: 24px; font-weight: 700; color: #e8f0f8; margin-bottom: 4px; }
    .page-subtitle { color: #666; font-size: 14px; margin-bottom: 16px; }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 12px;
      margin-bottom: 16px;
    }
    .stat-card {
      background: rgba(10,10,20,0.5);
      border: 1px solid rgba(255,255,255,0.04);
      border-radius: 8px;
      padding: 12px 16px;
      text-align: center;
    }
    .stat-card .label { font-size: 10px; text-transform: uppercase; color: #666; letter-spacing: 0.5px; }
    .stat-card .value { font-size: 22px; font-weight: 700; color: #e8f0f8; margin-top: 2px; }
    .stat-card .value.green { color: #4caf50; }
    .stat-card .value.blue { color: #5bc0f8; }
    .stat-card .value.orange { color: #f97316; }
    .stat-card .value.red { color: #ef4444; }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 16px;
    }
    .btn {
      padding: 6px 14px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
      transition: all 0.2s;
    }
    .btn:hover { transform: translateY(-1px); opacity: 0.9; }
    .btn-primary { background: #2196f3; color: #fff; }
    .btn-secondary { background: #444; color: #fff; }
    .btn-success { background: #22c55e; color: #fff; }
    .btn-warning { background: #eab308; color: #fff; }
    .btn-danger { background: #ef4444; color: #fff; }
    .status-label {
      padding: 4px 12px;
      border-radius: 4px;
      font-size: 12px;
      background: rgba(255,255,255,0.05);
      color: #888;
      margin-left: auto;
    }

    .grid-2col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 16px;
    }

    .panel {
      background: rgba(10,10,20,0.5);
      border: 1px solid rgba(255,255,255,0.04);
      border-radius: 8px;
      padding: 16px;
    }
    .panel .title { font-size: 14px; font-weight: 600; color: #e8f0f8; margin-bottom: 8px; }

    .agent-item {
      padding: 10px 12px;
      border-bottom: 1px solid rgba(255,255,255,0.03);
      margin-bottom: 4px;
      background: rgba(255,255,255,0.02);
      border-radius: 4px;
    }
    .agent-item .name { font-weight: 600; color: #e8f0f8; }
    .agent-item .status { font-size: 12px; }
    .agent-item .status.running { color: #22c55e; }
    .agent-item .status.idle { color: #888; }
    .agent-item .status.paused { color: #eab308; }
    .agent-item .icon { font-size: 20px; }
    .agent-item .tasks { font-size: 11px; color: #666; }

    .task-item {
      padding: 6px 10px;
      border-left: 3px solid #5bc0f8;
      margin-bottom: 4px;
      background: rgba(255,255,255,0.02);
      border-radius: 2px;
      font-size: 12px;
    }
    .task-item .title { font-weight: 500; color: #e8f0f8; }
    .task-item .status-completed { color: #22c55e; }
    .task-item .status-running { color: #eab308; }
    .task-item .status-pending { color: #5bc0f8; }
    .task-item .status-failed { color: #ef4444; }

    .loading { padding: 20px; text-align: center; color: #666; font-size: 14px; }
    .notification {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.85);
      color: #fff;
      padding: 8px 20px;
      border-radius: 6px;
      font-size: 13px;
      z-index: 100001;
      border: 1px solid rgba(255,255,255,0.1);
      animation: notif-fade 2.5s forwards;
    }
    @keyframes notif-fade {
      0% { opacity: 0; transform: translateX(-50%) translateY(10px); }
      10% { opacity: 1; transform: translateX(-50%) translateY(0); }
      80% { opacity: 1; transform: translateX(-50%) translateY(0); }
      100% { opacity: 0; transform: translateX(-50%) translateY(-20px); }
    }

    @media (max-width: 768px) {
      .grid-2col { grid-template-columns: 1fr; }
      .header { padding: 6px 12px; height: 42px; }
      .header h1 { font-size: 15px; }
      .main-content { padding: 10px; }
      .stats-grid { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>
  <header class="header">
    <h1>🤖 <span>Автономные</span> агенты</h1>
    <div class="nav-links">
      <a href="/jarvis" class="home">🏠 Главная</a>
      <a href="/agents" class="active">🤖 Агенты</a>
      <button class="btn-copy" id="copy-btn">📋 Копировать</button>
    </div>
  </header>

  <div class="main-content">
    <h1 class="page-title">🤖 Автономные агенты</h1>
    <p class="page-subtitle">Автоматическое выполнение задач — сбор, анализ, прогнозирование, отчёты</p>

    <div class="stats-grid" id="stats-grid">
      <div class="stat-card">
        <div class="label">Агентов</div>
        <div class="value blue" id="stat-agents">0</div>
      </div>
      <div class="stat-card">
        <div class="label">Активных</div>
        <div class="value green" id="stat-active">0</div>
      </div>
      <div class="stat-card">
        <div class="label">Задач</div>
        <div class="value orange" id="stat-tasks">0</div>
      </div>
      <div class="stat-card">
        <div class="label">Успешность</div>
        <div class="value green" id="stat-success">0%</div>
      </div>
    </div>

    <div class="controls">
      <button class="btn btn-primary" id="btn-auto">🚀 Автозапуск</button>
      <button class="btn btn-success" id="btn-system">🔧 Системные задачи</button>
      <button class="btn btn-secondary" id="btn-refresh">🔄 Обновить</button>
      <span class="status-label" id="status-label">⏹ Готов</span>
    </div>

    <div class="grid-2col">
      <div class="panel">
        <div class="title">🤖 Агенты</div>
        <div id="agents-content">
          <div class="loading">Загрузка...</div>
        </div>
      </div>
      <div class="panel">
        <div class="title">📋 Задачи</div>
        <div id="tasks-content">
          <div class="loading">Загрузка...</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    console.log('🤖 Автономные агенты загружаются...');

    async function loadData() {
      await Promise.all([loadStats(), loadAgents(), loadTasks()]);
    }

    async function loadStats() {
      try {
        const res = await fetch('/api/agents/status');
        const data = await res.json();
        if (data.success) {
          document.getElementById('stat-agents').textContent = data.stats.agents || 0;
          document.getElementById('stat-active').textContent = data.stats.active_agents || 0;
          document.getElementById('stat-tasks').textContent = data.stats.total_tasks || 0;
          document.getElementById('stat-success').textContent = (data.stats.success_rate || 0) + '%';
        }
      } catch (e) { console.error('[Agents] Ошибка загрузки статистики:', e); }
    }

    async function loadAgents() {
      try {
        const res = await fetch('/api/agents/list');
        const data = await res.json();
        if (data.success) {
          const container = document.getElementById('agents-content');
          let html = '';
          for (const agent of data.agents) {
            const statusClass = agent.status === 'running' ? 'running' :
                               agent.status === 'paused' ? 'paused' : 'idle';
            const statusText = agent.status === 'running' ? '🟢 Работает' :
                              agent.status === 'paused' ? '🟡 Пауза' : '⚪ Ожидает';
            html += `
              <div class="agent-item">
                <div style="display:flex;justify-content:space-between;align-items:center;">
                  <div>
                    <span class="icon">${agent.icon || '🤖'}</span>
                    <span class="name">${agent.name}</span>
                  </div>
                  <span class="status ${statusClass}">${statusText}</span>
                </div>
                <div style="font-size:11px;color:#666;">${agent.description}</div>
                <div class="tasks">Задач выполнено: ${agent.tasks_completed || 0} · Успешность: ${agent.success_rate || 0}%</div>
              </div>
            `;
          }
          container.innerHTML = html;
        }
      } catch (e) { console.error('[Agents] Ошибка загрузки агентов:', e); }
    }

    async function loadTasks() {
      try {
        const res = await fetch('/api/agents/tasks?limit=10');
        const data = await res.json();
        if (data.success) {
          const container = document.getElementById('tasks-content');
          if (data.tasks.length === 0) {
            container.innerHTML = '<div class="loading">Нет задач</div>';
            return;
          }
          let html = '';
          for (const task of data.tasks) {
            const statusClass = task.status === 'completed' ? 'status-completed' :
                               task.status === 'running' ? 'status-running' :
                               task.status === 'failed' ? 'status-failed' : 'status-pending';
            const time = new Date(task.created_at).toLocaleString();
            html += `
              <div class="task-item">
                <div class="title">${task.title}</div>
                <div style="font-size:10px;color:#888;">${task.agent_id} · ${time}</div>
                <div class="${statusClass}" style="font-size:11px;">${task.status.toUpperCase()}</div>
                ${task.result ? `<div style="font-size:11px;color:#666;">${JSON.stringify(task.result).slice(0, 50)}...</div>` : ''}
              </div>
            `;
          }
          container.innerHTML = html;
        }
      } catch (e) { console.error('[Agents] Ошибка загрузки задач:', e); }
    }

    async function autoStart() {
      const btn = document.getElementById('btn-auto');
      const label = document.getElementById('status-label');
      btn.textContent = '⏳ Запуск...';
      btn.disabled = true;
      label.textContent = '⏳ Запуск агентов...';
      label.className = 'status-label';

      try {
        const res = await fetch('/api/agents/auto', { method: 'POST' });
        const data = await res.json();
        if (data.success) {
          showNotification('✅ Автозапуск завершён!');
          await loadData();
        }
      } catch (e) {
        showNotification('❌ Ошибка: ' + e.message);
      } finally {
        btn.textContent = '🚀 Автозапуск';
        btn.disabled = false;
        label.textContent = '⏹ Готов';
        label.className = 'status-label';
      }
    }

    async function systemTasks() {
      const btn = document.getElementById('btn-system');
      const label = document.getElementById('status-label');
      btn.textContent = '⏳ Запуск...';
      btn.disabled = true;
      label.textContent = '⏳ Создание задач...';
      label.className = 'status-label';

      try {
        const res = await fetch('/api/agents/system', { method: 'POST' });
        const data = await res.json();
        if (data.success) {
          showNotification(`✅ Создано ${data.results.length} системных задач!`);
          await loadData();
        }
      } catch (e) {
        showNotification('❌ Ошибка: ' + e.message);
      } finally {
        btn.textContent = '🔧 Системные задачи';
        btn.disabled = false;
        label.textContent = '⏹ Готов';
        label.className = 'status-label';
      }
    }

    function showNotification(msg) {
      document.querySelectorAll('.notification').forEach(el => el.remove());
      const el = document.createElement('div');
      el.className = 'notification';
      el.textContent = msg;
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 2500);
    }

    document.getElementById('copy-btn').addEventListener('click', function() {
      const text = `=== CRUCIX — АВТОНОМНЫЕ АГЕНТЫ ===
Дата: ${new Date().toLocaleString()}

--- СТАТИСТИКА ---
Агентов: ${document.getElementById('stat-agents').textContent}
Активных: ${document.getElementById('stat-active').textContent}
Задач: ${document.getElementById('stat-tasks').textContent}
Успешность: ${document.getElementById('stat-success').textContent}

--- АГЕНТЫ ---
${document.getElementById('agents-content').textContent}

--- ЗАДАЧИ ---
${document.getElementById('tasks-content').textContent}

--- CRUCIX OSINT TERMINAL ---
🌐 http://localhost:3117/agents`;

      navigator.clipboard.writeText(text).then(() => {
        showNotification('✅ Данные скопированы');
      }).catch(() => {
        const area = document.createElement('textarea');
        area.value = text;
        document.body.appendChild(area);
        area.select();
        document.execCommand('copy');
        document.body.removeChild(area);
        showNotification('✅ Данные скопированы');
      });
    });

    document.addEventListener('DOMContentLoaded', function() {
      document.getElementById('btn-auto').addEventListener('click', autoStart);
      document.getElementById('btn-system').addEventListener('click', systemTasks);
      document.getElementById('btn-refresh').addEventListener('click', loadData);
      loadData();
    });
  </script>
</body>
</html>
