<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Цепи поставок — Crucix</title>
  <link rel="stylesheet" href="/css/supply-chain-monitor.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-left">
      <span class="topbar-brand">⚡ CRUCIX MONITOR</span>
      <span class="topbar-status">ЦЕПИ ПОСТАВОК</span>
    </div>
    <div class="topbar-right">
      <span class="topbar-time" id="topbar-date">Загрузка...</span>
      <button class="topbar-btn btn-home" onclick="window.location.href='/jarvis'">← НА ГЛАВНУЮ</button>
      <button class="topbar-btn btn-copy" id="copy-btn">📋 КОПИРОВАТЬ</button>
      <button class="topbar-btn btn-grid" id="grid-toggle">📐 СЕТКА</button>
    </div>
  </header>

  <main class="main-content">
    <h1 class="page-title">📦 Мониторинг цепей поставок</h1>
    <p class="page-subtitle">Глобальный индекс цепей поставок (GSCPI)</p>

    <div class="stats-row" id="stats-row">
      <div class="stat-item">
        <div class="stat-label">Глобальный индекс</div>
        <div class="stat-value blue" id="stat-index">0</div>
      </div>
      <div class="stat-item">
        <div class="stat-label">Критических</div>
        <div class="stat-value red" id="stat-critical">0</div>
      </div>
      <div class="stat-item">
        <div class="stat-label">Высоких</div>
        <div class="stat-value orange" id="stat-high">0</div>
      </div>
      <div class="stat-item">
        <div class="stat-label">Записей</div>
        <div class="stat-value" id="stat-total">0</div>
      </div>
    </div>

    <div class="controls">
      <button class="btn btn-primary" id="btn-update">🔄 Обновить данные</button>
      <button class="btn btn-secondary" id="btn-refresh">🔄 Обновить</button>
      <span class="status-label" id="status-label">⏹ Готов</span>
    </div>

    <div class="summary-panel" id="summary-panel">
      <h3>📋 Резюме</h3>
      <div id="summary-content" class="summary-content">
        <div class="loading">Ожидание обновления...</div>
      </div>
    </div>

    <div class="map-container" id="map-container">
      <h3>🌍 Карта цепей поставок</h3>
      <div id="chain-map" class="chain-map"></div>
    </div>

    <div class="data-panel" id="data-panel">
      <h3>📊 Данные по регионам и секторам</h3>
      <div id="data-list" class="data-list">
        <div class="loading">Загрузка данных...</div>
      </div>
    </div>
  </main>

  <div id="coordinate-grid"></div>
  <div id="grid-coords">X: 0  Y: 0</div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="/js/supply-chain-monitor.js"></script>
</body>
</html>
