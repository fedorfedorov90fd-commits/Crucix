<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Скрытые связи — Crucix</title>
  <link rel="stylesheet" href="/css/hidden-links.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-left">
      <span class="topbar-brand">⚡ CRUCIX MONITOR</span>
      <span class="topbar-status">СКРЫТЫЕ СВЯЗИ</span>
    </div>
    <div class="topbar-right">
      <span class="topbar-time" id="topbar-date">Загрузка...</span>
      <button class="topbar-btn btn-home" onclick="window.location.href='/jarvis'">← НА ГЛАВНУЮ</button>
      <button class="topbar-btn btn-help" onclick="showHelp()">❓ HELP</button>
    <button class="topbar-btn btn-copy" id="copy-btn">📋 КОПИРОВАТЬ</button>
      <button class="topbar-btn btn-grid" id="grid-toggle">📐 СЕТКА</button>
    </div>
  </header>

  <main class="main-content">
    <h1 class="page-title">🔗 Детектор скрытых связей</h1>
    <p class="page-subtitle">Анализ неочевидных связей между событиями</p>

    <div class="stats-row" id="stats-row">
      <div class="stat-item">
        <div class="stat-label">Событий</div>
        <div class="stat-value blue" id="stat-events">0</div>
      </div>
      <div class="stat-item">
        <div class="stat-label">Связей</div>
        <div class="stat-value green" id="stat-links">0</div>
      </div>
      <div class="stat-item">
        <div class="stat-label">Узлов в графе</div>
        <div class="stat-value orange" id="stat-nodes">0</div>
      </div>
      <div class="stat-item">
        <div class="stat-label">Связей в графе</div>
        <div class="stat-value" id="stat-edges">0</div>
      </div>
    </div>

    <div class="controls">
      <button class="btn btn-primary" id="btn-update">🔄 Обновить данные</button>
      <button class="btn btn-secondary" id="btn-refresh">🔄 Обновить граф</button>
      <span class="status-label" id="status-label">⏹ Готов</span>
    </div>

    <div class="graph-container">
      <div id="graph-container" class="graph-canvas">
        <div class="loading">⏳ Загрузите данные или нажмите "Обновить"</div>
      </div>
    </div>

    <div class="top-links-panel">
      <h3>🔥 Самые сильные связи</h3>
      <div id="top-links" class="top-links-list">
        <div class="loading">Нет данных</div>
      </div>
    </div>
  </main>

  <div id="coordinate-grid"></div>
  <div id="grid-coords">X: 0  Y: 0</div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/vis-network/9.1.2/vis-network.min.js"></script>
  <script src="/js/hidden-links.js"></script>
<script src="/js/help.js"></script>
</body>
</html>
