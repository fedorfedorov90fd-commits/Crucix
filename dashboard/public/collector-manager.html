<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Управление источниками — Crucix</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a1a;
            color: #e0e0e0;
            font-family: -apple-system, 'Segoe UI', system-ui, sans-serif;
            min-height: 100vh;
        }

        .topbar {
            position: fixed; top: 0; left: 0; right: 0;
            height: 60px;
            background: rgba(10,10,20,0.95);
            backdrop-filter: blur(12px);
            border-bottom: 2px solid rgba(91,192,248,0.25);
            box-shadow: 0 2px 20px rgba(91,192,248,0.08);
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
        }
        .topbar::after {
            content: "";
            position: absolute;
            bottom: -2px; left: 0; right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, #5bc0f8, transparent);
            opacity: 0.6;
        }
        .topbar-left { display: flex; align-items: center; gap: 12px; }
        .topbar-brand { font-size: 14px; font-weight: 700; color: #5bc0f8; text-transform: uppercase; letter-spacing: 2px; }
        .topbar-right { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
        .topbar-btn {
            height: 28px; padding: 0 12px;
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 4px;
            background: rgba(255,255,255,0.03);
            color: #888;
            font-size: 11px;
            font-weight: 500;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .topbar-btn:hover { background: rgba(255,255,255,0.06); transform: translateY(-1px); }
        .btn-home { color: #5bc0f8; border-color: rgba(91,192,248,0.2); background: rgba(91,192,248,0.06); }
        .btn-home:hover { background: rgba(91,192,248,0.15); }
        .btn-copy { color: #5bc0f8; border-color: rgba(91,192,248,0.15); background: rgba(91,192,248,0.06); }
        .btn-copy.copied { background: rgba(76,175,80,0.2); border-color: #4caf50; color: #4caf50; }
        .btn-rss { color: #f26522; border-color: rgba(242,101,34,0.2); background: rgba(242,101,34,0.06); }
        .btn-rss:hover { background: rgba(242,101,34,0.15); }
        .btn-help { color: #a78bfa; border-color: rgba(167,139,250,0.2); background: rgba(167,139,250,0.06); }
        .btn-help:hover { background: rgba(167,139,250,0.15); }

        .lang-switch {
            display: flex; gap: 2px; padding: 2px;
            background: rgba(255,255,255,0.03);
            border-radius: 4px;
            border: 1px solid rgba(255,255,255,0.06);
        }
        .lang-btn {
            padding: 2px 8px; border: none; background: transparent;
            color: #666; font-size: 11px; font-weight: 500;
            cursor: pointer; border-radius: 3px; transition: all 0.2s;
        }
        .lang-btn:hover { color: #888; background: rgba(255,255,255,0.05); }
        .lang-btn.active { color: #5bc0f8; background: rgba(91,192,248,0.1); }

        .copy-dropdown {
            position: relative;
            display: inline-block;
        }
        .copy-dropdown-content {
            display: none;
            position: absolute;
            right: 0;
            top: 32px;
            background: #0a0a1a;
            min-width: 220px;
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 8px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.6);
            z-index: 200;
            padding: 6px 0;
        }
        .copy-dropdown-content.show { display: block; }
        .copy-dropdown-content button {
            display: block; width: 100%; padding: 8px 16px;
            background: transparent; border: none;
            color: #c8d0d8; font-size: 12px; text-align: left;
            cursor: pointer; transition: all 0.15s;
            font-family: inherit;
        }
        .copy-dropdown-content button:hover { background: rgba(91,192,248,0.08); color: #5bc0f8; }
        .copy-dropdown-content .divider { height: 1px; background: rgba(255,255,255,0.05); margin: 4px 12px; }
        .copy-dropdown-content .label { padding: 4px 16px; font-size: 10px; color: #4a5a6a; text-transform: uppercase; letter-spacing: 0.5px; }

        .nav-dashboards {
            position: fixed;
            top: 60px;
            left: 0;
            right: 0;
            height: 38px;
            background: rgba(6,10,18,0.92);
            backdrop-filter: blur(8px);
            border-bottom: 1px solid rgba(255,255,255,0.04);
            z-index: 99;
            display: flex;
            align-items: center;
            padding: 0 20px;
            gap: 4px;
            overflow-x: auto;
            scrollbar-width: none;
        }
        .nav-dashboards::-webkit-scrollbar { display: none; }

        .nav-btn {
            padding: 4px 10px;
            border: none;
            border-radius: 4px;
            background: transparent;
            color: #666;
            font-size: 10px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
            font-family: inherit;
            border: 1px solid transparent;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 3px;
        }
        .nav-btn:hover { color: #c8d0d8; background: rgba(255,255,255,0.04); }
        .nav-btn.active { color: #5bc0f8; background: rgba(91,192,248,0.08); border-color: rgba(91,192,248,0.15); }
        .nav-btn .icon { margin-right: 3px; }

        .main-content {
            padding-top: 114px;
            max-width: 1440px;
            margin: 0 auto;
            padding-left: 20px;
            padding-right: 20px;
            padding-bottom: 40px;
            min-height: calc(100vh - 114px);
        }

        .page-title {
            font-size: 28px;
            font-weight: 700;
            color: #e8f0f8;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .page-title .badge {
            font-size: 12px; font-weight: 400;
            background: rgba(251,191,36,0.15); color: #fbbf24;
            padding: 2px 12px; border-radius: 20px;
            border: 1px solid rgba(251,191,36,0.2);
        }
        .page-subtitle {
            color: #8899aa;
            font-size: 14px;
            margin-bottom: 24px;
        }
        .page-subtitle a {
            color: #5bc0f8;
            text-decoration: none;
        }
        .page-subtitle a:hover { text-decoration: underline; }

        .status-bar {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 20px;
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 8px;
            padding: 16px 20px;
        }
        .status-item {
            font-size: 14px;
            color: #8899aa;
        }
        .status-item .num {
            font-weight: 700;
            color: #5bc0f8;
        }
        .status-item .num.on { color: #4ade80; }
        .status-item .num.off { color: #ef4444; }

        .category {
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 10px;
            padding: 16px 20px;
            margin-bottom: 16px;
        }
        .category-title {
            font-size: 16px;
            font-weight: 600;
            color: #5bc0f8;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .category-title .count {
            font-size: 12px;
            color: #4a5a6a;
            font-weight: 400;
        }

        .source-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 10px 12px;
            border-bottom: 1px solid rgba(255,255,255,0.03);
            flex-wrap: wrap;
        }
        .source-item:last-child { border-bottom: none; }

        .source-icon { font-size: 18px; width: 30px; }
        .source-name {
            flex: 1;
            font-size: 14px;
            font-weight: 500;
            min-width: 140px;
        }
        .source-name .desc {
            font-size: 11px;
            color: #4a5a6a;
            font-weight: 400;
            display: block;
        }

        .source-status {
            font-size: 11px;
            padding: 2px 10px;
            border-radius: 12px;
            font-weight: 500;
        }
        .source-status.on { background: rgba(74,222,128,0.15); color: #4ade80; }
        .source-status.off { background: rgba(74,90,106,0.15); color: #8899aa; }
        .source-status.limited { background: rgba(251,191,36,0.15); color: #fbbf24; }

        .source-limit {
            font-size: 11px;
            color: #4a5a6a;
            min-width: 70px;
        }
        .source-limit .val { color: #5bc0f8; }

        .key-input {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 4px;
            padding: 4px 10px;
            color: #e0e0e0;
            font-size: 12px;
            width: 160px;
            font-family: inherit;
        }
        .key-input::placeholder { color: #4a5a6a; }
        .key-input:focus { outline: none; border-color: rgba(91,192,248,0.3); }

        .btn-sm {
            padding: 4px 14px;
            border: none;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
        }
        .btn-sm:hover { transform: translateY(-1px); }

        .btn-toggle {
            background: rgba(74,222,128,0.15);
            color: #4ade80;
        }
        .btn-toggle.on { background: rgba(239,68,68,0.15); color: #ef4444; }
        .btn-toggle:hover { opacity: 0.8; }

        .btn-key {
            background: rgba(91,192,248,0.12);
            color: #5bc0f8;
            border: 1px solid rgba(91,192,248,0.15);
        }
        .btn-key:hover { background: rgba(91,192,248,0.2); }

        .notification {
            position: fixed;
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.85);
            color: #ffffff;
            padding: 8px 20px;
            border-radius: 6px;
            font-size: 13px;
            z-index: 100001;
            border: 1px solid rgba(255,255,255,0.1);
            animation: notif-fade 2.5s forwards;
        }
        @keyframes notif-fade {
            0% { opacity: 0; transform: translateX(-50%) translateY(10px); }
            10% { opacity: 1; transform: translateX(-50%) translateY(0); }
            80% { opacity: 1; }
            100% { opacity: 0; transform: translateX(-50%) translateY(-20px); }
        }

        @media (max-width: 768px) {
            .topbar { padding: 0 12px; height: 52px; }
            .topbar-brand { font-size: 12px; }
            .topbar-btn { font-size: 10px; padding: 0 8px; height: 24px; }
            .nav-dashboards { top: 52px; height: 34px; padding: 0 10px; gap: 2px; }
            .nav-btn { font-size: 9px; padding: 2px 6px; }
            .main-content { padding-top: 102px; padding-left: 12px; padding-right: 12px; }
            .page-title { font-size: 20px; }
            .source-item { gap: 8px; }
            .key-input { width: 120px; }
        }
        @media (max-width: 480px) {
            .topbar { padding: 0 8px; height: 46px; }
            .topbar-brand { font-size: 10px; letter-spacing: 1px; }
            .topbar-btn { font-size: 9px; padding: 0 6px; height: 20px; }
            .lang-btn { font-size: 9px; padding: 1px 5px; }
            .nav-dashboards { top: 46px; height: 30px; padding: 0 6px; gap: 2px; }
            .nav-btn { font-size: 8px; padding: 2px 5px; }
            .main-content { padding-top: 92px; padding-left: 8px; padding-right: 8px; }
            .page-title { font-size: 16px; }
            .key-input { width: 100px; }
            .source-item { gap: 6px; }
        }
    </style>
</head>
<body>

<header class="topbar">
    <div class="topbar-left"><span class="topbar-brand">⚙️ УПРАВЛЕНИЕ ИСТОЧНИКАМИ</span></div>
    <div class="topbar-right">
        <button class="topbar-btn btn-home" onclick="window.location.href='/jarvis'">← НА ГЛАВНУЮ</button>
        <div class="copy-dropdown">
            <button class="topbar-btn btn-copy" id="copy-btn">📋 КОПИРОВАТЬ ▼</button>
            <div class="copy-dropdown-content" id="copyDropdown">
                <div class="label">ФОРМАТЫ КОПИРОВАНИЯ</div>
                <button data-format="text">📄 Как текст</button>
                <button data-format="json">📊 Как JSON</button>
                <div class="divider"></div>
                <button data-format="all">📦 ВСЁ</button>
            </div>
        </div>
        <button class="topbar-btn btn-rss" onclick="window.location.href='/registry'">📡 Реестр</button>
        <button class="topbar-btn btn-help" onclick="openHelp()">❓ HELP</button>
        <div class="lang-switch">
            <button class="lang-btn active" data-lang="ru" onclick="switchLang('ru')">RU</button>
            <button class="lang-btn" data-lang="en" onclick="switchLang('en')">EN</button>
        </div>
    </div>
</header>

<nav class="nav-dashboards" id="navDashboards">
    <button class="nav-btn" onclick="window.location.href='/dashboard-5in1'"><span class="icon">🎯</span>Центр аналитики</button>
    <button class="nav-btn" onclick="window.location.href='/dashboard-economic'"><span class="icon">📊</span>Экономика</button>
    <button class="nav-btn" onclick="window.location.href='/dashboard-financial'"><span class="icon">💰</span>Финансы</button>
    <button class="nav-btn" onclick="window.location.href='/dashboard-military'"><span class="icon">🛡️</span>Военный</button>
    <button class="nav-btn" onclick="window.location.href='/dashboard-geopolitical'"><span class="icon">🌍</span>Геополитика</button>
    <button class="nav-btn" onclick="window.location.href='/dashboard-ecological'"><span class="icon">🌿</span>Экология</button>
    <button class="nav-btn" onclick="window.location.href='/dashboard-cyber'"><span class="icon">🔒</span>Кибер</button>
    <button class="nav-btn" onclick="window.location.href='/dashboard-space'"><span class="icon">🚀</span>Космос</button>
    <button class="nav-btn" onclick="window.location.href='/dashboard-news'"><span class="icon">📰</span>Новости</button>
    <button class="nav-btn" onclick="window.location.href='/dashboard-ai'"><span class="icon">🧠</span>AI</button>
    <button class="nav-btn" onclick="window.location.href='/dashboard-scientific'"><span class="icon">🔬</span>Наука</button>
    <button class="nav-btn" onclick="window.location.href='/dashboard-esg'"><span class="icon">🌱</span>ESG</button>
    <button class="nav-btn" onclick="window.location.href='/dashboard-threats'"><span class="icon">⚡</span>Угрозы</button>
    <button class="nav-btn" onclick="window.location.href='/dashboard-health'"><span class="icon">🏥</span>Здоровье</button>
    <button class="nav-btn" onclick="window.location.href='/dashboard-energy'"><span class="icon">⛽</span>Энергетика</button>
    <button class="nav-btn" onclick="window.location.href='/dashboard-transport'"><span class="icon">🚛</span>Транспорт</button>
    <button class="nav-btn" onclick="window.location.href='/dashboard-regions'"><span class="icon">🌏</span>Регионы</button>
</nav>

<main class="main-content">
    <div class="page-title">
        ⚙️ Управление источниками данных
        <span class="badge" id="statusBadge">🟢 ONLINE</span>
    </div>
    <div class="page-subtitle">
        Включайте/отключайте источники, управляйте API-ключами и лимитами
        <span style="margin-left:12px;font-size:12px;color:#4a5a6a;">
            <a href="/registry" target="_blank">📋 Полный реестр</a>
        </span>
    </div>

    <div class="status-bar" id="statusBar">
        <span class="status-item">📦 Всего: <span class="num" id="totalCount">0</span></span>
        <span class="status-item">✅ Включено: <span class="num on" id="enabledCount">0</span></span>
        <span class="status-item">❌ Выключено: <span class="num off" id="disabledCount">0</span></span>
        <span class="status-item">⏳ Лимиты: <span class="num" id="limitedCount" style="color:#fbbf24;">0</span></span>
    </div>

    <div id="sourcesContainer">
        <div style="text-align:center;color:#4a5a6a;padding:40px;">Загрузка...</div>
    </div>
</main>

<script>
// ============================================================
// 1. ПЕРЕКЛЮЧАТЕЛЬ ЯЗЫКА
// ============================================================
let currentLang = localStorage.getItem('crucix-lang') || 'ru';

function switchLang(lang) {
    currentLang = lang;
    localStorage.setItem('crucix-lang', lang);
    document.querySelectorAll('.lang-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.lang === lang);
    });
    showNotification('🌐 Язык: ' + lang.toUpperCase());
}

document.querySelectorAll('.lang-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.lang === currentLang);
});

// ============================================================
// 2. УВЕДОМЛЕНИЯ И HELP
// ============================================================
function showNotification(msg) {
    document.querySelectorAll('.notification').forEach(el => el.remove());
    const el = document.createElement('div');
    el.className = 'notification';
    el.textContent = msg;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 2500);
}

function openHelp() {
    alert('⚙️ Управление источниками\n\nВключайте или отключайте любые источники данных.\nВставляйте API-ключи в поля.\nЛимиты обновляются автоматически.');
}

// ============================================================
// 3. КНОПКА КОПИРОВАТЬ
// ============================================================
document.getElementById('copy-btn').addEventListener('click', function(e) {
    e.stopPropagation();
    document.getElementById('copyDropdown').classList.toggle('show');
});

document.addEventListener('click', function() {
    document.getElementById('copyDropdown').classList.remove('show');
});

function copyPageData(format) {
    const timestamp = new Date().toLocaleString();
    const pageTitle = document.querySelector('.page-title')?.textContent || document.title || 'Без заголовка';
    const url = window.location.href;

    let report = '=== CRUCIX — УПРАВЛЕНИЕ ИСТОЧНИКАМИ ===\n';
    report += 'Дата: ' + timestamp + '\n';
    report += 'URL: ' + url + '\n\n';

    const config = window._configData;
    if (config) {
        report += '--- КОНФИГУРАЦИЯ ---\n';
        for (const [cat, sources] of Object.entries(config.sources)) {
            report += '\n📂 ' + cat.toUpperCase() + '\n';
            for (const [name, data] of Object.entries(sources)) {
                report += `  ${name}: ${data.enabled ? '✅ Вкл' : '❌ Выкл'}  |  ${data.limit || '∞'} зап/сутки\n`;
            }
        }
    }

    report += '\n--- CRUCIX OSINT TERMINAL ---\n';
    report += '🌐 ' + window.location.origin;

    navigator.clipboard.writeText(report).then(() => {
        const btn = document.getElementById('copy-btn');
        btn.textContent = '✅ ' + format.toUpperCase();
        btn.classList.add('copied');
        setTimeout(() => {
            btn.textContent = '📋 КОПИРОВАТЬ ▼';
            btn.classList.remove('copied');
        }, 3000);
        showNotification('✅ Скопировано');
    }).catch(() => {
        const textarea = document.createElement('textarea');
        textarea.value = report;
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand('copy');
        document.body.removeChild(textarea);
        showNotification('✅ Скопировано');
    });
}

document.querySelectorAll('#copyDropdown button[data-format]').forEach(btn => {
    btn.addEventListener('click', function(e) {
        e.stopPropagation();
        document.getElementById('copyDropdown').classList.remove('show');
        copyPageData(this.dataset.format);
    });
});

// ============================================================
// 4. ОСНОВНАЯ ЛОГИКА
// ============================================================
let configData = {};

async function loadConfig() {
    try {
        const res = await fetch('/api/collector-config');
        const json = await res.json();
        if (!json.success) {
            document.getElementById('sourcesContainer').innerHTML =
                '<div style="text-align:center;color:#ef4444;padding:40px;">❌ Ошибка загрузки конфигурации</div>';
            return;
        }
        configData = json.data;
        window._configData = configData;
        renderConfig(configData);
    } catch (e) {
        document.getElementById('sourcesContainer').innerHTML =
            '<div style="text-align:center;color:#ef4444;padding:40px;">❌ Ошибка: ' + e.message + '</div>';
    }
}

function renderConfig(config) {
    const container = document.getElementById('sourcesContainer');
    const categories = config.sources || {};
    let total = 0, enabled = 0, disabled = 0, limited = 0;

    let html = '';

    for (const [cat, sources] of Object.entries(categories)) {
        const count = Object.keys(sources).length;
        html += `<div class="category">`;
        html += `<div class="category-title">📂 ${cat.toUpperCase()} <span class="count">(${count} источников)</span></div>`;

        for (const [name, data] of Object.entries(sources)) {
            total++;
            if (data.enabled) enabled++;
            else disabled++;
            if (data.limit && data.limit > 0) limited++;

            const statusClass = data.enabled ? 'on' : 'off';
            const statusText = data.enabled ? '✅ Вкл' : '❌ Выкл';
            const toggleText = data.enabled ? 'Выключить' : 'Включить';
            const toggleClass = data.enabled ? 'on' : '';

            const limitText = data.limit ? `${data.limit} зап/сутки` : '∞';

            const keyInputId = `key-${cat}-${name}`;
            const keyDisplay = data.key ? data.key : '';

            const iconMap = {
                'openweathermap': '🌤️',
                'gismeteo': '🌦️',
                'accuweather': '🌧️',
                'openmeteo': '🌡️',
                'noaa': '🌊',
                'weathergov': '⛅'
            };
            const icon = iconMap[name] || '📡';

            html += `
            <div class="source-item" data-category="${cat}" data-name="${name}">
                <span class="source-icon">${icon}</span>
                <span class="source-name">
                    ${name}
                    <span class="desc">${cat}</span>
                </span>
                <span class="source-status ${statusClass}">${statusText}</span>
                <span class="source-limit">⏳ <span class="val">${limitText}</span></span>
                <input class="key-input" id="${keyInputId}" placeholder="API ключ" value="${keyDisplay}" />
                <button class="btn-sm btn-key" onclick="saveKey('${cat}','${name}','${keyInputId}')">💾 Ключ</button>
                <button class="btn-sm btn-toggle ${toggleClass}" onclick="toggleSource('${cat}','${name}')">${toggleText}</button>
            </div>`;
        }
        html += '</div>';
    }

    container.innerHTML = html;

    document.getElementById('totalCount').textContent = total;
    document.getElementById('enabledCount').textContent = enabled;
    document.getElementById('disabledCount').textContent = disabled;
    document.getElementById('limitedCount').textContent = limited;
}

async function toggleSource(category, name) {
    try {
        const res = await fetch(`/api/collector-config/toggle?category=${category}&name=${name}`, { method: 'POST' });
        const json = await res.json();
        if (json.success) {
            showNotification(`✅ ${category}/${name} → ${json.data.enabled ? 'включён' : 'отключён'}`);
            loadConfig();
        } else {
            showNotification('❌ Ошибка: ' + json.error);
        }
    } catch (e) {
        showNotification('❌ Ошибка: ' + e.message);
    }
}

async function saveKey(category, name, inputId) {
    const input = document.getElementById(inputId);
    const key = input.value.trim();
    try {
        const res = await fetch('/api/collector-config/key', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ category, name, key })
        });
        const json = await res.json();
        if (json.success) {
            showNotification('✅ Ключ сохранён');
            loadConfig();
        } else {
            showNotification('❌ Ошибка: ' + json.error);
        }
    } catch (e) {
        showNotification('❌ Ошибка: ' + e.message);
    }
}

// ============================================================
// 5. ЗАПУСК
// ============================================================
loadConfig();
setInterval(loadConfig, 60000); // обновление каждую минуту
</script>
</body>
</html>
