<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Центр аналитики — Crucix</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a1a;
            color: #e0e0e0;
            font-family: -apple-system, 'Segoe UI', system-ui, sans-serif;
            min-height: 100vh;
        }

        /* ===== ТОПБАР (НЕ ТРОГАЕМ) ===== */
        .topbar {
            position: fixed; top: 0; left: 0; right: 0;
            height: 60px;
            background: rgba(10,10,20,0.95);
            backdrop-filter: blur(12px);
            border-bottom: 2px solid rgba(91,192,248,0.25);
            box-shadow: 0 2px 20px rgba(91,192,248,0.08);
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
        }
        .topbar::after {
            content: "";
            position: absolute;
            bottom: -2px; left: 0; right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, #5bc0f8, transparent);
            opacity: 0.6;
        }
        .topbar-left { display: flex; align-items: center; gap: 12px; }
        .topbar-brand { font-size: 14px; font-weight: 700; color: #5bc0f8; text-transform: uppercase; letter-spacing: 2px; }
        .topbar-right { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
        .topbar-btn {
            height: 28px; padding: 0 12px;
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 4px;
            background: rgba(255,255,255,0.03);
            color: #888;
            font-size: 11px;
            font-weight: 500;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .topbar-btn:hover { background: rgba(255,255,255,0.06); transform: translateY(-1px); }
        .btn-home { color: #5bc0f8; border-color: rgba(91,192,248,0.2); background: rgba(91,192,248,0.06); }
        .btn-home:hover { background: rgba(91,192,248,0.15); }
        .btn-copy { color: #5bc0f8; border-color: rgba(91,192,248,0.15); background: rgba(91,192,248,0.06); }
        .btn-copy.copied { background: rgba(76,175,80,0.2); border-color: #4caf50; color: #4caf50; }
        .btn-rss { color: #f26522; border-color: rgba(242,101,34,0.2); background: rgba(242,101,34,0.06); }
        .btn-rss:hover { background: rgba(242,101,34,0.15); }
        .btn-help { color: #a78bfa; border-color: rgba(167,139,250,0.2); background: rgba(167,139,250,0.06); }
        .btn-help:hover { background: rgba(167,139,250,0.15); }

        .lang-switch {
            display: flex; gap: 2px; padding: 2px;
            background: rgba(255,255,255,0.03);
            border-radius: 4px;
            border: 1px solid rgba(255,255,255,0.06);
        }
        .lang-btn {
            padding: 2px 8px; border: none; background: transparent;
            color: #666; font-size: 11px; font-weight: 500;
            cursor: pointer; border-radius: 3px; transition: all 0.2s;
        }
        .lang-btn:hover { color: #888; background: rgba(255,255,255,0.05); }
        .lang-btn.active { color: #5bc0f8; background: rgba(91,192,248,0.1); }

        .copy-dropdown {
            position: relative;
            display: inline-block;
        }
        .copy-dropdown-content {
            display: none;
            position: absolute;
            right: 0;
            top: 32px;
            background: #0a0a1a;
            min-width: 220px;
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 8px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.6);
            z-index: 200;
            padding: 6px 0;
        }
        .copy-dropdown-content.show { display: block; }
        .copy-dropdown-content button {
            display: block; width: 100%; padding: 8px 16px;
            background: transparent; border: none;
            color: #c8d0d8; font-size: 12px; text-align: left;
            cursor: pointer; transition: all 0.15s;
            font-family: inherit;
        }
        .copy-dropdown-content button:hover { background: rgba(91,192,248,0.08); color: #5bc0f8; }
        .copy-dropdown-content .divider { height: 1px; background: rgba(255,255,255,0.05); margin: 4px 12px; }
        .copy-dropdown-content .label { padding: 4px 16px; font-size: 10px; color: #4a5a6a; text-transform: uppercase; letter-spacing: 0.5px; }

        /* ===== ВТОРАЯ ПАНЕЛЬ (НАВИГАЦИЯ ПО ДАШБОРДАМ) ===== */
        .nav-dashboards {
            position: fixed;
            top: 60px;
            left: 0;
            right: 0;
            height: 38px;
            background: rgba(6,10,18,0.92);
            backdrop-filter: blur(8px);
            border-bottom: 1px solid rgba(255,255,255,0.04);
            z-index: 99;
            display: flex;
            align-items: center;
            padding: 0 20px;
            gap: 4px;
            overflow-x: auto;
            scrollbar-width: none;
        }
        .nav-dashboards::-webkit-scrollbar { display: none; }

        .nav-btn {
            padding: 4px 10px;
            border: none;
            border-radius: 4px;
            background: transparent;
            color: #666;
            font-size: 10px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
            font-family: inherit;
            border: 1px solid transparent;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 3px;
        }
        .nav-btn:hover { color: #c8d0d8; background: rgba(255,255,255,0.04); }
        .nav-btn.active { color: #5bc0f8; background: rgba(91,192,248,0.08); border-color: rgba(91,192,248,0.15); }
        .nav-btn .icon { margin-right: 3px; }
        .nav-btn.center { color: #fbbf24; border-color: rgba(251,191,36,0.2); background: rgba(251,191,36,0.06); }
        .nav-btn.center:hover { background: rgba(251,191,36,0.15); }

        /* ===== ОСНОВНОЙ КОНТЕНТ ===== */
        .main-content {
            padding-top: 114px;
            max-width: 1440px;
            margin: 0 auto;
            padding-left: 20px;
            padding-right: 20px;
            padding-bottom: 40px;
            min-height: calc(100vh - 114px);
        }

        .page-title {
            font-size: 28px;
            font-weight: 700;
            color: #e8f0f8;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .page-title .badge {
            font-size: 12px; font-weight: 400;
            background: rgba(251,191,36,0.15); color: #fbbf24;
            padding: 2px 12px; border-radius: 20px;
            border: 1px solid rgba(251,191,36,0.2);
        }
        .page-subtitle { color: #8899aa; font-size: 14px; margin-bottom: 24px; }
        .page-subtitle a { color: #5bc0f8; text-decoration: none; }
        .page-subtitle a:hover { text-decoration: underline; }

        .global-index {
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 12px;
            padding: 20px 24px;
            margin-bottom: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }
        .global-index .value {
            font-size: 36px;
            font-weight: 700;
            color: #f59e0b;
        }
        .global-index .label { font-size: 14px; color: #8899aa; }
        .global-index .status {
            font-size: 14px;
            font-weight: 600;
            padding: 4px 16px;
            border-radius: 20px;
        }
        .global-index .stats { display: flex; gap: 24px; font-size: 14px; color: #8899aa; }
        .global-index .stats strong { color: #e0e0e0; }
        .global-index .stats .num-normal { color: #4ade80; }
        .global-index .stats .num-medium { color: #fbbf24; }
        .global-index .stats .num-high { color: #f59e0b; }
        .global-index .stats .num-critical { color: #ef4444; }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 12px;
            margin-bottom: 24px;
        }
        .card-link {
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
            height: 100%;
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 10px;
            padding: 14px;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
            min-height: 160px;
        }
        .card-link:hover {
            background: rgba(255,255,255,0.04);
            transform: translateY(-2px);
            border-color: rgba(255,255,255,0.1);
        }
        .card-link .card-number {
            position: absolute;
            top: 4px; left: 6px;
            font-size: 9px;
            font-weight: 700;
            color: #4a5a6a;
            background: rgba(255,255,255,0.04);
            padding: 0 6px;
            border-radius: 4px;
            font-family: monospace;
        }
        .card-link .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
            margin-top: 6px;
        }
        .card-link .header .icon { font-size: 18px; }
        .card-link .header .name { font-size: 12px; font-weight: 600; color: #c0d0e0; }
        .card-link .header .status-dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            display: inline-block;
            flex-shrink: 0;
        }
        .card-link .main-value {
            font-size: 22px;
            font-weight: 700;
            margin: 2px 0;
        }
        .card-link .change {
            font-size: 12px;
            font-weight: 600;
            margin-left: 4px;
        }
        .card-link .change.up { color: #4ade80; }
        .card-link .change.down { color: #ef4444; }
        .card-link .change.neutral { color: #f59e0b; }

        .card-link .status-label {
            font-size: 11px;
            font-weight: 600;
            padding: 1px 8px;
            border-radius: 12px;
            display: inline-block;
            margin: 2px 0;
        }
        .card-link .status-label.critical { background: rgba(239,68,68,0.15); color: #ef4444; border: 1px solid rgba(239,68,68,0.2); }
        .card-link .status-label.high { background: rgba(245,158,11,0.15); color: #f59e0b; border: 1px solid rgba(245,158,11,0.2); }
        .card-link .status-label.medium { background: rgba(251,191,36,0.15); color: #fbbf24; border: 1px solid rgba(251,191,36,0.2); }
        .card-link .status-label.normal { background: rgba(74,222,128,0.15); color: #4ade80; border: 1px solid rgba(74,222,128,0.2); }

        .card-link .forecast { font-size: 11px; color: #8899aa; margin: 2px 0; }
        .card-link .source {
            font-size: 9px; color: #4a5a6a;
            margin-top: auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .card-link .source .src { color: #5bc0f8; }
        .card-link .source .updated { color: #4a5a6a; }
        .card-link .click-hint {
            font-size: 8px;
            color: #4a5a6a;
            text-align: center;
            margin-top: 2px;
        }

        .bg-critical { background: #ef4444; }
        .bg-high { background: #f59e0b; }
        .bg-medium { background: #fbbf24; }
        .bg-low { background: #4ade80; }
        .bg-online { background: #4ade80; }
        .bg-offline { background: #ef4444; }

        .charts-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 24px;
        }
        .chart-box {
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 10px;
            padding: 16px;
            min-height: 200px;
        }
        .chart-box .title {
            font-size: 13px;
            font-weight: 600;
            color: #8899aa;
            margin-bottom: 8px;
        }
        .chart-box .chart-placeholder {
            display: flex;
            align-items: flex-end;
            justify-content: center;
            height: 140px;
            gap: 2px;
            padding: 4px 0;
        }
        .chart-box .chart-placeholder .bar {
            flex: 1;
            border-radius: 2px 2px 0 0;
            min-width: 4px;
            min-height: 4px;
            transition: all 0.3s;
        }
        .chart-box .labels {
            display: flex;
            justify-content: space-between;
            font-size: 9px;
            color: #4a5a6a;
            margin-top: 4px;
        }

        .feed {
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 10px;
            padding: 16px;
            max-height: 300px;
            overflow-y: auto;
        }
        .feed .title {
            font-size: 13px;
            font-weight: 600;
            color: #8899aa;
            margin-bottom: 8px;
        }
        .feed-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 6px 0;
            border-bottom: 1px solid rgba(255,255,255,0.03);
            font-size: 13px;
        }
        .feed-item .source {
            font-weight: 600;
            font-size: 10px;
            padding: 1px 8px;
            border-radius: 4px;
            min-width: 60px;
            text-align: center;
        }
        .feed-item .msg { flex: 1; color: #c0d0e0; }
        .feed-item .time { font-size: 11px; color: #4a5a6a; }

        .source-notam { background: rgba(239,68,68,0.2); color: #ef4444; }
        .source-gps { background: rgba(245,158,11,0.2); color: #f59e0b; }
        .source-trends { background: rgba(91,192,248,0.2); color: #5bc0f8; }
        .source-vix { background: rgba(239,68,68,0.2); color: #ef4444; }
        .source-yield { background: rgba(74,222,128,0.2); color: #4ade80; }

        .notification {
            position: fixed;
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.85);
            color: #ffffff;
            padding: 8px 20px;
            border-radius: 6px;
            font-size: 13px;
            z-index: 100001;
            border: 1px solid rgba(255,255,255,0.1);
            animation: notif-fade 2.5s forwards;
        }
        @keyframes notif-fade {
            0% { opacity: 0; transform: translateX(-50%) translateY(10px); }
            10% { opacity: 1; transform: translateX(-50%) translateY(0); }
            80% { opacity: 1; }
            100% { opacity: 0; transform: translateX(-50%) translateY(-20px); }
        }

        @media (max-width: 1200px) { .cards-grid { grid-template-columns: repeat(4, 1fr); } }
        @media (max-width: 992px) { .cards-grid { grid-template-columns: repeat(3, 1fr); } }
        @media (max-width: 768px) {
            .cards-grid { grid-template-columns: repeat(2, 1fr); }
            .charts-row { grid-template-columns: 1fr; }
            .topbar { padding: 0 12px; height: 52px; }
            .topbar-brand { font-size: 12px; }
            .topbar-btn { font-size: 10px; padding: 0 8px; height: 24px; }
            .nav-dashboards { top: 52px; height: 34px; padding: 0 10px; gap: 2px; }
            .nav-btn { font-size: 9px; padding: 2px 6px; }
            .main-content { padding-top: 102px; padding-left: 12px; padding-right: 12px; }
            .page-title { font-size: 20px; }
        }
        @media (max-width: 480px) {
            .cards-grid { grid-template-columns: 1fr; }
            .topbar { padding: 0 8px; height: 46px; }
            .topbar-brand { font-size: 10px; letter-spacing: 1px; }
            .topbar-btn { font-size: 9px; padding: 0 6px; height: 20px; }
            .lang-btn { font-size: 9px; padding: 1px 5px; }
            .nav-dashboards { top: 46px; height: 30px; padding: 0 6px; gap: 2px; overflow-x: auto; }
            .nav-btn { font-size: 8px; padding: 2px 5px; }
            .main-content { padding-top: 92px; padding-left: 8px; padding-right: 8px; }
            .page-title { font-size: 16px; }
            .global-index { flex-direction: column; align-items: flex-start; gap: 12px; }
            .global-index .stats { flex-wrap: wrap; gap: 8px; }
        }
    </style>
</head>
<body>

<!-- ===== ТОПБАР (НЕ ТРОГАЕМ) ===== -->
<header class="topbar">
    <div class="topbar-left"><span class="topbar-brand">🎯 ЦЕНТР АНАЛИТИКИ</span></div>
    <div class="topbar-right">
        <button class="topbar-btn btn-home" onclick="window.location.href='/jarvis'">← НА ГЛАВНУЮ</button>

        <div class="copy-dropdown">
            <button class="topbar-btn btn-copy" id="copy-btn">📋 КОПИРОВАТЬ ▼</button>
            <div class="copy-dropdown-content" id="copyDropdown">
                <div class="label">ФОРМАТЫ КОПИРОВАНИЯ</div>
                <button data-format="text">📄 Как текст (полный снапшот)</button>
                <button data-format="markdown">📝 Как Markdown</button>
                <button data-format="json">📊 Как JSON</button>
                <button data-format="csv">📋 Как CSV (таблицы)</button>
                <div class="divider"></div>
                <button data-format="dom">🌳 DOM-дерево</button>
                <button data-format="storage">💾 localStorage + sessionStorage</button>
                <button data-format="api">📡 API-запросы страницы</button>
                <div class="divider"></div>
                <button data-format="all">📦 ВСЁ В ОДНОМ</button>
            </div>
        </div>

        <button class="topbar-btn btn-rss" onclick="window.location.href='/registry'">📡 Реестр</button>
        <button class="topbar-btn btn-help" onclick="openHelp()">❓ HELP</button>
        <div class="lang-switch">
            <button class="lang-btn active" data-lang="ru" onclick="switchLang('ru')">RU</button>
            <button class="lang-btn" data-lang="en" onclick="switchLang('en')">EN</button>
        </div>
    </div>
</header>

<!-- ===== ВТОРАЯ ПАНЕЛЬ (НАВИГАЦИЯ ПО ДАШБОРДАМ) ===== -->
<nav class="nav-dashboards" id="navDashboards">
    <button class="nav-btn active" onclick="window.location.href='/dashboard-5in1'"><span class="icon">🎯</span>Центр аналитики</button>
    <button class="nav-btn" onclick="window.location.href='/dashboard-economic'"><span class="icon">📊</span>Экономика</button>
    <button class="nav-btn" onclick="window.location.href='/dashboard-financial'"><span class="icon">💰</span>Финансы</button>
    <button class="nav-btn" onclick="window.location.href='/dashboard-military'"><span class="icon">🛡️</span>Военный</button>
    <button class="nav-btn" onclick="window.location.href='/dashboard-geopolitical'"><span class="icon">🌍</span>Геополитика</button>
    <button class="nav-btn" onclick="window.location.href='/dashboard-ecological'"><span class="icon">🌿</span>Экология</button>
    <button class="nav-btn" onclick="window.location.href='/dashboard-cyber'"><span class="icon">🔒</span>Кибер</button>
    <button class="nav-btn" onclick="window.location.href='/dashboard-space'"><span class="icon">🚀</span>Космос</button>
    <button class="nav-btn" onclick="window.location.href='/dashboard-news'"><span class="icon">📰</span>Новости</button>
    <button class="nav-btn" onclick="window.location.href='/dashboard-ai'"><span class="icon">🧠</span>AI</button>
    <button class="nav-btn" onclick="window.location.href='/dashboard-scientific'"><span class="icon">🔬</span>Наука</button>
    <button class="nav-btn" onclick="window.location.href='/dashboard-esg'"><span class="icon">🌱</span>ESG</button>
    <button class="nav-btn" onclick="window.location.href='/dashboard-threats'"><span class="icon">⚡</span>Угрозы</button>
    <button class="nav-btn" onclick="window.location.href='/dashboard-health'"><span class="icon">🏥</span>Здоровье</button>
    <button class="nav-btn" onclick="window.location.href='/dashboard-energy'"><span class="icon">⛽</span>Энергетика</button>
    <button class="nav-btn" onclick="window.location.href='/dashboard-transport'"><span class="icon">🚛</span>Транспорт</button>
    <button class="nav-btn" onclick="window.location.href='/dashboard-regions'"><span class="icon">🌏</span>Регионы</button>
</nav>

<!-- ===== ОСНОВНОЙ КОНТЕНТ ===== -->
<main class="main-content">
    <div class="page-title">
        🎯 Центр аналитики
        <span class="badge" id="statusBadge">🟢 ONLINE</span>
    </div>
    <div class="page-subtitle">
        35 ключевых индикаторов в реальном времени
        <span style="margin-left:12px;font-size:12px;color:#4a5a6a;">
            <a href="/registry" target="_blank">📋 Полный реестр</a>
        </span>
    </div>

    <!-- ГЛОБАЛЬНЫЙ ИНДЕКС -->
    <div class="global-index" id="globalIndexBlock">
        <div>
            <div class="label">🌍 Глобальный индекс напряженности</div>
            <div class="value" id="globalIndex">—</div>
        </div>
        <div class="stats">
            <span>🟢 Нормально: <strong id="normalCount" class="num-normal">0</strong></span>
            <span>🟡 Средний: <strong id="mediumCount" class="num-medium">0</strong></span>
            <span>🟠 Высокий: <strong id="highCount" class="num-high">0</strong></span>
            <span>🔴 Критический: <strong id="criticalCount" class="num-critical">0</strong></span>
        </div>
        <div>
            <span class="status" id="globalStatus">🟢 НОРМАЛЬНО</span>
        </div>
    </div>

    <!-- 35 КАРТОЧЕК -->
    <div class="cards-grid" id="cardsGrid"></div>

    <!-- ГРАФИКИ -->
    <div class="charts-row">
        <div class="chart-box">
            <div class="title">📉 Кривая доходности (10Y-2Y)</div>
            <div class="chart-placeholder" id="yieldChart"></div>
            <div class="labels" id="yieldLabels"></div>
        </div>
        <div class="chart-box">
            <div class="title">📈 Индекс VIX (30 дней)</div>
            <div class="chart-placeholder" id="vixChart"></div>
            <div class="labels" id="vixLabels"></div>
        </div>
    </div>

    <!-- ПОТОК СОБЫТИЙ -->

        btn.classList.add('copied');
        setTimeout(() => {

        textarea.value = report;
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand('copy');
        document.body.removeChild(textarea);
        showNotification('✅ Скопировано в формате ' + format.toUpperCase());
    });
}

// 7. ГРАФИКИ
// ============================================================
function renderChart(containerId, labelsId, data, key, colorGood, colorBad) {
    const container = document.getElementById(containerId);
    const labelsContainer = document.getElementById(labelsId);

    if (!data || data.length < 2) {
        container.innerHTML = '<span style="color:#4a5a6a;font-size:13px;">Недостаточно данных</span>';
        labelsContainer.innerHTML = '';
        return;
    }

    const values = data.map(d => d[key]);
    const maxVal = Math.max(...values) * 1.1 || 1;
    const minVal = Math.min(...values) * 0.9 || 0;
    const range = maxVal - minVal || 1;

    container.innerHTML = data.map(d => {
        const height = ((d[key] - minVal) / range) * 130 + 10;
        const color = d[key] < 0 ? colorBad : colorGood;
        return `<div class="bar" style="height:${height}px;background:${color};"></div>`;
    }).join('');

    const step = Math.max(1, Math.floor(data.length / 6));
    labelsContainer.innerHTML = data.map((d, i) => {
        if (i % step === 0 || i === data.length - 1) {
            return `<span>${d.date.slice(5)}</span>`;
        }
        return `<span></span>`;
    }).join('');
}

function renderFeed(notam, gps, trends, vixData, yieldData) {
    const feed = document.getElementById('feedList');
    const events = [];

    for (const n of notam.slice(0, 2)) {
        events.push({ source: 'NOTAM', msg: `${n.region || '—'}: ${n.label || '—'}`, timestamp: n.start || '' });
    }
    for (const n of gps.slice(0, 2)) {
        events.push({ source: 'GPS', msg: `${n.region || '—'}: ${n.label || '—'}`, timestamp: n.start || '' });
    }
    for (const n of trends.slice(0, 2)) {
        events.push({ source: 'TRENDS', msg: `${n.region || '—'}: "${n.keyword || ''}" +${n.change || 0}%`, timestamp: n.start || '' });
    }
    if (vixData.length > 0) {
        const last = vixData[vixData.length - 1];
        events.push({ source: 'VIX', msg: `${last.value.toFixed(2)} (${last.value > 30 ? '🔴 кризис' : '🟢 спокойствие'})`, timestamp: last.date || '' });
    }
    if (yieldData.length > 0) {
        const last = yieldData[yieldData.length - 1];
        events.push({ source: 'YIELD', msg: `${last.spread.toFixed(2)}% (${last.spread < 0 ? '🔴 инверсия' : '🟢 нормально'})`, timestamp: last.date || '' });
    }

    const sourceColors = {
        'NOTAM': 'source-notam',
        'GPS': 'source-gps',
        'TRENDS': 'source-trends',
        'VIX': 'source-vix',
        'YIELD': 'source-yield'
    };

    feed.innerHTML = events.slice(0, 10).map(e => {
        const sourceClass = sourceColors[e.source] || 'source-notam';
        const time = e.timestamp ? new Date(e.timestamp).toLocaleTimeString('ru-RU') : '';
        return `
            <div class="feed-item">
                <span class="source ${sourceClass}">${e.source}</span>
                <span class="msg">${e.msg}</span>
                <span class="time">${time}</span>
            </div>
        `;
    }).join('') || '<div style="color:#4a5a6a;padding:12px;">Нет событий</div>';
}

            fetchData('/api/notam/'),

            fetchData('/api/google-trends/'),
            fetchData('/api/vix/'),
            fetchData('/api/yield-curve/'),
            fetchData('/api/gold-oil-ratio/'),
            fetchData('/api/copper-gold/'),
            fetchData('/api/bdi/'),
            fetchData('/api/viirs/'),
            fetchData('/api/uranium/'),
            fetchData('/api/big-mac/'),
            fetchData('/api/debt-gdp/'),
            fetchData('/api/sp500-vix/'),
            fetchData('/api/crypto-fear/'),
            fetchData('/api/oil-gas/'),
            fetchData('/api/gold-silver/'),
            fetchData('/api/happiness/'),
            fetchData('/api/big-mac-alt/'),
            fetchData('/api/big-mac-main/'),
            fetchData('/api/vxx/'),
            fetchData('/api/happiness-alt/'),
            fetchData('/api/inflation/'),
            fetchData('/api/unemployment/'),
            fetchData('/api/pmi/'),
            fetchData('/api/recession/'),
            fetchData('/api/dxy/'),
            fetchData('/api/tips/'),
            fetchData('/api/ovx/'),
            fetchData('/api/hy-spread/'),
            fetchData('/api/war-preparation/'),
            fetchData('/api/consumer-confidence/'),
            fetchData('/api/nuclear-monitor/'),
            fetchData('/api/social-unrest/'),
            fetchData('/api/mcp/'),
            fetchData('/api/daily-briefing/')
        ]);

        const allData = {
            notam, gps, trends, vixData, yieldData,
            goldOilData, copperGoldData, bdiData, viirsData, uraniumData,
            bigMacData, debtGdpData, sp500VixData, cryptoFearData,
            oilGasData, goldSilverData, happinessData,
            bigMacAltData, bigMacMainData, vxxData, happinessAltData,
            inflationData, unemploymentData, pmiData, recessionData,
            dxy: dxyData, tips: tipsData, ovx: ovxData,
            'hy-spread': hySpreadData, 'war-prep': warPrepData,
            consumer: consumerData, nuclear: nuclearData, social: socialData,
            'mcp-server': mcpData,
            'daily-briefing': briefingData
        };

        renderCards(allData);

        const totalCritical = getSeverityCount(notam, 'critical') + getSeverityCount(gps, 'critical') + getSeverityCount(trends, 'critical');
        const totalHigh = getSeverityCount(notam, 'high') + getSeverityCount(gps, 'high') + getSeverityCount(trends, 'high');
        const totalMedium = getSeverityCount(notam, 'medium') + getSeverityCount(gps, 'medium') + getSeverityCount(trends, 'medium');

        document.getElementById('criticalCount').textContent = totalCritical;
        document.getElementById('highCount').textContent = totalHigh;
        document.getElementById('mediumCount').textContent = totalMedium;
        document.getElementById('normalCount').textContent = notam.length + gps.length + trends.length - totalCritical - totalHigh - totalMedium;

        const totalEvents = notam.length + gps.length + trends.length;
        const index = totalEvents > 0 ? Math.round((totalCritical * 70 + totalHigh * 40 + totalMedium * 20) / totalEvents) : 0;
        document.getElementById('globalIndex').textContent = index;

        renderChart('yieldChart', 'yieldLabels', yieldData, 'spread', '#4ade80', '#ef4444');
        renderChart('vixChart', 'vixLabels', vixData, 'value', '#5bc0f8', '#ef4444');

        renderFeed(notam, gps, trends, vixData, yieldData);

    } catch (e) {
        console.error('[Dashboard] Ошибка обновления:', e);
    }
}
