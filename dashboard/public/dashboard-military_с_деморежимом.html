<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Военный дашборд — Crucix</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a1a;
            color: #e0e0e0;
            font-family: -apple-system, 'Segoe UI', system-ui, sans-serif;
            min-height: 100vh;
        }

        .topbar {
            position: fixed; top: 0; left: 0; right: 0;
            height: 60px;
            background: rgba(10,10,20,0.95);
            backdrop-filter: blur(12px);
            border-bottom: 2px solid rgba(91,192,248,0.25);
            box-shadow: 0 2px 20px rgba(91,192,248,0.08);
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
        }
        .topbar::after {
            content: "";
            position: absolute;
            bottom: -2px; left: 0; right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, #5bc0f8, transparent);
            opacity: 0.6;
        }
        .topbar-left { display: flex; align-items: center; gap: 12px; }
        .topbar-brand { font-size: 14px; font-weight: 700; color: #5bc0f8; text-transform: uppercase; letter-spacing: 2px; }
        .topbar-right { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
        .topbar-btn {
            height: 28px; padding: 0 12px;
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 4px;
            background: rgba(255,255,255,0.03);
            color: #888;
            font-size: 11px;
            font-weight: 500;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .topbar-btn:hover { background: rgba(255,255,255,0.06); transform: translateY(-1px); }
        .btn-home { color: #5bc0f8; border-color: rgba(91,192,248,0.2); background: rgba(91,192,248,0.06); }
        .btn-home:hover { background: rgba(91,192,248,0.15); }
        .btn-copy { color: #5bc0f8; border-color: rgba(91,192,248,0.15); background: rgba(91,192,248,0.06); }
        .btn-copy.copied { background: rgba(76,175,80,0.2); border-color: #4caf50; color: #4caf50; }
        .btn-rss { color: #f26522; border-color: rgba(242,101,34,0.2); background: rgba(242,101,34,0.06); }
        .btn-rss:hover { background: rgba(242,101,34,0.15); }
        .btn-help { color: #a78bfa; border-color: rgba(167,139,250,0.2); background: rgba(167,139,250,0.06); }
        .btn-help:hover { background: rgba(167,139,250,0.15); }

        .lang-switch {
            display: flex; gap: 2px; padding: 2px;
            background: rgba(255,255,255,0.03);
            border-radius: 4px;
            border: 1px solid rgba(255,255,255,0.06);
        }
        .lang-btn {
            padding: 2px 8px; border: none; background: transparent;
            color: #666; font-size: 11px; font-weight: 500;
            cursor: pointer; border-radius: 3px; transition: all 0.2s;
        }
        .lang-btn:hover { color: #888; background: rgba(255,255,255,0.05); }
        .lang-btn.active { color: #5bc0f8; background: rgba(91,192,248,0.1); }

        .copy-dropdown {
            position: relative;
            display: inline-block;
        }
        .copy-dropdown-content {
            display: none;
            position: absolute;
            right: 0;
            top: 32px;
            background: #0a0a1a;
            min-width: 220px;
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 8px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.6);
            z-index: 200;
            padding: 6px 0;
        }
        .copy-dropdown-content.show { display: block; }
        .copy-dropdown-content button {
            display: block; width: 100%; padding: 8px 16px;
            background: transparent; border: none;
            color: #c8d0d8; font-size: 12px; text-align: left;
            cursor: pointer; transition: all 0.15s;
            font-family: inherit;
        }
        .copy-dropdown-content button:hover { background: rgba(91,192,248,0.08); color: #5bc0f8; }
        .copy-dropdown-content .divider { height: 1px; background: rgba(255,255,255,0.05); margin: 4px 12px; }
        .copy-dropdown-content .label { padding: 4px 16px; font-size: 10px; color: #4a5a6a; text-transform: uppercase; letter-spacing: 0.5px; }

        .nav-dashboards {
            position: fixed;
            top: 60px;
            left: 0;
            right: 0;
            height: 38px;
            background: rgba(6,10,18,0.92);
            backdrop-filter: blur(8px);
            border-bottom: 1px solid rgba(255,255,255,0.04);
            z-index: 99;
            display: flex;
            align-items: center;
            padding: 0 20px;
            gap: 4px;
            overflow-x: auto;
            scrollbar-width: none;
        }
        .nav-dashboards::-webkit-scrollbar { display: none; }

        .nav-btn {
            padding: 4px 10px;
            border: none;
            border-radius: 4px;
            background: transparent;
            color: #666;
            font-size: 10px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
            font-family: inherit;
            border: 1px solid transparent;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 3px;
        }
        .nav-btn:hover { color: #c8d0d8; background: rgba(255,255,255,0.04); }
        .nav-btn.active { color: #5bc0f8; background: rgba(91,192,248,0.08); border-color: rgba(91,192,248,0.15); }
        .nav-btn .icon { margin-right: 3px; }

        .main-content {
            padding-top: 114px;
            max-width: 1440px;
            margin: 0 auto;
            padding-left: 20px;
            padding-right: 20px;
            padding-bottom: 40px;
            min-height: calc(100vh - 114px);
        }

        .page-title {
            font-size: 28px;
            font-weight: 700;
            color: #e8f0f8;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .page-title .badge {
            font-size: 12px; font-weight: 400;
            background: rgba(251,191,36,0.15); color: #fbbf24;
            padding: 2px 12px; border-radius: 20px;
            border: 1px solid rgba(251,191,36,0.2);
        }
        .page-subtitle { color: #8899aa; font-size: 14px; margin-bottom: 24px; }

        .global-index {
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 12px;
            padding: 20px 24px;
            margin-bottom: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }
        .global-index .value {
            font-size: 36px;
            font-weight: 700;
            color: #f59e0b;
        }
        .global-index .label { font-size: 14px; color: #8899aa; }
        .global-index .status {
            font-size: 14px;
            font-weight: 600;
            padding: 4px 16px;
            border-radius: 20px;
        }
        .global-index .stats { display: flex; gap: 24px; font-size: 14px; color: #8899aa; }
        .global-index .stats strong { color: #e0e0e0; }
        .global-index .stats .num-normal { color: #4ade80; }
        .global-index .stats .num-medium { color: #fbbf24; }
        .global-index .stats .num-high { color: #f59e0b; }
        .global-index .stats .num-critical { color: #ef4444; }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 12px;
            margin-bottom: 24px;
        }
        .card-link {
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
            height: 100%;
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 10px;
            padding: 14px;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
            min-height: 160px;
        }
        .card-link:hover {
            background: rgba(255,255,255,0.04);
            transform: translateY(-2px);
            border-color: rgba(255,255,255,0.1);
        }
        .card-link .card-number {
            position: absolute;
            top: 4px; left: 6px;
            font-size: 9px;
            font-weight: 700;
            color: #4a5a6a;
            background: rgba(255,255,255,0.04);
            padding: 0 6px;
            border-radius: 4px;
            font-family: monospace;
        }
        .card-link .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2px;
            margin-top: 6px;
        }
        .card-link .header .icon { font-size: 18px; }
        .card-link .header .name { font-size: 12px; font-weight: 600; color: #c0d0e0; }
        .card-link .header .subtitle {
            font-size: 9px;
            color: #4a5a6a;
            margin: 0 0 2px 0;
            font-weight: 400;
        }
        .card-link .header .status-dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            display: inline-block;
            flex-shrink: 0;
        }
        .card-link .main-value {
            font-size: 22px;
            font-weight: 700;
            margin: 2px 0;
        }
        .card-link .change {
            font-size: 12px;
            font-weight: 600;
            margin-left: 4px;
        }
        .card-link .change.up { color: #4ade80; }
        .card-link .change.down { color: #ef4444; }
        .card-link .change.neutral { color: #f59e0b; }

        .card-link .status-label {
            font-size: 11px;
            font-weight: 600;
            padding: 1px 8px;
            border-radius: 12px;
            display: inline-block;
            margin: 2px 0;
        }
        .card-link .status-label.critical { background: rgba(239,68,68,0.15); color: #ef4444; border: 1px solid rgba(239,68,68,0.2); }
        .card-link .status-label.high { background: rgba(245,158,11,0.15); color: #f59e0b; border: 1px solid rgba(245,158,11,0.2); }
        .card-link .status-label.medium { background: rgba(251,191,36,0.15); color: #fbbf24; border: 1px solid rgba(251,191,36,0.2); }
        .card-link .status-label.normal { background: rgba(74,222,128,0.15); color: #4ade80; border: 1px solid rgba(74,222,128,0.2); }
        .card-link .status-label.demo { background: rgba(245,158,11,0.2); color: #f59e0b; border: 1px solid rgba(245,158,11,0.3); }

        .card-link .forecast { font-size: 11px; color: #8899aa; margin: 2px 0; }
        .card-link .source {
            font-size: 9px; color: #4a5a6a;
            margin-top: auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .card-link .source .src { color: #5bc0f8; }
        .card-link .source .updated { color: #4a5a6a; }
        .card-link .click-hint {
            font-size: 8px;
            color: #4a5a6a;
            text-align: center;
            margin-top: 2px;
        }
        .card-link .demo-badge {
            background: #f59e0b;
            color: #0a0a1a;
            font-size: 8px;
            font-weight: 700;
            padding: 1px 6px;
            border-radius: 4px;
            display: inline-block;
            margin-bottom: 4px;
        }

        .bg-critical { background: #ef4444; }
        .bg-high { background: #f59e0b; }
        .bg-medium { background: #fbbf24; }
        .bg-low { background: #4ade80; }
        .bg-online { background: #4ade80; }
        .bg-offline { background: #ef4444; }
        .bg-demo { background: #f59e0b; }

        .notification {
            position: fixed;
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.85);
            color: #ffffff;
            padding: 8px 20px;
            border-radius: 6px;
            font-size: 13px;
            z-index: 100001;
            border: 1px solid rgba(255,255,255,0.1);
            animation: notif-fade 2.5s forwards;
        }
        @keyframes notif-fade {
            0% { opacity: 0; transform: translateX(-50%) translateY(10px); }
            10% { opacity: 1; transform: translateX(-50%) translateY(0); }
            80% { opacity: 1; }
            100% { opacity: 0; transform: translateX(-50%) translateY(-20px); }
        }

        @media (max-width: 1200px) { .cards-grid { grid-template-columns: repeat(4, 1fr); } }
        @media (max-width: 992px) { .cards-grid { grid-template-columns: repeat(3, 1fr); } }
        @media (max-width: 768px) {
            .cards-grid { grid-template-columns: repeat(2, 1fr); }
            .topbar { padding: 0 12px; height: 52px; }
            .topbar-brand { font-size: 12px; }
            .topbar-btn { font-size: 10px; padding: 0 8px; height: 24px; }
            .nav-dashboards { top: 52px; height: 34px; padding: 0 10px; gap: 2px; }
            .nav-btn { font-size: 9px; padding: 2px 6px; }
            .main-content { padding-top: 102px; padding-left: 12px; padding-right: 12px; }
            .page-title { font-size: 20px; }
            .global-index { flex-direction: column; align-items: flex-start; gap: 12px; }
            .global-index .stats { flex-wrap: wrap; gap: 8px; }
        }
        @media (max-width: 480px) {
            .cards-grid { grid-template-columns: 1fr; }
            .topbar { padding: 0 8px; height: 46px; }
            .topbar-brand { font-size: 10px; letter-spacing: 1px; }
            .topbar-btn { font-size: 9px; padding: 0 6px; height: 20px; }
            .lang-btn { font-size: 9px; padding: 1px 5px; }
            .nav-dashboards { top: 46px; height: 30px; padding: 0 6px; gap: 2px; overflow-x: auto; }
            .nav-btn { font-size: 8px; padding: 2px 5px; }
            .main-content { padding-top: 92px; padding-left: 8px; padding-right: 8px; }
            .page-title { font-size: 16px; }
            .global-index { flex-direction: column; align-items: flex-start; gap: 12px; }
            .global-index .stats { flex-wrap: wrap; gap: 8px; }
        }
    </style>
</head>
<body>

<header class="topbar">
    <div class="topbar-left"><span class="topbar-brand">🛡️ ВОЕННЫЙ ДАШБОРД</span></div>
    <div class="topbar-right">
        <button class="topbar-btn btn-home" onclick="window.location.href='/jarvis'">← НА ГЛАВНУЮ</button>
        <div class="copy-dropdown">
            <button class="topbar-btn btn-copy" id="copy-btn">📋 КОПИРОВАТЬ ▼</button>
            <div class="copy-dropdown-content" id="copyDropdown">
                <div class="label">ФОРМАТЫ КОПИРОВАНИЯ</div>
                <button data-format="text">📄 Как текст (полный снапшот)</button>
                <button data-format="markdown">📝 Как Markdown</button>
                <button data-format="json">📊 Как JSON</button>
                <button data-format="csv">📋 Как CSV (таблицы)</button>
                <div class="divider"></div>
                <button data-format="dom">🌳 DOM-дерево</button>
                <button data-format="storage">💾 localStorage + sessionStorage</button>
                <button data-format="api">📡 API-запросы страницы</button>
                <div class="divider"></div>
                <button data-format="all">📦 ВСЁ В ОДНОМ</button>
            </div>
        </div>
        <button class="topbar-btn btn-rss" onclick="window.location.href='/registry'">📡 Реестр</button>
        <button class="topbar-btn btn-help" onclick="openHelp()">❓ HELP</button>
        <div class="lang-switch">
            <button class="lang-btn active" data-lang="ru" onclick="switchLang('ru')">RU</button>
            <button class="lang-btn" data-lang="en" onclick="switchLang('en')">EN</button>
        </div>
    </div>
</header>

<nav class="nav-dashboards" id="navDashboards">
    <button class="nav-btn" onclick="window.location.href='/dashboard-5in1'"><span class="icon">🎯</span>Центр аналитики</button>
    <button class="nav-btn" onclick="window.location.href='/dashboard-economic'"><span class="icon">📊</span>Экономика</button>
    <button class="nav-btn" onclick="window.location.href='/dashboard-financial'"><span class="icon">💰</span>Финансы</button>
    <button class="nav-btn active" onclick="window.location.href='/dashboard-military'"><span class="icon">🛡️</span>Военный</button>
    <button class="nav-btn" onclick="window.location.href='/dashboard-geopolitical'"><span class="icon">🌍</span>Геополитика</button>
    <button class="nav-btn" onclick="window.location.href='/dashboard-ecological'"><span class="icon">🌿</span>Экология</button>
    <button class="nav-btn" onclick="window.location.href='/dashboard-cyber'"><span class="icon">🔒</span>Кибер</button>
    <button class="nav-btn" onclick="window.location.href='/dashboard-space'"><span class="icon">🚀</span>Космос</button>
    <button class="nav-btn" onclick="window.location.href='/dashboard-news'"><span class="icon">📰</span>Новости</button>
    <button class="nav-btn" onclick="window.location.href='/dashboard-ai'"><span class="icon">🧠</span>AI</button>
    <button class="nav-btn" onclick="window.location.href='/dashboard-scientific'"><span class="icon">🔬</span>Наука</button>
    <button class="nav-btn" onclick="window.location.href='/dashboard-esg'"><span class="icon">🌱</span>ESG</button>
    <button class="nav-btn" onclick="window.location.href='/dashboard-threats'"><span class="icon">⚡</span>Угрозы</button>
    <button class="nav-btn" onclick="window.location.href='/dashboard-health'"><span class="icon">🏥</span>Здоровье</button>
    <button class="nav-btn" onclick="window.location.href='/dashboard-energy'"><span class="icon">⛽</span>Энергетика</button>
    <button class="nav-btn" onclick="window.location.href='/dashboard-transport'"><span class="icon">🚛</span>Транспорт</button>
    <button class="nav-btn" onclick="window.location.href='/dashboard-regions'"><span class="icon">🌏</span>Регионы</button>
    <button class="nav-btn" onclick="window.location.href='/indirect-indicators'"><span class="icon">🕵️</span>Косвенные</button>
</nav>

<main class="main-content">
    <div class="page-title">
        🛡️ Военный дашборд
        <span class="badge" id="statusBadge">🟢 ONLINE</span>
    </div>
    <div class="page-subtitle">
        Мониторинг военной активности и косвенных сигналов
        <span style="margin-left:12px;font-size:12px;color:#4a5a6a;">
            <a href="/registry" target="_blank">📋 Полный реестр</a>
        </span>
    </div>

    <div class="global-index" id="globalIndexBlock">
        <div>
            <div class="label">🌍 Индекс военной напряженности</div>
            <div class="value" id="globalIndex">—</div>
        </div>
        <div class="stats">
            <span>🟢 Нормально: <strong id="normalCount" class="num-normal">0</strong></span>
            <span>🟡 Средний: <strong id="mediumCount" class="num-medium">0</strong></span>
            <span>🟠 Высокий: <strong id="highCount" class="num-high">0</strong></span>
            <span>🔴 Критический: <strong id="criticalCount" class="num-critical">0</strong></span>
        </div>
        <div>
            <span class="status" id="globalStatus">🟢 НОРМАЛЬНО</span>
        </div>
    </div>

    <div class="cards-grid" id="cardsGrid"></div>
</main>

<script>
// ============================================================
// 1. ПЕРЕКЛЮЧАТЕЛЬ ЯЗЫКА
// ============================================================
let currentLang = localStorage.getItem('crucix-lang') || 'ru';

function switchLang(lang) {
    currentLang = lang;
    localStorage.setItem('crucix-lang', lang);
    document.querySelectorAll('.lang-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.lang === lang);
    });
    showNotification('🌐 Язык: ' + lang.toUpperCase());
}

document.querySelectorAll('.lang-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.lang === currentLang);
});

// ============================================================
// 2. УВЕДОМЛЕНИЯ И HELP
// ============================================================
function showNotification(msg) {
    document.querySelectorAll('.notification').forEach(el => el.remove());
    const el = document.createElement('div');
    el.className = 'notification';
    el.textContent = msg;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 2500);
}

function openHelp() {
    const pageId = window.location.pathname.replace(/^\/+/, "").replace(/\.html$/, "") || "jarvis";
    const lang = currentLang || "ru";
    const helpFile = `/data/help/${lang}/${pageId}.txt`;
    fetch(helpFile).then(res => res.text()).then(text => {
        alert(text || "Справка не найдена");
    }).catch(() => alert("Справка не найдена"));
}

// ============================================================
// 3. КНОПКА КОПИРОВАТЬ
// ============================================================
document.getElementById('copy-btn').addEventListener('click', function(e) {
    e.stopPropagation();
    document.getElementById('copyDropdown').classList.toggle('show');
});

document.addEventListener('click', function() {
    document.getElementById('copyDropdown').classList.remove('show');
});

function copyPageData(format) {
    const timestamp = new Date().toLocaleString();
    const pageTitle = document.querySelector('.page-title')?.textContent || document.title || 'Без заголовка';
    const url = window.location.href;
    const windowSize = window.innerWidth + '×' + window.innerHeight;

    let report = '=== CRUCIX — СНАПШОТ СТРАНИЦЫ ===\n';
    report += 'Дата: ' + timestamp + '\n';
    report += 'URL: ' + url + '\n';
    report += 'Размер окна: ' + windowSize + '\n';
    report += 'Страница: ' + pageTitle + '\n\n';

    const cards = document.querySelectorAll('.card-link');
    report += '--- КАРТОЧКИ (' + cards.length + ') ---\n';
    cards.forEach(card => {
        const number = card.querySelector('.card-number')?.textContent || '—';
        const name = card.querySelector('.name')?.textContent || '—';
        const value = card.querySelector('.main-value')?.textContent || '—';
        const status = card.querySelector('.status-label')?.textContent || '—';
        report += number + ' ' + name + ': ' + value + ' (' + status + ')\n';
    });

    report += '\n--- CRUCIX OSINT TERMINAL ---\n';
    report += '🌐 ' + window.location.origin;

    navigator.clipboard.writeText(report).then(() => {
        const btn = document.getElementById('copy-btn');
        btn.textContent = '✅ ' + format.toUpperCase();
        btn.classList.add('copied');
        setTimeout(() => {
            btn.textContent = '📋 КОПИРОВАТЬ ▼';
            btn.classList.remove('copied');
        }, 3000);
        showNotification('✅ Скопировано в формате ' + format.toUpperCase());
    }).catch(() => {
        const textarea = document.createElement('textarea');
        textarea.value = report;
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand('copy');
        document.body.removeChild(textarea);
        showNotification('✅ Скопировано в формате ' + format.toUpperCase());
    });
}

// ============================================================
// 5. fetchData — УНИВЕРСАЛЬНАЯ ВЕРСИЯ
// ============================================================
async function fetchData(url) {
    try {
        const res = await fetch(url);
        if (!res.ok) return [];
        const data = await res.json();
        let result = [];

        if (data.data) {
            if (Array.isArray(data.data)) {
                result = data.data;
            } else if (data.data.features) {
                result = data.data.features;
            } else if (typeof data.data === 'object' && data.data !== null) {
                if (data.data.date !== undefined || data.data.value !== undefined) {
                    result = [data.data];
                } else {
                    result = Object.values(data.data);
                }
            }
        } else if (Array.isArray(data)) {
            result = data;
        }

        return result;
    } catch {
        return [];
    }
}

function getSeverityCount(data, severity) {
    if (!Array.isArray(data)) return 0;
    return data.filter(d => d.severity === severity || d.intensity === severity).length;
}

// 6. РЕНДЕР КАРТОЧЕК (С ДЕМО-РЕЖИМОМ)
// ============================================================
function renderCards(cardsData) {
    const container = document.getElementById('cardsGrid');
    let html = '';

    for (const card of CARD_CONFIG) {
        let data = cardsData[card.id] || [];
        let isDemo = false;

        // === ПРОВЕРКА: если данных нет или они пустые — включаем ДЕМО ===
        if (!data || data.length === 0) {
            isDemo = true;
            const demoValue = Math.floor(Math.random() * 50) + 10;
            data = [{
                [card.key]: demoValue,
                date: new Date().toISOString(),
                status: 'demo',
                source: 'DEMO',
                isDemo: true
            }];
        }

        // Если данные есть, но все значения undefined — тоже ДЕМО
        if (!isDemo && data.length > 0) {
            let hasValidValue = false;
            for (const item of data) {
                if (item[card.key] !== undefined && item[card.key] !== null) {
                    hasValidValue = true;
                    break;
                }
            }
            if (!hasValidValue) {
                isDemo = true;
                const demoValue = Math.floor(Math.random() * 50) + 10;
                data = [{
                    [card.key]: demoValue,
                    date: new Date().toISOString(),
                    status: 'demo',
                    source: 'DEMO',
                    isDemo: true
                }];
            }
        }

        let value = null;

        if (card.key === '_count') {
            value = data.length;
        } else {
            let last = null;
            for (let i = data.length - 1; i >= 0; i--) {
                if (data[i] && data[i][card.key] !== undefined) {
                    last = data[i];
                    break;
                }
            }
            value = last ? last[card.key] : null;
        }

        // Если value всё ещё null — ставим демо
        if (value === null || value === undefined) {
            isDemo = true;
            value = Math.floor(Math.random() * 50) + 10;
        }

        let statusClass = 'normal';
        let statusLabel = '🟢 НОРМАЛЬНО';

        // === ЕСЛИ ДЕМО — ОРАНЖЕВЫЙ СТАТУС ===
        if (isDemo) {
            statusClass = 'demo';
            statusLabel = '🟠 ДЕМО-ДАННЫЕ';
        } else {
            // Обычная логика определения статуса
            if (card.id === 'vix') {
                if (value > 30) { statusClass = 'critical'; statusLabel = '🔴 ВЫСОКИЙ'; }
                else if (value > 20) { statusClass = 'high'; statusLabel = '🟠 СРЕДНИЙ'; }
            } else if (card.id === 'yield') {
                if (value < 0) { statusClass = 'critical'; statusLabel = '🔴 ИНВЕРСИЯ'; }
                else if (value < 0.5) { statusClass = 'high'; statusLabel = '🟡 ПРЕДУПРЕЖДЕНИЕ'; }
            } else if (card.id === 'gold-oil') {
                if (value > 30) { statusClass = 'critical'; statusLabel = '🔴 ВЫСОКИЙ РИСК'; }
                else if (value > 25) { statusClass = 'high'; statusLabel = '🟡 СРЕДНИЙ РИСК'; }
            } else if (card.id === 'copper-gold') {
                if (value > 15) { statusClass = 'critical'; statusLabel = '🔴 РЕЦЕССИЯ'; }
                else if (value > 10) { statusClass = 'high'; statusLabel = '🟡 ПРЕДУПРЕЖДЕНИЕ'; }
            } else if (card.id === 'bdi') {
                if (value > 3000) { statusClass = 'high'; statusLabel = '🟠 ВЫСОКИЙ'; }
                else if (value > 1500) { statusClass = 'normal'; statusLabel = '🟢 НОРМАЛЬНО'; }
            } else if (card.id === 'viirs') {
                if (value < 50) { statusClass = 'critical'; statusLabel = '🔴 КРИТИЧЕСКАЯ'; }
                else if (value < 70) { statusClass = 'high'; statusLabel = '🟡 СНИЖЕНИЕ'; }
            } else if (card.id === 'war-prep') {
                if (value > 70) { statusClass = 'critical'; statusLabel = '🔴 ВЫСОКИЙ'; }
                else if (value > 40) { statusClass = 'high'; statusLabel = '🟠 СРЕДНИЙ'; }
            } else if (card.id === 'nuclear') {
                if (value > 40) { statusClass = 'critical'; statusLabel = '🔴 АНОМАЛИЯ'; }
                else if (value > 30) { statusClass = 'high'; statusLabel = '🟡 ПОВЫШЕННЫЙ'; }
            } else if (card.id === 'social') {
                if (value > 50) { statusClass = 'critical'; statusLabel = '🔴 ВЫСОКАЯ'; }
                else if (value > 30) { statusClass = 'high'; statusLabel = '🟡 СРЕДНЯЯ'; }
            } else if (card.id === 'notam' || card.id === 'gps' || card.id === 'trends') {
                if (value > 5) { statusClass = 'critical'; statusLabel = '🔴 КРИТИЧЕСКИЙ'; }
                else if (value > 2) { statusClass = 'high'; statusLabel = '🟠 ВЫСОКИЙ'; }
                else if (value > 0) { statusClass = 'medium'; statusLabel = '🟡 СРЕДНИЙ'; }
            } else if (card.id === 'indirect-pizza' || card.id === 'indirect-taxi') {
                const statusMap = { critical: 'critical', warning: 'warning', normal: 'normal', unknown: 'unknown' };
                const statusLabels = { critical: '🔴 КРИТИЧЕСКИЙ', warning: '🟡 ПРЕДУПРЕЖДЕНИЕ', normal: '🟢 НОРМАЛЬНО', unknown: '⚪ НЕИЗВЕСТНО' };
                const st = statusMap[data[0]?.status] || 'unknown';
                statusClass = st;
                statusLabel = statusLabels[st] || '⚪ НЕИЗВЕСТНО';
            }
        }

        let change = '';
        let changeClass = 'neutral';

        if (card.key !== '_count' && data.length > 1 && !isDemo) {
            let prev = null;
            for (let i = data.length - 2; i >= 0; i--) {
                if (data[i] && data[i][card.key] !== undefined) {
                    prev = data[i];
                    break;
                }
            }
            if (prev && value !== null && typeof value === 'number') {
                const diff = value - prev[card.key];
                const pct = prev[card.key] !== 0 ? (diff / Math.abs(prev[card.key]) * 100) : 0;
                change = `${diff > 0 ? '+' : ''}${diff.toFixed(2)} (${pct > 0 ? '+' : ''}${pct.toFixed(1)}%)`;
                changeClass = diff > 0 ? 'up' : diff < 0 ? 'down' : 'neutral';
            }
        } else if (isDemo) {
            change = '📢 ДЕМО';
            changeClass = 'neutral';
        }

        let forecast = '—';
        if (value !== null && typeof value === 'number') {
            const low = Math.round(value * 0.95 * 100) / 100;
            const high = Math.round(value * 1.05 * 100) / 100;
            forecast = `${low} - ${high}`;
        }

        let displayValue = value !== null ? value : '—';
        if (typeof displayValue === 'number') displayValue = displayValue.toFixed(2);

        const updateTime = data.length > 0 && data[data.length-1]?.date ? new Date(data[data.length-1].date).toLocaleTimeString('ru-RU') : '—';

        const subtitleHtml = card.subtitle ? `<div class="subtitle">${card.subtitle}</div>` : '';
        const demoBadge = isDemo ? '<div class="demo-badge">📢 ДЕМО</div>' : '';

        html += `
            <a href="${card.url}" target="_blank" class="card-link">
                <span class="card-number">${card.number}</span>
                <div class="header">
                    <span class="icon">${card.icon}</span>
                    <span class="name">${card.name}</span>
                    <span class="status-dot ${statusClass === 'critical' ? 'bg-critical' : statusClass === 'high' ? 'bg-high' : statusClass === 'medium' ? 'bg-medium' : statusClass === 'demo' ? 'bg-demo' : 'bg-low'}"></span>
                </div>
                ${subtitleHtml}
                ${demoBadge}
                <div class="main-value">${displayValue}</div>
                <div class="change ${changeClass}">${change}</div>
                <div class="status-label ${statusClass}">${statusLabel}</div>
                <div class="forecast">📊 ${forecast}</div>
                <div class="source">
                    <span class="src">📌 ${isDemo ? '⚡ ДЕМО' : card.source}</span>
                    <span class="updated">🔄 ${updateTime}</span>
                </div>
                <div class="click-hint">🔗 клик для деталей</div>
            </a>
        `;
    }

    container.innerHTML = html;
}

    try {

               nuclearData, warPrepData, oilGasData, goldOilData, copperGoldData, goldSilverData,

               pmiData, recessionData, dxyData, tipsData, ovxData, hySpreadData, vixData, yieldData,
               cryptoFearData, sp500VixData, indirectData] = await Promise.all([
            fetchData('/api/notam/'),
            fetchData('/api/gps-jamming/'),
            fetchData('/api/aviation-monitor/'),
            fetchData('/api/opensky/'),
            fetchData('/api/ships/'),
            fetchData('/api/dark-ships/'),
            fetchData('/api/maritime/'),
            fetchData('/api/shipping/'),
            fetchData('/api/bdi/'),
            fetchData('/api/uranium/'),
            fetchData('/api/nuclear-monitor/'),
            fetchData('/api/war-preparation/'),
            fetchData('/api/oil-gas/'),
            fetchData('/api/gold-oil-ratio/'),
            fetchData('/api/copper-gold/'),
            fetchData('/api/gold-silver/'),
            fetchData('/api/viirs/'),
            fetchData('/api/google-trends/'),
            fetchData('/api/social-unrest/'),
            fetchData('/api/consumer-confidence/'),
            fetchData('/api/inflation/'),
            fetchData('/api/unemployment/'),
            fetchData('/api/pmi/'),
            fetchData('/api/recession/'),
            fetchData('/api/dxy/'),
            fetchData('/api/tips/'),
            fetchData('/api/ovx/'),
            fetchData('/api/hy-spread/'),
            fetchData('/api/vix/'),
            fetchData('/api/yield-curve/'),
            fetchData('/api/crypto-fear/'),
            fetchData('/api/sp500-vix/'),
            fetchData('/api/indirect/all')
        ]);

        // Извлекаем данные из indirect
        const pizzaData = indirectData?.indicators?.['pentagon-pizza'] ? [indirectData.indicators['pentagon-pizza']] : [];
        const taxiData = indirectData?.indicators?.['langley-taxis'] ? [indirectData.indicators['langley-taxis']] : [];

        const allData = {
            notam, gps, aviation, opensky, ships, darkShips, maritime, shipping,
            bdi: bdiData, uranium: uraniumData,
            nuclear: nuclearData, 'war-prep': warPrepData,
            'oil-gas': oilGasData, 'gold-oil': goldOilData, 'copper-gold': copperGoldData,
            'gold-silver': goldSilverData, viirs: viirsData,
            trends: trendsData, social: socialData, consumer: consumerData,
            inflation: inflationData, unemployment: unemploymentData,
            pmi: pmiData, recession: recessionData,
            dxy: dxyData, tips: tipsData, ovx: ovxData, 'hy-spread': hySpreadData,
            vix: vixData, yield: yieldData, 'crypto-fear': cryptoFearData,
            'sp500-vix': sp500VixData,
            'indirect-pizza': pizzaData,
            'indirect-taxi': taxiData,
            'indirect': indirectData?.indicators || {}
        };

        renderCards(allData);

        const totalCritical = getSeverityCount(notam, 'critical') + getSeverityCount(gps, 'critical') + getSeverityCount(aviation, 'critical');
        const totalHigh = getSeverityCount(notam, 'high') + getSeverityCount(gps, 'high') + getSeverityCount(aviation, 'high');
        const totalMedium = getSeverityCount(notam, 'medium') + getSeverityCount(gps, 'medium') + getSeverityCount(aviation, 'medium');

        document.getElementById('criticalCount').textContent = totalCritical;
        document.getElementById('highCount').textContent = totalHigh;
        document.getElementById('mediumCount').textContent = totalMedium;
        document.getElementById('normalCount').textContent = notam.length + gps.length + aviation.length - totalCritical - totalHigh - totalMedium;

        const totalEvents = notam.length + gps.length + aviation.length;
        const index = totalEvents > 0 ? Math.round((totalCritical * 70 + totalHigh * 40 + totalMedium * 20) / totalEvents) : 0;
        document.getElementById('globalIndex').textContent = index;

    } catch (e) {
        console.error('[Military Dashboard] Ошибка обновления:', e);
    }
}
