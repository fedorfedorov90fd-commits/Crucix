<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Анализ соцсетей — Crucix</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0a0a1a;
      color: #e0e0e0;
      min-height: 100vh;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 20px;
      background: rgba(10, 10, 30, 0.95);
      border-bottom: 1px solid rgba(255,255,255,0.06);
      z-index: 100;
      height: 48px;
    }
    .header h1 { font-size: 18px; font-weight: 700; color: #fff; }
    .header h1 span { color: #44ccff; }
    .header .nav-links {
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .header .nav-links a {
      color: #888;
      text-decoration: none;
      font-size: 13px;
      padding: 4px 12px;
      border-radius: 4px;
      transition: all 0.2s;
    }
    .header .nav-links a:hover { background: rgba(255,255,255,0.05); color: #e0e0e0; }
    .header .nav-links a.home { color: #2196f3; }
    .header .nav-links a.active { color: #44ccff; background: rgba(68,204,255,0.1); }
    .btn-copy {
      padding: 4px 12px;
      background: rgba(33,150,243,0.2);
      border: 1px solid rgba(33,150,243,0.3);
      border-radius: 4px;
      color: #2196f3;
      cursor: pointer;
      font-size: 12px;
      transition: all 0.2s;
    }
    .btn-copy:hover { background: rgba(33,150,243,0.3); }

    .main-content {
      padding: 16px 20px;
      max-width: 1400px;
      margin: 0 auto;
    }
    .page-title { font-size: 24px; font-weight: 700; color: #e8f0f8; margin-bottom: 4px; }
    .page-subtitle { color: #666; font-size: 14px; margin-bottom: 16px; }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 12px;
      margin-bottom: 16px;
    }
    .stat-card {
      background: rgba(10,10,20,0.5);
      border: 1px solid rgba(255,255,255,0.04);
      border-radius: 8px;
      padding: 12px 16px;
      text-align: center;
    }
    .stat-card .label { font-size: 10px; text-transform: uppercase; color: #666; letter-spacing: 0.5px; }
    .stat-card .value { font-size: 22px; font-weight: 700; color: #e8f0f8; margin-top: 2px; }
    .stat-card .value.green { color: #4caf50; }
    .stat-card .value.blue { color: #5bc0f8; }
    .stat-card .value.orange { color: #f97316; }
    .stat-card .value.red { color: #ef4444; }
    .stat-card .value.yellow { color: #ffd700; }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 16px;
    }
    .btn {
      padding: 6px 14px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
      transition: all 0.2s;
    }
    .btn:hover { transform: translateY(-1px); opacity: 0.9; }
    .btn-primary { background: #2196f3; color: #fff; }
    .btn-secondary { background: #444; color: #fff; }
    .status-label {
      padding: 4px 12px;
      border-radius: 4px;
      font-size: 12px;
      background: rgba(255,255,255,0.05);
      color: #888;
      margin-left: auto;
    }

    .grid-2col {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 16px;
      margin-bottom: 16px;
    }

    .panel {
      background: rgba(10,10,20,0.5);
      border: 1px solid rgba(255,255,255,0.04);
      border-radius: 8px;
      padding: 16px;
    }
    .panel .title { font-size: 14px; font-weight: 600; color: #e8f0f8; margin-bottom: 8px; }

    .post-item {
      padding: 10px 12px;
      border-bottom: 1px solid rgba(255,255,255,0.03);
      margin-bottom: 4px;
      background: rgba(255,255,255,0.02);
      border-radius: 4px;
    }
    .post-item .source { font-size: 11px; color: #666; }
    .post-item .author { font-size: 12px; color: #888; }
    .post-item .content { font-size: 13px; color: #c8d0d8; margin: 4px 0; }
    .post-item .meta { font-size: 11px; color: #555; }
    .post-item .sentiment-negative { color: #ef4444; }
    .post-item .sentiment-positive { color: #22c55e; }
    .post-item .sentiment-neutral { color: #eab308; }

    .trend-item {
      display: flex;
      justify-content: space-between;
      padding: 6px 8px;
      border-bottom: 1px solid rgba(255,255,255,0.03);
      font-size: 12px;
    }
    .trend-item .up { color: #22c55e; }
    .trend-item .down { color: #ef4444; }

    .campaign-item {
      padding: 8px 10px;
      border-left: 3px solid #ef4444;
      margin-bottom: 6px;
      background: rgba(239,68,68,0.05);
      border-radius: 2px;
      font-size: 12px;
    }
    .campaign-item .severity-critical { border-color: #ef4444; }
    .campaign-item .severity-high { border-color: #f97316; }
    .campaign-item .severity-medium { border-color: #eab308; }

    .loading { padding: 20px; text-align: center; color: #666; font-size: 14px; }
    .notification {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.85);
      color: #fff;
      padding: 8px 20px;
      border-radius: 6px;
      font-size: 13px;
      z-index: 100001;
      border: 1px solid rgba(255,255,255,0.1);
      animation: notif-fade 2.5s forwards;
    }
    @keyframes notif-fade {
      0% { opacity: 0; transform: translateX(-50%) translateY(10px); }
      10% { opacity: 1; transform: translateX(-50%) translateY(0); }
      80% { opacity: 1; transform: translateX(-50%) translateY(0); }
      100% { opacity: 0; transform: translateX(-50%) translateY(-20px); }
    }

    @media (max-width: 768px) {
      .grid-2col { grid-template-columns: 1fr; }
      .header { padding: 6px 12px; height: 42px; }
      .header h1 { font-size: 15px; }
      .main-content { padding: 10px; }
      .stats-grid { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>
  <header class="header">
    <h1>📱 <span>Анализ</span> соцсетей</h1>
    <div class="nav-links">
      <a href="/jarvis" class="home">🏠 Главная</a>
      <a href="/social" class="active">📱 Соцсети</a>
      <button class="btn-copy" id="copy-btn">📋 Копировать</button>
    </div>
  </header>

  <div class="main-content">
    <h1 class="page-title">📱 Анализ социальных сетей</h1>
    <p class="page-subtitle">Twitter/X · Telegram · Reddit — мониторинг тональности и трендов</p>

    <div class="stats-grid" id="stats-grid">
      <div class="stat-card">
        <div class="label">Постов</div>
        <div class="value blue" id="stat-posts">0</div>
      </div>
      <div class="stat-card">
        <div class="label">Трендов</div>
        <div class="value orange" id="stat-trends">0</div>
      </div>
      <div class="stat-card">
        <div class="label">Кампаний</div>
        <div class="value red" id="stat-campaigns">0</div>
      </div>
      <div class="stat-card">
        <div class="label">Средняя тональность</div>
        <div class="value yellow" id="stat-sentiment">0%</div>
      </div>
    </div>

    <div class="controls">
      <button class="btn btn-secondary" id="btn-refresh">🔄 Обновить</button>
      <span class="status-label" id="status-label">⏹ Готов</span>
    </div>

    <div class="grid-2col">
      <div class="panel">
        <div class="title">📝 Последние посты</div>
        <div id="posts-content">
          <div class="loading">Загрузка...</div>
        </div>
      </div>
      <div class="panel">
        <div class="title">📈 Тренды</div>
        <div id="trends-content">
          <div class="loading">Загрузка...</div>
        </div>
        <div style="margin-top:12px;">
          <div class="title">🚨 Информационные кампании</div>
          <div id="campaigns-content">
            <div class="loading">Загрузка...</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    console.log('📱 Анализ соцсетей загружается...');

    async function loadData() {
      await Promise.all([loadStats(), loadPosts(), loadTrends(), loadCampaigns()]);
    }

    async function loadStats() {
      try {
        const res = await fetch('/api/social/status');
        const data = await res.json();
        if (data.success) {
          document.getElementById('stat-posts').textContent = data.stats.total_posts || 0;
          document.getElementById('stat-trends').textContent = data.stats.trends || 0;
          document.getElementById('stat-campaigns').textContent = data.stats.campaigns || 0;
          document.getElementById('stat-sentiment').textContent = data.stats.avg_sentiment + '%';
        }
      } catch (e) { console.error('[Social] Ошибка загрузки статистики:', e); }
    }

    async function loadPosts() {
      try {
        const res = await fetch('/api/social/posts?limit=10');
        const data = await res.json();
        if (data.success) {
          const container = document.getElementById('posts-content');
          if (data.posts.length === 0) {
            container.innerHTML = '<div class="loading">Нет постов</div>';
            return;
          }
          let html = '';
          for (const post of data.posts) {
            const sentimentClass = post.sentiment === 'negative' ? 'sentiment-negative' : 
                                  post.sentiment === 'positive' ? 'sentiment-positive' : 'sentiment-neutral';
            const time = new Date(post.timestamp).toLocaleString();
            html += `
              <div class="post-item">
                <div class="source">${post.source} · ${post.author}</div>
                <div class="content">${post.content}</div>
                <div class="meta">
                  <span class="${sentimentClass}">${post.sentiment} (${Math.round(post.sentiment_score * 100)}%)</span>
                  · ${post.region} · ♥ ${post.engagement}
                </div>
              </div>
            `;
          }
          container.innerHTML = html;
        }
      } catch (e) { console.error('[Social] Ошибка загрузки постов:', e); }
    }

    async function loadTrends() {
      try {
        const res = await fetch('/api/social/trends');
        const data = await res.json();
        if (data.success) {
          const container = document.getElementById('trends-content');
          let html = '';
          for (const trend of data.trends) {
            const dirClass = trend.direction === 'up' ? 'up' : 'down';
            const dirSymbol = trend.direction === 'up' ? '↑' : '↓';
            html += `
              <div class="trend-item">
                <span>${trend.topic}</span>
                <span>${trend.volume} постов · ${trend.sentiment}%</span>
                <span class="${dirClass}">${dirSymbol} ${Math.abs(trend.change)}%</span>
              </div>
            `;
          }
          container.innerHTML = html || '<div class="loading">Нет трендов</div>';
        }
      } catch (e) { console.error('[Social] Ошибка загрузки трендов:', e); }
    }

    async function loadCampaigns() {
      try {
        const res = await fetch('/api/social/campaigns');
        const data = await res.json();
        if (data.success) {
          const container = document.getElementById('campaigns-content');
          if (data.campaigns.length === 0) {
            container.innerHTML = '<div class="loading">Нет активных кампаний</div>';
            return;
          }
          let html = '';
          for (const campaign of data.campaigns) {
            const severityClass = campaign.severity === 'critical' ? 'severity-critical' :
                                 campaign.severity === 'high' ? 'severity-high' : 'severity-medium';
            html += `
              <div class="campaign-item ${severityClass}">
                <strong>${campaign.name}</strong>
                <span style="color:${campaign.severity === 'critical' ? '#ef4444' : campaign.severity === 'high' ? '#f97316' : '#eab308'};">
                  [${campaign.severity.toUpperCase()}]
                </span>
                <br>Постов: ${campaign.posts} · Тональность: ${campaign.avg_sentiment}%
              </div>
            `;
          }
          container.innerHTML = html;
        }
      } catch (e) { console.error('[Social] Ошибка загрузки кампаний:', e); }
    }

    function showNotification(msg) {
      document.querySelectorAll('.notification').forEach(el => el.remove());
      const el = document.createElement('div');
      el.className = 'notification';
      el.textContent = msg;
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 2500);
    }

    document.getElementById('copy-btn').addEventListener('click', function() {
      const text = `=== CRUCIX — АНАЛИЗ СОЦСЕТЕЙ ===
Дата: ${new Date().toLocaleString()}

--- СТАТИСТИКА ---
Постов: ${document.getElementById('stat-posts').textContent}
Трендов: ${document.getElementById('stat-trends').textContent}
Кампаний: ${document.getElementById('stat-campaigns').textContent}
Средняя тональность: ${document.getElementById('stat-sentiment').textContent}

--- ПОСЛЕДНИЕ ПОСТЫ ---
${document.getElementById('posts-content').textContent}

--- ТРЕНДЫ ---
${document.getElementById('trends-content').textContent}

--- КАМПАНИИ ---
${document.getElementById('campaigns-content').textContent}

--- CRUCIX OSINT TERMINAL ---
🌐 http://localhost:3117/social`;

      navigator.clipboard.writeText(text).then(() => {
        showNotification('✅ Данные скопированы');
      }).catch(() => {
        const area = document.createElement('textarea');
        area.value = text;
        document.body.appendChild(area);
        area.select();
        document.execCommand('copy');
        document.body.removeChild(area);
        showNotification('✅ Данные скопированы');
      });
    });

    document.addEventListener('DOMContentLoaded', function() {
      document.getElementById('btn-refresh').addEventListener('click', loadData);
      loadData();
    });
  </script>
</body>
</html>
