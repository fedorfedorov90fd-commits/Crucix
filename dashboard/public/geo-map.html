<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Геополитическая карта — Crucix</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.heat/0.2.0/leaflet-heat.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.heat/0.2.0/leaflet-heat.js"></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <link rel="stylesheet" href="/geo-map/css/core.css" />
    <link rel="stylesheet" href="/geo-map/css/header.css" />
    <link rel="stylesheet" href="/geo-map/css/layers-panel.css" />
    <link rel="stylesheet" href="/geo-map/css/map.css" />
    <link rel="stylesheet" href="/geo-map/css/responsive.css" />

    <script src="/geo-map/js/core.js"></script>
    <script src="/geo-map/js/countries.js"></script>
    <script src="/geo-map/js/layers.js"></script>
    <script src="/geo-map/js/layers-dynamic.js"></script>
    <script src="/geo-map/js/markers.js"></script>
    <script src="/geo-map/js/map-controls.js"></script>
    <script src="/geo-map/js/copy-data.js?v=3"></script>
    <script src="/geo-map/js/heat-timeline.js"></script>
    <script src="/geo-map/js/ssi.js"></script>
    <script src="/geo-map/js/refresh.js"></script>
    <script type="module" src="/geo-map/js/logger.mjs"></script>
    <script src="/geo-map/js/cii.js"></script>

    <script src="/geo-map/js/init.js"></script>

    <style>
        .timeline-panel {
            position: absolute;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            width: 92%;
            max-width: 1000px;
            background: rgba(10,10,30,0.95);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 14px;
            padding: 20px 24px;
            display: none;
            z-index: 1000;
            backdrop-filter: blur(12px);
            box-shadow: 0 8px 40px rgba(0,0,0,0.6);
            pointer-events: auto;
        }
        .timeline-panel.active { display: block; }
        .timeline-title {
            color: #5bc0f8;
            font-size: 15px;
            font-weight: 700;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .timeline-title .close-btn {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.06);
            color: #8899aa;
            border-radius: 4px;
            padding: 2px 12px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .timeline-title .close-btn:hover {
            background: rgba(239,68,68,0.15);
            border-color: rgba(239,68,68,0.2);
            color: #ef4444;
        }
        .timeline-track {
            display: flex;
            gap: 5px;
            align-items: flex-end;
            height: 72px;
            overflow-x: auto;
            padding: 6px 0 10px 0;
            scrollbar-width: thin;
            scrollbar-color: rgba(255,255,255,0.1) transparent;
        }
        .timeline-track::-webkit-scrollbar { height: 6px; }
        .timeline-track::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 4px; }
        .timeline-track::-webkit-scrollbar-track { background: transparent; }
        .timeline-bar {
            min-width: 12px;
            border-radius: 3px 3px 0 0;
            cursor: pointer;
            transition: all 0.2s;
            flex-shrink: 0;
            position: relative;
        }
        .timeline-bar:hover {
            opacity: 0.85;
            transform: scaleY(1.08);
            transform-origin: bottom;
            box-shadow: 0 0 16px rgba(255,255,255,0.08);
        }
        .timeline-bar .tooltip {
            display: none;
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.85);
            color: #fff;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 11px;
            white-space: nowrap;
            margin-bottom: 6px;
            border: 1px solid rgba(255,255,255,0.06);
        }
        .timeline-bar:hover .tooltip { display: block; }
        .timeline-date {
            color: #8899aa;
            font-size: 14px;
            margin-top: 12px;
            text-align: center;
            font-weight: 500;
            letter-spacing: 0.3px;
        }
        .timeline-stats {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-top: 8px;
            font-size: 12px;
            color: #4a5a6a;
        }
        .timeline-stats span { color: #c8d0d8; }
        #map { opacity: 0; transition: opacity 0.8s ease; }
        #map.leaflet-container { opacity: 1; }
        .leaflet-tile-pane { opacity: 0; transition: opacity 0.5s ease; }
        .leaflet-tile-pane.leaflet-tile-loaded { opacity: 1; }

        @media (max-width: 768px) {
            .timeline-panel { padding: 14px 16px; width: 96%; bottom: 12px; }
            .timeline-track { height: 54px; }
            .timeline-bar { min-width: 8px; }
            .timeline-title { font-size: 12px; }
            .timeline-date { font-size: 11px; }
        }
        @media (max-width: 480px) {
            .timeline-panel { padding: 10px 12px; border-radius: 10px; }
            .timeline-track { height: 40px; gap: 3px; }
            .timeline-bar { min-width: 5px; }
        }
    </style>
</head>
<body>

    <header class="topbar">
        <div class="topbar-left">
            <span class="topbar-brand" id="brand-text">🌍 CRUCIX MAP</span>
            <div class="refresh-inline" id="refresh-inline">
                <span class="label">🔄</span>
                <select id="refresh-interval">
                    <option value="0">Выкл</option>
                    <option value="60000">1 мин</option>
                    <option value="300000">5 мин</option>
                    <option value="600000" selected>10 мин</option>
                    <option value="1800000">30 мин</option>
                    <option value="3600000">1 час</option>
                    <option value="7200000">2 часа</option>
                </select>
                <span class="timer" id="refresh-timer">—</span>
                <button class="btn-refresh" id="refresh-now-btn" title="Обновить сейчас">⟳</button>
                <span class="last-update" id="last-update-time">
                    <span class="status-dot active" id="status-dot"></span>
                    <span id="update-text">—</span>
                </span>
            </div>
        </div>
        <div class="topbar-right">
            <button class="topbar-btn btn-home" onclick="window.location.href='/jarvis'">← НА ГЛАВНУЮ</button>
            <button class="topbar-btn btn-copy" id="copy-btn" onclick="copyAllData()">📋 КОПИРОВАТЬ</button>
            <button class="topbar-btn btn-rss" onclick="window.location.href='/registry'">📡 Список страниц</button>
            <button class="topbar-btn btn-help" onclick="openHelp()">❓ HELP</button>
            <button class="topbar-btn btn-logger" id="btn-logger" onclick="if(window.crucixLogger) window.crucixLogger.togglePanel()">📋 Логи</button>
            <button class="topbar-btn btn-mode active" id="btn-mode" onclick="toggleMapMode()">📊 CII</button>
            <button class="topbar-btn btn-heat" id="btn-heat" onclick="toggleHeat()">🌡️ Тепловая</button>
            <button class="topbar-btn btn-timeline" id="btn-timeline" onclick="toggleTimeline()">📅 Хронология</button>
            <button class="topbar-btn btn-pdf" onclick="exportPDF()">📄 PDF</button>
            <div class="lang-switch">
                <button class="lang-btn active" data-lang="ru" onclick="setLanguage('ru')">RU</button>
                <button class="lang-btn" data-lang="en" onclick="setLanguage('en')">EN</button>
            </div>
        </div>
    </header>

    <nav class="nav-dashboards">
        <button class="nav-btn active" onclick="goToDashboard('5in1')"><span class="icon">🎯</span>Центр аналитики</button>
        <button class="nav-btn" onclick="goToDashboard('economic')"><span class="icon">📊</span>Экономика</button>
        <button class="nav-btn" onclick="goToDashboard('financial')"><span class="icon">💰</span>Финансы</button>
        <button class="nav-btn" onclick="goToDashboard('military')"><span class="icon">🛡️</span>Военный</button>
        <button class="nav-btn" onclick="goToDashboard('geopolitical')"><span class="icon">🌍</span>Геополитика</button>
        <button class="nav-btn" onclick="goToDashboard('ecological')"><span class="icon">🌿</span>Экология</button>
        <button class="nav-btn" onclick="goToDashboard('cyber')"><span class="icon">🔒</span>Кибер</button>
        <button class="nav-btn" onclick="goToDashboard('space')"><span class="icon">🚀</span>Космос</button>
        <button class="nav-btn" onclick="goToDashboard('news')"><span class="icon">📰</span>Новости</button>
        <button class="nav-btn" onclick="goToDashboard('ai')"><span class="icon">🧠</span>AI</button>
        <button class="nav-btn" onclick="goToDashboard('scientific')"><span class="icon">🔬</span>Наука</button>
        <button class="nav-btn" onclick="goToDashboard('esg')"><span class="icon">🌱</span>ESG</button>
        <button class="nav-btn" onclick="goToDashboard('threats')"><span class="icon">⚡</span>Угрозы</button>
        <button class="nav-btn" onclick="goToDashboard('health')"><span class="icon">🏥</span>Здоровье</button>
        <button class="nav-btn" onclick="goToDashboard('energy')"><span class="icon">⛽</span>Энергетика</button>
        <button class="nav-btn" onclick="goToDashboard('transport')"><span class="icon">🚛</span>Транспорт</button>
        <button class="nav-btn" onclick="goToDashboard('regions')"><span class="icon">🌏</span>Регионы</button>
    </nav>
    <div style="height:2px; background: linear-gradient(90deg, transparent, rgba(91,192,248,0.3), transparent); margin:0;"></div>

    <button class="panel-toggle-btn" id="panel-toggle-btn" onclick="toggleLayerPanel()">📋</button>

    <div class="layer-panel" id="layer-panel">
        <div class="layer-panel-header">
            <div style="display:flex; gap:6px; margin-top:4px; width:100%; justify-content:space-between;">
                <div>
                    <button onclick="enableAllLayers()" style="background:rgba(91,192,248,0.12); border:1px solid rgba(91,192,248,0.2); color:#5bc0f8; border-radius:3px; padding:2px 8px; font-size:9px; cursor:pointer;">Включить все</button>
                    <button onclick="disableAllLayers()" style="background:rgba(239,68,68,0.12); border:1px solid rgba(239,68,68,0.2); color:#ef4444; border-radius:3px; padding:2px 8px; font-size:9px; cursor:pointer;">Выключить все</button>
                </div>
                <span id="active-layers-count" style="font-size:9px; color:#4a5a6a; align-self:center;">0 активных</span>
            </div>
            <span class="layer-panel-title" id="layers-title">🎯 СЛОИ <span class="count" id="layer-count">0</span></span>
            <button class="layer-panel-toggle" onclick="toggleLayerPanel()">✕</button>
        </div>
        <input class="layer-search" id="layer-search" type="text" placeholder="🔍 Поиск слоев..." oninput="filterLayers()">
        <div id="layer-list"></div>
    </div>

    <div class="map-container" id="map-container">
        <div id="map"></div>
        <div class="loading-overlay" id="loading-overlay">
            <div class="spinner"></div>
            <div class="text" id="loading-text">ЗАГРУЗКА КАРТЫ...</div>
        </div>

        <div class="legend" id="legend">
            <div class="legend-title" id="legend-title">🎯 Легенда</div>
            <div id="legend-items"></div>
        </div>

        <div class="stats" id="stats">
            <div class="count" id="marker-count">0</div>
            <div class="label" id="stats-label">событий</div>
            <div class="countries-count" id="countries-count">🌍 0 стран</div>
        </div>

        <div class="ssi-panel" id="ssi-panel">
            <div class="ssi-title" id="ssi-title">📊 Индекс напряжённости (SSI)</div>
            <div class="ssi-bar"><div class="ssi-fill" id="ssi-fill"></div></div>
            <div class="ssi-value" id="ssi-label">0%</div>
        </div>

        <div class="timeline-panel" id="timeline-panel">
            <div class="timeline-title">
                <span>📅 Хронология событий</span>
                <button class="close-btn" onclick="toggleTimeline()">✕ Закрыть</button>
            </div>
            <div class="timeline-track" id="timeline-track"></div>
            <div class="timeline-date" id="timeline-date">—</div>
            <div class="timeline-stats">
                <span>📊 <span id="timeline-events">0</span> событий</span>
                <span>📅 <span id="timeline-days">0</span> дней</span>
            </div>
        </div>
    </div>

    <script>
        // Функция для переключения панели слоёв
        function toggleLayerPanel() {
            const panel = document.getElementById('layer-panel');
            const btn = document.getElementById('panel-toggle-btn');
            if (panel.style.display === 'none' || panel.style.display === '') {
                panel.style.display = 'block';
                btn.classList.add('visible');
            } else {
                panel.style.display = 'none';
                btn.classList.remove('visible');
            }
        }

        // enableAllLayers/disableAllLayers определены в /geo-map/js/layers.js



        // Функция для фильтрации слоёв
        function filterLayers() {
            const query = document.getElementById('layer-search').value.toLowerCase();
            const items = document.querySelectorAll('#layer-list .layer-item');
            items.forEach(item => {
                const label = item.querySelector('label')?.textContent?.toLowerCase() || '';
                item.style.display = label.includes(query) ? '' : 'none';
            });
        }

        // Функция для переключения режима карты (CII/Тепловая)
        function toggleMapMode() {
            const btn = document.getElementById('btn-mode');
            const isCII = btn.textContent.includes('CII');
            if (isCII) {
                btn.textContent = '🌡️ Тепловая';
                btn.classList.remove('active');
                if (window.toggleHeat) window.toggleHeat();
            } else {
                btn.textContent = '📊 CII';
                btn.classList.add('active');
                if (window.toggleHeat) window.toggleHeat();
            }
        }

        // Функция для переключения тепловой карты
        function toggleHeat() {
            if (window.toggleHeatmap) window.toggleHeatmap();
        }

        // Функция для переключения хронологии
        function toggleTimeline() {
            const panel = document.getElementById('timeline-panel');
            panel.classList.toggle('active');
        }

        // Функция для экспорта PDF
        function exportPDF() {
            if (window.exportMapPDF) window.exportMapPDF();
        }

        // Функция для открытия справки
        function openHelp() {
            window.open('/help', '_blank');
        }

        // Функция для установки языка
        function setLanguage(lang) {
            document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
            document.querySelector(`.lang-btn[data-lang="${lang}"]`).classList.add('active');
            if (window.setMapLanguage) window.setMapLanguage(lang);
        }

        // Функция для перехода на дашборд
        function goToDashboard(name) {
            window.location.href = `/dashboard-${name}`;
        }

        // copyAllData определена в /geo-map/js/copy-data.js (window.copyAllData)

        // Инициализация карты после загрузки
        document.addEventListener('DOMContentLoaded', function() {
            console.log('✅ geo-map.html загружен');
            // Проверяем, что карта инициализирована
            if (typeof window.initMap === 'function') {
                window.initMap();
            } else {
                console.warn('⚠️ initMap не найдена, проверьте init.js');
            }
        });
    </script>

    <!-- Всплывающие окна и новости -->
    <script type="module">
        import { showRegionPopup } from '/geo-map/js/popups.mjs';
        import { addNewsMarkers } from '/geo-map/js/news-markers.mjs?v=4';

        function initPopupAndNews() {
            if (!window.map) {
                setTimeout(initPopupAndNews, 500);
                return;
            }

            window.map.on('click', async (e) => {
                const { lat, lng } = e.latlng;
                try {
                    const region = await fetch('/api/geocode?lat=' + lat + '&lon=' + lng)
                        .then(r => r.json())
                        .catch(() => ({}));
                    const popupHtml = await showRegionPopup(lat, lng, region.name || 'Неизвестный регион');
                    L.popup()
                        .setLatLng([lat, lng])
                        .setContent(popupHtml)
                        .openOn(window.map);
                } catch (err) {
                    console.warn('Popup error:', err);
                }
            });

            addNewsMarkers(window.map).catch(err => console.warn('News markers error:', err));
            console.log('✅ Всплывающие окна и новости активированы');
        }

        initPopupAndNews();
    </script>
</body>
</html>
