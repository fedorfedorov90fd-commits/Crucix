<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Мониторинг энергетики — Crucix</title>
  <link rel="stylesheet" href="/css/energy-monitor.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-left">
      <span class="topbar-brand">⚡ CRUCIX MONITOR</span>
      <span class="topbar-status">МОНИТОРИНГ ЭНЕРГЕТИКИ</span>
    </div>
    <div class="topbar-right">
      <span class="topbar-time" id="topbar-date">Загрузка...</span>
      <button class="topbar-btn btn-home" onclick="window.location.href='/jarvis'">← НА ГЛАВНУЮ</button>
      <button class="topbar-btn btn-copy" id="copy-btn">📋 КОПИРОВАТЬ</button>
      <button class="topbar-btn btn-grid" id="grid-toggle">📐 СЕТКА</button>
    </div>
  </header>

  <main class="main-content">
    <h1 class="page-title">🛢️ Мониторинг энергетики</h1>
    <p class="page-subtitle">Цены на нефть, газ, уголь и топливо</p>

    <div class="stats-row" id="stats-row">
      <div class="stat-item">
        <div class="stat-label">Энергоносителей</div>
        <div class="stat-value blue" id="stat-types">0</div>
      </div>
      <div class="stat-item">
        <div class="stat-label">Последнее обновление</div>
        <div class="stat-value" id="stat-last">—</div>
      </div>
    </div>

    <div class="controls">
      <button class="btn btn-primary" id="btn-update">🔄 Обновить данные</button>
      <button class="btn btn-secondary" id="btn-refresh">🔄 Обновить</button>
      <span class="status-label" id="status-label">⏹ Готов</span>
    </div>

    <div class="prices-grid" id="prices-grid">
      <div class="loading">Загрузка данных...</div>
    </div>

    <div class="chart-container">
      <div class="chart-title">📈 Динамика цен</div>
      <canvas id="price-chart"></canvas>
    </div>

    <div class="predictions-panel" id="predictions-panel">
      <h3>🔮 Прогноз цен</h3>
      <div id="predictions-content" class="predictions-content">
        <div class="loading">Ожидание прогноза...</div>
      </div>
    </div>
  </main>

  <div id="coordinate-grid"></div>
  <div id="grid-coords">X: 0  Y: 0</div>

  <script src="/js/energy-monitor.js"></script>
</body>
</html>
