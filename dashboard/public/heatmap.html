<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Тепловые карты — Crucix</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0a1a; color: #e0e0e0; font-family: -apple-system, 'Segoe UI', system-ui, sans-serif; min-height: 100vh; }

        .topbar {
            position: fixed; top: 0; left: 0; right: 0;
            height: 60px;
            background: rgba(10,10,20,0.95);
            backdrop-filter: blur(12px);
            border-bottom: 2px solid rgba(91,192,248,0.25);
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
        }
        .topbar::after {
            content: "";
            position: absolute;
            bottom: -2px; left: 0; right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, #5bc0f8, transparent);
            opacity: 0.6;
        }
        .topbar-left { display: flex; align-items: center; gap: 12px; }
        .topbar-brand { font-size: 14px; font-weight: 700; color: #5bc0f8; text-transform: uppercase; letter-spacing: 2px; }
        .topbar-right { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }

        .topbar-btn {
            height: 28px; padding: 0 12px;
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 4px;
            background: rgba(255,255,255,0.03);
            color: #888;
            font-size: 11px;
            font-weight: 500;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 4px;
            font-family: inherit;
        }
        .topbar-btn:hover { background: rgba(255,255,255,0.06); transform: translateY(-1px); }
        .btn-home { color: #5bc0f8; border-color: rgba(91,192,248,0.2); background: rgba(91,192,248,0.06); }
        .btn-home:hover { background: rgba(91,192,248,0.15); }
        .btn-rss { color: #f26522; border-color: rgba(242,101,34,0.2); background: rgba(242,101,34,0.06); }
        .btn-rss:hover { background: rgba(242,101,34,0.15); }
        .btn-help { color: #a78bfa; border-color: rgba(167,139,250,0.2); background: rgba(167,139,250,0.06); }
        .btn-help:hover { background: rgba(167,139,250,0.15); }

        .lang-switch {
            display: flex; gap: 2px; padding: 2px;
            background: rgba(255,255,255,0.03);
            border-radius: 4px;
            border: 1px solid rgba(255,255,255,0.06);
        }
        .lang-btn {
            padding: 2px 8px; border: none; background: transparent;
            color: #666; font-size: 11px; font-weight: 500;
            cursor: pointer; border-radius: 3px; transition: all 0.2s;
            font-family: inherit;
        }
        .lang-btn:hover { color: #888; background: rgba(255,255,255,0.05); }
        .lang-btn.active { color: #5bc0f8; background: rgba(91,192,248,0.1); }

        .nav-dashboards {
            position: fixed;
            top: 60px;
            left: 0;
            right: 0;
            height: 38px;
            background: rgba(6,10,18,0.92);
            backdrop-filter: blur(8px);
            border-bottom: 1px solid rgba(255,255,255,0.04);
            z-index: 99;
            display: flex;
            align-items: center;
            padding: 0 20px;
            gap: 4px;
            overflow-x: auto;
            scrollbar-width: none;
        }
        .nav-dashboards::-webkit-scrollbar { display: none; }

        .nav-btn {
            padding: 4px 10px;
            border: none;
            border-radius: 4px;
            background: transparent;
            color: #666;
            font-size: 10px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
            font-family: inherit;
            border: 1px solid transparent;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 3px;
        }
        .nav-btn:hover { color: #c8d0d8; background: rgba(255,255,255,0.04); }
        .nav-btn.active { color: #5bc0f8; background: rgba(91,192,248,0.08); border-color: rgba(91,192,248,0.15); }
        .nav-btn .icon { margin-right: 3px; }

        .main-content {
            padding-top: 114px;
            max-width: 1440px;
            margin: 0 auto;
            padding-left: 20px;
            padding-right: 20px;
            padding-bottom: 40px;
            min-height: calc(100vh - 114px);
        }

        .heatmap-controls {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin: 16px 0 24px;
        }
        .heatmap-controls select, .heatmap-controls button {
            padding: 8px 16px;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 6px;
            background: rgba(255,255,255,0.03);
            color: #e0e0e0;
            font-family: inherit;
            font-size: 13px;
            cursor: pointer;
        }
        .heatmap-controls select:focus { outline: none; border-color: #5bc0f8; }
        .heatmap-controls button {
            background: #5bc0f8;
            color: #0a0a1a;
            font-weight: 600;
            border: none;
        }
        .heatmap-controls button:hover { opacity: 0.8; }
        .heatmap-controls button:disabled { opacity: 0.4; cursor: not-allowed; }

        .heatmap-preview {
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 8px;
            padding: 20px;
            min-height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .heatmap-preview .placeholder {
            color: #4a5a6a;
            font-size: 16px;
            text-align: center;
        }
        .heatmap-preview canvas {
            max-width: 100%;
            border-radius: 4px;
        }

        .page-title {
            font-size: 24px;
            font-weight: 700;
            color: #e0e0e0;
            margin-bottom: 8px;
        }
        .page-subtitle {
            font-size: 14px;
            color: #8892b0;
            margin-bottom: 20px;
        }
        .notification {
            position: fixed;
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.85);
            color: #ffffff;
            padding: 8px 20px;
            border-radius: 6px;
            font-size: 13px;
            z-index: 100001;
            border: 1px solid rgba(255,255,255,0.1);
            animation: notif-fade 2.5s forwards;
        }
        @keyframes notif-fade {
            0% { opacity: 0; transform: translateX(-50%) translateY(10px); }
            10% { opacity: 1; transform: translateX(-50%) translateY(0); }
            80% { opacity: 1; }
            100% { opacity: 0; transform: translateX(-50%) translateY(-20px); }
        }
        @media (max-width: 768px) {
            .topbar { padding: 0 12px; height: 52px; }
            .nav-dashboards { top: 52px; height: 34px; }
            .main-content { padding-top: 102px; }
        }
        .stats-row {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 12px;
            margin: 16px 0;
        }
        .stat-item {
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.04);
            border-radius: 6px;
            padding: 12px;
            text-align: center;
        }
        .stat-item .val { font-size: 20px; font-weight: 600; color: #5bc0f8; }
        .stat-item .lbl { font-size: 11px; color: #8892b0; }
    </style>
</head>
<body>

<header class="topbar">
    <div class="topbar-left">
        <span class="topbar-brand">🔥 ТЕПЛОВЫЕ КАРТЫ</span>
    </div>
    <div class="topbar-right">
        <button class="topbar-btn btn-home" onclick="window.location.href='/jarvis'">← НА ГЛАВНУЮ</button>
        <button class="topbar-btn btn-rss" onclick="window.location.href='/registry'">📡 Реестр</button>
        <button class="topbar-btn btn-help" onclick="openHelp()">❓ HELP</button>
        <div class="lang-switch">
            <button class="lang-btn active" data-lang="ru" onclick="switchLang('ru')">RU</button>
            <button class="lang-btn" data-lang="en" onclick="switchLang('en')">EN</button>
        </div>
    </div>
</header>

<nav class="nav-dashboards" id="navDashboards">
    <button class="nav-btn" onclick="window.location.href='/dashboard-5in1'"><span class="icon">🎯</span>Центр аналитики</button>
    <button class="nav-btn" onclick="window.location.href='/dashboard-economic'"><span class="icon">📊</span>Экономика</button>
    <button class="nav-btn" onclick="window.location.href='/dashboard-financial'"><span class="icon">💰</span>Финансы</button>
    <button class="nav-btn" onclick="window.location.href='/dashboard-military'"><span class="icon">🛡️</span>Военный</button>
    <button class="nav-btn" onclick="window.location.href='/dashboard-geopolitical'"><span class="icon">🌍</span>Геополитика</button>
    <button class="nav-btn" onclick="window.location.href='/dashboard-ecological'"><span class="icon">🌿</span>Экология</button>
    <button class="nav-btn" onclick="window.location.href='/dashboard-cyber'"><span class="icon">🔒</span>Кибер</button>
    <button class="nav-btn" onclick="window.location.href='/dashboard-space'"><span class="icon">🚀</span>Космос</button>
    <button class="nav-btn" onclick="window.location.href='/dashboard-news'"><span class="icon">📰</span>Новости</button>
    <button class="nav-btn" onclick="window.location.href='/dashboard-ai'"><span class="icon">🧠</span>AI</button>
    <button class="nav-btn" onclick="window.location.href='/dashboard-scientific'"><span class="icon">🔬</span>Наука</button>
    <button class="nav-btn" onclick="window.location.href='/dashboard-esg'"><span class="icon">🌱</span>ESG</button>
    <button class="nav-btn" onclick="window.location.href='/dashboard-threats'"><span class="icon">⚡</span>Угрозы</button>
    <button class="nav-btn" onclick="window.location.href='/dashboard-health'"><span class="icon">🏥</span>Здоровье</button>
    <button class="nav-btn" onclick="window.location.href='/dashboard-energy'"><span class="icon">⛽</span>Энергетика</button>
    <button class="nav-btn" onclick="window.location.href='/dashboard-transport'"><span class="icon">🚛</span>Транспорт</button>
    <button class="nav-btn" onclick="window.location.href='/dashboard-regions'"><span class="icon">🌏</span>Регионы</button>
    <button class="nav-btn active" onclick="window.location.href='/heatmap'"><span class="icon">🔥</span>Тепловые карты</button>
</nav>

<main class="main-content">
    <h1 class="page-title">🔥 Тепловые карты</h1>
    <p class="page-subtitle">Визуализация плотности данных на карте</p>

    <div class="heatmap-controls">
        <select id="layerSelect">
            <option value="acled">ACLED Конфликты</option>
            <option value="firms">Пожары FIRMS</option>
            <option value="ships">Суда AIS</option>
            <option value="covid">COVID-19</option>
            <option value="emotion">Анализ эмоций</option>
        </select>
        <button onclick="generateHeatmap()">🔄 Сгенерировать</button>
    </div>

    <div class="stats-row" id="statsRow" style="display:none;">
        <div class="stat-item"><div class="val" id="totalPoints">--</div><div class="lbl">Всего точек</div></div>
        <div class="stat-item"><div class="val" id="activeCells">--</div><div class="lbl">Активных ячеек</div></div>
        <div class="stat-item"><div class="val" id="gridCells">--</div><div class="lbl">Ячеек сетки</div></div>
    </div>

    <div class="heatmap-preview" id="heatmapContainer">
        <div class="placeholder">🔥 Выберите слой и нажмите "Сгенерировать"</div>
    </div>
</main>

<script>
// ============================================================
// 1. ЯЗЫК
// ============================================================
let currentLang = localStorage.getItem('crucix-lang') || 'ru';

function switchLang(lang) {
    currentLang = lang;
    localStorage.setItem('crucix-lang', lang);
    document.querySelectorAll('.lang-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.lang === lang);
    });
    showNotification('🌐 Язык: ' + lang.toUpperCase());
}

document.querySelectorAll('.lang-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.lang === currentLang);
});

function showNotification(msg) {
    document.querySelectorAll('.notification').forEach(el => el.remove());
    const el = document.createElement('div');
    el.className = 'notification';
    el.textContent = msg;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 2500);
}

function openHelp() {
    alert('🔥 Тепловые карты\n\nПоказывают плотность данных на карте.\nAPI: /api/heatmap/map/:layerId');
}

// ============================================================
// 2. ГЕНЕРАЦИЯ ТЕПЛОВОЙ КАРТЫ
// ============================================================
async function generateHeatmap() {
    const layerId = document.getElementById('layerSelect').value;
    const container = document.getElementById('heatmapContainer');
    const statsRow = document.getElementById('statsRow');

    container.innerHTML = '<div class="placeholder">⏳ Загрузка...</div>';

    try {
        const response = await fetch(`/api/heatmap/map/${layerId}?zoom=8`);
        const data = await response.json();

        if (data.success && data.heatmap && data.heatmap.features) {
            const features = data.heatmap.features;
            const stats = data.stats || {};

            // Показываем статистику
            statsRow.style.display = 'grid';
            document.getElementById('totalPoints').textContent = stats.totalPoints || features.length;
            document.getElementById('activeCells').textContent = stats.activeCells || '--';
            document.getElementById('gridCells').textContent = stats.gridCells || '--';

            // Визуализация (упрощённая — точки на canvas)
            renderHeatmapCanvas(features);
        } else {
            container.innerHTML = `<div class="placeholder">❌ ${data.error || 'Нет данных для слоя'}</div>`;
            statsRow.style.display = 'none';
        }
    } catch (error) {
        container.innerHTML = '<div class="placeholder">❌ Ошибка подключения к серверу</div>';
        statsRow.style.display = 'none';
    }
}

function renderHeatmapCanvas(features) {
    const container = document.getElementById('heatmapContainer');
    const canvas = document.createElement('canvas');
    canvas.width = 800;
    canvas.height = 400;

    const ctx = canvas.getContext('2d');

    // Тёмный фон
    ctx.fillStyle = '#0a0a1a';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    if (!features || features.length === 0) {
        ctx.fillStyle = '#4a5a6a';
        ctx.font = '18px Arial';
        ctx.textAlign = 'center';
        ctx.fillText('Нет данных для отображения', canvas.width/2, canvas.height/2);
        container.innerHTML = '';
        container.appendChild(canvas);
        return;
    }

    // Находим границы
    let minLat = Infinity, maxLat = -Infinity;
    let minLng = Infinity, maxLng = -Infinity;

    for (const f of features) {
        const coords = f.geometry.coordinates;
        if (coords && coords.length === 2) {
            const lng = coords[0], lat = coords[1];
            if (lat < minLat) minLat = lat;
            if (lat > maxLat) maxLat = lat;
            if (lng < minLng) minLng = lng;
            if (lng > maxLng) maxLng = lng;
        }
    }

    const latRange = maxLat - minLat || 1;
    const lngRange = maxLng - minLng || 1;
    const padding = 30;

    // Рисуем точки
    for (const f of features) {
        const coords = f.geometry.coordinates;
        if (!coords || coords.length !== 2) continue;

        const lng = coords[0], lat = coords[1];
        const x = padding + (lng - minLng) / lngRange * (canvas.width - padding * 2);
        const y = padding + (maxLat - lat) / latRange * (canvas.height - padding * 2);

        const weight = f.properties?.weight || 0.5;
        const radius = 3 + weight * 12;
        const alpha = 0.3 + weight * 0.6;

        const gradient = ctx.createRadialGradient(x, y, 0, x, y, radius);
        gradient.addColorStop(0, `rgba(91, 192, 248, ${alpha})`);
        gradient.addColorStop(0.5, `rgba(91, 192, 248, ${alpha * 0.6})`);
        gradient.addColorStop(1, `rgba(91, 192, 248, 0)`);

        ctx.beginPath();
        ctx.arc(x, y, radius, 0, Math.PI * 2);
        ctx.fillStyle = gradient;
        ctx.fill();
    }

    // Сетка
    ctx.strokeStyle = 'rgba(255,255,255,0.03)';
    ctx.lineWidth = 0.5;
    for (let i = 0; i < 10; i++) {
        const x = padding + i / 10 * (canvas.width - padding * 2);
        ctx.beginPath();
        ctx.moveTo(x, padding);
        ctx.lineTo(x, canvas.height - padding);
        ctx.stroke();
        const y = padding + i / 10 * (canvas.height - padding * 2);
        ctx.beginPath();
        ctx.moveTo(padding, y);
        ctx.lineTo(canvas.width - padding, y);
        ctx.stroke();
    }

    // Легенда
    ctx.fillStyle = 'rgba(255,255,255,0.06)';
    ctx.fillRect(canvas.width - 150, 10, 130, 80);

    ctx.fillStyle = '#8892b0';
    ctx.font = '10px Arial';
    ctx.fillText('Интенсивность', canvas.width - 140, 28);

    const grad = ctx.createLinearGradient(canvas.width - 140, 38, canvas.width - 20, 38);
    grad.addColorStop(0, 'rgba(91,192,248,0.1)');
    grad.addColorStop(0.5, 'rgba(91,192,248,0.5)');
    grad.addColorStop(1, 'rgba(91,192,248,1)');
    ctx.fillStyle = grad;
    ctx.fillRect(canvas.width - 140, 38, 120, 8);

    ctx.fillStyle = '#4a5a6a';
    ctx.font = '8px Arial';
    ctx.fillText('Низкая', canvas.width - 140, 62);
    ctx.fillText('Высокая', canvas.width - 30, 62);

    container.innerHTML = '';
    container.appendChild(canvas);
}

// ============================================================
// 3. ЗАПУСК
// ============================================================
document.addEventListener('DOMContentLoaded', () => {
    // Автогенерация при загрузке
    generateHeatmap();
});
</script>
</body>
</html>
