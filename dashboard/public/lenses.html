<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Тематические линзы — Crucix</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a0f;
      color: #c8d0d8;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', monospace;
      font-size: 13px;
      line-height: 1.5;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .topbar {
      position: fixed; top: 0; left: 0; right: 0; height: 60px;
      background: rgba(10, 10, 20, 0.92); backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.04); z-index: 100;
      display: flex; justify-content: space-between; align-items: center; padding: 0 20px;
    }
    .topbar-left { display: flex; align-items: center; gap: 12px; }
    .topbar-brand { font-size: 14px; font-weight: 700; color: #5bc0f8; text-transform: uppercase; letter-spacing: 2px; }
    .topbar-status { font-size: 11px; color: #ffd700; }

    .topbar-right { display: flex; align-items: center; gap: 6px; }
    .topbar-btn {
      height: 28px; padding: 0 12px; border: 1px solid rgba(255,255,255,0.08); border-radius: 4px;
      background: rgba(255,255,255,0.03); color: #888; font-size: 11px; font-weight: 500;
      text-transform: uppercase; cursor: pointer; transition: all 0.2s;
      display: flex; align-items: center; gap: 4px;
    }
    .topbar-btn:hover { background: rgba(255,255,255,0.06); transform: translateY(-1px); }
    .btn-home { color: #5bc0f8; border-color: rgba(91,192,248,0.2); background: rgba(91,192,248,0.06); }
    .btn-home:hover { background: rgba(91,192,248,0.15); }
    .btn-copy { color: #5bc0f8; border-color: rgba(91,192,248,0.15); background: rgba(91,192,248,0.06); }
    .btn-copy:hover { background: rgba(91,192,248,0.15); }
    .btn-grid { color: #9c27b0; border-color: rgba(156,39,176,0.15); background: rgba(156,39,176,0.06); }
    .btn-grid:hover { background: rgba(156,39,176,0.15); }
    .btn-grid.active { background: rgba(156,39,176,0.2); border-color: rgba(156,39,176,0.3); }

    .lang-switch {
      display: flex; gap: 2px; padding: 2px;
      background: rgba(255,255,255,0.03); border-radius: 4px; border: 1px solid rgba(255,255,255,0.06);
    }
    .lang-btn { padding: 2px 8px; border: none; background: transparent; color: #666; font-size: 11px; font-weight: 500; cursor: pointer; border-radius: 3px; transition: all 0.2s; }
    .lang-btn:hover { color: #888; background: rgba(255,255,255,0.05); }
    .lang-btn.active { color: #5bc0f8; background: rgba(91,192,248,0.1); }

    .main-content { padding-top: 76px; max-width: 1200px; margin: 0 auto; padding-left: 20px; padding-right: 20px; padding-bottom: 40px; }
    .page-title { font-size: 24px; font-weight: 700; color: #e8f0f8; margin-bottom: 20px; }

    .current-lens {
      background: rgba(10,10,20,0.5); border: 1px solid rgba(255,255,255,0.04); border-radius: 8px;
      padding: 16px 20px; margin-bottom: 16px; display: flex; align-items: center; gap: 16px;
    }
    .current-lens .icon { font-size: 32px; }
    .current-lens .info { flex: 1; }
    .current-lens .info .name { font-size: 18px; font-weight: 600; color: #e8f0f8; }
    .current-lens .info .desc { font-size: 13px; color: #888; }

    .lenses-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; margin-bottom: 16px;
    }
    .lens-card {
      background: rgba(10,10,20,0.5); border: 1px solid rgba(255,255,255,0.04); border-radius: 8px;
      padding: 16px; cursor: pointer; transition: all 0.3s; text-align: center;
      border-bottom: 3px solid transparent;
    }
    .lens-card:hover { transform: translateY(-4px); border-color: rgba(255,255,255,0.1); }
    .lens-card.active { border-bottom-color: #5bc0f8; background: rgba(91,192,248,0.05); }
    .lens-card .icon { font-size: 36px; display: block; }
    .lens-card .name { font-size: 14px; font-weight: 600; color: #e8f0f8; margin: 6px 0 2px; }
    .lens-card .desc { font-size: 11px; color: #888; }
    .lens-card .modules-count { font-size: 10px; color: #666; margin-top: 4px; }

    .modules-preview {
      background: rgba(10,10,20,0.3); border: 1px solid rgba(255,255,255,0.03); border-radius: 8px;
      padding: 16px; margin-top: 16px;
    }
    .modules-preview .title { font-size: 12px; color: #888; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }
    .modules-preview .tags { display: flex; flex-wrap: wrap; gap: 6px; }
    .modules-preview .tag {
      padding: 4px 12px; background: rgba(91,192,248,0.1); border: 1px solid rgba(91,192,248,0.15);
      border-radius: 12px; font-size: 11px; color: #5bc0f8;
    }

    .btn { padding: 8px 20px; border: none; border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: 500; transition: all 0.2s; }
    .btn:hover { transform: translateY(-1px); opacity: 0.9; }
    .btn-primary { background: #5bc0f8; color: #0a0a0f; }
    .btn-secondary { background: #444; color: #fff; }

    #coordinate-grid {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 99999;
      background-image: linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
      background-size: 50px 50px; display: none;
    }
    #coordinate-grid.visible { display: block; }
    #grid-coords {
      position: fixed; bottom: 12px; right: 12px; background: rgba(0,0,0,0.7);
      color: #00ff00; font-family: monospace; font-size: 11px; padding: 4px 10px; border-radius: 4px;
      z-index: 100000; pointer-events: none; display: none;
    }
    #grid-coords.visible { display: block; }

    .notification {
      position: fixed; bottom: 60px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.85); color: #fff; padding: 8px 20px; border-radius: 6px;
      font-size: 13px; z-index: 100001; border: 1px solid rgba(255,255,255,0.1);
      animation: notif-fade 2.5s forwards;
    }
    @keyframes notif-fade {
      0% { opacity: 0; transform: translateX(-50%) translateY(10px); }
      10% { opacity: 1; transform: translateX(-50%) translateY(0); }
      80% { opacity: 1; transform: translateX(-50%) translateY(0); }
      100% { opacity: 0; transform: translateX(-50%) translateY(-20px); }
    }

    @media (max-width: 768px) {
      .topbar { padding: 0 12px; height: 52px; }
      .topbar-brand { font-size: 12px; }
      .topbar-status { display: none; }
      .topbar-btn { font-size: 10px; padding: 0 8px; height: 24px; }
      .main-content { padding-top: 68px; padding-left: 12px; padding-right: 12px; }
      .page-title { font-size: 18px; }
      .lenses-grid { grid-template-columns: 1fr 1fr; }
      .current-lens { flex-direction: column; text-align: center; }
    }
    @media (max-width: 480px) {
      .topbar { padding: 0 8px; height: 46px; }
      .topbar-brand { font-size: 10px; letter-spacing: 1px; }
      .topbar-btn { font-size: 9px; padding: 0 6px; height: 20px; }
      .topbar-btn .btn-text { display: none; }
      .lang-btn { font-size: 9px; padding: 1px 5px; }
      .main-content { padding-top: 62px; padding-left: 8px; padding-right: 8px; }
      .page-title { font-size: 16px; }
      .lenses-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <header class="topbar">
    <div class="topbar-left">
      <span class="topbar-brand">⚡ CRUCIX MONITOR</span>
      <span class="topbar-status">МОДУЛЬ №20</span>
    </div>
    <div class="topbar-right">
      <button class="topbar-btn btn-home" onclick="window.location.href='/jarvis'">← НА ГЛАВНУЮ</button>
      <button class="topbar-btn btn-help" onclick="showHelp()">❓ HELP</button>
    <button class="topbar-btn btn-copy" id="copy-btn">📋 КОПИРОВАТЬ</button>
      <button class="topbar-btn btn-grid" id="grid-toggle">📐 СЕТКА</button>
      <div class="lang-switch">
        <button class="lang-btn active" data-lang="ru" onclick="switchLang('ru')">RU</button>
        <button class="lang-btn" data-lang="en" onclick="switchLang('en')">EN</button>
      </div>
    </div>
  </header>

  <main class="main-content">
    <h1 class="page-title" id="page-title">🔍 Тематические линзы (профили интерфейса)</h1>

    <div class="current-lens" id="current-lens">
      <span class="icon" id="current-icon">🌍</span>
      <div class="info">
        <div class="name" id="current-name">Геополитика</div>
        <div class="desc" id="current-desc">Фокус на геополитических событиях и аналитике</div>
      </div>
      <span style="font-size:12px;color:#888;" id="current-modules-count">8 модулей</span>
    </div>

    <div class="lenses-grid" id="lenses-grid"></div>

    <div class="modules-preview" id="modules-preview">
      <div class="title">📦 Модули в этой линзе</div>
      <div class="tags" id="modules-tags"></div>
    </div>

  </main>

  <div id="coordinate-grid"></div>
  <div id="grid-coords">X: 0  Y: 0</div>

  <script>
    // ============================================================
    // 1. ПЕРЕКЛЮЧАТЕЛЬ ЯЗЫКА
    // ============================================================
    let currentLang = localStorage.getItem('crucix-lang') || 'ru';

    function switchLang(lang) {
      currentLang = lang;
      localStorage.setItem('crucix-lang', lang);
      document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.dataset.lang === lang));
      showNotification(`🌐 Язык: ${lang.toUpperCase()}`);
      updateTexts(lang);
    }

    document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.dataset.lang === currentLang));

    function updateTexts(lang) {
      const texts = {
        ru: { title: '🔍 Тематические линзы (профили интерфейса)' },
        en: { title: '🔍 Thematic Lenses (UI Profiles)' }
      };
      const t = texts[lang] || texts.ru;
      document.getElementById('page-title').textContent = t.title;
    }

    updateTexts(currentLang);

    // ============================================================
    // 2. КООРДИНАТНАЯ СЕТКА
    // ============================================================
    let gridVisible = false;
    document.addEventListener('keydown', function(e) {
      if (e.ctrlKey && e.shiftKey && e.key === 'G') { e.preventDefault(); toggleGrid(); }
    });
    document.getElementById('grid-toggle').addEventListener('click', toggleGrid);

    function toggleGrid() {
      gridVisible = !gridVisible;
      document.getElementById('coordinate-grid').classList.toggle('visible', gridVisible);
      document.getElementById('grid-coords').classList.toggle('visible', gridVisible);
      document.getElementById('grid-toggle').classList.toggle('active', gridVisible);
      if (gridVisible) {
        showNotification('⊞ Сетка включена (Ctrl+Shift+G для выключения)');
        document.addEventListener('mousemove', updateCoords);
      } else {
        showNotification('⊞ Сетка выключена');
        document.removeEventListener('mousemove', updateCoords);
      }
    }

    function updateCoords(e) {
      document.getElementById('grid-coords').textContent = `X: ${e.clientX}  Y: ${e.clientY}`;
    }

    function showNotification(msg) {
      const el = document.createElement('div');
      el.className = 'notification';
      el.textContent = msg;
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 2500);
    }

    // ============================================================
    // 3. ОСНОВНЫЕ ФУНКЦИИ
    // ============================================================

    let currentLensId = 'geopolitics';

    async function loadLenses() {
      try {
        const resp = await fetch('/api/lenses/list');
        const data = await resp.json();
        if (data.success) {
          currentLensId = data.current || 'geopolitics';
          renderLenses(data.all);
          renderCurrentLens(currentLensId);
          renderModulesPreview(currentLensId);
        }
      } catch(e) { console.error('[Lenses] Ошибка загрузки:', e); }
    }

    function renderLenses(lenses) {
      const container = document.getElementById('lenses-grid');
      let html = '';
      for (const l of lenses) {
        const active = l.id === currentLensId ? 'active' : '';
        html += `
          <div class="lens-card ${active}" onclick="switchLens('${l.id}')">
            <span class="icon">${l.icon || '🔍'}</span>
            <div class="name">${l.name}</div>
            <div class="desc">${l.description || ''}</div>
            <div class="modules-count">${l.modules ? l.modules.length : 0} модулей</div>
          </div>
        `;
      }
      container.innerHTML = html;
    }

    function renderCurrentLens(lensId) {
      fetch(`/api/lenses/preview?lensId=${lensId}`)
        .then(r => r.json())
        .then(data => {
          if (data.success) {
            const l = data.lens;
            document.getElementById('current-icon').textContent = l.icon || '🔍';
            document.getElementById('current-name').textContent = l.name;
            document.getElementById('current-desc').textContent = l.description || '';
            document.getElementById('current-modules-count').textContent = `${l.modules ? l.modules.length : 0} модулей`;
            renderModulesPreview(lensId);
          }
        })
        .catch(e => console.error('[Lenses] Ошибка:', e));
    }

    function renderModulesPreview(lensId) {
      fetch(`/api/lenses/preview?lensId=${lensId}`)
        .then(r => r.json())
        .then(data => {
          if (data.success) {
            const container = document.getElementById('modules-tags');
            if (data.modules && data.modules.length) {
              let html = '';
              for (const m of data.modules) {
                html += `<span class="tag">${m.icon || '📄'} ${m.name}</span>`;
              }
              container.innerHTML = html;
            } else {
              container.innerHTML = '<span style="color:#666;font-size:12px;">Модули не выбраны</span>';
            }
          }
        })
        .catch(e => console.error('[Lenses] Ошибка:', e));
    }

    async function switchLens(lensId) {
      try {
        const resp = await fetch('/api/lenses/switch', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ lensId })
        });
        const data = await resp.json();
        if (data.success) {
          currentLensId = lensId;
          showNotification(`✅ Переключено на ${data.lens.name}`);
          loadLenses();
        } else {
          showNotification('❌ ' + (data.error || 'Ошибка переключения'));
        }
      } catch(e) { showNotification('❌ Ошибка соединения'); }
    }

    // ============================================================
    // 4. КНОПКА КОПИРОВАНИЯ
    // ============================================================
    function copyPageData() {
      const name = document.getElementById('current-name').textContent || '—';
      const desc = document.getElementById('current-desc').textContent || '—';
      const icon = document.getElementById('current-icon').textContent || '—';
      const count = document.getElementById('current-modules-count').textContent || '—';

      const tags = document.querySelectorAll('#modules-tags .tag');
      let modules = [];
      for (const t of tags) {
        modules.push(t.textContent.trim());
      }

      let text = `=== Тематические линзы ===\n`;
      text += `Дата: ${new Date().toLocaleString()}\n\n`;
      text += `--- ТЕКУЩАЯ ЛИНЗА ---\n`;
      text += `${icon} ${name}\n`;
      text += `${desc}\n`;
      text += `${count}\n\n`;
      text += `--- МОДУЛИ (${modules.length}) ---\n`;
      for (const m of modules) {
        text += `- ${m}\n`;
      }

      navigator.clipboard.writeText(text).then(() => {
        showNotification('✅ Данные скопированы');
      }).catch(() => {
        const area = document.createElement('textarea');
        area.value = text;
        document.body.appendChild(area);
        area.select();
        document.execCommand('copy');
        document.body.removeChild(area);
        showNotification('✅ Данные скопированы');
      });
    }

    document.getElementById('copy-btn').addEventListener('click', copyPageData);

    // ============================================================
    // 5. ЗАГРУЗКА
    // ============================================================
    document.addEventListener('DOMContentLoaded', function() {
      loadLenses();
    });
  </script>
<script src="/js/help.js"></script>
</body>
</html>
