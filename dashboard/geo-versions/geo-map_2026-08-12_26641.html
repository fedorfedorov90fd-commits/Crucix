<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Геополитическая карта — Crucix</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            background: #0a0a1a;
            color: #e0e0e0;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 20px;
            background: rgba(10, 10, 30, 0.95);
            border-bottom: 1px solid rgba(255,255,255,0.06);
            flex-shrink: 0;
            z-index: 100;
            height: 48px;
        }
        .header h1 { font-size: 18px; font-weight: 700; color: #fff; }
        .header h1 span { color: #44ccff; }
        .header .nav-links {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .header .nav-links a {
            color: #888;
            text-decoration: none;
            font-size: 13px;
            padding: 4px 12px;
            border-radius: 4px;
            transition: all 0.2s;
        }
        .header .nav-links a:hover { background: rgba(255,255,255,0.05); color: #e0e0e0; }
        .header .nav-links a.home { color: #2196f3; }
        .header .nav-links a.rss { color: #f26522; }
        .header .nav-links a.active { color: #44ccff; background: rgba(68,204,255,0.1); }
        
        .map-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
        }
        #map {
            flex: 1;
            width: 100%;
            background: #0a0a1a;
            min-height: 300px;
        }
        
        .legend {
            position: absolute;
            bottom: 30px;
            left: 20px;
            z-index: 1000;
            background: rgba(10, 10, 30, 0.92);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 8px;
            padding: 12px 16px;
            font-size: 12px;
            color: #ccc;
            backdrop-filter: blur(10px);
            min-width: 160px;
        }
        .legend .title { font-weight: 600; color: #fff; margin-bottom: 6px; font-size: 13px; }
        .legend .item { display: flex; align-items: center; gap: 8px; margin: 3px 0; }
        .legend .color-box { width: 20px; height: 14px; border-radius: 3px; display: inline-block; border: 1px solid rgba(255,255,255,0.1); }
        .legend .color-box.critical { background: rgba(255,23,68,0.7); }
        .legend .color-box.high { background: rgba(255,125,11,0.6); }
        .legend .color-box.medium { background: rgba(255,235,59,0.5); }
        .legend .color-box.normal { background: rgba(76,175,80,0.3); }
        
        .stats {
            position: absolute;
            top: 60px;
            right: 20px;
            z-index: 1000;
            background: rgba(10, 10, 30, 0.92);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 8px;
            padding: 12px 16px;
            font-size: 12px;
            color: #ccc;
            backdrop-filter: blur(10px);
            min-width: 130px;
        }
        .stats .count { font-size: 24px; font-weight: 700; color: #44ccff; }
        .stats .label { font-size: 11px; color: #888; }
        
        .btn-copy {
            position: absolute;
            top: 60px;
            right: 180px;
            z-index: 1000;
            padding: 8px 16px;
            background: rgba(33, 150, 243, 0.2);
            border: 1px solid rgba(33, 150, 243, 0.3);
            border-radius: 6px;
            color: #2196f3;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.2s;
            backdrop-filter: blur(10px);
        }
        .btn-copy:hover { background: rgba(33, 150, 243, 0.3); border-color: #2196f3; }
        .btn-copy.copied { background: rgba(76, 175, 80, 0.2); border-color: #4caf50; color: #4caf50; }
        
        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 999;
            color: #666;
            font-size: 16px;
        }
        
        .marker-popup .title { font-weight: 600; color: #fff; margin-bottom: 4px; }
        .marker-popup .source { font-size: 11px; color: #888; margin-bottom: 4px; }
        .marker-popup .summary { font-size: 12px; color: #aaa; line-height: 1.4; max-height: 60px; overflow: hidden; }
        .marker-popup .score { display: inline-block; padding: 1px 10px; border-radius: 12px; font-size: 12px; font-weight: 700; margin-top: 4px; }
        .marker-popup .score.critical { background: #ff1744; color: #fff; }
        .marker-popup .score.important { background: #ff9100; color: #fff; }
        .marker-popup .score.normal { background: #4caf50; color: #fff; }
        .marker-popup .read-more { display: inline-block; margin-top: 6px; color: #44ccff; text-decoration: none; font-size: 12px; }
        .marker-popup .read-more:hover { text-decoration: underline; }
        .country-status { font-size: 12px; font-weight: 600; padding: 2px 10px; border-radius: 4px; display: inline-block; }
        .country-status.critical { background: rgba(255,23,68,0.2); color: #ff1744; border: 1px solid #ff1744; }
        .country-status.high { background: rgba(255,125,11,0.2); color: #ff7d0b; border: 1px solid #ff7d0b; }
        .country-status.medium { background: rgba(255,235,59,0.2); color: #ffeb3b; border: 1px solid #ffeb3b; }
        .country-status.normal { background: rgba(76,175,80,0.2); color: #4caf50; border: 1px solid #4caf50; }
        
        .country-polygon {
            stroke-width: 2;
            stroke-opacity: 0.8;
            fill-opacity: 0.45;
        }
        .country-polygon:hover {
            fill-opacity: 0.65;
            stroke-width: 3;
        }
        
        .country-label {
            font-size: 14px;
            font-weight: 400;
            color: #ffffff !important;
            text-shadow: 
                0 0 4px rgba(0,0,0,0.95),
                0 0 8px rgba(0,0,0,0.9),
                0 0 16px rgba(0,0,0,0.8),
                0 0 32px rgba(0,0,0,0.6);
            pointer-events: none;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            letter-spacing: 0.3px;
            background: rgba(0,0,0,0.12);
            padding: 2px 10px;
            border-radius: 4px;
            border: 1px solid rgba(255,255,255,0.06);
        }
        
        @media (max-width: 600px) {
            .header { padding: 6px 12px; height: 42px; }
            .header h1 { font-size: 15px; }
            .header .nav-links a { font-size: 11px; padding: 2px 8px; }
            .legend { bottom: 10px; left: 10px; padding: 8px 12px; font-size: 11px; min-width: 120px; }
            .stats { top: 52px; right: 10px; padding: 8px 12px; }
            .stats .count { font-size: 18px; }
            .btn-copy { top: 52px; right: 110px; font-size: 11px; padding: 4px 10px; }
            .country-label { font-size: 11px; padding: 1px 6px; }
        }
    </style>
</head>
<body>
    <header class="header">
        <h1>📡 <span>Геополитическая</span> карта</h1>
        <div class="nav-links">
            <a href="/jarvis" class="home">🏠 Главная</a>
            <a href="/rss-feed" class="rss">📰 Лента</a>
            <a href="/geo-map" class="active">🌍 Карта</a>
        </div>
    </header>

    <div class="map-wrapper">
        <div id="map">
            <div class="loading" id="loading-text">Загрузка карты...</div>
        </div>

        <button class="btn-copy" id="btn-copy" onclick="copyData()">📋 Копировать данные</button>

        <div class="legend" id="legend">
            <div class="title">📊 Статус стран</div>
            <div class="item"><span class="color-box critical"></span> Критический (война)</div>
            <div class="item"><span class="color-box high"></span> Высокий (подготовка)</div>
            <div class="item"><span class="color-box medium"></span> Средний (напряжение)</div>
            <div class="item"><span class="color-box normal"></span> Нормальный</div>
            <div class="item" style="margin-top:6px;border-top:1px solid rgba(255,255,255,0.06);padding-top:6px;">
                <span style="color:#888;">●</span> Маркеры новостей
            </div>
        </div>

        <div class="stats" id="stats">
            <div class="count" id="marker-count">0</div>
            <div class="label">новостей на карте</div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        console.log('🌍 Геополитическая карта загружается...');
        
        let map;
        let markers = [];
        let allData = { markers: [], countries: [] };
        let countryLabels = [];

        function initMap() {
            map = L.map('map', {
                center: [20, 0],
                zoom: 2,
                zoomControl: true,
                attributionControl: false
            });
            
            L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
            }).addTo(map);
            
            document.getElementById('loading-text').style.display = 'none';
            
            loadCountryStatus();
            loadMarkers();
        }

        function getStatusColor(status) {
            const colors = {
                'critical': '#ff1744',
                'high': '#ff7d0b',
                'medium': '#ffeb3b',
                'normal': '#4caf50'
            };
            return colors[status] || '#666';
        }

        function getStatusFillOpacity(status) {
            const opacities = {
                'critical': 0.50,
                'high': 0.40,
                'medium': 0.30,
                'normal': 0.15
            };
            return opacities[status] || 0.1;
        }

        async function loadCountryStatus() {
            try {
                const response = await fetch('/api/geo/status');
                const data = await response.json();
                if (data.success && data.countries) {
                    allData.countries = data.countries;
                    drawCountryPolygons(data.countries);
                }
            } catch (e) {
                console.error('❌ Ошибка загрузки статусов стран:', e);
            }
        }

        function drawCountryPolygons(countries) {
            fetch('https://raw.githubusercontent.com/holtzy/D3-graph-gallery/master/DATA/world.geojson')
                .then(response => response.json())
                .then(data => {
                    const statusMap = {};
                    const colorMap = {};
                    const nameMap = {};
                    
                    for (const c of countries) {
                        const countryIds = {
                            'russia': ['RUS', 'Russia', 'Россия', 'Russian Federation'],
                            'ukraine': ['UKR', 'Ukraine', 'Украина'],
                            'iran': ['IRN', 'Iran', 'Иран'],
                            'north-korea': ['PRK', 'North Korea', 'Северная Корея'],
                            'israel': ['ISR', 'Israel', 'Израиль'],
                            'turkey': ['TUR', 'Turkey', 'Турция'],
                            'japan': ['JPN', 'Japan', 'Япония'],
                            'us': ['USA', 'United States', 'США'],
                            'uk': ['GBR', 'United Kingdom', 'Великобритания'],
                            'china': ['CHN', 'China', 'Китай'],
                            'india': ['IND', 'India', 'Индия'],
                            'france': ['FRA', 'France', 'Франция'],
                            'germany': ['DEU', 'Germany', 'Германия'],
                            'south-korea': ['KOR', 'South Korea', 'Южная Корея'],
                            'syria': ['SYR', 'Syria', 'Сирия'],
                            'yemen': ['YEM', 'Yemen', 'Йемен'],
                            'palestine': ['PSE', 'Palestine', 'Палестина'],
                            'sudan': ['SDN', 'Sudan', 'Судан'],
                            'armenia': ['ARM', 'Armenia', 'Армения'],
                            'azerbaijan': ['AZE', 'Azerbaijan', 'Азербайджан'],
                            'poland': ['POL', 'Poland', 'Польша'],
                            'colombia': ['COL', 'Colombia', 'Колумбия'],
                            'ethiopia': ['ETH', 'Ethiopia', 'Эфиопия'],
                            'somalia': ['SOM', 'Somalia', 'Сомали']
                        };
                        
                        const ids = countryIds[c.id] || [c.id, c.name];
                        for (const id of ids) {
                            statusMap[id] = c.status;
                            colorMap[id] = c.color || getStatusColor(c.status);
                            nameMap[id] = c.name;
                        }
                    }
                    
                    for (const feature of data.features) {
                        const countryName = feature.properties.name || '';
                        const countryId = feature.properties.iso_a3 || feature.properties.id || '';
                        
                        let status = null;
                        let color = '#666';
                        let displayName = countryName;
                        
                        for (const [key, value] of Object.entries(statusMap)) {
                            if (countryName.includes(key) || key.includes(countryName) || 
                                countryId === key || countryId === value) {
                                status = value;
                                color = colorMap[key] || getStatusColor(value);
                                displayName = nameMap[key] || countryName;
                                break;
                            }
                        }
                        
                        if (status) {
                            const fillColor = getStatusColor(status);
                            const fillOpacity = getStatusFillOpacity(status);
                            
                            const polygon = L.geoJSON(feature, {
                                style: {
                                    color: fillColor,
                                    weight: 2,
                                    opacity: 0.8,
                                    fillColor: fillColor,
                                    fillOpacity: fillOpacity,
                                    className: 'country-polygon'
                                },
                                onEachFeature: function(feature, layer) {
                                    const statusText = status === 'critical' ? '🔴 ВОЙНА' :
                                                     status === 'high' ? '🟡 ПОДГОТОВКА' :
                                                     status === 'medium' ? '🟠 НАПРЯЖЕНИЕ' : '🟢 НОРМАЛЬНО';
                                    
                                    layer.bindPopup(`
                                        <div style="font-size:14px;min-width:200px;">
                                            <div style="font-weight:700;color:#fff;font-size:18px;border-bottom:2px solid ${fillColor};padding-bottom:6px;">
                                                ${displayName}
                                            </div>
                                            <div style="margin-top:8px;">
                                                <div class="country-status ${status}" style="font-size:14px;padding:4px 14px;">${statusText}</div>
                                                <div style="font-size:12px;color:#888;margin-top:6px;">
                                                    Уровень напряжённости: <span style="color:${fillColor};font-weight:600;">${status}</span>
                                                </div>
                                            </div>
                                        </div>
                                    `, { maxWidth: 280 });
                                    
                                    layer.on('mouseover', function() {
                                        this.setStyle({
                                            fillOpacity: Math.min(fillOpacity + 0.2, 0.8),
                                            weight: 3
                                        });
                                    });
                                    layer.on('mouseout', function() {
                                        this.setStyle({
                                            fillOpacity: fillOpacity,
                                            weight: 2
                                        });
                                    });
                                    
                                    const center = layer.getBounds().getCenter();
                                    if (center.lat && center.lng) {
                                        const label = L.marker([center.lat, center.lng], {
                                            icon: L.divIcon({
                                                className: 'country-label',
                                                html: `<div class="country-label">${displayName}</div>`,
                                                iconSize: [0, 0],
                                                iconAnchor: [0, 0]
                                            })
                                        }).addTo(map);
                                        countryLabels.push(label);
                                    }
                                }
                            }).addTo(map);
                        }
                    }
                    
                    // ЯВНО ДОБАВЛЯЕМ ПОДПИСЬ ДЛЯ РОССИИ (на случай, если не отобразилась)
                    setTimeout(function() {
                        const russiaCoords = { lat: 61.5, lng: 105.0 };
                        const existingLabels = document.querySelectorAll('.country-label');
                        let hasRussia = false;
                        for (const el of existingLabels) {
                            if (el.textContent === 'Россия' || el.textContent === 'Russia') {
                                hasRussia = true;
                                break;
                            }
                        }
                        if (!hasRussia) {
                            const label = L.marker([61.5, 105.0], {
                                icon: L.divIcon({
                                    className: 'country-label',
                                    html: `<div class="country-label">Россия</div>`,
                                    iconSize: [0, 0],
                                    iconAnchor: [0, 0]
                                })
                            }).addTo(map);
                            countryLabels.push(label);
                            console.log('🇷🇺 Явно добавлена подпись для России');
                        }
                    }, 1000);
                    
                    console.log('🌍 Нанесены полигоны и подписи для стран');
                })
                .catch(e => {
                    console.error('❌ Ошибка загрузки GeoJSON:', e);
                    drawFallbackCircles(countries);
                });
        }

        function drawFallbackCircles(countries) {
            for (const country of countries) {
                const color = country.color || '#666';
                const statusText = country.status === 'critical' ? '🔴 ВОЙНА' :
                                  country.status === 'high' ? '🟡 ПОДГОТОВКА' :
                                  country.status === 'medium' ? '🟠 НАПРЯЖЕНИЕ' : '🟢 НОРМАЛЬНО';
                
                const icon = L.divIcon({
                    className: 'country-marker',
                    html: `
                        <div style="width:40px;height:40px;background:${color}60;border-radius:50%;border:3px solid ${color};box-shadow:0 0 40px ${color}80;display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff;font-weight:700;text-shadow:0 0 8px rgba(0,0,0,0.9);">
                            ${country.name ? country.name.charAt(0) : '?'}
                        </div>
                    `,
                    iconSize: [40, 40],
                    iconAnchor: [20, 20]
                });
                
                L.marker([country.lat, country.lng], { icon })
                    .addTo(map)
                    .bindPopup(`
                        <div style="font-size:14px;min-width:180px;">
                            <div style="font-weight:700;color:#fff;font-size:18px;">${country.name}</div>
                            <div class="country-status ${country.status}" style="font-size:14px;padding:4px 14px;margin-top:6px;">${statusText}</div>
                        </div>
                    `, { maxWidth: 280 });
            }
        }

        async function loadMarkers() {
            try {
                const response = await fetch('/api/geo/markers?minScore=0');
                const data = await response.json();
                if (data.success && data.markers) {
                    allData.markers = data.markers;
                    document.getElementById('marker-count').textContent = data.markers.length;
                    addMarkers(data.markers);
                }
            } catch (e) {
                console.error('❌ Ошибка загрузки маркеров:', e);
            }
        }

        function addMarkers(markersData) {
            for (const item of markersData) {
                const color = item.color || '#44ccff';
                const icon = L.divIcon({
                    className: 'custom-marker',
                    html: `
                        <div style="width:14px;height:14px;background:${color};border-radius:50%;border:2px solid rgba(255,255,255,0.5);box-shadow:0 0 20px ${color}80;cursor:pointer;"></div>
                    `,
                    iconSize: [14, 14],
                    iconAnchor: [7, 7]
                });
                
                const marker = L.marker([item.lat, item.lng], { icon })
                    .addTo(map)
                    .bindPopup(`
                        <div class="marker-popup" style="min-width:200px;">
                            <div class="title" style="font-size:16px;">${item.title || 'Новость'}</div>
                            <div class="source">📰 ${item.source || 'Источник'} · ${item.countryName || ''}</div>
                            <div class="summary" style="margin-top:4px;">${(item.summary || '').replace(/<[^>]*>/g, '').slice(0, 150)}${(item.summary || '').length > 150 ? '...' : ''}</div>
                            <div style="margin-top:6px;display:flex;gap:8px;align-items:center;">
                                <span class="score ${item.scoreClass || 'normal'}">${item.score || '?'}</span>
                                <span style="font-size:11px;color:#888;">важность</span>
                            </div>
                            <a href="${item.url || '#'}" target="_blank" class="read-more" style="display:inline-block;margin-top:8px;color:#44ccff;text-decoration:none;font-size:12px;">🔗 Читать полностью →</a>
                        </div>
                    `, { maxWidth: 320 });
                
                markers.push(marker);
            }
            
            if (markers.length > 0) {
                try {
                    const group = L.featureGroup(markers);
                    map.fitBounds(group.getBounds().pad(0.2));
                } catch (e) {
                    map.setView([20, 0], 2);
                }
            }
        }

        function copyData() {
            const data = {
                timestamp: new Date().toISOString(),
                markers: allData.markers,
                countries: allData.countries,
                total_markers: allData.markers.length,
                total_countries: allData.countries.length
            };
            
            const json = JSON.stringify(data, null, 2);
            
            navigator.clipboard.writeText(json).then(() => {
                const btn = document.getElementById('btn-copy');
                btn.textContent = '✅ Скопировано!';
                btn.classList.add('copied');
                setTimeout(() => {
                    btn.textContent = '📋 Копировать данные';
                    btn.classList.remove('copied');
                }, 3000);
            }).catch(() => {
                const textarea = document.createElement('textarea');
                textarea.value = json;
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);
                alert('✅ Данные скопированы в буфер обмена!');
            });
        }

        document.addEventListener('DOMContentLoaded', initMap);
    </script>
</body>
</html>
