<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Киберинтеллект — Crucix</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a0f;
      color: #c8d0d8;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', monospace;
      font-size: 13px;
      line-height: 1.5;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .topbar {
      position: fixed; top: 0; left: 0; right: 0; height: 60px;
      background: rgba(10, 10, 20, 0.92); backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.04); z-index: 100;
      display: flex; justify-content: space-between; align-items: center; padding: 0 20px;
    }
    .topbar-left { display: flex; align-items: center; gap: 12px; }
    .topbar-brand { font-size: 14px; font-weight: 700; color: #5bc0f8; text-transform: uppercase; letter-spacing: 2px; }
    .topbar-status { font-size: 11px; color: #ffd700; }

    .topbar-right { display: flex; align-items: center; gap: 6px; }
    .topbar-btn {
      height: 28px; padding: 0 12px; border: 1px solid rgba(255,255,255,0.08); border-radius: 4px;
      background: rgba(255,255,255,0.03); color: #888; font-size: 11px; font-weight: 500;
      text-transform: uppercase; cursor: pointer; transition: all 0.2s;
      display: flex; align-items: center; gap: 4px;
    }
    .topbar-btn:hover { background: rgba(255,255,255,0.06); transform: translateY(-1px); }
    .btn-home { color: #5bc0f8; border-color: rgba(91,192,248,0.2); background: rgba(91,192,248,0.06); }
    .btn-home:hover { background: rgba(91,192,248,0.15); }
    .btn-copy { color: #5bc0f8; border-color: rgba(91,192,248,0.15); background: rgba(91,192,248,0.06); }
    .btn-copy:hover { background: rgba(91,192,248,0.15); }
    .btn-grid { color: #9c27b0; border-color: rgba(156,39,176,0.15); background: rgba(156,39,176,0.06); }
    .btn-grid:hover { background: rgba(156,39,176,0.15); }
    .btn-grid.active { background: rgba(156,39,176,0.2); border-color: rgba(156,39,176,0.3); }

    .lang-switch {
      display: flex; gap: 2px; padding: 2px;
      background: rgba(255,255,255,0.03); border-radius: 4px; border: 1px solid rgba(255,255,255,0.06);
    }
    .lang-btn { padding: 2px 8px; border: none; background: transparent; color: #666; font-size: 11px; font-weight: 500; cursor: pointer; border-radius: 3px; transition: all 0.2s; }
    .lang-btn:hover { color: #888; background: rgba(255,255,255,0.05); }
    .lang-btn.active { color: #5bc0f8; background: rgba(91,192,248,0.1); }

    .main-content { padding-top: 76px; max-width: 1400px; margin: 0 auto; padding-left: 20px; padding-right: 20px; padding-bottom: 40px; }
    .page-title { font-size: 24px; font-weight: 700; color: #e8f0f8; margin-bottom: 20px; }

    .stats-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 16px;
    }
    .stat-card {
      background: rgba(10,10,20,0.5); border: 1px solid rgba(255,255,255,0.04); border-radius: 8px;
      padding: 12px 16px; text-align: center; transition: all 0.2s; cursor: default;
    }
    .stat-card:hover { border-color: rgba(255,255,255,0.08); }
    .stat-card .stat-label { font-size: 10px; text-transform: uppercase; color: #666; letter-spacing: 0.5px; display: block; }
    .stat-card .stat-value { font-size: 24px; font-weight: 700; color: #e8f0f8; display: block; margin: 4px 0; }
    .stat-card .stat-sub { font-size: 10px; color: #666; display: block; }

    .controls-panel {
      display: flex; flex-wrap: wrap; gap: 12px; align-items: center; padding: 16px;
      background: rgba(10,10,20,0.5); border: 1px solid rgba(255,255,255,0.04); border-radius: 8px; margin-bottom: 16px;
    }
    .control-group { display: flex; align-items: center; gap: 6px; }
    .control-group label { font-size: 11px; font-weight: 500; text-transform: uppercase; color: #666; letter-spacing: 0.5px; }
    .control-group select { padding: 4px 8px; border: 1px solid rgba(255,255,255,0.08); border-radius: 4px; background: rgba(255,255,255,0.03); color: #c8d0d8; font-size: 12px; font-family: monospace; }
    .control-group select:focus { outline: none; border-color: #5bc0f8; }

    .btn { height: 28px; padding: 0 14px; border: 1px solid rgba(255,255,255,0.08); border-radius: 4px; background: rgba(255,255,255,0.03); color: #c8d0d8; font-size: 11px; font-weight: 500; text-transform: uppercase; cursor: pointer; transition: all 0.2s; }
    .btn:hover { background: rgba(255,255,255,0.06); transform: translateY(-1px); }
    .btn-primary { background: #5bc0f8; color: #0a0a0f; border-color: #5bc0f8; }
    .btn-primary:hover { background: #4a8af4; }
    .btn-danger { background: #f44336; color: #fff; border-color: #f44336; }
    .btn-danger:hover { background: #d32f2f; }

    .threats-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
    .threat-item {
      display: flex; align-items: center; gap: 12px; padding: 10px 16px;
      background: rgba(10,10,20,0.5); border: 1px solid rgba(255,255,255,0.04); border-radius: 6px;
      border-left: 3px solid #4caf50; transition: all 0.2s;
    }
    .threat-item:hover { background: rgba(255,255,255,0.05); }
    .threat-item.critical { border-left-color: #f44336; }
    .threat-item.high { border-left-color: #f26522; }
    .threat-item.medium { border-left-color: #ffd700; }
    .threat-item.low { border-left-color: #4caf50; }
    .threat-item .info { flex: 1; }
    .threat-item .info .title { font-size: 13px; color: #e8f0f8; }
    .threat-item .info .meta { font-size: 11px; color: #888; }
    .threat-item .badge { font-size: 10px; font-weight: 600; padding: 2px 10px; border-radius: 12px; text-transform: uppercase; }
    .badge.critical { background: rgba(244,67,54,0.2); color: #f44336; }
    .badge.high { background: rgba(242,101,34,0.2); color: #f26522; }
    .badge.medium { background: rgba(255,215,0,0.2); color: #ffd700; }
    .badge.low { background: rgba(76,175,80,0.2); color: #4caf50; }
    .threat-item .confidence { font-size: 12px; color: #5bc0f8; }

    .cves-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; margin-bottom: 16px;
    }
    .cve-card {
      background: rgba(10,10,20,0.5); border: 1px solid rgba(255,255,255,0.04); border-radius: 8px; padding: 12px 16px;
      border-left: 3px solid #4caf50;
    }
    .cve-card.critical { border-left-color: #f44336; }
    .cve-card.high { border-left-color: #f26522; }
    .cve-card.medium { border-left-color: #ffd700; }
    .cve-card .cve-id { font-size: 12px; color: #5bc0f8; font-weight: 600; }
    .cve-card .cve-title { font-size: 13px; color: #e8f0f8; }
    .cve-card .cve-meta { font-size: 11px; color: #888; }
    .cve-card .cve-score { font-size: 14px; font-weight: 700; }
    .cve-card .exploited { color: #f44336; font-size: 10px; text-transform: uppercase; }

    .iocs-list { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
    .ioc-item {
      display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px;
      background: rgba(10,10,20,0.5); border: 1px solid rgba(255,255,255,0.04); border-radius: 12px;
      font-size: 11px; color: #c8d0d8; font-family: monospace;
    }
    .ioc-item .ioc-type { color: #888; }
    .ioc-item .ioc-risk-high { color: #f44336; }
    .ioc-item .ioc-risk-medium { color: #ffd700; }

    .alerts-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
    .alert-item {
      display: flex; align-items: center; gap: 12px; padding: 10px 16px;
      background: rgba(10,10,20,0.5); border: 1px solid rgba(255,255,255,0.04); border-radius: 6px;
      border-left: 3px solid #f44336;
    }
    .alert-item .info { flex: 1; }
    .alert-item .info .title { font-size: 13px; color: #e8f0f8; }
    .alert-item .info .meta { font-size: 11px; color: #888; }
    .alert-item .alert-severity { font-size: 10px; font-weight: 600; padding: 2px 10px; border-radius: 12px; text-transform: uppercase; }
    .alert-item .alert-severity.critical { background: rgba(244,67,54,0.2); color: #f44336; }
    .alert-item .alert-severity.high { background: rgba(242,101,34,0.2); color: #f26522; }
    .alert-item .alert-severity.medium { background: rgba(255,215,0,0.2); color: #ffd700; }

    #coordinate-grid {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 99999;
      background-image: linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
      background-size: 50px 50px; display: none;
    }
    #coordinate-grid.visible { display: block; }
    #grid-coords {
      position: fixed; bottom: 12px; right: 12px; background: rgba(0,0,0,0.7);
      color: #00ff00; font-family: monospace; font-size: 11px; padding: 4px 10px; border-radius: 4px;
      z-index: 100000; pointer-events: none; display: none;
    }
    #grid-coords.visible { display: block; }

    .notification {
      position: fixed; bottom: 60px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.85); color: #fff; padding: 8px 20px; border-radius: 6px;
      font-size: 13px; z-index: 100001; border: 1px solid rgba(255,255,255,0.1);
      animation: notif-fade 2.5s forwards;
    }
    @keyframes notif-fade {
      0% { opacity: 0; transform: translateX(-50%) translateY(10px); }
      10% { opacity: 1; transform: translateX(-50%) translateY(0); }
      80% { opacity: 1; transform: translateX(-50%) translateY(0); }
      100% { opacity: 0; transform: translateX(-50%) translateY(-20px); }
    }

    @media (max-width: 768px) {
      .topbar { padding: 0 12px; height: 52px; }
      .topbar-brand { font-size: 12px; }
      .topbar-status { display: none; }
      .topbar-btn { font-size: 10px; padding: 0 8px; height: 24px; }
      .main-content { padding-top: 68px; padding-left: 12px; padding-right: 12px; }
      .page-title { font-size: 18px; }
      .stats-grid { grid-template-columns: 1fr 1fr; }
      .cves-grid { grid-template-columns: 1fr; }
    }
    @media (max-width: 480px) {
      .topbar { padding: 0 8px; height: 46px; }
      .topbar-brand { font-size: 10px; letter-spacing: 1px; }
      .topbar-btn { font-size: 9px; padding: 0 6px; height: 20px; }
      .topbar-btn .btn-text { display: none; }
      .lang-btn { font-size: 9px; padding: 1px 5px; }
      .main-content { padding-top: 62px; padding-left: 8px; padding-right: 8px; }
      .page-title { font-size: 16px; }
      .stats-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <header class="topbar">
    <div class="topbar-left">
      <span class="topbar-brand">⚡ CRUCIX MONITOR</span>
      <span class="topbar-status">МОДУЛЬ №14</span>
    </div>
    <div class="topbar-right">
      <button class="topbar-btn btn-home" onclick="window.location.href='/jarvis'">← НА ГЛАВНУЮ</button>
      <button class="topbar-btn btn-copy" id="copy-btn">📋 КОПИРОВАТЬ</button>
      <button class="topbar-btn btn-grid" id="grid-toggle">📐 СЕТКА</button>
      <div class="lang-switch">
        <button class="lang-btn active" data-lang="ru" onclick="switchLang('ru')">RU</button>
        <button class="lang-btn" data-lang="en" onclick="switchLang('en')">EN</button>
      </div>
    </div>
  </header>

  <main class="main-content">
    <h1 class="page-title" id="page-title">🛡️ Киберинтеллект и мониторинг угроз</h1>

    <div class="stats-grid" id="stats-grid">
      <div class="stat-card"><span class="stat-label">Угроз</span><span class="stat-value red" id="stat-threats">—</span><span class="stat-sub">активных</span></div>
      <div class="stat-card"><span class="stat-label">CVE</span><span class="stat-value orange" id="stat-cves">—</span><span class="stat-sub">уязвимостей</span></div>
      <div class="stat-card"><span class="stat-label">Акторов</span><span class="stat-value yellow" id="stat-actors">—</span><span class="stat-sub">группировок</span></div>
      <div class="stat-card"><span class="stat-label">IOC</span><span class="stat-value blue" id="stat-iocs">—</span><span class="stat-sub">индикаторов</span></div>
    </div>

    <div class="controls-panel">
      <div class="control-group">
        <label>Важность:</label>
        <select id="severity-filter">
          <option value="all">Все</option>
          <option value="critical">Критические</option>
          <option value="high">Высокие</option>
          <option value="medium">Средние</option>
          <option value="low">Низкие</option>
        </select>
      </div>
      <div class="control-group">
        <label>Тип:</label>
        <select id="type-filter">
          <option value="all">Все</option>
          <option value="ransomware">Ransomware</option>
          <option value="apt">APT</option>
          <option value="exploit">Эксплойт</option>
          <option value="malware">Вредоносное ПО</option>
        </select>
      </div>
      <button class="btn btn-primary" id="refresh-btn">🔄 Обновить</button>
    </div>

    <h2 style="color:#888;font-size:14px;margin-bottom:8px;">🚨 Активные угрозы</h2>
    <div class="threats-list" id="threats-list"></div>

    <h2 style="color:#888;font-size:14px;margin:16px 0 8px;">📋 CVE-уязвимости</h2>
    <div class="cves-grid" id="cves-grid"></div>

    <h2 style="color:#888;font-size:14px;margin:16px 0 8px;">🔴 Активные оповещения</h2>
    <div class="alerts-list" id="alerts-list"></div>

    <h2 style="color:#888;font-size:14px;margin:16px 0 8px;">📌 Индикаторы компрометации (IOC)</h2>
    <div class="iocs-list" id="iocs-list"></div>

  </main>

  <div id="coordinate-grid"></div>
  <div id="grid-coords">X: 0  Y: 0</div>

  <script>
    let currentLang = localStorage.getItem('crucix-lang') || 'ru';
    function switchLang(lang) {
      currentLang = lang;
      localStorage.setItem('crucix-lang', lang);
      document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.dataset.lang === lang));
      showNotification(`🌐 Язык: ${lang.toUpperCase()}`);
      updateTexts(lang);
    }
    document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.dataset.lang === currentLang));

    function updateTexts(lang) {
      const texts = {
        ru: { title: '🛡️ Киберинтеллект и мониторинг угроз', threats: 'Угроз', cves: 'CVE', actors: 'Акторов', iocs: 'IOC', active: 'активных', vulnerabilities: 'уязвимостей', groups: 'группировок', indicators: 'индикаторов' },
        en: { title: '🛡️ Cyber Intelligence & Threat Monitoring', threats: 'Threats', cves: 'CVE', actors: 'Actors', iocs: 'IOC', active: 'active', vulnerabilities: 'vulnerabilities', groups: 'groups', indicators: 'indicators' }
      };
      const t = texts[lang] || texts.ru;
      document.getElementById('page-title').textContent = t.title;
      document.querySelector('#stats-grid .stat-card:nth-child(1) .stat-label').textContent = t.threats;
      document.querySelector('#stats-grid .stat-card:nth-child(2) .stat-label').textContent = t.cves;
      document.querySelector('#stats-grid .stat-card:nth-child(3) .stat-label').textContent = t.actors;
      document.querySelector('#stats-grid .stat-card:nth-child(4) .stat-label').textContent = t.iocs;
      document.querySelector('#stats-grid .stat-card:nth-child(1) .stat-sub').textContent = t.active;
      document.querySelector('#stats-grid .stat-card:nth-child(2) .stat-sub').textContent = t.vulnerabilities;
      document.querySelector('#stats-grid .stat-card:nth-child(3) .stat-sub').textContent = t.groups;
      document.querySelector('#stats-grid .stat-card:nth-child(4) .stat-sub').textContent = t.indicators;
    }
    updateTexts(currentLang);

    let gridVisible = false;
    document.addEventListener('keydown', function(e) {
      if (e.ctrlKey && e.shiftKey && e.key === 'G') { e.preventDefault(); toggleGrid(); }
    });
    document.getElementById('grid-toggle').addEventListener('click', toggleGrid);
    function toggleGrid() {
      gridVisible = !gridVisible;
      document.getElementById('coordinate-grid').classList.toggle('visible', gridVisible);
      document.getElementById('grid-coords').classList.toggle('visible', gridVisible);
      document.getElementById('grid-toggle').classList.toggle('active', gridVisible);
      if (gridVisible) {
        showNotification('⊞ Сетка включена (Ctrl+Shift+G для выключения)');
        document.addEventListener('mousemove', updateCoords);
      } else {
        showNotification('⊞ Сетка выключена');
        document.removeEventListener('mousemove', updateCoords);
      }
    }
    function updateCoords(e) {
      document.getElementById('grid-coords').textContent = `X: ${e.clientX}  Y: ${e.clientY}`;
    }

    function showNotification(msg) {
      const el = document.createElement('div');
      el.className = 'notification';
      el.textContent = msg;
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 2500);
    }

    class CyberPage {
      constructor() {
        this.threats = [];
        this.cves = [];
        this.actors = [];
        this.iocs = [];
        this.alerts = [];
        this.init();
      }
      init() {
        document.getElementById('copy-btn').addEventListener('click', () => this.copyData());
        document.getElementById('refresh-btn').addEventListener('click', () => this.loadAll());
        document.getElementById('severity-filter').addEventListener('change', () => this.loadThreats());
        document.getElementById('type-filter').addEventListener('change', () => this.loadThreats());
        this.loadAll();
      }
      async loadAll() {
        await this.loadThreats();
        await this.loadCVEs();
        await this.loadActors();
        await this.loadIOCs();
        await this.loadAlerts();
        await this.loadStats();
      }
      async loadThreats() {
        try {
          const severity = document.getElementById('severity-filter').value;
          const type = document.getElementById('type-filter').value;
          let url = '/api/cyber/threats?';
          if (severity !== 'all') url += `severity=${severity}&`;
          if (type !== 'all') url += `type=${type}&`;
          const resp = await fetch(url);
          const data = await resp.json();
          if (data.success) {
            this.threats = data.threats || [];
            this.renderThreats();
          }
        } catch(e) { console.error('[Cyber] Ошибка загрузки угроз:', e); }
      }
      async loadCVEs() {
        try {
          const resp = await fetch('/api/cyber/cves');
          const data = await resp.json();
          if (data.success) {
            this.cves = data.cves || [];
            this.renderCVEs();
          }
        } catch(e) { console.error('[Cyber] Ошибка загрузки CVE:', e); }
      }
      async loadActors() {
        try {
          const resp = await fetch('/api/cyber/actors');
          const data = await resp.json();
          if (data.success) {
            this.actors = data.actors || [];
          }
        } catch(e) { console.error('[Cyber] Ошибка загрузки акторов:', e); }
      }
      async loadIOCs() {
        try {
          const resp = await fetch('/api/cyber/iocs');
          const data = await resp.json();
          if (data.success) {
            this.iocs = data.iocs || [];
            this.renderIOCs();
          }
        } catch(e) { console.error('[Cyber] Ошибка загрузки IOC:', e); }
      }
      async loadAlerts() {
        try {
          const resp = await fetch('/api/cyber/alerts');
          const data = await resp.json();
          if (data.success) {
            this.alerts = data.alerts || [];
            this.renderAlerts();
          }
        } catch(e) { console.error('[Cyber] Ошибка загрузки оповещений:', e); }
      }
      async loadStats() {
        try {
          const resp = await fetch('/api/cyber/stats');
          const data = await resp.json();
          if (data.success) {
            document.getElementById('stat-threats').textContent = data.totalThreats || 0;
            document.getElementById('stat-cves').textContent = data.totalCVEs || 0;
            document.getElementById('stat-actors').textContent = data.totalActors || 0;
            document.getElementById('stat-iocs').textContent = data.totalIOCs || 0;
          }
        } catch(e) { console.error('[Cyber] Ошибка загрузки статистики:', e); }
      }
      renderThreats() {
        const container = document.getElementById('threats-list');
        if (!this.threats.length) {
          container.innerHTML = '<div style="text-align:center;color:#666;padding:10px;">Угроз не найдено</div>';
          return;
        }
        const severityLabels = { critical: 'КРИТИЧЕСКИЙ', high: 'ВЫСОКИЙ', medium: 'СРЕДНИЙ', low: 'НИЗКИЙ' };
        let html = '';
        for (const t of this.threats) {
          html += `
            <div class="threat-item ${t.severity}">
              <div class="info">
                <div class="title">${t.name}</div>
                <div class="meta">${t.actor || 'Неизвестен'} · ${t.type} · ${t.targets ? t.targets.join(', ') : ''}</div>
              </div>
              <span class="badge ${t.severity}">${severityLabels[t.severity] || t.severity}</span>
              <span class="confidence">${t.confidence}%</span>
            </div>
          `;
        }
        container.innerHTML = html;
      }
      renderCVEs() {
        const container = document.getElementById('cves-grid');
        if (!this.cves.length) {
          container.innerHTML = '<div style="text-align:center;color:#666;padding:10px;">CVE не найдены</div>';
          return;
        }
        let html = '';
        for (const c of this.cves) {
          const exploited = c.exploited ? '🔴 EXPLOITED' : '🟢 Not exploited';
          html += `
            <div class="cve-card ${c.severity}">
              <div class="cve-id">${c.id}</div>
              <div class="cve-title">${c.title}</div>
              <div class="cve-meta">${c.vendor} · ${c.product}</div>
              <div style="display:flex;justify-content:space-between;margin-top:4px;">
                <span class="cve-score" style="color:${c.cvssScore >= 9 ? '#f44336' : c.cvssScore >= 7 ? '#f26522' : '#ffd700'};">CVSS: ${c.cvssScore}</span>
                <span class="exploited">${exploited}</span>
              </div>
            </div>
          `;
        }
        container.innerHTML = html;
      }
      renderIOCs() {
        const container = document.getElementById('iocs-list');
        if (!this.iocs.length) {
          container.innerHTML = '<div style="text-align:center;color:#666;padding:10px;">IOC не найдены</div>';
          return;
        }
        let html = '';
        for (const i of this.iocs) {
          const riskClass = i.risk === 'high' ? 'ioc-risk-high' : i.risk === 'medium' ? 'ioc-risk-medium' : '';
          html += `
            <span class="ioc-item">
              <span class="ioc-type">[${i.type}]</span>
              <span>${i.value}</span>
              <span class="${riskClass}">${i.risk}</span>
            </span>
          `;
        }
        container.innerHTML = html;
      }
      renderAlerts() {
        const container = document.getElementById('alerts-list');
        if (!this.alerts.length) {
          container.innerHTML = '<div style="text-align:center;color:#666;padding:10px;">Оповещений нет</div>';
          return;
        }
        let html = '';
        for (const a of this.alerts) {
          html += `
            <div class="alert-item">
              <div class="info">
                <div class="title">${a.title}</div>
                <div class="meta">${a.description} · ${a.source}</div>
              </div>
              <span class="alert-severity ${a.severity}">${a.severity}</span>
            </div>
          `;
        }
        container.innerHTML = html;
      }
      copyData() {
        let text = `=== Киберинтеллект ===\nДата: ${new Date().toLocaleString()}\n\n`;
        text += `--- УГРОЗЫ (${this.threats.length}) ---\n`;
        for (const t of this.threats) {
          text += `${t.name} | ${t.severity} | ${t.type} | ${t.confidence}%\n`;
        }
        text += `\n--- CVE (${this.cves.length}) ---\n`;
        for (const c of this.cves) {
          text += `${c.id} | ${c.title} | CVSS: ${c.cvssScore} | ${c.exploited ? 'EXPLOITED' : 'Not exploited'}\n`;
        }
        text += `\n--- IOC (${this.iocs.length}) ---\n`;
        for (const i of this.iocs) {
          text += `${i.type}: ${i.value} (${i.risk})\n`;
        }
        text += `\n--- JSON ---\n${JSON.stringify({ threats: this.threats, cves: this.cves, iocs: this.iocs }, null, 2)}`;
        navigator.clipboard.writeText(text).then(() => showNotification('✅ Данные скопированы'));
      }
    }

    document.addEventListener('DOMContentLoaded', function() {
      window.cyber = new CyberPage();
    });
  </script>
</body>
</html>
