<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Аналитические центры — Crucix</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a0f;
      color: #c8d0d8;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', monospace;
      font-size: 13px;
      line-height: 1.5;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .topbar {
      position: fixed; top: 0; left: 0; right: 0; height: 60px;
      background: rgba(10, 10, 20, 0.92); backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.04); z-index: 100;
      display: flex; justify-content: space-between; align-items: center; padding: 0 20px;
    }
    .topbar-left { display: flex; align-items: center; gap: 12px; }
    .topbar-brand { font-size: 14px; font-weight: 700; color: #5bc0f8; text-transform: uppercase; letter-spacing: 2px; }
    .topbar-status { font-size: 11px; color: #ffd700; }

    .topbar-right { display: flex; align-items: center; gap: 6px; }
    .topbar-btn {
      height: 28px; padding: 0 12px; border: 1px solid rgba(255,255,255,0.08); border-radius: 4px;
      background: rgba(255,255,255,0.03); color: #888; font-size: 11px; font-weight: 500;
      text-transform: uppercase; cursor: pointer; transition: all 0.2s;
      display: flex; align-items: center; gap: 4px;
    }
    .topbar-btn:hover { background: rgba(255,255,255,0.06); transform: translateY(-1px); }
    .btn-home { color: #5bc0f8; border-color: rgba(91,192,248,0.2); background: rgba(91,192,248,0.06); }
    .btn-home:hover { background: rgba(91,192,248,0.15); }
    .btn-copy { color: #5bc0f8; border-color: rgba(91,192,248,0.15); background: rgba(91,192,248,0.06); }
    .btn-copy:hover { background: rgba(91,192,248,0.15); }
    .btn-grid { color: #9c27b0; border-color: rgba(156,39,176,0.15); background: rgba(156,39,176,0.06); }
    .btn-grid:hover { background: rgba(156,39,176,0.15); }
    .btn-grid.active { background: rgba(156,39,176,0.2); border-color: rgba(156,39,176,0.3); }

    .lang-switch {
      display: flex; gap: 2px; padding: 2px;
      background: rgba(255,255,255,0.03); border-radius: 4px; border: 1px solid rgba(255,255,255,0.06);
    }
    .lang-btn { padding: 2px 8px; border: none; background: transparent; color: #666; font-size: 11px; font-weight: 500; cursor: pointer; border-radius: 3px; transition: all 0.2s; }
    .lang-btn:hover { color: #888; background: rgba(255,255,255,0.05); }
    .lang-btn.active { color: #5bc0f8; background: rgba(91,192,248,0.1); }

    .main-content { padding-top: 76px; max-width: 1400px; margin: 0 auto; padding-left: 20px; padding-right: 20px; padding-bottom: 40px; }
    .page-title { font-size: 24px; font-weight: 700; color: #e8f0f8; margin-bottom: 20px; }

    .stats-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 16px;
    }
    .stat-card {
      background: rgba(10,10,20,0.5); border: 1px solid rgba(255,255,255,0.04); border-radius: 8px;
      padding: 12px 16px; text-align: center; transition: all 0.2s; cursor: default;
    }
    .stat-card:hover { border-color: rgba(255,255,255,0.08); }
    .stat-card .stat-label { font-size: 10px; text-transform: uppercase; color: #666; letter-spacing: 0.5px; display: block; }
    .stat-card .stat-value { font-size: 24px; font-weight: 700; color: #e8f0f8; display: block; margin: 4px 0; }
    .stat-card .stat-sub { font-size: 10px; color: #666; display: block; }

    .controls-panel {
      display: flex; flex-wrap: wrap; gap: 12px; align-items: center; padding: 16px;
      background: rgba(10,10,20,0.5); border: 1px solid rgba(255,255,255,0.04); border-radius: 8px; margin-bottom: 16px;
    }
    .control-group { display: flex; align-items: center; gap: 6px; }
    .control-group label { font-size: 11px; font-weight: 500; text-transform: uppercase; color: #666; letter-spacing: 0.5px; }
    .control-group select { padding: 4px 8px; border: 1px solid rgba(255,255,255,0.08); border-radius: 4px; background: rgba(255,255,255,0.03); color: #c8d0d8; font-size: 12px; font-family: monospace; }
    .control-group select:focus { outline: none; border-color: #5bc0f8; }

    .btn { height: 28px; padding: 0 14px; border: 1px solid rgba(255,255,255,0.08); border-radius: 4px; background: rgba(255,255,255,0.03); color: #c8d0d8; font-size: 11px; font-weight: 500; text-transform: uppercase; cursor: pointer; transition: all 0.2s; }
    .btn:hover { background: rgba(255,255,255,0.06); transform: translateY(-1px); }
    .btn-primary { background: #5bc0f8; color: #0a0a0f; border-color: #5bc0f8; }
    .btn-primary:hover { background: #4a8af4; }

    .centers-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; margin-bottom: 16px;
    }
    .center-card {
      background: rgba(10,10,20,0.5); border: 1px solid rgba(255,255,255,0.04); border-radius: 8px; padding: 12px 16px; transition: all 0.2s;
    }
    .center-card:hover { border-color: rgba(255,255,255,0.08); }
    .center-card .name { font-size: 14px; font-weight: 600; color: #e8f0f8; }
    .center-card .country { font-size: 11px; color: #888; }
    .center-card .focus { font-size: 11px; color: #666; margin-top: 4px; }
    .center-card .focus span { display: inline-block; background: rgba(255,255,255,0.05); padding: 1px 8px; border-radius: 10px; margin: 2px 2px; }

    .reports-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
    .report-item {
      display: flex; align-items: center; gap: 12px; padding: 10px 16px;
      background: rgba(10,10,20,0.5); border: 1px solid rgba(255,255,255,0.04); border-radius: 6px;
      border-left: 3px solid #4caf50; cursor: pointer; transition: all 0.2s;
    }
    .report-item:hover { background: rgba(255,255,255,0.05); }
    .report-item.critical { border-left-color: #f44336; }
    .report-item.high { border-left-color: #f26522; }
    .report-item.medium { border-left-color: #ffd700; }
    .report-item .info { flex: 1; }
    .report-item .info .title { font-size: 13px; color: #e8f0f8; }
    .report-item .info .meta { font-size: 11px; color: #888; }
    .report-item .badge { font-size: 10px; font-weight: 600; padding: 2px 10px; border-radius: 12px; text-transform: uppercase; }
    .badge.critical { background: rgba(244,67,54,0.2); color: #f44336; }
    .badge.high { background: rgba(242,101,34,0.2); color: #f26522; }
    .badge.medium { background: rgba(255,215,0,0.2); color: #ffd700; }
    .badge.low { background: rgba(76,175,80,0.2); color: #4caf50; }
    .report-item .confidence { font-size: 12px; color: #5bc0f8; }

    .predictions-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; margin-bottom: 16px;
    }
    .prediction-card {
      background: rgba(10,10,20,0.5); border: 1px solid rgba(255,255,255,0.04); border-radius: 8px; padding: 12px 16px;
      border-left: 3px solid #5bc0f8;
    }
    .prediction-card .title { font-size: 13px; font-weight: 600; color: #e8f0f8; }
    .prediction-card .prediction { font-size: 12px; color: #c8d0d8; margin: 4px 0; }
    .prediction-card .meta { font-size: 11px; color: #888; }
    .prediction-card .confidence { font-size: 12px; color: #5bc0f8; }

    #coordinate-grid {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 99999;
      background-image: linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
      background-size: 50px 50px; display: none;
    }
    #coordinate-grid.visible { display: block; }
    #grid-coords {
      position: fixed; bottom: 12px; right: 12px; background: rgba(0,0,0,0.7);
      color: #00ff00; font-family: monospace; font-size: 11px; padding: 4px 10px; border-radius: 4px;
      z-index: 100000; pointer-events: none; display: none;
    }
    #grid-coords.visible { display: block; }

    .notification {
      position: fixed; bottom: 60px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.85); color: #fff; padding: 8px 20px; border-radius: 6px;
      font-size: 13px; z-index: 100001; border: 1px solid rgba(255,255,255,0.1);
      animation: notif-fade 2.5s forwards;
    }
    @keyframes notif-fade {
      0% { opacity: 0; transform: translateX(-50%) translateY(10px); }
      10% { opacity: 1; transform: translateX(-50%) translateY(0); }
      80% { opacity: 1; transform: translateX(-50%) translateY(0); }
      100% { opacity: 0; transform: translateX(-50%) translateY(-20px); }
    }

    @media (max-width: 768px) {
      .topbar { padding: 0 12px; height: 52px; }
      .topbar-brand { font-size: 12px; }
      .topbar-status { display: none; }
      .topbar-btn { font-size: 10px; padding: 0 8px; height: 24px; }
      .main-content { padding-top: 68px; padding-left: 12px; padding-right: 12px; }
      .page-title { font-size: 18px; }
      .stats-grid { grid-template-columns: 1fr 1fr; }
      .centers-grid { grid-template-columns: 1fr 1fr; }
      .predictions-grid { grid-template-columns: 1fr; }
    }
    @media (max-width: 480px) {
      .topbar { padding: 0 8px; height: 46px; }
      .topbar-brand { font-size: 10px; letter-spacing: 1px; }
      .topbar-btn { font-size: 9px; padding: 0 6px; height: 20px; }
      .topbar-btn .btn-text { display: none; }
      .lang-btn { font-size: 9px; padding: 1px 5px; }
      .main-content { padding-top: 62px; padding-left: 8px; padding-right: 8px; }
      .page-title { font-size: 16px; }
      .stats-grid { grid-template-columns: 1fr; }
      .centers-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <header class="topbar">
    <div class="topbar-left">
      <span class="topbar-brand">⚡ CRUCIX MONITOR</span>
      <span class="topbar-status">МОДУЛЬ №13</span>
    </div>
    <div class="topbar-right">
      <button class="topbar-btn btn-home" onclick="window.location.href='/jarvis'">← НА ГЛАВНУЮ</button>
      <button class="topbar-btn btn-copy" id="copy-btn">📋 КОПИРОВАТЬ</button>
      <button class="topbar-btn btn-grid" id="grid-toggle">📐 СЕТКА</button>
      <div class="lang-switch">
        <button class="lang-btn active" data-lang="ru" onclick="switchLang('ru')">RU</button>
        <button class="lang-btn" data-lang="en" onclick="switchLang('en')">EN</button>
      </div>
    </div>
  </header>

  <main class="main-content">
    <h1 class="page-title" id="page-title">📊 Аналитические центры и прогнозные отчёты</h1>

    <div class="stats-grid" id="stats-grid">
      <div class="stat-card"><span class="stat-label">Центров</span><span class="stat-value blue" id="stat-centers">—</span><span class="stat-sub">активных</span></div>
      <div class="stat-card"><span class="stat-label">Отчётов</span><span class="stat-value green" id="stat-reports">—</span><span class="stat-sub">всего</span></div>
      <div class="stat-card"><span class="stat-label">Прогнозов</span><span class="stat-value orange" id="stat-predictions">—</span><span class="stat-sub">активных</span></div>
      <div class="stat-card"><span class="stat-label">Уверенность</span><span class="stat-value yellow" id="stat-confidence">—</span><span class="stat-sub">средняя</span></div>
    </div>

    <div class="controls-panel">
      <div class="control-group">
        <label>Центр:</label>
        <select id="center-filter">
          <option value="all">Все</option>
        </select>
      </div>
      <div class="control-group">
        <label>Регион:</label>
        <select id="region-filter">
          <option value="all">Все</option>
          <option value="global">Глобальный</option>
          <option value="ukraine">Украина</option>
          <option value="europe">Европа</option>
          <option value="middle-east">Ближний Восток</option>
          <option value="asia-pacific">Азиатско-Тихоокеанский</option>
        </select>
      </div>
      <div class="control-group">
        <label>Важность:</label>
        <select id="severity-filter">
          <option value="all">Все</option>
          <option value="critical">Критические</option>
          <option value="high">Высокие</option>
          <option value="medium">Средние</option>
          <option value="low">Низкие</option>
        </select>
      </div>
      <button class="btn btn-primary" id="refresh-btn">🔄 Обновить</button>
    </div>

    <h2 style="color:#888;font-size:14px;margin-bottom:8px;">🏛️ Аналитические центры</h2>
    <div class="centers-grid" id="centers-grid"></div>

    <h2 style="color:#888;font-size:14px;margin:16px 0 8px;">📄 Отчёты</h2>
    <div class="reports-list" id="reports-list"></div>

    <h2 style="color:#888;font-size:14px;margin:16px 0 8px;">🔮 Прогнозы</h2>
    <div class="predictions-grid" id="predictions-grid"></div>

  </main>

  <div id="coordinate-grid"></div>
  <div id="grid-coords">X: 0  Y: 0</div>

  <script>
    let currentLang = localStorage.getItem('crucix-lang') || 'ru';
    function switchLang(lang) {
      currentLang = lang;
      localStorage.setItem('crucix-lang', lang);
      document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.dataset.lang === lang));
      showNotification(`🌐 Язык: ${lang.toUpperCase()}`);
      updateTexts(lang);
    }
    document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.dataset.lang === currentLang));

    function updateTexts(lang) {
      const texts = {
        ru: { title: '📊 Аналитические центры и прогнозные отчёты', centers: 'Центров', reports: 'Отчётов', predictions: 'Прогнозов', confidence: 'Уверенность', active: 'активных', total: 'всего', avg: 'средняя' },
        en: { title: '📊 Think Tanks & Forecast Reports', centers: 'Centers', reports: 'Reports', predictions: 'Predictions', confidence: 'Confidence', active: 'active', total: 'total', avg: 'average' }
      };
      const t = texts[lang] || texts.ru;
      document.getElementById('page-title').textContent = t.title;
      document.querySelector('#stats-grid .stat-card:nth-child(1) .stat-label').textContent = t.centers;
      document.querySelector('#stats-grid .stat-card:nth-child(2) .stat-label').textContent = t.reports;
      document.querySelector('#stats-grid .stat-card:nth-child(3) .stat-label').textContent = t.predictions;
      document.querySelector('#stats-grid .stat-card:nth-child(4) .stat-label').textContent = t.confidence;
      document.querySelector('#stats-grid .stat-card:nth-child(1) .stat-sub').textContent = t.active;
      document.querySelector('#stats-grid .stat-card:nth-child(2) .stat-sub').textContent = t.total;
      document.querySelector('#stats-grid .stat-card:nth-child(3) .stat-sub').textContent = t.active;
      document.querySelector('#stats-grid .stat-card:nth-child(4) .stat-sub').textContent = t.avg;
    }
    updateTexts(currentLang);

    let gridVisible = false;
    document.addEventListener('keydown', function(e) {
      if (e.ctrlKey && e.shiftKey && e.key === 'G') { e.preventDefault(); toggleGrid(); }
    });
    document.getElementById('grid-toggle').addEventListener('click', toggleGrid);
    function toggleGrid() {
      gridVisible = !gridVisible;
      document.getElementById('coordinate-grid').classList.toggle('visible', gridVisible);
      document.getElementById('grid-coords').classList.toggle('visible', gridVisible);
      document.getElementById('grid-toggle').classList.toggle('active', gridVisible);
      if (gridVisible) {
        showNotification('⊞ Сетка включена (Ctrl+Shift+G для выключения)');
        document.addEventListener('mousemove', updateCoords);
      } else {
        showNotification('⊞ Сетка выключена');
        document.removeEventListener('mousemove', updateCoords);
      }
    }
    function updateCoords(e) {
      document.getElementById('grid-coords').textContent = `X: ${e.clientX}  Y: ${e.clientY}`;
    }

    function showNotification(msg) {
      const el = document.createElement('div');
      el.className = 'notification';
      el.textContent = msg;
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 2500);
    }

    class ThinkTanksPage {
      constructor() {
        this.centers = [];
        this.reports = [];
        this.predictions = [];
        this.init();
      }
      init() {
        document.getElementById('copy-btn').addEventListener('click', () => this.copyData());
        document.getElementById('refresh-btn').addEventListener('click', () => this.loadAll());
        document.getElementById('center-filter').addEventListener('change', () => this.applyFilters());
        document.getElementById('region-filter').addEventListener('change', () => this.applyFilters());
        document.getElementById('severity-filter').addEventListener('change', () => this.applyFilters());
        this.loadAll();
      }
      async loadAll() {
        await this.loadCenters();
        await this.loadReports();
        await this.loadPredictions();
        await this.loadSummary();
        this.populateFilters();
      }
      async loadCenters() {
        try {
          const resp = await fetch('/api/thinktanks/centers');
          const data = await resp.json();
          if (data.success) {
            this.centers = data.centers || [];
            this.renderCenters();
          }
        } catch(e) { console.error('[ThinkTanks] Ошибка загрузки центров:', e); }
      }
      async loadReports() {
        try {
          const params = new URLSearchParams();
          const center = document.getElementById('center-filter').value;
          const region = document.getElementById('region-filter').value;
          const severity = document.getElementById('severity-filter').value;
          if (center !== 'all') params.set('center', center);
          if (region !== 'all') params.set('region', region);
          if (severity !== 'all') params.set('severity', severity);
          const url = '/api/thinktanks/reports?' + params.toString();
          const resp = await fetch(url);
          const data = await resp.json();
          if (data.success) {
            this.reports = data.reports || [];
            this.renderReports();
          }
        } catch(e) { console.error('[ThinkTanks] Ошибка загрузки отчётов:', e); }
      }
      async loadPredictions() {
        try {
          const resp = await fetch('/api/thinktanks/predictions');
          const data = await resp.json();
          if (data.success) {
            this.predictions = data.predictions || [];
            this.renderPredictions();
          }
        } catch(e) { console.error('[ThinkTanks] Ошибка загрузки прогнозов:', e); }
      }
      async loadSummary() {
        try {
          const resp = await fetch('/api/thinktanks/summary');
          const data = await resp.json();
          if (data.success) {
            document.getElementById('stat-centers').textContent = this.centers.length;
            document.getElementById('stat-reports').textContent = data.totalReports || 0;
            document.getElementById('stat-predictions').textContent = this.predictions.length;
            document.getElementById('stat-confidence').textContent = data.avgConfidence ? data.avgConfidence + '%' : '—';
          }
        } catch(e) { console.error('[ThinkTanks] Ошибка загрузки сводки:', e); }
      }
      populateFilters() {
        const centerSelect = document.getElementById('center-filter');
        centerSelect.innerHTML = '<option value="all">Все</option>';
        for (const c of this.centers) {
          centerSelect.innerHTML += `<option value="${c.id}">${c.name}</option>`;
        }
      }
      renderCenters() {
        const container = document.getElementById('centers-grid');
        let html = '';
        for (const c of this.centers) {
          html += `
            <div class="center-card">
              <div class="name">${c.name}</div>
              <div class="country">${c.country} (${c.founded})</div>
              <div class="focus">${c.focus.map(f => `<span>${f}</span>`).join(' ')}</div>
            </div>
          `;
        }
        container.innerHTML = html;
      }
      renderReports() {
        const container = document.getElementById('reports-list');
        if (!this.reports.length) {
          container.innerHTML = '<div style="text-align:center;color:#666;padding:10px;">Отчётов не найдено</div>';
          return;
        }
        const severityLabels = { critical: 'КРИТИЧЕСКИЙ', high: 'ВЫСОКИЙ', medium: 'СРЕДНИЙ', low: 'НИЗКИЙ' };
        let html = '';
        for (const r of this.reports) {
          const center = this.centers.find(c => c.id === r.center);
          html += `
            <div class="report-item ${r.severity}">
              <div class="info">
                <div class="title">${r.title}</div>
                <div class="meta">${center ? center.name : r.center} · ${r.date} · Регион: ${r.region}</div>
              </div>
              <span class="badge ${r.severity}">${severityLabels[r.severity] || r.severity}</span>
              <span class="confidence">${r.confidence}%</span>
            </div>
          `;
        }
        container.innerHTML = html;
      }
      renderPredictions() {
        const container = document.getElementById('predictions-grid');
        if (!this.predictions.length) {
          container.innerHTML = '<div style="text-align:center;color:#666;padding:10px;">Прогнозов нет</div>';
          return;
        }
        let html = '';
        for (const p of this.predictions) {
          const center = this.centers.find(c => c.id === p.center);
          html += `
            <div class="prediction-card">
              <div class="title">${p.title}</div>
              <div class="prediction">${p.prediction}</div>
              <div class="meta">${center ? center.name : p.center} · ${p.timeframe} · ${p.region}</div>
              <div class="confidence">Уверенность: ${p.confidence}%</div>
            </div>
          `;
        }
        container.innerHTML = html;
      }
      applyFilters() {
        this.loadReports();
      }
      copyData() {
        let text = `=== Аналитические центры ===\nДата: ${new Date().toLocaleString()}\n\n`;
        text += `--- ЦЕНТРЫ (${this.centers.length}) ---\n`;
        for (const c of this.centers) {
          text += `${c.name} (${c.country}) — ${c.focus.join(', ')}\n`;
        }
        text += `\n--- ОТЧЁТЫ (${this.reports.length}) ---\n`;
        for (const r of this.reports) {
          text += `${r.title} | ${r.severity} | ${r.confidence}%\n`;
        }
        text += `\n--- ПРОГНОЗЫ (${this.predictions.length}) ---\n`;
        for (const p of this.predictions) {
          text += `${p.title}: ${p.prediction} (${p.confidence}%)\n`;
        }
        text += `\n--- JSON ---\n${JSON.stringify({ centers: this.centers, reports: this.reports, predictions: this.predictions }, null, 2)}`;
        navigator.clipboard.writeText(text).then(() => showNotification('✅ Данные скопированы'));
      }
    }

    document.addEventListener('DOMContentLoaded', function() {
      window.thinktanks = new ThinkTanksPage();
    });
  </script>
</body>
</html>
