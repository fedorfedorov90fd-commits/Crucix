<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Управление слоями — Crucix</title>
    <style>
        /* ===== СТИЛИ ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0a1a; color: #e0e0e0; font-family: -apple-system, 'Segoe UI', system-ui, sans-serif; min-height: 100vh; }

        .topbar {
            position: fixed; top: 0; left: 0; right: 0;
            height: 60px;
            background: rgba(10,10,20,0.95);
            backdrop-filter: blur(12px);
            border-bottom: 2px solid rgba(91,192,248,0.25);
            box-shadow: 0 2px 20px rgba(91,192,248,0.08);
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
        }
        .topbar::after {
            content: "";
            position: absolute;
            bottom: -2px; left: 0; right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, #5bc0f8, transparent);
            opacity: 0.6;
        }
        .topbar-left { display: flex; align-items: center; gap: 12px; }
        .topbar-brand { font-size: 14px; font-weight: 700; color: #5bc0f8; text-transform: uppercase; letter-spacing: 2px; }
        .topbar-right { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }

        .topbar-btn {
            height: 28px; padding: 0 12px;
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 4px;
            background: rgba(255,255,255,0.03);
            color: #888;
            font-size: 11px;
            font-weight: 500;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 4px;
            font-family: inherit;
        }
        .topbar-btn:hover { background: rgba(255,255,255,0.06); transform: translateY(-1px); }
        .btn-home { color: #5bc0f8; border-color: rgba(91,192,248,0.2); background: rgba(91,192,248,0.06); }
        .btn-home:hover { background: rgba(91,192,248,0.15); }
        .btn-rss { color: #f26522; border-color: rgba(242,101,34,0.2); background: rgba(242,101,34,0.06); }
        .btn-rss:hover { background: rgba(242,101,34,0.15); }
        .btn-help { color: #a78bfa; border-color: rgba(167,139,250,0.2); background: rgba(167,139,250,0.06); }
        .btn-help:hover { background: rgba(167,139,250,0.15); }

        .lang-switch {
            display: flex; gap: 2px; padding: 2px;
            background: rgba(255,255,255,0.03);
            border-radius: 4px;
            border: 1px solid rgba(255,255,255,0.06);
        }
        .lang-btn {
            padding: 2px 8px; border: none; background: transparent;
            color: #666; font-size: 11px; font-weight: 500;
            cursor: pointer; border-radius: 3px; transition: all 0.2s;
            font-family: inherit;
        }
        .lang-btn:hover { color: #888; background: rgba(255,255,255,0.05); }
        .lang-btn.active { color: #5bc0f8; background: rgba(91,192,248,0.1); }

        .nav-dashboards {
            position: fixed;
            top: 60px;
            left: 0;
            right: 0;
            height: 38px;
            background: rgba(6,10,18,0.92);
            backdrop-filter: blur(8px);
            border-bottom: 1px solid rgba(255,255,255,0.04);
            z-index: 99;
            display: flex;
            align-items: center;
            padding: 0 20px;
            gap: 4px;
            overflow-x: auto;
            scrollbar-width: none;
        }
        .nav-dashboards::-webkit-scrollbar { display: none; }

        .nav-btn {
            padding: 4px 10px;
            border: none;
            border-radius: 4px;
            background: transparent;
            color: #666;
            font-size: 10px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
            font-family: inherit;
            border: 1px solid transparent;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 3px;
        }
        .nav-btn:hover { color: #c8d0d8; background: rgba(255,255,255,0.04); }
        .nav-btn.active { color: #5bc0f8; background: rgba(91,192,248,0.08); border-color: rgba(91,192,248,0.15); }
        .nav-btn .icon { margin-right: 3px; }

        .main-content {
            padding-top: 114px;
            max-width: 1440px;
            margin: 0 auto;
            padding-left: 20px;
            padding-right: 20px;
            padding-bottom: 40px;
            min-height: calc(100vh - 114px);
        }

        /* Специфические стили для страницы слоёв */
        .layers-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 16px;
            margin-top: 20px;
        }
        .layer-card {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 8px;
            padding: 16px;
            transition: all 0.3s;
        }
        .layer-card:hover {
            border-color: rgba(91,192,248,0.3);
            background: rgba(255,255,255,0.05);
        }
        .layer-card .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        .layer-card .name {
            font-size: 16px;
            font-weight: 600;
            color: #e0e0e0;
        }
        .layer-card .status {
            font-size: 12px;
            padding: 2px 10px;
            border-radius: 12px;
        }
        .status.active { background: rgba(0,255,136,0.2); color: #00ff88; }
        .status.inactive { background: rgba(255,0,68,0.2); color: #ff0044; }
        .layer-card .meta {
            font-size: 13px;
            color: #8892b0;
            margin-bottom: 4px;
        }
        .layer-card .toggle-btn {
            margin-top: 10px;
            padding: 4px 16px;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 4px;
            background: transparent;
            color: #5bc0f8;
            cursor: pointer;
            font-family: inherit;
            font-size: 12px;
        }
        .layer-card .toggle-btn:hover { background: rgba(91,192,248,0.1); }
        .page-title {
            font-size: 24px;
            font-weight: 700;
            color: #e0e0e0;
            margin-bottom: 8px;
        }
        .page-subtitle {
            font-size: 14px;
            color: #8892b0;
            margin-bottom: 20px;
        }
        .stat-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            background: rgba(91,192,248,0.1);
            color: #5bc0f8;
            margin-right: 8px;
        }
        @media (max-width: 768px) {
            .topbar { padding: 0 12px; height: 52px; }
            .nav-dashboards { top: 52px; height: 34px; }
            .main-content { padding-top: 102px; }
            .layers-grid { grid-template-columns: 1fr; }
        }
        .notification {
            position: fixed;
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.85);
            color: #ffffff;
            padding: 8px 20px;
            border-radius: 6px;
            font-size: 13px;
            z-index: 100001;
            border: 1px solid rgba(255,255,255,0.1);
            animation: notif-fade 2.5s forwards;
        }
        @keyframes notif-fade {
            0% { opacity: 0; transform: translateX(-50%) translateY(10px); }
            10% { opacity: 1; transform: translateX(-50%) translateY(0); }
            80% { opacity: 1; }
            100% { opacity: 0; transform: translateX(-50%) translateY(-20px); }
        }
    </style>
</head>
<body>

<header class="topbar">
    <div class="topbar-left">
        <span class="topbar-brand">🗺️ УПРАВЛЕНИЕ СЛОЯМИ</span>
    </div>
    <div class="topbar-right">
        <button class="topbar-btn btn-home" onclick="window.location.href='/jarvis'">← НА ГЛАВНУЮ</button>
        <button class="topbar-btn btn-rss" onclick="window.location.href='/registry'">📡 Реестр</button>
        <button class="topbar-btn btn-help" onclick="openHelp()">❓ HELP</button>
        <div class="lang-switch">
            <button class="lang-btn active" data-lang="ru" onclick="switchLang('ru')">RU</button>
            <button class="lang-btn" data-lang="en" onclick="switchLang('en')">EN</button>
        </div>
    </div>
</header>

<nav class="nav-dashboards" id="navDashboards">
    <button class="nav-btn" onclick="window.location.href='/dashboard-5in1'"><span class="icon">🎯</span>Центр аналитики</button>
    <button class="nav-btn" onclick="window.location.href='/dashboard-economic'"><span class="icon">📊</span>Экономика</button>
    <button class="nav-btn" onclick="window.location.href='/dashboard-financial'"><span class="icon">💰</span>Финансы</button>
    <button class="nav-btn" onclick="window.location.href='/dashboard-military'"><span class="icon">🛡️</span>Военный</button>
    <button class="nav-btn" onclick="window.location.href='/dashboard-geopolitical'"><span class="icon">🌍</span>Геополитика</button>
    <button class="nav-btn" onclick="window.location.href='/dashboard-ecological'"><span class="icon">🌿</span>Экология</button>
    <button class="nav-btn" onclick="window.location.href='/dashboard-cyber'"><span class="icon">🔒</span>Кибер</button>
    <button class="nav-btn" onclick="window.location.href='/dashboard-space'"><span class="icon">🚀</span>Космос</button>
    <button class="nav-btn" onclick="window.location.href='/dashboard-news'"><span class="icon">📰</span>Новости</button>
    <button class="nav-btn" onclick="window.location.href='/dashboard-ai'"><span class="icon">🧠</span>AI</button>
    <button class="nav-btn" onclick="window.location.href='/dashboard-scientific'"><span class="icon">🔬</span>Наука</button>
    <button class="nav-btn" onclick="window.location.href='/dashboard-esg'"><span class="icon">🌱</span>ESG</button>
    <button class="nav-btn" onclick="window.location.href='/dashboard-threats'"><span class="icon">⚡</span>Угрозы</button>
    <button class="nav-btn" onclick="window.location.href='/dashboard-health'"><span class="icon">🏥</span>Здоровье</button>
    <button class="nav-btn" onclick="window.location.href='/dashboard-energy'"><span class="icon">⛽</span>Энергетика</button>
    <button class="nav-btn" onclick="window.location.href='/dashboard-transport'"><span class="icon">🚛</span>Транспорт</button>
    <button class="nav-btn" onclick="window.location.href='/dashboard-regions'"><span class="icon">🌏</span>Регионы</button>
    <button class="nav-btn active" onclick="window.location.href='/layers'"><span class="icon">🗺️</span>Слои</button>
</nav>

<main class="main-content">
    <div id="page-content">
        <h1 class="page-title">🗺️ Управление слоями карты</h1>
        <p class="page-subtitle">Включайте и выключайте слои, смотрите их статус и количество данных</p>

        <div>
            <span class="stat-badge" id="totalLayers">Загрузка...</span>
            <span class="stat-badge" id="activeLayers">Активных: --</span>
            <span class="stat-badge" id="inactiveLayers">Неактивных: --</span>
        </div>

        <div class="layers-grid" id="layersGrid">
            <p style="color:#8892b0;">Загрузка слоёв...</p>
        </div>
    </div>
</main>

<script>
// ============================================================
// 1. ЯЗЫК
// ============================================================
let currentLang = localStorage.getItem('crucix-lang') || 'ru';

function switchLang(lang) {
    currentLang = lang;
    localStorage.setItem('crucix-lang', lang);
    document.querySelectorAll('.lang-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.lang === lang);
    });
    showNotification('🌐 Язык: ' + lang.toUpperCase());
}

document.querySelectorAll('.lang-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.lang === currentLang);
});

// ============================================================
// 2. УВЕДОМЛЕНИЯ
// ============================================================
function showNotification(msg) {
    document.querySelectorAll('.notification').forEach(el => el.remove());
    const el = document.createElement('div');
    el.className = 'notification';
    el.textContent = msg;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 2500);
}

function openHelp() {
    alert('🗺️ Управление слоями карты\n\nВключайте и выключайте слои.\nСлои с данными отображаются на карте.\nAPI: /api/layers');
}

// ============================================================
// 3. ЗАГРУЗКА СЛОЁВ
// ============================================================
async function loadLayers() {
    try {
        const response = await fetch('/api/layers');
        const data = await response.json();

        if (data.success && data.layers) {
            renderLayers(data.layers);
            updateStats(data.layers);
        } else {
            document.getElementById('layersGrid').innerHTML = '<p style="color:#ff0044;">Ошибка загрузки слоёв</p>';
        }
    } catch (error) {
        console.error('Ошибка:', error);
        document.getElementById('layersGrid').innerHTML = '<p style="color:#ff0044;">Ошибка подключения к серверу</p>';
    }
}

function renderLayers(layers) {
    const grid = document.getElementById('layersGrid');
    grid.innerHTML = '';

    for (const layer of layers) {
        const card = document.createElement('div');
        card.className = 'layer-card';
        card.innerHTML = `
            <div class="header">
                <span class="name">${layer.icon || '📍'} ${layer.name}</span>
                <span class="status ${layer.enabled ? 'active' : 'inactive'}">${layer.enabled ? 'Вкл' : 'Выкл'}</span>
            </div>
            <div class="meta">Категория: ${layer.category || 'general'}</div>
            <div class="meta">Данных: ${layer.dataCount || 0} записей</div>
            <div class="meta">Тип: ${layer.type || 'point'}</div>
            <button class="toggle-btn" data-id="${layer.id}" data-enabled="${layer.enabled}">
                ${layer.enabled ? '🔴 Выключить' : '🟢 Включить'}
            </button>
        `;
        grid.appendChild(card);
    }

    // Обработчики для кнопок
    document.querySelectorAll('.toggle-btn').forEach(btn => {
        btn.addEventListener('click', async function() {
            const id = this.dataset.id;
            const current = this.dataset.enabled === 'true';
            const newState = !current;

            try {
                const response = await fetch(`/api/layers/toggle/${id}?enabled=${newState}`, {
                    method: 'POST'
                });
                const data = await response.json();

                if (data.success) {
                    showNotification(`Слой "${id}" ${newState ? 'включён' : 'выключен'}`);
                    loadLayers(); // Перезагружаем список
                } else {
                    showNotification('Ошибка: ' + (data.error || 'неизвестная'));
                }
            } catch (error) {
                showNotification('Ошибка сети');
            }
        });
    });
}

function updateStats(layers) {
    document.getElementById('totalLayers').textContent = `Всего: ${layers.length}`;
    const active = layers.filter(l => l.enabled).length;
    const inactive = layers.filter(l => !l.enabled).length;
    document.getElementById('activeLayers').textContent = `Активных: ${active}`;
    document.getElementById('inactiveLayers').textContent = `Неактивных: ${inactive}`;
}

// ============================================================
// 4. ЗАПУСК
// ============================================================
document.addEventListener('DOMContentLoaded', loadLayers);
</script>
</body>
</html>
