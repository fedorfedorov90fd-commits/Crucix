<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Диагностика — Crucix</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{background:#0a0a0f;color:#c8d0d8;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',monospace;font-size:13px;line-height:1.5;min-height:100vh}
    .topbar{position:fixed;top:0;left:0;right:0;height:60px;background:rgba(10,10,20,0.92);backdrop-filter:blur(12px);border-bottom:1px solid rgba(255,255,255,0.04);z-index:100;display:flex;justify-content:space-between;align-items:center;padding:0 20px}
    .topbar-brand{font-size:14px;font-weight:700;color:#5bc0f8;text-transform:uppercase;letter-spacing:2px}
    .topbar-status{font-size:11px;color:#ffd700}
    .topbar-right{display:flex;align-items:center;gap:6px}
    .topbar-btn{height:28px;padding:0 12px;border:1px solid rgba(255,255,255,0.08);border-radius:4px;background:rgba(255,255,255,0.03);color:#888;font-size:11px;font-weight:500;text-transform:uppercase;cursor:pointer;transition:all 0.2s;display:flex;align-items:center;gap:4px}
    .topbar-btn:hover{background:rgba(255,255,255,0.06);transform:translateY(-1px)}
    .btn-home{color:#5bc0f8;border-color:rgba(91,192,248,0.2);background:rgba(91,192,248,0.06)}
    .btn-home:hover{background:rgba(91,192,248,0.15)}
    .btn-copy{color:#5bc0f8;border-color:rgba(91,192,248,0.15);background:rgba(91,192,248,0.06)}
    .btn-copy:hover{background:rgba(91,192,248,0.15)}
    .btn-help{color:#8b5cf6;border-color:rgba(139,92,246,0.2);background:rgba(139,92,246,0.06)}
    .btn-help:hover{background:rgba(139,92,246,0.15)}
    .btn-grid{color:#9c27b0;border-color:rgba(156,39,176,0.15);background:rgba(156,39,176,0.06)}
    .btn-grid:hover{background:rgba(156,39,176,0.15)}
    .topbar-time{font-size:11px;color:#666}
    .main-content{padding-top:76px;max-width:1400px;margin:0 auto;padding:76px 20px 40px}
    .page-title{font-size:28px;font-weight:700;color:#e8f0f8;margin-bottom:8px}
    .page-subtitle{color:#666;font-size:14px;margin-bottom:24px}
    .stats-row{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:16px}
    .stat-item{background:rgba(10,10,20,0.5);border:1px solid rgba(255,255,255,0.03);border-radius:6px;padding:8px 14px;min-width:100px}
    .stat-item .stat-label{font-size:10px;font-weight:500;text-transform:uppercase;color:#666;letter-spacing:0.5px}
    .stat-item .stat-value{font-size:18px;font-weight:700;color:#5bc0f8;margin-top:2px}
    .stat-value.green{color:#4caf50}
    .stat-value.red{color:#ef4444}
    .stat-value.orange{color:#f97316}
    .stat-value.purple{color:#8b5cf6}
    .controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:12px 16px;background:rgba(255,255,255,0.03);border-radius:6px;margin-bottom:16px}
    .controls .btn{padding:6px 14px;border:none;border-radius:4px;cursor:pointer;font-size:13px;transition:all 0.2s}
    .controls .btn:hover{transform:translateY(-1px);opacity:0.9}
    .controls .btn-primary{background:#2196f3;color:#fff}
    .controls .btn-secondary{background:#444;color:#fff}
    .controls .status-label{margin-left:auto;padding:4px 12px;border-radius:4px;font-size:12px;background:rgba(255,255,255,0.05);color:#888}
    .controls .status-label.running{color:#ffd700;border:1px solid rgba(255,215,0,0.3)}
    .pages-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin-bottom:16px}
    .page-card{background:rgba(10,10,20,0.5);border:1px solid rgba(255,255,255,0.04);border-radius:8px;padding:12px 14px;border-left:4px solid #6b7280}
    .page-card .header{display:flex;justify-content:space-between;align-items:center}
    .page-card .name{font-size:13px;font-weight:600;color:#e8f0f8}
    .page-card .status{font-size:11px;padding:2px 10px;border-radius:10px}
    .page-card .status.online{background:rgba(76,175,80,0.15);color:#4caf50}
    .page-card .status.offline{background:rgba(239,68,68,0.15);color:#ef4444}
    .page-card .status.error{background:rgba(249,115,22,0.15);color:#f97316}
    .page-card .meta{font-size:11px;color:#666;margin-top:4px}
    .page-card .controls-card{display:flex;gap:4px;margin-top:6px}
    .page-card .controls-card button{padding:2px 10px;border:none;border-radius:3px;font-size:10px;cursor:pointer;transition:all 0.2s}
    .page-card .controls-card .btn-toggle{background:rgba(255,255,255,0.08);color:#888}
    .page-card .controls-card .btn-toggle:hover{background:rgba(255,255,255,0.15)}
    .page-card .controls-card .btn-toggle.enabled{background:rgba(76,175,80,0.2);color:#4caf50}
    .page-card .controls-card .btn-toggle.disabled{background:rgba(239,68,68,0.15);color:#ef4444}
    .page-card .controls-card .btn-block{background:rgba(239,68,68,0.1);color:#ef4444}
    .page-card .controls-card .btn-block:hover{background:rgba(239,68,68,0.2)}
    .page-card .controls-card .btn-help-card{background:rgba(139,92,246,0.1);color:#8b5cf6}
    .page-card .controls-card .btn-help-card:hover{background:rgba(139,92,246,0.2)}
    .trust-badge{font-size:9px;padding:1px 8px;border-radius:8px;font-weight:600}
    .trust-badge.core{background:rgba(91,192,248,0.15);color:#5bc0f8}
    .trust-badge.trusted{background:rgba(76,175,80,0.15);color:#4caf50}
    .trust-badge.user{background:rgba(249,115,22,0.15);color:#f97316}
    .trust-badge.blocked{background:rgba(239,68,68,0.15);color:#ef4444}
    .loading{color:#666;text-align:center;padding:20px}
    #coordinate-grid{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:99999;background-image:linear-gradient(rgba(255,255,255,0.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,0.03) 1px,transparent 1px);background-size:50px 50px;display:none}
    #coordinate-grid.visible{display:block}
    #grid-coords{position:fixed;bottom:12px;right:12px;background:rgba(0,0,0,0.7);color:#00ff00;font-family:monospace;font-size:11px;padding:4px 10px;border-radius:4px;z-index:100000;pointer-events:none;display:none}
    #grid-coords.visible{display:block}
    .notification{position:fixed;bottom:60px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.85);color:#fff;padding:8px 20px;border-radius:6px;font-size:13px;z-index:100001;border:1px solid rgba(255,255,255,0.1);animation:notif-fade 2.5s forwards}
    @keyframes notif-fade{0%{opacity:0;transform:translateX(-50%) translateY(10px)}10%{opacity:1;transform:translateX(-50%) translateY(0)}80%{opacity:1}100%{opacity:0;transform:translateX(-50%) translateY(-20px)}}
    @media(max-width:768px){.topbar{padding:0 12px;height:52px}.topbar-brand{font-size:12px}.topbar-status{display:none}.topbar-btn{font-size:10px;padding:0 8px;height:24px}.main-content{padding-top:68px;padding-left:12px;padding-right:12px}.page-title{font-size:22px}.pages-grid{grid-template-columns:1fr}}
  </style>
</head>
<body>

<header class="topbar">
  <div class="topbar-left">
    <span class="topbar-brand">⚡ CRUCIX MONITOR</span>
    <span class="topbar-status">ДИАГНОСТИКА</span>
  </div>
  <div class="topbar-right">
    <span class="topbar-time" id="topbar-date"></span>
    <button class="topbar-btn btn-home" onclick="window.location.href='/jarvis'">← НА ГЛАВНУЮ</button>
    <button class="topbar-btn btn-copy" id="copy-btn">📋 КОПИРОВАТЬ</button>
    <button class="topbar-btn btn-help" onclick="showHelp()">❓ HELP</button>
    <button class="topbar-btn btn-grid" id="grid-toggle">📐 СЕТКА</button>
  </div>
</header>

<main class="main-content">
  <h1 class="page-title">🩺 Центр управления — Диагностика</h1>
  <p class="page-subtitle">Мониторинг всех страниц, API, модулей и система доверия</p>

  <div class="stats-row" id="stats-row">
    <div class="stat-item"><div class="stat-label">Всего страниц</div><div class="stat-value blue" id="stat-total">—</div></div>
    <div class="stat-item"><div class="stat-label">✅ Онлайн</div><div class="stat-value green" id="stat-online">—</div></div>
    <div class="stat-item"><div class="stat-label">❌ Офлайн</div><div class="stat-value red" id="stat-offline">—</div></div>
    <div class="stat-item"><div class="stat-label">🔵 Ядро</div><div class="stat-value blue" id="stat-core">—</div></div>
    <div class="stat-item"><div class="stat-label">🟢 Проверенные</div><div class="stat-value green" id="stat-trusted">—</div></div>
    <div class="stat-item"><div class="stat-label">🔴 Заблокированы</div><div class="stat-value red" id="stat-blocked">—</div></div>
  </div>

  <div class="controls">
    <button class="btn btn-primary" id="btn-check">🔄 Проверить все страницы</button>
    <button class="btn btn-secondary" id="btn-refresh">🔄 Обновить</button>
    <span class="status-label" id="status-label">⏹ Готов</span>
  </div>

  <div class="pages-grid" id="pages-grid">
    <div class="loading">⏳ Загрузка данных...</div>
  </div>
</main>

<div id="coordinate-grid"></div>
<div id="grid-coords">X: 0  Y: 0</div>

<script src="/js/help.js"></script>
<script>
let pagesData = [];

function updateTime() {
  const now = new Date();
  document.getElementById('topbar-date').textContent =
    now.toLocaleDateString('ru-RU', { month: 'short', day: 'numeric', year: 'numeric' }).toUpperCase() +
    ' ' + now.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
}
updateTime();
setInterval(updateTime, 60000);

let gridVisible = false;
document.addEventListener('keydown', function(e) {
  if (e.ctrlKey && e.shiftKey && e.key === 'G') { e.preventDefault(); toggleGrid(); }
});
document.getElementById('grid-toggle').addEventListener('click', toggleGrid);

function toggleGrid() {
  gridVisible = !gridVisible;
  document.getElementById('coordinate-grid').classList.toggle('visible', gridVisible);
  document.getElementById('grid-coords').classList.toggle('visible', gridVisible);
  document.getElementById('grid-toggle').classList.toggle('active', gridVisible);
  if (gridVisible) {
    document.addEventListener('mousemove', function(e) {
      document.getElementById('grid-coords').textContent = 'X: ' + e.clientX + '  Y: ' + e.clientY;
    });
  }
}

async function loadPages() {
  const label = document.getElementById('status-label');
  label.textContent = '⏳ Проверка...';
  label.className = 'status-label running';

  try {
    const resp = await fetch('/api/diagnostics/pages');
    const data = await resp.json();
    if (data.success) {
      pagesData = data.pages;
      renderPages(pagesData);
      renderStats(pagesData);
      label.textContent = '✅ Готово';
      label.className = 'status-label';
    } else {
      showNotif('❌ Ошибка загрузки');
    }
  } catch (e) {
    showNotif('❌ Ошибка: ' + e.message);
    label.textContent = '❌ Ошибка';
    label.className = 'status-label';
  }
}

function renderPages(pages) {
  const container = document.getElementById('pages-grid');
  if (!pages || pages.length === 0) {
    container.innerHTML = '<div class="loading">Нет данных</div>';
    return;
  }

  let html = '';
  for (const p of pages) {
    const statusClass = p.status === 'online' ? 'online' : (p.status === 'error' ? 'error' : 'offline');
    const statusText = p.status === 'online' ? '🟢 Онлайн' : (p.status === 'error' ? '🟡 Ошибка' : '🔴 Офлайн');
    const timeText = p.time !== null ? p.time + 'ms' : '—';
    const enabled = p.enabled !== false;
    const trustLabel = p.label || 'Неизвестно';
    const trustClass = p.trust || 'user';

    html += `
      <div class="page-card" style="border-left-color: ${p.color || '#6b7280'}">
        <div class="header">
          <span class="name">/${p.page}</span>
          <span class="status ${statusClass}">${statusText}</span>
        </div>
        <div class="meta">
          <span>⏱ ${timeText}</span>
          <span style="margin-left:8px;">🔒 <span class="trust-badge ${trustClass}">${trustLabel}</span></span>
          <span style="margin-left:8px;">${enabled ? '✅ Вкл' : '⛔ Выкл'}</span>
        </div>
        <div class="controls-card">
          <button class="btn-toggle ${enabled ? 'enabled' : 'disabled'}" onclick="toggleModule('${p.page}')">
            ${enabled ? '🔌 Выключить' : '🔌 Включить'}
          </button>
          <button class="btn-block" onclick="blockModule('${p.page}')">🚫 Заблокировать</button>
          <button class="btn-help-card" onclick="showHelpPage('${p.page}')">❓</button>
        </div>
      </div>
    `;
  }
  container.innerHTML = html;
}

function renderStats(pages) {
  const total = pages.length;
  const online = pages.filter(p => p.status === 'online').length;
  const offline = pages.filter(p => p.status === 'offline').length;
  const core = pages.filter(p => p.trust === 'core').length;
  const trusted = pages.filter(p => p.trust === 'trusted').length;
  const blocked = pages.filter(p => p.trust === 'blocked').length;

  document.getElementById('stat-total').textContent = total;
  document.getElementById('stat-online').textContent = online;
  document.getElementById('stat-offline').textContent = offline;
  document.getElementById('stat-core').textContent = core;
  document.getElementById('stat-trusted').textContent = trusted;
  document.getElementById('stat-blocked').textContent = blocked;
}

async function toggleModule(page) {
  const card = document.querySelector(`.page-card .name:contains("/${page}")`)?.closest('.page-card');
  const current = pagesData.find(p => p.page === page);
  if (!current) return;

  const newEnabled = !current.enabled;
  try {
    const resp = await fetch('/api/diagnostics/toggle', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ page, enabled: newEnabled })
    });
    const data = await resp.json();
    if (data.success) {
      current.enabled = newEnabled;
      loadPages();
      showNotif(`✅ ${page} ${newEnabled ? 'включена' : 'выключена'}`);
    }
  } catch (e) {
    showNotif('❌ Ошибка: ' + e.message);
  }
}

async function blockModule(page) {
  if (!confirm(`🚫 Заблокировать модуль /${page}?\nЭто отключит его и добавит в чёрный список.`)) return;

  try {
    const resp = await fetch('/api/diagnostics/block', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ page })
    });
    const data = await resp.json();
    if (data.success) {
      loadPages();
      showNotif(`🚫 ${page} заблокирован`);
    }
  } catch (e) {
    showNotif('❌ Ошибка: ' + e.message);
  }
}

function showHelpPage(page) {
  window.location.href = `/${page}`;
  setTimeout(() => { showHelp(); }, 500);
}

document.getElementById('copy-btn').addEventListener('click', function() {
  let text = '=== CRUCIX — ДИАГНОСТИКА ===\n';
  text += 'Дата: ' + new Date().toLocaleString() + '\n\n';
  text += '--- СТАТИСТИКА ---\n';
  text += 'Всего: ' + document.getElementById('stat-total').textContent + '\n';
  text += 'Онлайн: ' + document.getElementById('stat-online').textContent + '\n';
  text += 'Офлайн: ' + document.getElementById('stat-offline').textContent + '\n';
  text += 'Ядро: ' + document.getElementById('stat-core').textContent + '\n';
  text += 'Проверенные: ' + document.getElementById('stat-trusted').textContent + '\n';
  text += 'Заблокированы: ' + document.getElementById('stat-blocked').textContent + '\n\n';
  text += '--- СТРАНИЦЫ ---\n';
  document.querySelectorAll('.page-card').forEach(function(card) {
    const name = card.querySelector('.name')?.textContent || '—';
    const status = card.querySelector('.status')?.textContent || '—';
    text += name + '  ' + status + '\n';
  });
  text += '\n--- CRUCIX OSINT TERMINAL ---\n';
  text += '🌐 http://localhost:3117\n';

  navigator.clipboard.writeText(text).then(function() {
    showNotif('✅ Данные скопированы');
  }).catch(function() {
    const area = document.createElement('textarea');
    area.value = text;
    document.body.appendChild(area);
    area.select();
    document.execCommand('copy');
    document.body.removeChild(area);
    showNotif('✅ Данные скопированы');
  });
});

function showNotif(msg) {
  document.querySelectorAll('.notification').forEach(function(el) { el.remove(); });
  const el = document.createElement('div');
  el.className = 'notification';
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(function() { el.remove(); }, 2500);
}

document.addEventListener('DOMContentLoaded', function() {
  document.getElementById('btn-check').addEventListener('click', loadPages);
  document.getElementById('btn-refresh').addEventListener('click', loadPages);
  loadPages();
});
</script>
</body>
</html>
