<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crucix · Plugin Manager</title>
<link rel="manifest" href="/pwa/manifest.json">
<meta name="theme-color" content="#3b82f6">
<style>
:root {
  --bg: #06080f;
  --surface: #0d1220;
  --surface2: #161d2e;
  --surface3: #1f2842;
  --border: #1a2540;
  --border2: #2b3a5c;
  --text: #e8edf5;
  --text-dim: #8fa1c2;
  --text-faint: #5a6b8a;
  --accent: #3b82f6;
  --accent2: #8b5cf6;
  --green: #22c55e;
  --yellow: #eab308;
  --orange: #f97316;
  --red: #ef4444;
  --mono: 'SF Mono', 'Cascadia Code', monospace;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, 'Segoe UI', sans-serif;
  background: var(--bg);
  color: var(--text);
  padding: 24px;
  min-height: 100vh;
  font-size: 14px;
  line-height: 1.5;
}
.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 16px 24px;
  background: linear-gradient(90deg, var(--surface), rgba(59,130,246,0.08));
  border: 1px solid var(--border);
  border-radius: 14px;
  margin-bottom: 24px;
  flex-wrap: wrap;
  gap: 16px;
}
.header h1 {
  font-size: 22px;
  font-weight: 800;
  letter-spacing: -0.5px;
}
.header h1 span { color: var(--text-dim); font-weight: 400; font-size: 14px; }
.header-actions { display: flex; gap: 10px; }
.btn {
  padding: 8px 16px;
  border-radius: 8px;
  border: none;
  font-weight: 600;
  font-size: 13px;
  cursor: pointer;
  transition: all 0.2s;
  font-family: inherit;
}
.btn-primary { background: var(--accent); color: white; }
.btn-primary:hover { background: #2563eb; }
.btn-secondary {
  background: var(--surface2);
  color: var(--text);
  border: 1px solid var(--border2);
}
.btn-secondary:hover { background: var(--surface3); }
.btn-danger { background: var(--red); color: white; }
.btn-danger:hover { background: #dc2626; }
.btn-small { padding: 5px 10px; font-size: 11px; }
.tabs {
  display: flex;
  gap: 8px;
  margin-bottom: 20px;
  border-bottom: 1px solid var(--border);
}
.tab {
  padding: 10px 20px;
  cursor: pointer;
  color: var(--text-dim);
  font-weight: 600;
  font-size: 13px;
  border-bottom: 2px solid transparent;
  transition: all 0.2s;
}
.tab:hover { color: var(--text); }
.tab.active { color: var(--accent); border-bottom-color: var(--accent); }
.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 12px;
  margin-bottom: 24px;
}
.stat-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 16px;
}
.stat-value {
  font-family: var(--mono);
  font-size: 26px;
  font-weight: 800;
  color: var(--accent);
  letter-spacing: -1px;
}
.stat-label {
  font-size: 11px;
  color: var(--text-faint);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-top: 4px;
}
.plugins-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
  background: var(--surface);
  border-radius: 12px;
  overflow: hidden;
  border: 1px solid var(--border);
}
.plugins-table th {
  text-align: left;
  padding: 14px 16px;
  color: var(--text-faint);
  font-weight: 600;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  background: var(--surface2);
  border-bottom: 1px solid var(--border2);
}
.plugins-table td {
  padding: 14px 16px;
  border-bottom: 1px solid var(--border);
  vertical-align: middle;
}
.plugins-table tr:last-child td { border-bottom: none; }
.plugins-table tr:hover td { background: var(--surface2); }
.plugin-name {
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 8px;
}
.plugin-icon { font-size: 18px; }
.plugin-version {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--text-faint);
}
.plugin-desc {
  color: var(--text-dim);
  font-size: 12px;
  max-width: 300px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.plugin-tags { display: flex; gap: 4px; flex-wrap: wrap; }
.tag {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 4px;
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.3px;
}
.tag-signal { background: rgba(59,130,246,0.2); color: #60a5fa; }
.tag-notifier { background: rgba(139,92,246,0.2); color: #a78bfa; }
.tag-fetcher { background: rgba(34,197,94,0.2); color: #4ade80; }
.tag-analyzer { background: rgba(234,179,8,0.2); color: #facc15; }
.tag-full { background: rgba(236,72,153,0.2); color: #f472b6; }
.tag-official { background: rgba(34,197,94,0.3); color: #22c55e; }
.toggle {
  position: relative;
  display: inline-block;
  width: 40px;
  height: 22px;
  cursor: pointer;
}
.toggle input { opacity: 0; width: 0; height: 0; }
.toggle-slider {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  background: var(--surface3);
  border-radius: 22px;
  transition: 0.3s;
}
.toggle-slider:before {
  content: '';
  position: absolute;
  height: 16px;
  width: 16px;
  left: 3px;
  bottom: 3px;
  background: white;
  border-radius: 50%;
  transition: 0.3s;
}
.toggle input:checked + .toggle-slider { background: var(--green); }
.toggle input:checked + .toggle-slider:before { transform: translateX(18px); }
.status-badge {
  display: inline-block;
  padding: 3px 8px;
  border-radius: 4px;
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
}
.status-enabled { background: rgba(34,197,94,0.15); color: var(--green); }
.status-disabled { background: rgba(100,116,139,0.15); color: var(--text-faint); }
.actions { display: flex; gap: 6px; }
.modal-overlay {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.7);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 1000;
  padding: 20px;
}
.modal-overlay.active { display: flex; }
.modal {
  background: var(--surface);
  border: 1px solid var(--border2);
  border-radius: 16px;
  width: 100%;
  max-width: 640px;
  max-height: 90vh;
  overflow-y: auto;
  padding: 24px;
}
.modal-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  padding-bottom: 16px;
  border-bottom: 1px solid var(--border);
}
.modal-title { font-size: 20px; font-weight: 800; }
.modal-close {
  background: none;
  border: none;
  color: var(--text-dim);
  font-size: 24px;
  cursor: pointer;
  line-height: 1;
}
.config-editor {
  background: var(--bg);
  border: 1px solid var(--border2);
  border-radius: 8px;
  padding: 16px;
  font-family: var(--mono);
  font-size: 13px;
  color: var(--text);
  width: 100%;
  min-height: 300px;
  resize: vertical;
  line-height: 1.6;
}
.modal-actions {
  display: flex;
  gap: 10px;
  justify-content: flex-end;
  margin-top: 20px;
  padding-top: 16px;
  border-top: 1px solid var(--border);
}
.loading {
  text-align: center;
  padding: 60px 20px;
  color: var(--text-faint);
}
.spinner {
  width: 40px;
  height: 40px;
  margin: 0 auto 16px;
  border: 3px solid var(--border2);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 1s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.empty {
  text-align: center;
  padding: 60px 20px;
  color: var(--text-faint);
}
.empty-icon { font-size: 48px; opacity: 0.3; margin-bottom: 16px; }
.toast {
  position: fixed;
  bottom: 20px;
  right: 20px;
  background: var(--surface2);
  border: 1px solid var(--border2);
  border-left: 4px solid var(--accent);
  padding: 12px 20px;
  border-radius: 8px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.4);
  z-index: 2000;
  font-size: 13px;
  max-width: 400px;
  animation: slideIn 0.3s ease;
}
@keyframes slideIn {
  from { transform: translateX(100%); opacity: 0; }
  to { transform: translateX(0); opacity: 1; }
}
.toast.success { border-left-color: var(--green); }
.toast.error { border-left-color: var(--red); }
</style>
</head>
<body>

<div class="header">
  <h1>Crucix <span>· Plugin Manager</span></h1>
  <div class="header-actions">
    <button class="btn btn-secondary" onclick="reloadAll()">Reload All</button>
    <button class="btn btn-primary" onclick="showAvailable()">+ Install New</button>
  </div>
</div>

<div class="stats-grid">
  <div class="stat-card">
    <div class="stat-value" id="stat-installed">—</div>
    <div class="stat-label">Installed</div>
  </div>
  <div class="stat-card">
    <div class="stat-value" id="stat-enabled">—</div>
    <div class="stat-label">Enabled</div>
  </div>
  <div class="stat-card">
    <div class="stat-value" id="stat-hooks">—</div>
    <div class="stat-label">Active Hooks</div>
  </div>
  <div class="stat-card">
    <div class="stat-value" id="stat-available">—</div>
    <div class="stat-label">Available</div>
  </div>
</div>

<div class="tabs">
  <div class="tab active" data-tab="installed" onclick="switchTab('installed')">Installed</div>
  <div class="tab" data-tab="available" onclick="switchTab('available')">Available</div>
</div>

<div id="content">
  <div class="loading">
    <div class="spinner"></div>
    Loading plugins...
  </div>
</div>

<div class="modal-overlay" id="config-modal">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title" id="modal-title">Plugin Config</div>
      <button class="modal-close" onclick="closeModal()">×</button>
    </div>
    <div id="modal-content"></div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveConfig()">Save</button>
    </div>
  </div>
</div>

<script>
let currentTab = 'installed';
let currentPlugin = null;
let data = { installed: [], available: [], status: {} };

async function load() {
  try {
    const res = await fetch('/api/plugins');
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    data = await res.json();
    render();
  } catch (e) {
    document.getElementById('content').innerHTML = `
      <div class="empty">
        <div class="empty-icon">Error</div>
        <div>Error loading plugins: ${e.message}</div>
        <button class="btn btn-primary" style="margin-top: 16px;" onclick="load()">Retry</button>
      </div>
    `;
  }
}

function render() {
  renderStats();
  renderContent();
}

function renderStats() {
  document.getElementById('stat-installed').textContent = data.installed?.length || 0;
  document.getElementById('stat-enabled').textContent = (data.installed || []).filter(p => p.enabled).length;
  document.getElementById('stat-hooks').textContent = Object.keys(data.status?.hooks?.hooks || {}).length;
  document.getElementById('stat-available').textContent = (data.available || []).filter(p => !p.isInstalled).length;
}

function renderContent() {
  if (currentTab === 'installed') renderInstalled();
  else renderAvailable();
}

function renderInstalled() {
  const plugins = data.installed || [];
  if (plugins.length === 0) {
    document.getElementById('content').innerHTML = `
      <div class="empty">
        <div class="empty-icon">Empty</div>
        <div>Нет установленных плагинов</div>
        <button class="btn btn-primary" style="margin-top: 16px;" onclick="switchTab('available')">Browse Available</button>
      </div>
    `;
    return;
  }
  const html = `
    <table class="plugins-table">
      <thead><tr>
        <th>Plugin</th><th>Type</th><th>Hooks</th><th>Status</th><th>Enabled</th><th>Actions</th>
      </tr></thead>
      <tbody>${plugins.map(p => renderPluginRow(p)).join('')}</tbody>
    </table>
  `;
  document.getElementById('content').innerHTML = html;
}

function renderPluginRow(p) {
  return `
    <tr>
      <td><div class="plugin-name">
        <span class="plugin-icon">${getPluginIcon(p.type)}</span>
        <div><div>${p.name}</div><div class="plugin-version">v${p.version}</div></div>
      </div></td>
      <td><span class="tag tag-${p.type}">${p.type}</span></td>
      <td><div class="plugin-tags">
        ${(p.hooks || []).slice(0, 3).map(h => `<span class="tag" style="background: var(--surface3); color: var(--text-dim);">${h}</span>`).join('')}
      </div></td>
      <td><span class="status-badge ${p.enabled ? 'status-enabled' : 'status-disabled'}">${p.enabled ? 'Active' : 'Disabled'}</span></td>
      <td>
        <label class="toggle">
          <input type="checkbox" ${p.enabled ? 'checked' : ''} onchange="togglePlugin('${p.name}', this.checked)">
          <span class="toggle-slider"></span>
        </label>
      </td>
      <td><div class="actions">
        <button class="btn btn-secondary btn-small" onclick="openConfig('${p.name}')">Cfg</button>
        <button class="btn btn-secondary btn-small" onclick="showLogs('${p.name}')">Log</button>
        <button class="btn btn-danger btn-small" onclick="uninstall('${p.name}')">Del</button>
      </div></td>
    </tr>
  `;
}

function renderAvailable() {
  const plugins = (data.available || []).filter(p => !p.isInstalled);
  if (plugins.length === 0) {
    document.getElementById('content').innerHTML = `<div class="empty"><div class="empty-icon">OK</div><div>Все доступные плагины установлены</div></div>`;
    return;
  }
  const html = `
    <table class="plugins-table">
      <thead><tr><th>Plugin</th><th>Type</th><th>Description</th><th>Author</th><th>Actions</th></tr></thead>
      <tbody>${plugins.map(p => `
        <tr>
          <td><div class="plugin-name">
            <span class="plugin-icon">${getPluginIcon(p.type)}</span>
            <div><div>${p.name}</div>${p.official ? '<span class="tag tag-official">OFFICIAL</span>' : ''}</div>
          </div></td>
          <td><span class="tag tag-${p.type}">${p.type}</span></td>
          <td class="plugin-desc" title="${p.description}">${p.description}</td>
          <td style="color: var(--text-dim); font-size: 12px;">${p.author}</td>
          <td><button class="btn btn-primary btn-small" onclick="install('${p.name}')">Install</button></td>
        </tr>
      `).join('')}</tbody>
    </table>
  `;
  document.getElementById('content').innerHTML = html;
}

function getPluginIcon(type) {
  return { signal: 'Sig', notifier: 'Not', fetcher: 'Fet', analyzer: 'Ana', full: 'Full' }[type] || 'Plg';
}

async function install(name) {
  toast(`Installing ${name}...`, 'info');
  try {
    const res = await fetch(`/api/plugins/${name}/install`, { method: 'POST' });
    const result = await res.json();
    if (result.ok) { toast(`Installed ${name}`, 'success'); await load(); }
    else toast(`Failed: ${result.error || 'unknown'}`, 'error');
  } catch (e) { toast(`Error: ${e.message}`, 'error'); }
}

async function uninstall(name) {
  if (!confirm(`Uninstall ${name}?`)) return;
  try {
    const res = await fetch(`/api/plugins/${name}`, { method: 'DELETE' });
    const result = await res.json();
    if (result.ok) { toast(`Uninstalled ${name}`, 'success'); await load(); }
    else toast(`Failed: ${result.error}`, 'error');
  } catch (e) { toast(`Error: ${e.message}`, 'error'); }
}

async function togglePlugin(name, enabled) {
  const action = enabled ? 'enable' : 'disable';
  try {
    const res = await fetch(`/api/plugins/${name}/${action}`, { method: 'POST' });
    const result = await res.json();
    if (result.ok) { toast(`${enabled ? 'Enabled' : 'Disabled'} ${name}`, 'success'); await load(); }
    else toast(`Failed: ${result.error}`, 'error');
  } catch (e) { toast(`Error: ${e.message}`, 'error'); }
}

async function reloadAll() {
  toast('Reloading all plugins...', 'info');
  try {
    const res = await fetch('/api/plugins/reload', { method: 'POST' });
    const result = await res.json();
    toast(`Reloaded ${result.reloaded} plugins`, 'success');
    await load();
  } catch (e) { toast(`Error: ${e.message}`, 'error'); }
}

async function openConfig(name) {
  currentPlugin = name;
  document.getElementById('modal-title').textContent = `${name} · Configuration`;
  try {
    const res = await fetch(`/api/plugins/${name}/config`);
    const config = await res.json();
    document.getElementById('modal-content').innerHTML = `
      <p style="color: var(--text-dim); font-size: 13px; margin-bottom: 12px;">Edit plugin configuration as JSON.</p>
      <textarea class="config-editor" id="config-editor">${JSON.stringify(config, null, 2)}</textarea>
    `;
    document.getElementById('config-modal').classList.add('active');
  } catch (e) { toast(`Error: ${e.message}`, 'error'); }
}

async function saveConfig() {
  if (!currentPlugin) return;
  try {
    const editor = document.getElementById('config-editor');
    const config = JSON.parse(editor.value);
    const res = await fetch(`/api/plugins/${currentPlugin}/config`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(config),
    });
    const result = await res.json();
    if (result.ok) { toast('Config saved', 'success'); closeModal(); await load(); }
    else toast(`Failed: ${result.error}`, 'error');
  } catch (e) { toast(`Invalid JSON: ${e.message}`, 'error'); }
}

function closeModal() {
  document.getElementById('config-modal').classList.remove('active');
  currentPlugin = null;
}

async function showLogs(name) {
  try {
    const res = await fetch(`/api/plugins/${name}/logs?limit=50`);
    const { lines, total } = await res.json();
    const content = lines.length > 0 ? lines.join('\n') : '(no logs)';
    document.getElementById('modal-title').textContent = `${name} · Logs (${total} lines)`;
    document.getElementById('modal-content').innerHTML = `
      <pre style="background: #000; color: #22c55e; padding: 16px; border-radius: 8px; font-family: var(--mono); font-size: 12px; max-height: 400px; overflow: auto; line-height: 1.5;">${escapeHtml(content)}</pre>
    `;
    document.getElementById('config-modal').classList.add('active');
    currentPlugin = null;
  } catch (e) { toast(`Error: ${e.message}`, 'error'); }
}

function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
  renderContent();
}

function showAvailable() { switchTab('available'); }

function escapeHtml(str) {
  return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function toast(message, type = 'info') {
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.textContent = message;
  document.body.appendChild(el);
  setTimeout(() => {
    el.style.animation = 'slideIn 0.3s ease reverse';
    setTimeout(() => el.remove(), 300);
  }, 3000);
}

load();
setInterval(load, 30000);
</script>

</body>
</html>
