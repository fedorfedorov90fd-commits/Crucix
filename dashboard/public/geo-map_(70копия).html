<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Геополитическая карта — Crucix</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet.heat.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
    </script>
    <script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet.heat.js">
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js">
    </script>
    <style>
        /* ===== RESET & BASE ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0a0a0f;
            color: #c8d0d8;
            font-family: -apple-system, 'Segoe UI', system-ui, sans-serif;
            font-size: 13px;
            line-height: 1.5;
            min-height: 100vh;
            overflow: hidden;
        }

        /* ===== ПЕРВЫЙ БЛОК: ТОПБАР ===== */
        .topbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: rgba(10, 10, 20, 0.95);
            backdrop-filter: blur(12px);
            border-bottom: 2px solid rgba(91, 192, 248, 0.25);
            box-shadow: 0 2px 20px rgba(91, 192, 248, 0.08);
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
        }
        .topbar::after {
            content: "";
            position: absolute;
            bottom: -2px;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, #5bc0f8, transparent);
            opacity: 0.6;
        }
        .topbar-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .topbar-brand {
            font-size: 14px;
            font-weight: 700;
            color: #5bc0f8;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .topbar-right {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }
        .topbar-btn {
            height: 28px;
            padding: 0 12px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 4px;
            background: rgba(255, 255, 255, 0.03);
            color: #888;
            font-size: 11px;
            font-weight: 500;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 4px;
            font-family: inherit;
        }
        .topbar-btn:hover {
            background: rgba(255, 255, 255, 0.06);
            transform: translateY(-1px);
        }
        .btn-home {
            color: #5bc0f8;
            border-color: rgba(91, 192, 248, 0.2);
            background: rgba(91, 192, 248, 0.06);
        }
        .btn-home:hover {
            background: rgba(91, 192, 248, 0.15);
        }
        .btn-copy {
            color: #5bc0f8;
            border-color: rgba(91, 192, 248, 0.15);
            background: rgba(91, 192, 248, 0.06);
        }
        .btn-copy:hover {
            background: rgba(91, 192, 248, 0.15);
        }
        .btn-copy.copied {
            background: rgba(76, 175, 80, 0.2);
            border-color: #4caf50;
            color: #4caf50;
        }
        .btn-rss {
            color: #f26522;
            border-color: rgba(242, 101, 34, 0.2);
            background: rgba(242, 101, 34, 0.06);
        }
        .btn-rss:hover {
            background: rgba(242, 101, 34, 0.15);
        }
        .btn-help {
            color: #a78bfa;
            border-color: rgba(167, 139, 250, 0.2);
            background: rgba(167, 139, 250, 0.06);
        }
        .btn-help:hover {
            background: rgba(167, 139, 250, 0.15);
        }
        .btn-heat {
            color: #44ccff;
            border-color: rgba(68, 204, 255, 0.15);
            background: rgba(68, 204, 255, 0.06);
        }
        .btn-heat:hover {
            background: rgba(68, 204, 255, 0.15);
        }
        .btn-heat.active {
            background: rgba(68, 204, 255, 0.2);
            border-color: #44ccff;
        }
        .btn-timeline {
            color: #ff6b6b;
            border-color: rgba(255, 107, 107, 0.15);
            background: rgba(255, 107, 107, 0.06);
        }
        .btn-timeline:hover {
            background: rgba(255, 107, 107, 0.15);
        }
        .btn-timeline.active {
            background: rgba(255, 107, 107, 0.2);
            border-color: #ff6b6b;
        }
        .btn-pdf {
            color: #ec4899;
            border-color: rgba(236, 72, 153, 0.15);
            background: rgba(236, 72, 153, 0.06);
        }
        .btn-pdf:hover {
            background: rgba(236, 72, 153, 0.15);
        }

        .lang-switch {
            display: flex;
            gap: 2px;
            padding: 2px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }
        .lang-btn {
            padding: 2px 8px;
            border: none;
            background: transparent;
            color: #666;
            font-size: 11px;
            font-weight: 500;
            cursor: pointer;
            border-radius: 3px;
            transition: all 0.2s;
            font-family: inherit;
        }
        .lang-btn:hover {
            color: #888;
            background: rgba(255, 255, 255, 0.05);
        }
        .lang-btn.active {
            color: #5bc0f8;
            background: rgba(91, 192, 248, 0.1);
        }

        /* ===== ВЫПАДАЮЩЕЕ МЕНЮ КОПИРОВАНИЯ ===== */
        .copy-dropdown {
            position: relative;
            display: inline-block;
        }
        .copy-dropdown-content {
            display: none;
            position: absolute;
            right: 0;
            top: 32px;
            background: #0a0a1a;
            min-width: 220px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
            z-index: 200;
            padding: 6px 0;
        }
        .copy-dropdown-content.show {
            display: block;
        }
        .copy-dropdown-content button {
            display: block;
            width: 100%;
            padding: 8px 16px;
            background: transparent;
            border: none;
            color: #c8d0d8;
            font-size: 12px;
            text-align: left;
            cursor: pointer;
            transition: all 0.15s;
            font-family: inherit;
        }
        .copy-dropdown-content button:hover {
            background: rgba(91, 192, 248, 0.08);
            color: #5bc0f8;
        }
        .copy-dropdown-content .divider {
            height: 1px;
            background: rgba(255, 255, 255, 0.05);
            margin: 4px 12px;
        }
        .copy-dropdown-content .label {
            padding: 4px 16px;
            font-size: 10px;
            color: #4a5a6a;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* ===== ВТОРОЙ БЛОК: НАВИГАЦИЯ ПО ДАШБОРДАМ ===== */
        .nav-dashboards {
            position: fixed;
            top: 60px;
            left: 0;
            right: 0;
            height: 38px;
            background: rgba(6, 10, 18, 0.92);
            backdrop-filter: blur(8px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            z-index: 99;
            display: flex;
            align-items: center;
            padding: 0 20px;
            gap: 4px;
            overflow-x: auto;
            scrollbar-width: none;
        }
        .nav-dashboards::-webkit-scrollbar {
            display: none;
        }
        .nav-btn {
            padding: 4px 10px;
            border: none;
            border-radius: 4px;
            background: transparent;
            color: #666;
            font-size: 10px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
            font-family: inherit;
            border: 1px solid transparent;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 3px;
        }
        .nav-btn:hover {
            color: #c8d0d8;
            background: rgba(255, 255, 255, 0.04);
        }
        .nav-btn.active {
            color: #5bc0f8;
            background: rgba(91, 192, 248, 0.08);
            border-color: rgba(91, 192, 248, 0.15);
        }
        .nav-btn .icon {
            margin-right: 3px;
        }

        /* ===== ТРЕТИЙ БЛОК: ПАНЕЛЬ СЛОЁВ (30 шт.) ===== */
        .layer-bar {
            position: fixed;
            top: 98px;
            left: 0;
            right: 0;
            height: auto;
            min-height: 40px;
            background: rgba(6, 10, 18, 0.88);
            backdrop-filter: blur(8px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            z-index: 98;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            padding: 4px 20px;
            gap: 4px;
            overflow: hidden;
        }
        .layer-bar-label {
            color: #4a5a6a;
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-right: 8px;
            flex-shrink: 0;
        }
        .layer-btn {
            padding: 3px 10px;
            border: none;
            border-radius: 4px;
            background: rgba(255, 255, 255, 0.04);
            color: #666;
            font-size: 10px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
            font-family: inherit;
            border: 1px solid transparent;
        }
        .layer-btn:hover {
            color: #c8d0d8;
            background: rgba(255, 255, 255, 0.08);
        }
        .layer-btn.active {
            color: #5bc0f8;
            background: rgba(91, 192, 248, 0.12);
            border-color: rgba(91, 192, 248, 0.2);
        }
        .layer-btn .dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 4px;
        }

        /* ===== КАРТА ===== */
        .map-container {
            padding-top: 224px;
            height: 100vh;
            width: 100%;
            position: relative;
        }
        #map {
            height: 100%;
            width: 100%;
            background: #0a0a0f;
        }

        /* ===== ЛЕГЕНДА ===== */
        .legend {
            position: absolute;
            bottom: 30px;
            left: 20px;
            z-index: 1000;
            background: rgba(10, 10, 30, 0.92);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 8px;
            padding: 12px 16px;
            font-size: 12px;
            backdrop-filter: blur(10px);
            color: #ccc;
            min-width: 140px;
            max-height: 260px;
            overflow-y: auto;
        }
        .legend .title {
            font-weight: 600;
            color: #fff;
            margin-bottom: 6px;
            font-size: 13px;
        }
        .legend .item {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 3px 0;
        }
        .legend .color-box {
            width: 20px;
            height: 14px;
            border-radius: 3px;
            display: inline-block;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .legend .color-box.critical {
            background: #ef4444;
        }
        .legend .color-box.pre-war {
            background: #f97316;
        }
        .legend .color-box.high {
            background: #f59e0b;
        }
        .legend .color-box.medium {
            background: #eab308;
        }
        .legend .color-box.low {
            background: #22c55e;
        }
        .legend .color-box.inactive {
            background: #3a3a4a;
        }
        .legend .color-box.marker {
            background: #3b82f6;
            border-radius: 50%;
            width: 12px;
            height: 12px;
        }
        .legend .color-box.heat {
            background: linear-gradient(90deg, #22c55e, #f59e0b, #ef4444);
            border-radius: 3px;
        }

        /* ===== СТАТИСТИКА ===== */
        .stats {
            position: absolute;
            top: 200px;
            right: 20px;
            z-index: 1000;
            background: rgba(10, 10, 30, 0.92);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 8px;
            padding: 12px 16px;
            backdrop-filter: blur(10px);
            min-width: 130px;
            color: #ccc;
            text-align: center;
        }
        .stats .count {
            font-size: 28px;
            font-weight: 700;
            color: #44ccff;
        }
        .stats .label {
            font-size: 11px;
            color: #888;
        }
        .stats .countries-count {
            font-size: 14px;
            color: #ffd700;
            margin-top: 4px;
        }

        /* ===== SSI ===== */
        .ssi-panel {
            position: absolute;
            bottom: 150px;
            right: 20px;
            z-index: 1000;
            background: rgba(10, 10, 30, 0.92);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 8px;
            padding: 12px 16px;
            backdrop-filter: blur(10px);
            min-width: 150px;
        }
        .ssi-panel .ssi-title {
            font-size: 11px;
            color: #888;
            margin-bottom: 4px;
        }
        .ssi-panel .ssi-bar {
            height: 8px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 4px;
            overflow: hidden;
        }
        .ssi-panel .ssi-fill {
            height: 100%;
            background: linear-gradient(90deg, #22c55e, #eab308, #f59e0b, #f97316, #ef4444);
            transition: width 1s ease;
            border-radius: 4px;
            width: 0%;
        }
        .ssi-panel .ssi-value {
            font-size: 18px;
            font-weight: 700;
            margin-top: 4px;
        }

        /* ===== ВРЕМЕННАЯ ШКАЛА ===== */
        .timeline-panel {
            position: absolute;
            bottom: 200px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            background: rgba(10, 10, 30, 0.92);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 8px;
            padding: 8px 16px;
            backdrop-filter: blur(10px);
            min-width: 300px;
            display: none;
            color: #ccc;
        }
        .timeline-panel.active {
            display: block;
        }
        .timeline-panel .timeline-title {
            font-size: 11px;
            color: #888;
            margin-bottom: 4px;
            text-align: center;
        }
        .timeline-panel .timeline-track {
            display: flex;
            gap: 2px;
            height: 20px;
            align-items: flex-end;
            padding: 2px 0;
        }
        .timeline-panel .timeline-bar {
            flex: 1;
            min-height: 2px;
            border-radius: 2px;
            transition: height 0.5s ease;
        }
        .timeline-panel .timeline-date {
            font-size: 10px;
            color: #666;
            text-align: center;
            margin-top: 4px;
        }

        /* ===== УВЕДОМЛЕНИЯ ===== */
        .notification {
            position: fixed;
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.85);
            color: #ffffff;
            padding: 8px 20px;
            border-radius: 6px;
            font-size: 13px;
            z-index: 100001;
            border: 1px solid rgba(255, 255, 255, 0.1);
            animation: notif-fade 2.5s forwards;
        }
        @keyframes notif-fade {
            0% {
                opacity: 0;
                transform: translateX(-50%) translateY(10px);
            }
            10% {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
            80% {
                opacity: 1;
            }
            100% {
                opacity: 0;
                transform: translateX(-50%) translateY(-20px);
            }
        }

        /* ===== ЗАГРУЗКА ===== */
        .loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(10, 10, 15, 0.8);
            z-index: 999;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            gap: 16px;
        }
        .loading-overlay .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top-color: #5bc0f8;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
        .loading-overlay .text {
            color: #888;
            font-size: 14px;
            letter-spacing: 1px;
        }

        /* ===== POPUP СТИЛИ ===== */
        .leaflet-popup-content-wrapper {
            background: rgba(10, 10, 20, 0.92) !important;
            color: #c8d0d8 !important;
            border-radius: 6px !important;
            border: 1px solid rgba(255, 255, 255, 0.1) !important;
        }
        .leaflet-popup-tip {
            background: rgba(10, 10, 20, 0.92) !important;
        }
        .leaflet-control-zoom {
            border: 1px solid rgba(255, 255, 255, 0.1) !important;
        }
        .leaflet-control-zoom a {
            background: rgba(10, 10, 20, 0.8) !important;
            color: #c8d0d8 !important;
        }

        /* ===== ГРАНИЦЫ ===== */
        .country-boundary {
            stroke: #ffffff !important;
            stroke-width: 1.2px !important;
            stroke-opacity: 0.7 !important;
            transition: all 0.3s;
        }
        .country-boundary:hover {
            fill-opacity: 0.8 !important;
            stroke-width: 2.5px !important;
            stroke-opacity: 1 !important;
        }

        /* ===== ПОДПИСИ СТРАН ===== */
        .country-label {
            color: #e0e8f0;
            font-size: 10px;
            font-weight: 500;
            text-shadow: 0 0 12px rgba(0, 0, 0, 0.95), 0 0 6px rgba(0, 0, 0, 0.9), 0 0 3px rgba(0, 0, 0, 0.8);
            pointer-events: none;
            white-space: nowrap;
            letter-spacing: 0.5px;
        }
        .country-label-russia {
            color: #ffffff;
            font-size: 12px;
            font-weight: 700;
            text-shadow: 0 0 15px rgba(0, 0, 0, 0.95), 0 0 8px rgba(0, 0, 0, 0.9), 0 0 4px rgba(0, 0, 0, 0.8);
            letter-spacing: 0.6px;
        }
        .country-label-inactive {
            color: #8899aa;
            font-size: 9px;
            font-weight: 400;
            text-shadow: 0 0 8px rgba(0, 0, 0, 0.9);
            opacity: 0.85;
        }

        /* ===== АДАПТИВ ===== */
        @media (max-width: 768px) {
            .topbar {
                padding: 0 12px;
                height: 52px;
            }
            .topbar-brand {
                font-size: 12px;
            }
            .topbar-btn {
                font-size: 10px;
                padding: 0 8px;
                height: 24px;
            }
            .nav-dashboards {
                top: 52px;
                height: 34px;
                padding: 0 10px;
                gap: 2px;
            }
            .nav-btn {
                font-size: 9px;
                padding: 2px 6px;
            }
            .layer-bar {
                top: 86px;
                padding: 4px 10px;
                gap: 2px;
            }
            .layer-btn {
                font-size: 9px;
                padding: 2px 6px;
            }
            .map-container {
                padding-top: 160px;
            }
            .stats {
                top: 170px;
                right: 10px;
                padding: 8px 12px;
                min-width: 100px;
            }
            .stats .count {
                font-size: 20px;
            }
            .legend {
                bottom: 10px;
                left: 10px;
                padding: 8px 12px;
                font-size: 10px;
                min-width: 100px;
            }
            .ssi-panel {
                bottom: 110px;
                right: 10px;
                padding: 8px 12px;
                min-width: 100px;
            }
            .timeline-panel {
                bottom: 150px;
                min-width: 200px;
            }
        }
        @media (max-width: 480px) {
            .topbar {
                padding: 0 8px;
                height: 46px;
            }
            .topbar-brand {
                font-size: 10px;
                letter-spacing: 1px;
            }
            .topbar-btn {
                font-size: 9px;
                padding: 0 6px;
                height: 20px;
            }
            .lang-btn {
                font-size: 9px;
                padding: 1px 5px;
            }
            .nav-dashboards {
                top: 46px;
                height: 30px;
                padding: 0 6px;
                gap: 2px;
            }
            .nav-btn {
                font-size: 8px;
                padding: 2px 5px;
            }
            .layer-bar {
                top: 76px;
                padding: 4px 6px;
                gap: 2px;
            }
            .layer-btn {
                font-size: 8px;
                padding: 2px 5px;
            }
            .map-container {
                padding-top: 145px;
            }
        }
    </style>
</head>
<body>

    <!-- ===== ПЕРВЫЙ БЛОК: ТОПБАР ===== -->
    <header class="topbar">
        <div class="topbar-left">
            <span class="topbar-brand">🌍 CRUCIX MAP</span>
        </div>
        <div class="topbar-right">
            <button class="topbar-btn btn-home" onclick="window.location.href='/jarvis'">← НА ГЛАВНУЮ</button>

            <div class="copy-dropdown">
                <button class="topbar-btn btn-copy" id="copy-btn">📋 КОПИРОВАТЬ ▼</button>
                <div class="copy-dropdown-content" id="copyDropdown">
                    <div class="label">ФОРМАТЫ КОПИРОВАНИЯ</div>
                    <button data-format="text">📄 Как текст (полный снапшот)</button>
                    <button data-format="markdown">📝 Как Markdown</button>
                    <button data-format="json">📊 Как JSON</button>
                    <button data-format="csv">📋 Как CSV (таблицы)</button>
                    <div class="divider"></div>
                    <button data-format="dom">🌳 DOM-дерево</button>
                    <button data-format="storage">💾 localStorage + sessionStorage</button>
                    <button data-format="api">📡 API-запросы страницы</button>
                    <div class="divider"></div>
                    <button data-format="all">📦 ВСЁ В ОДНОМ</button>
                </div>
            </div>

    <div class="map-container" id="map-container">

    <script>
        // ============================================================
        // 1. ПЕРЕКЛЮЧАТЕЛЬ ЯЗЫКА
        // ============================================================
        let currentLang = localStorage.getItem('crucix-lang') || 'ru';

        function setLanguage(lang) {
            currentLang = lang;
            localStorage.setItem('crucix-lang', lang);
            document.querySelectorAll('.lang-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.lang === lang);
            });
            showNotification('🌐 Язык: ' + lang.toUpperCase());
        }

        document.querySelectorAll('.lang-btn').forEach(btn => {
            btn.classList.toggle('active', btn.dataset.lang === currentLang);
        });

        // ============================================================
        // 2. УВЕДОМЛЕНИЯ И HELP
        // ============================================================
        function showNotification(msg) {
            document.querySelectorAll('.notification').forEach(el => el.remove());
            const el = document.createElement('div');
            el.className = 'notification';
            el.textContent = msg;
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 2500);
        }

        function openHelp() {
            const pageId = window.location.pathname.replace(/^\/+/, "").replace(/\.html$/, "") || "jarvis";
            const lang = currentLang || "ru";
            const helpFile = `/data/help/${lang}/${pageId}.txt`;
            fetch(helpFile).then(res => res.text()).then(text => {
                alert(text || "Справка не найдена");
            }).catch(() => alert("Справка не найдена"));
        }

        // ============================================================
        // 3. НАВИГАЦИЯ ПО ДАШБОРДАМ
        // ============================================================
        function goToDashboard(name) {
            window.location.href = '/dashboard-' + name + '.html';
        }

        // ============================================================
        // 4. КНОПКА КОПИРОВАТЬ — ОСНОВНАЯ ФУНКЦИЯ (из первого файла)
        // ============================================================
        function copyAllData() {
            const timestamp = new Date().toLocaleString();
            let report = '=== CRUCIX — ГЕОПОЛИТИЧЕСКАЯ КАРТА ===\n';
            report += 'Дата: ' + timestamp + '\n';
            report += 'URL: ' + window.location.href + '\n\n';

            report += '--- СТАТИСТИКА ---\n';
            report += 'Стран: ' + Object.keys(countryData).length + '\n';
            report += 'Событий: ' + markerData.length + '\n\n';

            report += '--- СТРАНЫ ПО СТАТУСАМ ---\n';
            const critical = [],
                preWar = [],
                high = [],
                medium = [],
                low = [];
            for (const [id, data] of Object.entries(countryData)) {
                if (data.status === 'critical') critical.push(data.name);
                else if (data.status === 'pre-war') preWar.push(data.name);
                else if (data.status === 'high') high.push(data.name);
                else if (data.status === 'medium') medium.push(data.name);
                else if (data.status === 'low') low.push(data.name);
            }
            report += '🔴 Критический (' + critical.length + '): ' + critical.join(', ') + '\n';
            report += '🟠 Предвоенный (' + preWar.length + '): ' + preWar.join(', ') + '\n';
            report += '🟠 Высокий (' + high.length + '): ' + high.join(', ') + '\n';
            report += '🟡 Средний (' + medium.length + '): ' + medium.join(', ') + '\n';
            report += '🟢 Нормальный (' + low.length + '): ' + low.join(', ') + '\n\n';

            report += '--- ИНДЕКС НАПРЯЖЁННОСТИ ---\n';
            report += 'SSI: ' + (document.getElementById('ssi-label')?.textContent || '—') + '\n\n';

            report += '--- МАРКЕРЫ СОБЫТИЙ ---\n';
            for (const m of markerData) {
                report += '  ' + m.name + ' (' + m.status + ') — ' + m.lat + ', ' + m.lng + ' [слой: ' + (m.layer ||
                    'all') + ']\n';
            }

            report += '\n--- КООРДИНАТЫ КАРТЫ ---\n';
            if (map) {
                const center = map.getCenter();
                const zoom = map.getZoom();
                report += 'Центр: ' + center.lat.toFixed(4) + ', ' + center.lng.toFixed(4) + '\n';
                report += 'Масштаб: ' + zoom + '\n';
                const bounds = map.getBounds();
                report += 'Границы: ' + bounds.getSouthWest().lat.toFixed(4) + ', ' + bounds.getSouthWest().lng.toFixed(
                    4) + ' — ' + bounds.getNorthEast().lat.toFixed(4) + ', ' + bounds.getNorthEast().lng.toFixed(
                    4) + '\n';
            }

            report += '\n--- CRUCIX OSINT TERMINAL ---\n';
            report += '🌐 ' + window.location.origin + '/geo-map';

            navigator.clipboard.writeText(report).then(() => {
                const btn = document.getElementById('copy-btn');
                btn.textContent = '✅ Скопировано!';
                btn.classList.add('copied');
                setTimeout(() => {
                    btn.textContent = '📋 КОПИРОВАТЬ ▼';
                    btn.classList.remove('copied');
                }, 3000);
                showNotification('✅ Данные скопированы');
            }).catch(() => {
                const textarea = document.createElement('textarea');
                textarea.value = report;
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);
                showNotification('✅ Данные скопированы');
            });
        }

        // --- Выпадающее меню копирования ---
        document.getElementById('copy-btn').addEventListener('click', function(e) {
            e.stopPropagation();
            document.getElementById('copyDropdown').classList.toggle('show');
        });

        document.addEventListener('click', function() {
            document.getElementById('copyDropdown').classList.remove('show');
        });

        // Обработчики для пунктов меню — все ведут на основную функцию copyAllData()
        document.querySelectorAll('#copyDropdown button[data-format]').forEach(btn => {
            btn.addEventListener('click', function(e) {
                e.stopPropagation();
                document.getElementById('copyDropdown').classList.remove('show');
                copyAllData(); // вызываем основную функцию из первого файла
            });
        });

        // ============================================================
        // 5. ПЕРЕМЕННЫЕ
        // ============================================================
        let map = null;
        let countryData = {};
        let markerData = [];
        let allMarkers = [];
        let geoJsonLayer = null;
        let labelsLayer = null;
        let heatLayer = null;
        let notamLayer = null;
        let gpsLayer = null;
        let heatEnabled = false;
        let timelineEnabled = false;
        let currentLayer = 'all';

        // ============================================================
        // 6. УПРАВЛЕНИЕ СЛОЯМИ
        // ============================================================
        function setLayer(layer) {
            currentLayer = layer;
            document.querySelectorAll('.layer-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.layer === layer);
            });

            if (layer === 'all' || layer === 'notam') {
                loadNotamLayer();
            } else if (notamLayer) {
                map.removeLayer(notamLayer);
                notamLayer = null;
            }

            if (layer === 'all' || layer === 'gps') {
                loadGpsLayer();
            } else if (gpsLayer) {
                map.removeLayer(gpsLayer);
                gpsLayer = null;
            }

            if (allMarkers.length > 0) {
                const filtered = layer === 'all' ? allMarkers : allMarkers.filter(m => m.layer === layer || m.layer ===
                    'all');
                updateMarkers(filtered);
            }

            showNotification('🎯 Слой: ' + layer.toUpperCase());
        }

        // ============================================================
        // 7. МАРКЕРЫ
        // ============================================================
        function updateMarkers(markers) {
            if (window._markersLayer) {
                map.removeLayer(window._markersLayer);
            }

            const markersLayer = L.layerGroup().addTo(map);
            window._markersLayer = markersLayer;

            const STATUS_COLORS = {
                critical: '#ef4444',
                'pre-war': '#f97316',
                high: '#f59e0b',
                medium: '#eab308',
                low: '#22c55e'
            };

            for (const item of markers) {
                if (!item.lat || !item.lng) continue;
                const color = STATUS_COLORS[item.status] || '#3b82f6';
                const size = item.status === 'critical' ? 16 : item.status === 'pre-war' ? 14 : item.status === 'high' ?
                    13 : 11;

                const icon = L.divIcon({
                    className: 'event-marker',
                    html: `
                    <div style="position:relative;width:${size}px;height:${size}px;">
                      <div style="position:absolute;top:0;left:0;width:100%;height:100%;background:${color};border-radius:50%;border:2px solid rgba(255,255,255,0.5);box-shadow:0 0 20px ${color}80;animation:pulse 2s infinite;"></div>

                    </div>
                    <style>@keyframes pulse { 0%,100% { transform: scale(1); opacity:1; } 50% { transform: scale(1.25); opacity:0.7; } }</style>
                  `,
                    iconSize: [size, size],
                    iconAnchor: [size / 2, size / 2]
                });

                L.marker([item.lat, item.lng], { icon })
                    .addTo(markersLayer)
                    .bindPopup(`
                    <div style="padding:4px 0;">
                      <strong style="color:#e8f0f8;font-size:14px;">${item.name}</strong><br>
                      <span style="color:${color};font-weight:600;">${item.status.toUpperCase()}</span>

            document.getElementById('marker-count').textContent = markers.length;

        function buildTimeline() {
            const track = document.getElementById('timeline-track');
            const dateLabel = document.getElementById('timeline-date');

            if (markerData.length === 0) {
                track.innerHTML = '<div style="color:#555;font-size:11px;text-align:center;padding:8px;">Нет данных</div>';
                dateLabel.textContent = '—';
                return;
            }

            const grouped = {};
            const today = new Date();
            for (const m of markerData) {
                const date = new Date(m.timestamp || today);
                const key = date.toLocaleDateString('ru-RU');
                if (!grouped[key]) grouped[key] = [];
                grouped[key].push(m);
            }

            const keys = Object.keys(grouped).sort();
            if (keys.length === 0) {
                track.innerHTML = '<div style="color:#555;font-size:11px;text-align:center;padding:8px;">Нет данных</div>';
                dateLabel.textContent = '—';
                return;
            }

            let maxCount = 0;
            for (const key of keys) {
                if (grouped[key].length > maxCount) maxCount = grouped[key].length;
            }

            let html = '';
            for (const key of keys) {
                const count = grouped[key].length;
                const height = maxCount > 0 ? Math.max(4, (count / maxCount) * 20) : 4;
                const color = count > 5 ? '#ef4444' : count > 3 ? '#f97316' : count > 1 ? '#eab308' : '#22c55e';
                html +=
                    `<div class="timeline-bar" style="height:${height}px;background:${color};" title="${key}: ${count} событий"></div>`;
            }

            track.innerHTML = html;
            dateLabel.textContent = keys.length > 0 ? `${keys[0]} — ${keys[keys.length - 1]}` : '—';
        }

        // ============================================================
        // 12. PDF ЭКСПОРТ

        function exportPDF() {
            const btn = document.querySelector('.btn-pdf');
            btn.textContent = '⏳';
            btn.disabled = true;
            showNotification('⏳ Создание PDF...');

            const container = document.getElementById('map-container');
            const legend = document.querySelector('.legend');
            const stats = document.querySelector('.stats');
            const ssi = document.querySelector('.ssi-panel');
            const timeline = document.getElementById('timeline-panel');

            if (legend) legend.style.display = 'none';
            if (stats) stats.style.display = 'none';
            if (ssi) ssi.style.display = 'none';
            if (timeline) timeline.style.display = 'none';

            setTimeout(() => {
                html2canvas(container, {
                    scale: 2,
                    useCORS: true,
                    backgroundColor: '#0a1a2a'
                }).then(canvas => {
                    if (legend) legend.style.display = 'block';
                    if (stats) stats.style.display = 'block';
                    if (ssi) ssi.style.display = 'block';
                    if (timeline && timelineEnabled) timeline.style.display = 'block';

                    const link = document.createElement('a');
                    link.download =
                        `Crucix_GeoMap_${new Date().toISOString().slice(0, 10)}.png`;
                    link.href = canvas.toDataURL('image/png');
                    link.click();

                    btn.textContent = '📄 PDF';
                    btn.disabled = false;
                    showNotification('✅ PDF экспортирован!');
                }).catch(err => {
                    console.error('[PDF] Ошибка:', err);
                    if (legend) legend.style.display = 'block';
                    if (stats) stats.style.display = 'block';
                    if (ssi) ssi.style.display = 'block';
                    if (timeline && timelineEnabled) timeline.style.display = 'block';
                    btn.textContent = '📄 PDF';
                    btn.disabled = false;
                    showNotification('❌ Ошибка экспорта');
                });
            }, 500);
        }

        // ============================================================
        // 13. КАРТА
        // ============================================================
        function initMap() {
            map = L.map('map', {
                center: [30, 20],
                zoom: 2.5,
                zoomControl: true,
                minZoom: 1.5,
                maxZoom: 10
            });

            L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
                attribution: '© OpenStreetMap, © CartoDB',
                maxZoom: 19,
                opacity: 0.9
            }).addTo(map);

            loadData();
        }

        async function loadData() {
            try {
                const [markersRes, statusRes] = await Promise.all([
                    fetch('/api/geo/markers'),
                    fetch('/api/geo/status')
                ]);

                const markersData = await markersRes.json();
                const statusData = await statusRes.json();

                if (statusData.success && statusData.status && statusData.status.countries) {
                    countryData = statusData.status.countries;
                    document.getElementById('countries-count').textContent = '🌍 ' + Object.keys(countryData).length +
                        ' стран';
                }

                if (markersData.success && markersData.markers) {
                    allMarkers = markersData.markers.map(m => {
                        if (!m.layer) {
                            if (m.name?.toLowerCase().includes('notam')) m.layer = 'notam';
                            else if (m.name?.toLowerCase().includes('gps')) m.layer = 'gps';
                            else if (m.name?.toLowerCase().includes('пожар')) m.layer = 'firms';
                            else if (m.name?.toLowerCase().includes('землетряс')) m.layer = 'usgs';
                            else if (m.name?.toLowerCase().includes('суд')) m.layer = 'ships';
                            else if (m.name?.toLowerCase().includes('авиа')) m.layer = 'aviation';
                            else m.layer = 'conflicts';
                        }
                        return m;
                    });
                    markerData = allMarkers;
                    document.getElementById('marker-count').textContent = markerData.length;
                    updateMarkers(allMarkers);
                }

                calculateSSI();
                await loadCountryBoundaries();

                loadNotamLayer();
                loadGpsLayer();

                document.getElementById('loading-overlay').style.display = 'none';
                setTimeout(() => { if (map) map.invalidateSize(); }, 500);
            } catch (e) {
                console.error('[Geo Map] Ошибка:', e);
                document.getElementById('loading-overlay').innerHTML =
                    '<div class="text" style="color:#ef4444;">❌ ОШИБКА</div>';
            }
        }

                    }
                }
                if (nameRu === 'Россия' || nameRu === 'США' || nameRu === 'Китай' || nameRu === 'Индия') {
                    isActive = true;
                }

                let center = null;
                if (feature.properties?.center) {
                    center = feature.properties.center;
                } else if (feature.geometry && feature.geometry.type === 'Polygon') {
                    const coords = feature.geometry.coordinates[0];
                    if (coords && coords.length > 0) {
                        let lat = 0,
                            lng = 0,
                            count = 0;
                        for (const c of coords) {
                            if (c && c.length >= 2) {
                                lat += c[1];
                                lng += c[0];
                                count++;
                            }
                        }
                        if (count > 0) {
                            center = { lat: lat / count, lng: lng / count };
                        }
                    }
                } else if (feature.geometry && feature.geometry.type === 'MultiPolygon') {
                    if (feature.geometry.coordinates && feature.geometry.coordinates[0]) {
                        const coords = feature.geometry.coordinates[0][0];
                        if (coords && coords.length > 0) {
                            let lat = 0,
                                lng = 0,
                                count = 0;
                            for (const c of coords) {
                                if (c && c.length >= 2) {
                                    lat += c[1];
                                    lng += c[0];
                                    count++;
                                }
                            }
                            if (count > 0) {
                                center = { lat: lat / count, lng: lng / count };
                            }
                        }
                    }
                }

                if (center && center.lat && center.lng) {
                    let labelClass = 'country-label';
                    let labelText = nameRu;

                    if (nameRu === 'Россия') {
                        labelClass = 'country-label-russia';
                    } else if (!isActive) {
                        labelClass = 'country-label-inactive';
                    }

                    const label = L.marker([center.lat, center.lng], {
                        icon: L.divIcon({
                            className: labelClass,
                            html: `<span class="${labelClass}">${labelText}</span>`,
                            iconSize: [0, 0],
                            iconAnchor: [0, 0]
                        })
                    }).addTo(labelsLayer);
                }
            }

            console.log('[Geo Map] Подписи стран добавлены');
        }

        // ============================================================
        // 15. SSI
        // ============================================================
        function calculateSSI() {
            const total = Object.keys(countryData).length;
            if (total === 0) return;

            let score = 0;
            for (const [id, data] of Object.entries(countryData)) {
                if (data.status === 'critical') score += 100;
                else if (data.status === 'pre-war') score += 80;
                else if (data.status === 'high') score += 70;
                else if (data.status === 'medium') score += 40;
                else if (data.status === 'low') score += 10;
            }
            const clamped = Math.min(Math.max(Math.round(score / total), 0), 100);
            document.getElementById('ssi-fill').style.width = clamped + '%';
            document.getElementById('ssi-label').textContent = clamped + '%';
            document.getElementById('ssi-label').style.color = clamped > 80 ? '#ef4444' : clamped > 60 ? '#f97316' :
                clamped > 40 ? '#eab308' : '#22c55e';
        }

        // ============================================================
        // 16. ЗАПУСК
        // ============================================================
        document.addEventListener('DOMContentLoaded', function() {
            const savedLang = localStorage.getItem('crucix-lang') || 'ru';
            setLanguage(savedLang);

            if (typeof L !== 'undefined') {
                initMap();
            } else {
                document.getElementById('loading-overlay').innerHTML =
                    '<div class="text" style="color:#ef4444;">❌ ОШИБКА: Leaflet не загружен</div>';
            }
        });
    </script>
