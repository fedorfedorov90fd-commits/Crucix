<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Планировщик задач — Crucix</title>
  <link rel="stylesheet" href="/css/scheduler.css">
</head>
<body>
  <!-- ============================================================
       ВЕРХНЯЯ ПАНЕЛЬ (ТОЧНАЯ КОПИЯ JARVIS)
       ============================================================ -->
  <header class="topbar">
    <div class="topbar-left">
      <span class="topbar-brand">⚡ CRUCIX MONITOR</span>
      <span class="topbar-status">WARTIME STAGFLATION RISK</span>
    </div>
    <div class="topbar-right">
      <span class="topbar-time">SWEEP 30.1s</span>
      <span class="topbar-time" id="topbar-date">APR 3, 2026 07:18 PM</span>
      <span class="topbar-sources">SOURCES 28/29</span>
      
      <button class="topbar-btn btn-home" onclick="window.location.href='/jarvis'">← НА ГЛАВНУЮ</button>
      <button class="topbar-btn btn-help" onclick="showHelp()">❓ HELP</button>
    <button class="topbar-btn btn-copy" id="copy-btn">📋 КОПИРОВАТЬ</button>
      <button class="topbar-btn btn-rss" onclick="window.location.href='/rss-feed'">📡 RSS</button>
      <button class="topbar-btn btn-ai" onclick="window.location.href='/ai-chat'">🧠 AI Чат</button>
      <button class="topbar-btn btn-map" onclick="window.location.href='/geo-map'">🌍 КАРТА</button>
      <button class="topbar-btn btn-index" onclick="window.location.href='/global-index'">📊 ИНДЕКС</button>
      <button class="topbar-btn btn-basket" onclick="window.location.href='/basket'">📦 КОРЗИНА</button>
      <button class="topbar-btn btn-grid" id="grid-toggle">📐 СЕТКА</button>
      
      <div class="lang-switch">
        <button class="lang-btn active" data-lang="ru" onclick="switchLang('ru')">RU</button>
        <button class="lang-btn" data-lang="en" onclick="switchLang('en')">EN</button>
      </div>
      
      <button class="topbar-btn btn-alert">🔴 HIGH ALERT</button>
    </div>
  </header>

  <!-- ============================================================
       ОСНОВНОЙ КОНТЕНТ
       ============================================================ -->
  <main class="main-content">
    <h1 class="page-title">⏰ Планировщик задач</h1>
    
    <!-- Статистика -->
    <div class="stats-row" id="stats-row">
      <div class="stat-item">
        <div class="stat-label">Всего задач</div>
        <div class="stat-value blue" id="stat-total">—</div>
      </div>
      <div class="stat-item">
        <div class="stat-label">Активных</div>
        <div class="stat-value green" id="stat-enabled">—</div>
      </div>
      <div class="stat-item">
        <div class="stat-label">Выполняется</div>
        <div class="stat-value orange" id="stat-running">—</div>
      </div>
      <div class="stat-item">
        <div class="stat-label">Успешно</div>
        <div class="stat-value green" id="stat-success">—</div>
      </div>
      <div class="stat-item">
        <div class="stat-label">С ошибками</div>
        <div class="stat-value red" id="stat-error">—</div>
      </div>
    </div>

    <!-- Управление -->
    <div class="scheduler-controls">
      <button class="btn btn-primary" id="btn-run-all">▶ Запустить все задачи</button>
      <button class="btn btn-secondary" id="btn-refresh">🔄 Обновить</button>
      <button class="btn btn-secondary" id="btn-start-scheduler">▶ Запустить планировщик</button>
      <button class="btn btn-secondary" id="btn-stop-scheduler">⏹ Остановить планировщик</button>
      <span class="scheduler-status" id="scheduler-status">⏹ Остановлен</span>
    </div>

    <!-- Таблица задач -->
    <div class="tasks-container">
      <div class="tasks-header">
        <span class="col-name">Задача</span>
        <span class="col-description">Описание</span>
        <span class="col-schedule">Расписание</span>
        <span class="col-status">Статус</span>
        <span class="col-last">Последний запуск</span>
        <span class="col-actions">Действия</span>
      </div>
      <div id="tasks-list" class="tasks-list">
        <div class="loading">Загрузка задач...</div>
      </div>
    </div>
  </main>

  <!-- ============================================================
       КООРДИНАТНАЯ СЕТКА
       ============================================================ -->
  <div id="coordinate-grid"></div>
  <div id="grid-coords">X: 0  Y: 0</div>

  <!-- ============================================================
       JAVASCRIPT
       ============================================================ -->
  <script src="/js/scheduler.js"></script>
<script src="/js/help.js"></script>
</body>
</html>
