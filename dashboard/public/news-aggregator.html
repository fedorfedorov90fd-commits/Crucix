<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Новостной агрегатор — Crucix</title>
  <link rel="stylesheet" href="/css/news-aggregator.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-left">
      <span class="topbar-brand">⚡ CRUCIX MONITOR</span>
      <span class="topbar-status">НОВОСТНОЙ АГРЕГАТОР</span>
    </div>
    <div class="topbar-right">
      <span class="topbar-time" id="topbar-date">Загрузка...</span>
      <button class="topbar-btn btn-home" onclick="window.location.href='/jarvis'">← НА ГЛАВНУЮ</button>
      <button class="topbar-btn btn-copy" id="copy-btn">📋 КОПИРОВАТЬ</button>
      <button class="topbar-btn btn-grid" id="grid-toggle">📐 СЕТКА</button>
    </div>
  </header>

  <main class="main-content">
    <h1 class="page-title">📰 Новостной агрегатор</h1>
    <p class="page-subtitle">Сбор новостей из ТАСС и других источников</p>

    <div class="stats-row" id="stats-row">
      <div class="stat-item">
        <div class="stat-label">Всего новостей</div>
        <div class="stat-value blue" id="stat-total">0</div>
      </div>
      <div class="stat-item">
        <div class="stat-label">Источников</div>
        <div class="stat-value green" id="stat-sources">0</div>
      </div>
      <div class="stat-item">
        <div class="stat-label">Активных</div>
        <div class="stat-value orange" id="stat-active">0</div>
      </div>
      <div class="stat-item">
        <div class="stat-label">Важных</div>
        <div class="stat-value red" id="stat-high">0</div>
      </div>
    </div>

    <div class="controls">
      <button class="btn btn-primary" id="btn-update">🔄 Собрать новости</button>
      <button class="btn btn-secondary" id="btn-refresh">🔄 Обновить</button>
      <span class="status-label" id="status-label">⏹ Готов</span>
    </div>

    <div class="filters">
      <select id="filter-source">
        <option value="all">Все источники</option>
      </select>
      <select id="filter-category">
        <option value="all">Все категории</option>
        <option value="Политика">Политика</option>
        <option value="Экономика">Экономика</option>
        <option value="Бизнес">Бизнес</option>
        <option value="Технологии">Технологии</option>
        <option value="Наука">Наука</option>
        <option value="Культура">Культура</option>
        <option value="Спорт">Спорт</option>
        <option value="Происшествия">Происшествия</option>
        <option value="Международные">Международные</option>
        <option value="Региональные">Региональные</option>
        <option value="Оборона">Оборона</option>
      </select>
      <select id="filter-importance">
        <option value="all">Все важности</option>
        <option value="high">🔴 Высокая</option>
        <option value="medium">🟡 Средняя</option>
        <option value="low">🟢 Низкая</option>
      </select>
    </div>

    <div class="summary-panel" id="summary-panel">
      <h3>📋 Резюме</h3>
      <div id="summary-content" class="summary-content">
        <div class="loading">Ожидание обновления...</div>
      </div>
    </div>

    <div class="sources-panel" id="sources-panel">
      <h3>📡 Источники</h3>
      <div id="sources-list" class="sources-list">
        <div class="loading">Загрузка...</div>
      </div>
    </div>

    <div class="news-panel" id="news-panel">
      <h3>📊 Новости</h3>
      <div id="news-list" class="news-list">
        <div class="loading">Загрузка новостей...</div>
      </div>
    </div>
  </main>

  <div id="coordinate-grid"></div>
  <div id="grid-coords">X: 0  Y: 0</div>

  <script src="/js/news-aggregator.js"></script>
</body>
</html>
