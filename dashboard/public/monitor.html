<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Monitor — Центр мониторинга — Crucix</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0a1a; color: #e0e0e0; font-family: -apple-system, 'Segoe UI', system-ui, sans-serif; min-height: 100vh; }
        .topbar {
            position: fixed; top: 0; left: 0; right: 0; height: 60px;
            background: rgba(10,10,20,0.95); backdrop-filter: blur(12px);
            border-bottom: 2px solid rgba(91,192,248,0.25);
            box-shadow: 0 2px 20px rgba(91,192,248,0.08);
            z-index: 100; display: flex; justify-content: space-between; align-items: center; padding: 0 20px;
        }
        .topbar::after {
            content: ""; position: absolute; bottom: -2px; left: 0; right: 0;
            height: 2px; background: linear-gradient(90deg, transparent, #5bc0f8, transparent); opacity: 0.6;
        }
        .topbar-left { display: flex; align-items: center; gap: 12px; }
        .topbar-brand { font-size: 14px; font-weight: 700; color: #5bc0f8; text-transform: uppercase; letter-spacing: 2px; }
        .topbar-right { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
        .topbar-btn {
            height: 28px; padding: 0 12px; border: 1px solid rgba(255,255,255,0.08);
            border-radius: 4px; background: rgba(255,255,255,0.03); color: #888;
            font-size: 11px; font-weight: 500; text-transform: uppercase;
            cursor: pointer; transition: all 0.2s; display: flex; align-items: center; gap: 4px;
        }
        .topbar-btn:hover { background: rgba(255,255,255,0.06); transform: translateY(-1px); }
        .btn-home { color: #5bc0f8; border-color: rgba(91,192,248,0.2); background: rgba(91,192,248,0.06); }
        .btn-home:hover { background: rgba(91,192,248,0.15); }
        .btn-copy { color: #5bc0f8; border-color: rgba(91,192,248,0.15); background: rgba(91,192,248,0.06); }
        .btn-copy.copied { background: rgba(76,175,80,0.2); border-color: #4caf50; color: #4caf50; }
        .btn-rss { color: #f26522; border-color: rgba(242,101,34,0.2); background: rgba(242,101,34,0.06); }
        .btn-rss:hover { background: rgba(242,101,34,0.15); }
        .btn-help { color: #a78bfa; border-color: rgba(167,139,250,0.2); background: rgba(167,139,250,0.06); }
        .btn-help:hover { background: rgba(167,139,250,0.15); }
        .lang-switch {
            display: flex; gap: 2px; padding: 2px;
            background: rgba(255,255,255,0.03); border-radius: 4px;
            border: 1px solid rgba(255,255,255,0.06);
        }
        .lang-btn {
            padding: 2px 8px; border: none; background: transparent;
            color: #666; font-size: 11px; font-weight: 500;
            cursor: pointer; border-radius: 3px; transition: all 0.2s;
        }
        .lang-btn:hover { color: #888; background: rgba(255,255,255,0.05); }
        .lang-btn.active { color: #5bc0f8; background: rgba(91,192,248,0.1); }
        .copy-dropdown { position: relative; display: inline-block; }
        .copy-dropdown-content {
            display: none; position: absolute; right: 0; top: 32px;
            background: #0a0a1a; min-width: 280px;
            border: 1px solid rgba(255,255,255,0.08); border-radius: 8px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.6); z-index: 200;
            padding: 6px 0; max-height: 80vh; overflow-y: auto;
        }
        .copy-dropdown-content.show { display: block; }
        .copy-dropdown-content button {
            display: block; width: 100%; padding: 8px 16px;
            background: transparent; border: none;
            color: #c8d0d8; font-size: 12px; text-align: left;
            cursor: pointer; transition: all 0.15s; font-family: inherit;
        }
        .copy-dropdown-content button:hover { background: rgba(91,192,248,0.08); color: #5bc0f8; }
        .copy-dropdown-content .divider { height: 1px; background: rgba(255,255,255,0.05); margin: 4px 12px; }
        .copy-dropdown-content .label { padding: 4px 16px; font-size: 10px; color: #4a5a6a; text-transform: uppercase; letter-spacing: 0.5px; }
        .nav-dashboards {
            position: fixed; top: 60px; left: 0; right: 0; height: 38px;
            background: rgba(6,10,18,0.92); backdrop-filter: blur(8px);
            border-bottom: 1px solid rgba(255,255,255,0.04); z-index: 99;
            display: flex; align-items: center; padding: 0 20px; gap: 4px;
            overflow-x: auto; scrollbar-width: none;
        }
        .nav-dashboards::-webkit-scrollbar { display: none; }
        .nav-btn {
            padding: 4px 10px; border: none; border-radius: 4px;
            background: transparent; color: #666; font-size: 10px; font-weight: 500;
            cursor: pointer; transition: all 0.2s; white-space: nowrap;
            font-family: inherit; border: 1px solid transparent;
            text-decoration: none; display: inline-flex; align-items: center; gap: 3px;
        }
        .nav-btn:hover { color: #c8d0d8; background: rgba(255,255,255,0.04); }
        .nav-btn.active { color: #5bc0f8; background: rgba(91,192,248,0.08); border-color: rgba(91,192,248,0.15); }
        .nav-btn .icon { margin-right: 3px; }
        .main-content {
            padding-top: 114px; max-width: 1200px; margin: 0 auto;
            padding-left: 20px; padding-right: 20px; padding-bottom: 40px;
            min-height: calc(100vh - 114px);
        }
        .page-title {
            font-size: 28px; font-weight: 700; color: #e8f0f8;
            margin-bottom: 8px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
        }
        .page-title .badge {
            font-size: 12px; font-weight: 400;
            background: rgba(251,191,36,0.15); color: #fbbf24;
            padding: 2px 12px; border-radius: 20px;
            border: 1px solid rgba(251,191,36,0.2);
        }
        .page-subtitle { color: #8899aa; font-size: 14px; margin-bottom: 24px; }
        .page-subtitle a { color: #5bc0f8; text-decoration: none; }
        .page-subtitle a:hover { text-decoration: underline; }
        .monitor-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px; margin-bottom: 24px;
        }
        .monitor-card {
            background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.05);
            border-radius: 12px; padding: 18px 20px; transition: all 0.2s;
        }
        .monitor-card:hover { background: rgba(255,255,255,0.04); transform: translateY(-2px); }
        .monitor-card .header {
            display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;
        }
        .monitor-card .header .name { font-weight: 600; color: #c0d0e0; }
        .monitor-card .header .status {
            font-size: 12px; padding: 2px 10px; border-radius: 12px; font-weight: 600;
        }
        .monitor-card .header .status.online { background: rgba(74,222,128,0.15); color: #4ade80; }
        .monitor-card .header .status.warning { background: rgba(245,158,11,0.15); color: #f59e0b; }
        .monitor-card .header .status.offline { background: rgba(239,68,68,0.15); color: #ef4444; }
        .monitor-card .header .status.unknown { background: rgba(74,90,106,0.15); color: #8899aa; }
        .monitor-card .value { font-size: 32px; font-weight: 700; margin: 4px 0; }
        .monitor-card .info { color: #8899aa; font-size: 13px; }
        .monitor-card .info span { margin-right: 16px; }
        .notification {
            position: fixed; bottom: 60px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.85); color: #ffffff; padding: 8px 20px;
            border-radius: 6px; font-size: 13px; z-index: 100001;
            border: 1px solid rgba(255,255,255,0.1); animation: notif-fade 3s forwards;
        }
        @keyframes notif-fade {
            0% { opacity: 0; transform: translateX(-50%) translateY(10px); }
            10% { opacity: 1; transform: translateX(-50%) translateY(0); }
            80% { opacity: 1; }
            100% { opacity: 0; transform: translateX(-50%) translateY(-20px); }
        }
        @media (max-width: 768px) {
            .topbar { padding: 0 12px; height: 52px; }
            .topbar-brand { font-size: 12px; }
            .topbar-btn { font-size: 10px; padding: 0 8px; height: 24px; }
            .nav-dashboards { top: 52px; height: 34px; padding: 0 10px; gap: 2px; }
            .nav-btn { font-size: 9px; padding: 2px 6px; }
            .main-content { padding-top: 102px; padding-left: 12px; padding-right: 12px; }
            .page-title { font-size: 20px; }
            .monitor-grid { grid-template-columns: 1fr; }
        }
        @media (max-width: 480px) {
            .topbar { padding: 0 8px; height: 46px; }
            .topbar-brand { font-size: 10px; letter-spacing: 1px; }
            .topbar-btn { font-size: 9px; padding: 0 6px; height: 20px; }
            .lang-btn { font-size: 9px; padding: 1px 5px; }
            .nav-dashboards { top: 46px; height: 30px; padding: 0 6px; gap: 2px; }
            .nav-btn { font-size: 8px; padding: 2px 5px; }
            .main-content { padding-top: 92px; padding-left: 8px; padding-right: 8px; }
            .page-title { font-size: 16px; }
        }
    </style>
</head>
<body>
<header class="topbar">
    <div class="topbar-left"><span class="topbar-brand">📊 MONITOR</span></div>
    <div class="topbar-right">
        <button class="topbar-btn btn-home" onclick="window.location.href='/jarvis'">← НА ГЛАВНУЮ</button>
        <div class="copy-dropdown">
            <button class="topbar-btn btn-copy" id="copy-btn">📋 КОПИРОВАТЬ ▼</button>
            <div class="copy-dropdown-content" id="copyDropdown">
                <div class="label">📄 ФОРМАТЫ КОПИРОВАНИЯ</div>
                <button data-format="txt">📄 Полный дамп (TXT)</button>
                <button data-format="markdown">📝 Markdown</button>
                <button data-format="json">📊 JSON</button>
                <div class="divider"></div>
                <button data-format="all">📦 ВСЁ В ОДНОМ</button>
            </div>
        </div>
        <button class="topbar-btn btn-rss" onclick="window.location.href='/registry'">📡 Реестр</button>
        <button class="topbar-btn btn-help" onclick="openHelp()">❓ HELP</button>
        <div class="lang-switch">
            <button class="lang-btn active" data-lang="ru" onclick="switchLang('ru')">RU</button>
            <button class="lang-btn" data-lang="en" onclick="switchLang('en')">EN</button>
        </div>
    </div>
</header>
<nav class="nav-dashboards" id="navDashboards">
    <button class="nav-btn" onclick="window.location.href='/dashboard-5in1'"><span class="icon">🎯</span>Центр аналитики</button>
    <button class="nav-btn" onclick="window.location.href='/dashboard-economic'"><span class="icon">📊</span>Экономика</button>
    <button class="nav-btn" onclick="window.location.href='/dashboard-financial'"><span class="icon">💰</span>Финансы</button>
    <button class="nav-btn" onclick="window.location.href='/dashboard-military'"><span class="icon">🛡️</span>Военный</button>
    <button class="nav-btn" onclick="window.location.href='/dashboard-geopolitical'"><span class="icon">🌍</span>Геополитика</button>
    <button class="nav-btn" onclick="window.location.href='/dashboard-ecological'"><span class="icon">🌿</span>Экология</button>
    <button class="nav-btn" onclick="window.location.href='/dashboard-cyber'"><span class="icon">🔒</span>Кибер</button>
    <button class="nav-btn" onclick="window.location.href='/dashboard-space'"><span class="icon">🚀</span>Космос</button>
    <button class="nav-btn" onclick="window.location.href='/dashboard-news'"><span class="icon">📰</span>Новости</button>
    <button class="nav-btn" onclick="window.location.href='/dashboard-ai'"><span class="icon">🧠</span>AI</button>
    <button class="nav-btn" onclick="window.location.href='/dashboard-scientific'"><span class="icon">🔬</span>Наука</button>
    <button class="nav-btn" onclick="window.location.href='/dashboard-esg'"><span class="icon">🌱</span>ESG</button>
    <button class="nav-btn" onclick="window.location.href='/dashboard-threats'"><span class="icon">⚡</span>Угрозы</button>
    <button class="nav-btn" onclick="window.location.href='/dashboard-health'"><span class="icon">🏥</span>Здоровье</button>
    <button class="nav-btn" onclick="window.location.href='/dashboard-energy'"><span class="icon">⛽</span>Энергетика</button>
    <button class="nav-btn" onclick="window.location.href='/dashboard-transport'"><span class="icon">🚛</span>Транспорт</button>
    <button class="nav-btn" onclick="window.location.href='/dashboard-regions'"><span class="icon">🌏</span>Регионы</button>
</nav>
<main class="main-content">
    <div class="page-title">
        <span>📊 Monitor — Центр мониторинга</span>
        <span class="badge" id="statusBadge">🟢 ONLINE</span>
    </div>
    <div class="page-subtitle">
        Общий статус всех систем и модулей Crucix
        <span style="margin-left:12px;font-size:12px;color:#4a5a6a;">
            <a href="/registry" target="_blank">📋 Полный реестр</a>
        </span>
    </div>
    <div class="monitor-grid" id="monitorGrid">
        <div style="color:#4a5a6a;text-align:center;padding:40px;">Загрузка данных...</div>
    </div>
</main>
<script>
let currentLang = localStorage.getItem('crucix-lang') || 'ru';
function switchLang(lang) { currentLang = lang; localStorage.setItem('crucix-lang', lang); document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.dataset.lang === lang)); showNotification('🌐 Язык: ' + lang.toUpperCase()); }
document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.dataset.lang === currentLang));
function showNotification(msg) { document.querySelectorAll('.notification').forEach(el => el.remove()); const el = document.createElement('div'); el.className = 'notification'; el.textContent = msg; document.body.appendChild(el); setTimeout(() => el.remove(), 3000); }
function openHelp() { alert('📊 Monitor — Центр мониторинга\n\nОбщий статус всех систем и модулей Crucix.\n\nОтображает состояние сервера, API, сборщиков, данных и AI.'); }
document.getElementById('copy-btn').addEventListener('click', function(e) { e.stopPropagation(); document.getElementById('copyDropdown').classList.toggle('show'); });
document.addEventListener('click', function() { document.getElementById('copyDropdown').classList.remove('show'); });
function copyPageData(format) {
    const timestamp = new Date().toLocaleString();
    const pageTitle = document.querySelector('.page-title span')?.textContent || document.title || 'Без заголовка';
    const url = window.location.href;
    let report = '=== CRUCIX — СНАПШОТ СТРАНИЦЫ ===\nДата: ' + timestamp + '\nURL: ' + url + '\nСтраница: ' + pageTitle + '\n\n--- CRUCIX OSINT TERMINAL ---\n🌐 ' + window.location.origin;
    navigator.clipboard.writeText(report).then(() => { const btn = document.getElementById('copy-btn'); btn.textContent = '✅ ' + format.toUpperCase(); btn.classList.add('copied'); setTimeout(() => { btn.textContent = '📋 КОПИРОВАТЬ ▼'; btn.classList.remove('copied'); }, 3000); showNotification('✅ Скопировано в формате ' + format.toUpperCase()); }).catch(() => { const textarea = document.createElement('textarea'); textarea.value = report; document.body.appendChild(textarea); textarea.select(); document.execCommand('copy'); document.body.removeChild(textarea); showNotification('✅ Скопировано в формате ' + format.toUpperCase()); });
}
document.querySelectorAll('#copyDropdown button[data-format]').forEach(btn => { btn.addEventListener('click', function(e) { e.stopPropagation(); document.getElementById('copyDropdown').classList.remove('show'); copyPageData(this.dataset.format); }); });
async function loadData() {
    try {
        const res = await fetch('/api/monitor/');
        const data = await res.json();
        const items = data.data || data.modules || [];
        const grid = document.getElementById('monitorGrid');
        if (items.length === 0) {
            grid.innerHTML = '<div style="color:#4a5a6a;text-align:center;padding:40px;">Нет данных для отображения</div>';
            return;
        }
        grid.innerHTML = items.map(m => `
            <div class="monitor-card">
                <div class="header">
                    <span class="name">${m.icon || '📊'} ${m.name || 'Модуль'}</span>
                    <span class="status ${m.status || 'unknown'}">${(m.status || 'unknown').toUpperCase()}</span>
                </div>
                <div class="value">${m.value !== undefined ? m.value : '—'}</div>
                <div class="info">
                    ${m.info ? `<span>${m.info}</span>` : ''}
                    ${m.time ? `<span>🔄 ${new Date(m.time).toLocaleString('ru-RU')}</span>` : ''}
                </div>
            </div>
        `).join('');
    } catch (e) {
        document.getElementById('monitorGrid').innerHTML = `<div style="color:#ef4444;text-align:center;padding:40px;">❌ Ошибка: ${e.message}</div>`;
    }
}
loadData(); setInterval(loadData, 60000);
</script>
</body>
</html>
