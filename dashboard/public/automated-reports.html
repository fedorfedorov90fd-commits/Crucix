<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Автоматические отчёты — Crucix</title>
  <link rel="stylesheet" href="/css/automated-reports.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-left">
      <span class="topbar-brand">⚡ CRUCIX MONITOR</span>
      <span class="topbar-status">АВТОМАТИЧЕСКИЕ ОТЧЁТЫ</span>
    </div>
    <div class="topbar-right">
      <span class="topbar-time" id="topbar-date">Загрузка...</span>
      <button class="topbar-btn btn-home" onclick="window.location.href='/jarvis'">← НА ГЛАВНУЮ</button>
      <button class="topbar-btn btn-copy" id="copy-btn">📋 КОПИРОВАТЬ</button>
      <button class="topbar-btn btn-grid" id="grid-toggle">📐 СЕТКА</button>
    </div>
  </header>

  <main class="main-content">
    <h1 class="page-title">📊 Автоматические отчёты</h1>
    <p class="page-subtitle">Ежедневные дайджесты с AI-анализом</p>

    <div class="stats-row" id="stats-row">
      <div class="stat-item">
        <div class="stat-label">Всего отчётов</div>
        <div class="stat-value blue" id="stat-total">0</div>
      </div>
      <div class="stat-item">
        <div class="stat-label">Записей в истории</div>
        <div class="stat-value green" id="stat-history">0</div>
      </div>
      <div class="stat-item">
        <div class="stat-label">Последний отчёт</div>
        <div class="stat-value" id="stat-last">—</div>
      </div>
    </div>

    <div class="controls">
      <button class="btn btn-primary" id="btn-generate">📄 Создать отчёт</button>
      <button class="btn btn-success" id="btn-start-auto">▶️ Запустить автообновление</button>
      <button class="btn btn-secondary" id="btn-stop-auto">⏹ Остановить автообновление</button>
      <button class="btn btn-secondary" id="btn-refresh">🔄 Обновить</button>
      <span class="status-label" id="status-label">⏹ Готов</span>
    </div>

    <div class="report-panel" id="report-panel">
      <h3>📄 Последний отчёт</h3>
      <div id="report-content" class="report-content">
        <div class="loading">Ожидание создания отчёта...</div>
      </div>
    </div>

    <div class="history-panel" id="history-panel">
      <h3>📜 История отчётов</h3>
      <div id="history-content" class="history-content">
        <div class="loading">Загрузка истории...</div>
      </div>
    </div>
  </main>

  <div id="coordinate-grid"></div>
  <div id="grid-coords">X: 0  Y: 0</div>

  <script src="/js/automated-reports.js"></script>
</body>
</html>
