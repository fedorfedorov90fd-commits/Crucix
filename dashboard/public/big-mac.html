<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Биг-Мак — Crucix</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a0f;
      color: #c8d0d8;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', monospace;
      font-size: 13px;
      line-height: 1.5;
      min-height: 100vh;
      overflow-x: hidden;
    }
    .topbar {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 60px;
      background: rgba(10, 10, 20, 0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
      z-index: 100;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 20px;
    }
    .topbar-left { display: flex; align-items: center; gap: 12px; }
    .topbar-brand { font-size: 14px; font-weight: 700; color: #5bc0f8; text-transform: uppercase; letter-spacing: 2px; }
    .topbar-right { display: flex; align-items: center; gap: 6px; }
    .topbar-btn {
      height: 28px; padding: 0 12px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.03);
      color: #888;
      font-size: 11px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .topbar-btn:hover { background: rgba(255, 255, 255, 0.06); transform: translateY(-1px); }
    .btn-home { color: #5bc0f8; border-color: rgba(91, 192, 248, 0.2); background: rgba(91, 192, 248, 0.06); }
    .btn-home:hover { background: rgba(91, 192, 248, 0.15); }
    .btn-copy { color: #5bc0f8; border-color: rgba(91, 192, 248, 0.15); background: rgba(91, 192, 248, 0.06); }
    .btn-copy:hover { background: rgba(91, 192, 248, 0.15); }
    .btn-copy.copied { background: rgba(76, 175, 80, 0.2); border-color: #4caf50; color: #4caf50; }
    .btn-rss { color: #f26522; border-color: rgba(242, 101, 34, 0.2); background: rgba(242, 101, 34, 0.06); }
    .btn-rss:hover { background: rgba(242, 101, 34, 0.15); }
    .lang-switch {
      display: flex; gap: 2px; padding: 2px;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 4px;
      border: 1px solid rgba(255, 255, 255, 0.06);
    }
    .lang-btn {
      padding: 2px 8px; border: none; background: transparent;
      color: #666; font-size: 11px; font-weight: 500;
      cursor: pointer; border-radius: 3px; transition: all 0.2s;
    }
    .lang-btn:hover { color: #888; background: rgba(255, 255, 255, 0.05); }
    .lang-btn.active { color: #5bc0f8; background: rgba(91, 192, 248, 0.1); }
    .main-content {
      padding-top: 76px;
      max-width: 1400px;
      margin: 0 auto;
      padding-left: 20px;
      padding-right: 20px;
      padding-bottom: 40px;
      min-height: calc(100vh - 76px);
    }
    .page-title {
      font-size: 24px;
      font-weight: 700;
      color: #e8f0f8;
      letter-spacing: -0.5px;
      margin-bottom: 20px;
    }
    .notification {
      position: fixed;
      bottom: 60px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.85);
      color: #ffffff;
      padding: 8px 20px;
      border-radius: 6px;
      font-size: 13px;
      z-index: 100001;
      border: 1px solid rgba(255, 255, 255, 0.1);
      animation: notif-fade 2.5s forwards;
    }
    @keyframes notif-fade {
      0% { opacity: 0; transform: translateX(-50%) translateY(10px); }
      10% { opacity: 1; transform: translateX(-50%) translateY(0); }
      80% { opacity: 1; transform: translateX(-50%) translateY(0); }
      100% { opacity: 0; transform: translateX(-50%) translateY(-20px); }
    }
    .big-mac-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 12px;
      margin-bottom: 24px;
    }
    .big-mac-card {
      background: rgba(255,255,255,0.02);
      border: 1px solid rgba(255,255,255,0.05);
      border-radius: 10px;
      padding: 16px;
      text-align: center;
    }
    .big-mac-card .country { font-size: 14px; font-weight: 600; color: #8899aa; }
    .big-mac-card .price { font-size: 24px; font-weight: 700; margin: 8px 0; }
    .big-mac-card .rank { font-size: 12px; color: #4a5a6a; }
    .chart-container {
      background: rgba(255,255,255,0.02);
      border: 1px solid rgba(255,255,255,0.05);
      border-radius: 12px;
      padding: 16px;
      min-height: 200px;
    }
    .chart-placeholder {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 200px;
      color: #4a5a6a;
    }
    .no-data {
      text-align: center;
      color: #4a5a6a;
      padding: 40px;
      font-size: 16px;
      grid-column: 1/-1;
    }
    @media (max-width: 768px) {
      .topbar { padding: 0 12px; height: 52px; }
      .main-content { padding-top: 68px; padding-left: 12px; padding-right: 12px; }
      .page-title { font-size: 18px; }
    }
  </style>
</head>
<body>

<header class="topbar">
  <div class="topbar-left">
    <span class="topbar-brand">⚡ CRUCIX MONITOR</span>
  </div>
  <div class="topbar-right">
    <button class="topbar-btn btn-home" onclick="window.location.href='/jarvis'">← НА ГЛАВНУЮ</button>
    <button class="topbar-btn btn-copy" id="copy-btn" title="Копировать все данные страницы">📋 КОПИРОВАТЬ</button>
    <button class="topbar-btn btn-rss" onclick="window.location.href='/rss-feed'">📡 Список страниц</button>
    <div class="lang-switch">
      <button class="lang-btn active" data-lang="ru" onclick="switchLang('ru')">RU</button>
      <button class="lang-btn" data-lang="en" onclick="switchLang('en')">EN</button>
    </div>
  </div>
</header>

<main class="main-content">
  <h1 class="page-title">🍔 Индекс Биг-Мак</h1>
  <div class="big-mac-grid" id="bigMacGrid">
    <div class="no-data">⏳ Загрузка данных...</div>
  </div>
  <div class="chart-container">
    <div class="chart-placeholder" id="chartPlaceholder">📊 График загружается...</div>
  </div>
</main>

<script>
let currentLang = localStorage.getItem('crucix-lang') || 'ru';
function switchLang(lang) {
  currentLang = lang;
  localStorage.setItem('crucix-lang', lang);
  document.querySelectorAll('.lang-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.lang === lang);
  });
}
document.querySelectorAll('.lang-btn').forEach(btn => {
  btn.classList.toggle('active', btn.dataset.lang === currentLang);
});

document.getElementById('copy-btn').addEventListener('click', function() {
  const text = document.body.innerText;
  navigator.clipboard.writeText(text).then(() => {
    this.textContent = '✅ Скопировано!';
    this.classList.add('copied');
    setTimeout(() => {
      this.textContent = '📋 КОПИРОВАТЬ';
      this.classList.remove('copied');
    }, 3000);
  }).catch(() => {
    const textarea = document.createElement('textarea');
    textarea.value = text;
    document.body.appendChild(textarea);
    textarea.select();
    document.execCommand('copy');
    document.body.removeChild(textarea);
    this.textContent = '✅ Скопировано!';
    setTimeout(() => {
      this.textContent = '📋 КОПИРОВАТЬ';
    }, 3000);
  });
});

async function loadData() {
  try {
    const res = await fetch('/api/big-mac/');
    const data = await res.json();
    return data.data || [];
  } catch (e) {
    console.error('[BIG-MAC] Ошибка:', e);
    return [];
  }
}

function render(data) {
  const grid = document.getElementById('bigMacGrid');
  if (!data || data.length === 0) {
    grid.innerHTML = `<div class="no-data">📭 Нет данных. Запустите: node scripts/collect-big-mac.mjs</div>`;
    return;
  }
  const last = data[data.length - 1];
  const countries = Object.keys(last).filter(k => k !== 'date');
  const sorted = countries.map(c => ({ country: c, price: last[c] })).sort((a, b) => a.price - b.price);

  grid.innerHTML = sorted.map(({ country, price }) => {
    const color = price > 5 ? '#ef4444' : price > 4 ? '#f59e0b' : '#4ade80';
    const label = price > 5 ? '🔴 Дорогой' : price > 4 ? '🟡 Средний' : '🟢 Дешевый';
    return `<div class="big-mac-card">
      <div class="country">${country}</div>
      <div class="price" style="color:${color}">$${price.toFixed(2)}</div>
      <div class="rank">${label}</div>
    </div>`;
  }).join('');

  renderChart(data);
}

function renderChart(data) {
  const c = document.getElementById('chartPlaceholder');
  if (data.length < 2) {
    c.innerHTML = '📊 Недостаточно данных для графика';
    return;
  }
  const countries = Object.keys(data[0]).filter(k => k !== 'date');
  const country = countries[0] || '';
  const items = data.map(d => ({ date: d.date, value: d[country] })).filter(d => d.value !== undefined);
  if (items.length < 2) { c.innerHTML = '📊 Недостаточно данных'; return; }
  const vals = items.map(d => d.value);
  const maxV = Math.max(...vals) * 1.1 || 1;
  const minV = Math.min(...vals) * 0.9 || 0;
  const range = maxV - minV || 1;

  c.innerHTML = `
    <div style="font-size:12px;color:#8899aa;margin-bottom:8px;">📊 ${country} — цена Биг-Мака</div>
    <div style="display:flex;height:150px;gap:2px;align-items:flex-end;padding:4px 0;width:100%;overflow-x:auto;">
      ${items.map(d => {
        const h = ((d.value - minV) / range) * 130 + 10;
        return `<div style="display:flex;flex-direction:column;align-items:center;flex:1;">
          <div style="width:100%;height:${h}px;background:#fbbf24;border-radius:2px 2px 0 0;min-height:4px;"></div>
        </div>`;
      }).join('')}
    </div>
    <div style="display:flex;justify-content:space-between;font-size:9px;color:#4a5a6a;padding:0 4px;">
      <span>${items[0].date}</span>
      <span>${items[items.length-1].date}</span>
    </div>
  `;
}

async function update() {
  const data = await loadData();
  render(data);
}
update();
setInterval(update, 60000);
</script>
</body>
</html>
