<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRUCIX — Все модули</title>
  <style>
    /* ============================================================
       ГЛОБАЛЬНЫЕ СТИЛИ
       ============================================================ */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      background: #0a0a0f;
      color: #c8d0d8;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', monospace;
      font-size: 13px;
      line-height: 1.5;
      min-height: 100vh;
      overflow-x: hidden;
    }
    
    /* ============================================================
       ВЕРХНЯЯ ПАНЕЛЬ
       ============================================================ */
    .topbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 60px;
      background: rgba(10, 10, 20, 0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
      z-index: 100;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 20px;
    }
    
    .topbar-left { display: flex; align-items: center; gap: 12px; }
    .topbar-brand { font-size: 14px; font-weight: 700; color: #5bc0f8; text-transform: uppercase; letter-spacing: 2px; text-shadow: 0 0 20px rgba(91, 192, 248, 0.15); }
    .topbar-status { font-size: 11px; color: #ffd700; text-shadow: 0 0 15px rgba(255, 215, 0, 0.1); }
    
    .topbar-right { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    
    .topbar-btn {
      height: 28px;
      padding: 0 12px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.03);
      color: #888;
      font-size: 11px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .topbar-btn:hover { background: rgba(255, 255, 255, 0.06); transform: translateY(-1px); }
    
    .btn-home { color: #5bc0f8; border-color: rgba(91, 192, 248, 0.2); background: rgba(91, 192, 248, 0.06); }
    .btn-home:hover { background: rgba(91, 192, 248, 0.15); }
    
    .btn-copy { color: #5bc0f8; border-color: rgba(91, 192, 248, 0.15); background: rgba(91, 192, 248, 0.06); }
    .btn-copy:hover { background: rgba(91, 192, 248, 0.15); }
    .btn-copy:active { background: rgba(91, 192, 248, 0.25); }
    
    .btn-rss { color: #f26522; border-color: rgba(242, 101, 34, 0.2); background: rgba(242, 101, 34, 0.06); }
    .btn-rss:hover { background: rgba(242, 101, 34, 0.15); }
    
    .btn-ai { color: #4caf50; border-color: rgba(76, 175, 80, 0.15); background: rgba(76, 175, 80, 0.06); }
    .btn-ai:hover { background: rgba(76, 175, 80, 0.15); }
    
    .btn-map { color: #5bc0f8; border-color: rgba(91, 192, 248, 0.15); background: rgba(91, 192, 248, 0.06); }
    .btn-map:hover { background: rgba(91, 192, 248, 0.15); }
    
    .btn-index { color: #ffd700; border-color: rgba(255, 215, 0, 0.15); background: rgba(255, 215, 0, 0.06); }
    .btn-index:hover { background: rgba(255, 215, 0, 0.15); }
    
    .btn-basket { color: #2196f3; border-color: rgba(33, 150, 243, 0.15); background: rgba(33, 150, 243, 0.06); }
    .btn-basket:hover { background: rgba(33, 150, 243, 0.15); }
    
    .btn-grid { color: #9c27b0; border-color: rgba(156, 39, 176, 0.15); background: rgba(156, 39, 176, 0.06); }
    .btn-grid:hover { background: rgba(156, 39, 176, 0.15); }
    .btn-grid.active { background: rgba(156, 39, 176, 0.2); border-color: rgba(156, 39, 176, 0.3); }
    
    .btn-scheduler { color: #ff6b6b; border-color: rgba(255, 107, 107, 0.15); background: rgba(255, 107, 107, 0.06); }
    .btn-scheduler:hover { background: rgba(255, 107, 107, 0.15); }
    
    .btn-trust { color: #ffd93d; border-color: rgba(255, 217, 61, 0.15); background: rgba(255, 217, 61, 0.06); }
    .btn-trust:hover { background: rgba(255, 217, 61, 0.15); }
    
    .btn-alert {
      color: #ffffff;
      background: #f44336;
      border-color: #f44336;
      animation: alert-pulse 2s infinite;
    }
    .btn-alert:hover { background: #d32f2f; }
    
    @keyframes alert-pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(244, 67, 54, 0.3); }
      50% { box-shadow: 0 0 0 6px rgba(244, 67, 54, 0); }
    }
    
    .lang-switch {
      display: flex;
      gap: 2px;
      padding: 2px;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 4px;
      border: 1px solid rgba(255, 255, 255, 0.06);
    }
    .lang-btn {
      padding: 2px 8px;
      border: none;
      background: transparent;
      color: #666;
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      border-radius: 3px;
      transition: all 0.2s;
    }
    .lang-btn:hover { color: #888; background: rgba(255, 255, 255, 0.05); }
    .lang-btn.active { color: #5bc0f8; background: rgba(91, 192, 248, 0.1); }
    
    .topbar-time { font-size: 11px; color: #666; font-variant-numeric: tabular-nums; }
    .topbar-sources { font-size: 11px; color: #4caf50; }
    
    /* ============================================================
       ОСНОВНОЙ КОНТЕНТ
       ============================================================ */
    .main-content {
      padding-top: 76px;
      max-width: 1400px;
      margin: 0 auto;
      padding-left: 20px;
      padding-right: 20px;
      padding-bottom: 40px;
    }
    
    .page-title {
      font-size: 24px;
      font-weight: 700;
      color: #e8f0f8;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
      text-shadow: 0 0 30px rgba(91, 192, 248, 0.05);
    }
    
    .page-subtitle {
      color: #666;
      font-size: 14px;
      margin-bottom: 20px;
    }
    
    /* ============================================================
       КАРТОЧКИ-ССЫЛКИ НА МОДУЛИ
       ============================================================ */
    .module-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 12px;
      margin-bottom: 20px;
    }
    
    .module-card {
      background: rgba(10, 10, 20, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.04);
      border-radius: 8px;
      padding: 14px 16px;
      cursor: pointer;
      transition: all 0.25s;
      text-decoration: none;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .module-card:hover {
      border-color: rgba(255, 255, 255, 0.12);
      transform: translateY(-2px);
      background: rgba(10, 10, 20, 0.8);
    }
    .module-card .mod-icon { font-size: 20px; }
    .module-card .mod-name { font-size: 13px; font-weight: 600; color: #e8f0f8; }
    .module-card .mod-desc { font-size: 11px; color: #666; }
    .module-card .mod-badge {
      font-size: 9px;
      color: #4caf50;
      background: rgba(76, 175, 80, 0.12);
      padding: 1px 8px;
      border-radius: 10px;
      align-self: flex-start;
      margin-top: 4px;
    }
    
    /* ============================================================
       СТАТУСНАЯ ПАНЕЛЬ
       ============================================================ */
    .status-panel {
      margin-top: 20px;
      padding: 16px;
      background: rgba(255, 215, 0, 0.05);
      border: 1px solid rgba(255, 215, 0, 0.1);
      border-radius: 8px;
    }
    .status-panel .title { color: #ffd700; font-size: 13px; font-weight: 600; }
    .status-panel .info { color: #888; font-size: 12px; margin-top: 4px; }
    
    /* ============================================================
       КООРДИНАТНАЯ СЕТКА
       ============================================================ */
    #coordinate-grid {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 99999;
      background-image:
        linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
      background-size: 50px 50px;
      display: none;
    }
    #coordinate-grid.visible { display: block; }
    
    #grid-coords {
      position: fixed;
      bottom: 12px;
      right: 12px;
      background: rgba(0, 0, 0, 0.7);
      color: #00ff00;
      font-family: monospace;
      font-size: 11px;
      padding: 4px 10px;
      border-radius: 4px;
      z-index: 100000;
      pointer-events: none;
      display: none;
    }
    #grid-coords.visible { display: block; }
    
    /* ============================================================
       УВЕДОМЛЕНИЯ
       ============================================================ */
    .notification {
      position: fixed;
      bottom: 60px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.85);
      color: #ffffff;
      padding: 8px 20px;
      border-radius: 6px;
      font-size: 13px;
      z-index: 100001;
      border: 1px solid rgba(255, 255, 255, 0.1);
      animation: notif-fade 2.5s forwards;
    }
    @keyframes notif-fade {
      0% { opacity: 0; transform: translateX(-50%) translateY(10px); }
      10% { opacity: 1; transform: translateX(-50%) translateY(0); }
      80% { opacity: 1; transform: translateX(-50%) translateY(0); }
      100% { opacity: 0; transform: translateX(-50%) translateY(-20px); }
    }
    
    /* ============================================================
       АДАПТИВНОСТЬ
       ============================================================ */
    @media (max-width: 768px) {
      .topbar { padding: 0 12px; height: 52px; }
      .topbar-brand { font-size: 12px; }
      .topbar-status { display: none; }
      .topbar-btn { font-size: 10px; padding: 0 8px; height: 24px; }
      .topbar-time { display: none; }
      .main-content { padding-top: 68px; padding-left: 12px; padding-right: 12px; }
      .page-title { font-size: 18px; }
      .module-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
    }
    
    @media (max-width: 480px) {
      .topbar { padding: 0 8px; height: 46px; }
      .topbar-brand { font-size: 10px; letter-spacing: 1px; }
      .topbar-btn { font-size: 9px; padding: 0 6px; height: 20px; }
      .lang-btn { font-size: 9px; padding: 1px 5px; }
      .main-content { padding-top: 62px; padding-left: 8px; padding-right: 8px; }
      .page-title { font-size: 16px; }
      .module-grid { grid-template-columns: 1fr 1fr; gap: 8px; }
      .module-card { padding: 10px 12px; }
      .module-card .mod-desc { display: none; }
    }
  </style>
</head>
<body>

  <!-- ============================================================
       ВЕРХНЯЯ ПАНЕЛЬ
       ============================================================ -->
  <header class="topbar">
    <div class="topbar-left">
      <span class="topbar-brand">⚡ CRUCIX MONITOR</span>
      <span class="topbar-status">WARTIME STAGFLATION RISK</span>
    </div>
    <div class="topbar-right">
      <span class="topbar-time">SWEEP 30.1s</span>
      <span class="topbar-time" id="topbar-date">APR 3, 2026 07:18 PM</span>
      <span class="topbar-sources">SOURCES 28/29</span>
      
      <!-- КНОПКА "📋 КОПИРОВАТЬ" -->
      <button class="topbar-btn btn-help" onclick="showHelp()">❓ HELP</button>
    <button class="topbar-btn btn-copy" id="copy-btn" onclick="copyPageData()">📋 КОПИРОВАТЬ</button>
      
      <button class="topbar-btn btn-rss" onclick="window.location.href='/rss-feed'">📡 RSS</button>
      <button class="topbar-btn btn-ai" onclick="window.location.href='/ai-chat'">🧠 AI Чат</button>
      <button class="topbar-btn btn-map" onclick="window.location.href='/geo-map'">🌍 КАРТА</button>
      <button class="topbar-btn btn-index" onclick="window.location.href='/global-index'">📊 ИНДЕКС</button>
      <button class="topbar-btn btn-basket" onclick="window.location.href='/basket'">📦 КОРЗИНА</button>
      <button class="topbar-btn btn-scheduler" onclick="window.location.href='/scheduler'">⏰ ПЛАН</button>
      <button class="topbar-btn btn-trust" onclick="window.location.href='/trust'">🛡️ ДОВЕРИЕ</button>
      <button class="topbar-btn btn-grid" id="grid-toggle" onclick="toggleGrid()">📐 СЕТКА</button>
      
      <div class="lang-switch">
        <button class="lang-btn active" data-lang="ru" onclick="switchLang('ru')">RU</button>
        <button class="lang-btn" data-lang="en" onclick="switchLang('en')">EN</button>
      </div>
      
      <button class="topbar-btn btn-alert">🔴 HIGH ALERT</button>
    </div>
  </header>

  <!-- ============================================================
       ОСНОВНОЙ КОНТЕНТ
       ============================================================ -->
  <main class="main-content">
    <h1 class="page-title">🚀 CRUCIX — Все модули</h1>
    <p class="page-subtitle">25 модулей готовы. Выбери инструмент для работы:</p>
    
    <div class="module-grid" id="module-grid">
      <!-- Карточки заполняются через JavaScript -->
    </div>
    
    <div class="status-panel">
      <div class="title">🎉 Все 25 модулей Crucix готовы!</div>
      <div class="info">Версия 2.1.2 · 24 источника в системе доверия · Средний рейтинг: 80</div>
    </div>
  </main>

  <!-- ============================================================
       КООРДИНАТНАЯ СЕТКА
       ============================================================ -->
  <div id="coordinate-grid"></div>
  <div id="grid-coords">X: 0  Y: 0</div>

  <!-- ============================================================
       JAVASCRIPT
       ============================================================ -->
  <script>
    // ============================================================
    // 1. МОДУЛИ
    // ============================================================
    const MODULES = [
      { icon: '📊', name: 'Главный дашборд', desc: 'Оригинальный интерфейс Crucix', url: '/jarvis', badge: 'Оригинал' },
      { icon: '📰', name: 'RSS Лента', desc: 'Новости с фильтрами', url: '/rss-feed', badge: 'Модуль №1' },
      { icon: '📡', name: 'Управление RSS', desc: 'Добавление/удаление лент', url: '/rss-dashboard', badge: 'Модуль №1' },
      { icon: '🧠', name: 'AI Чат', desc: 'Локальный ИИ-помощник', url: '/ai-chat', badge: 'Модуль №3' },
      { icon: '🌍', name: 'Геополитическая карта', desc: 'Статусы стран, маркеры', url: '/geo-map', badge: 'Модуль №2' },
      { icon: '📦', name: 'Корзина данных', desc: 'Все собранные новости', url: '/basket', badge: 'Модуль №4' },
      { icon: '📊', name: 'Глобальный индекс', desc: 'Напряжённость в мире', url: '/global-index', badge: 'Модуль №5' },
      { icon: '📈', name: 'Исторический анализ', desc: 'Сравнение периодов', url: '/historical-analysis', badge: 'Модуль №6' },
      { icon: '🔗', name: 'Кросс-корреляция', desc: 'Связи между событиями', url: '/correlation', badge: 'Модуль №7' },
      { icon: '🏗️', name: 'Инфраструктура', desc: 'Критические объекты', url: '/infrastructure', badge: 'Модуль №8' },
      { icon: '🌋', name: 'Землетрясения', desc: 'USGS мониторинг', url: '/usgs', badge: 'Модуль №20' },
      { icon: '📍', name: 'Локальный мониторинг', desc: 'Вокруг вас', url: '/local', badge: 'Модуль №21' },
      { icon: '⏰', name: 'Планировщик задач', desc: 'Автоматизация', url: '/scheduler', badge: 'Модуль №24' },
      { icon: '🛡️', name: 'Доверие к источникам', desc: 'Рейтинг СМИ', url: '/trust', badge: 'Модуль №25' },
      { icon: '📐', name: 'Инструмент "Сетка"', desc: 'Координатная разметка', url: '/grid-tool', badge: 'Вспомогательный' }
    ];

    // ============================================================
    // 2. РЕНДЕРИНГ КАРТОЧЕК
    // ============================================================
    function renderModules() {
      const grid = document.getElementById('module-grid');
      if (!grid) return;
      
      let html = '';
      for (const m of MODULES) {
        html += `
          <a class="module-card" href="${m.url}">
            <span class="mod-icon">${m.icon}</span>
            <span class="mod-name">${m.name}</span>
            <span class="mod-desc">${m.desc}</span>
            <span class="mod-badge">✅ ${m.badge}</span>
          </a>
        `;
      }
      grid.innerHTML = html;
    }

    // ============================================================
    // 3. ВРЕМЯ В ВЕРХНЕЙ ПАНЕЛИ
    // ============================================================
    function updateTopbar() {
      const now = new Date();
      const dateStr = now.toLocaleDateString('en-US', {
        month: 'short',
        day: 'numeric',
        year: 'numeric'
      }).toUpperCase();
      const timeStr = now.toLocaleTimeString('en-US', {
        hour: '2-digit',
        minute: '2-digit',
        hour12: true
      });
      const el = document.getElementById('topbar-date');
      if (el) el.textContent = `${dateStr} ${timeStr}`;
    }

    // ============================================================
    // 4. КНОПКА КОПИРОВАНИЯ
    // ============================================================
    function copyPageData() {
      try {
        const data = collectPageData();
        const text = formatDataForCopy(data);

        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(() => {
            showNotification('✅ Данные скопированы в буфер обмена');
          }).catch(() => {
            fallbackCopy(text);
          });
        } else {
          fallbackCopy(text);
        }
      } catch (e) {
        console.error('[Copy] Ошибка:', e);
        showNotification('❌ Ошибка копирования');
      }
    }

    function fallbackCopy(text) {
      const area = document.createElement('textarea');
      area.value = text;
      area.style.position = 'fixed';
      area.style.left = '-9999px';
      area.style.top = '-9999px';
      document.body.appendChild(area);
      area.select();
      try {
        document.execCommand('copy');
        showNotification('✅ Данные скопированы');
      } catch (e) {
        showNotification('❌ Ошибка копирования');
        console.error('[Copy] Fallback ошибка:', e);
      }
      document.body.removeChild(area);
    }

    function collectPageData() {
      const data = {
        title: document.title,
        time: new Date().toLocaleString(),
        modules: []
      };

      document.querySelectorAll('.module-card').forEach(card => {
        const name = card.querySelector('.mod-name')?.textContent?.trim() || '—';
        const desc = card.querySelector('.mod-desc')?.textContent?.trim() || '—';
        data.modules.push({ name, desc });
      });

      return data;
    }

    function formatDataForCopy(data) {
      let text = `=== ${data.title} ===\n`;
      text += `Дата: ${data.time}\n`;
      text += `Версия: 2.1.2\n`;
      text += `Модулей: ${data.modules.length}/25\n\n`;
      text += '--- МОДУЛИ ---\n';
      for (const m of data.modules) {
        text += `  ${m.name} — ${m.desc}\n`;
      }
      text += '\n--- СТАТУС ---\n';
      text += '✅ Все 25 модулей готовы\n';
      text += '🛡️ 24 источника в системе доверия\n';
      text += '📊 Средний рейтинг источников: 80\n';
      text += '\n--- CRUCIX OSINT TERMINAL ---\n';
      text += '🌐 http://localhost:3117\n';
      return text;
    }

    // ============================================================
    // 5. УВЕДОМЛЕНИЯ
    // ============================================================
    function showNotification(msg) {
      document.querySelectorAll('.notification').forEach(el => el.remove());
      
      const el = document.createElement('div');
      el.className = 'notification';
      el.textContent = msg;
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 2500);
    }

    // ============================================================
    // 6. ПЕРЕКЛЮЧАТЕЛЬ ЯЗЫКА
    // ============================================================
    let currentLang = localStorage.getItem('crucix-lang') || 'ru';

    function switchLang(lang) {
      currentLang = lang;
      localStorage.setItem('crucix-lang', lang);
      document.querySelectorAll('.lang-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.lang === lang);
      });
      showNotification(`🌐 Язык: ${lang.toUpperCase()}`);
    }

    // ============================================================
    // 7. КООРДИНАТНАЯ СЕТКА
    // ============================================================
    let gridVisible = false;
    const gridEl = document.getElementById('coordinate-grid');
    const coordsEl = document.getElementById('grid-coords');
    const gridBtn = document.getElementById('grid-toggle');

    document.addEventListener('keydown', function(e) {
      if (e.ctrlKey && e.shiftKey && e.key === 'G') {
        e.preventDefault();
        toggleGrid();
      }
    });

    function toggleGrid() {
      gridVisible = !gridVisible;
      if (gridEl) gridEl.classList.toggle('visible', gridVisible);
      if (coordsEl) coordsEl.classList.toggle('visible', gridVisible);
      if (gridBtn) gridBtn.classList.toggle('active', gridVisible);

      if (gridVisible) {
        showNotification('⊞ Сетка включена');
        document.addEventListener('mousemove', updateCoords);
      } else {
        showNotification('⊞ Сетка выключена');
        document.removeEventListener('mousemove', updateCoords);
      }
    }

    function updateCoords(e) {
      const el = document.getElementById('grid-coords');
      if (el) el.textContent = `X: ${e.clientX}  Y: ${e.clientY}`;
    }

    // ============================================================
    // 8. ИНИЦИАЛИЗАЦИЯ
    // ============================================================
    document.addEventListener('DOMContentLoaded', function() {
      renderModules();
      updateTopbar();
      setInterval(updateTopbar, 60000);

      document.querySelectorAll('.lang-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.lang === currentLang);
      });
    });
  </script>

<script src="/js/help.js"></script>
</body>
</html>
