<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crucix — Forecast Map</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.heat/0.2.0/leaflet-heat.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.heat/0.2.0/leaflet-heat.js"></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <!-- Локальный CSS (6 модулей из Network Map) -->
    <link rel="stylesheet" href="css/core.css" />
    <link rel="stylesheet" href="css/header.css" />
    <link rel="stylesheet" href="css/layers-panel.css" />
    <link rel="stylesheet" href="css/map.css" />
    <link rel="stylesheet" href="css/responsive.css" />
    <link rel="stylesheet" href="css/cii.css" />

    <!-- Флаг карты -->
    <script>window.CrucixMap = { mapType: 'forecasts', name: 'Crucix — Forecast Map' };</script>
</head>
<body>

    <!-- ===== ТОПБАР ===== -->
    <header class="topbar">
        <div class="topbar-left">
            <span class="topbar-brand" id="brand-text">🔮 CRUCIX FORECAST</span>
            <div class="refresh-inline" id="refresh-inline">
                <span class="label">🔄</span>
                <select id="refresh-interval">
                    <option value="0" selected>Выкл</option>
                    <option value="60000">1 мин</option>
                    <option value="300000">5 мин</option>
                    <option value="600000">10 мин</option>
                    <option value="1800000">30 мин</option>
                    <option value="3600000">1 час</option>
                </select>
                <span class="timer" id="refresh-timer">—</span>
                <button class="btn-refresh" id="refresh-now-btn" onclick="refreshMapData && refreshMapData()" title="Обновить сейчас">⟳</button>
                <span class="last-update" id="last-update-time">
                    <span class="status-dot active" id="status-dot"></span>
                    <span id="update-text">—</span>
                </span>
            </div>
        </div>
        <div class="topbar-right">
            <div class="map-switcher" id="map-switcher">
                <a class="map-switch-btn" data-map="events" href="../event-map/">Events</a>
                <a class="map-switch-btn" data-map="metrics" href="../metrics-map/">Metrics</a>
                <a class="map-switch-btn" data-map="semantic" href="../semantic-map/">Semantic</a>
                <a class="map-switch-btn" data-map="network" href="../network-map/">Network</a>
                <a class="map-switch-btn active" data-map="forecasts" href="../forecast-map/">Forecast</a>
            </div>
            <button class="topbar-btn btn-home" onclick="window.location.href='/jarvis'">← НА ГЛАВНУЮ</button>
            <button class="topbar-btn btn-copy" id="copy-btn" onclick="window.copyAllData && window.copyAllData()">📋 КОПИРОВАТЬ</button>
            <button class="topbar-btn btn-rss" onclick="window.location.href='/registry'">📡 Список страниц</button>
            <button class="topbar-btn btn-help" onclick="window.openHelp && window.openHelp()">❓ HELP</button>
            <button class="topbar-btn btn-heat" id="btn-heat" onclick="window.toggleHeat && window.toggleHeat()">🌡️ Тепловая</button>
            <button class="topbar-btn btn-timeline" id="btn-timeline" onclick="window.toggleTimeline && window.toggleTimeline()">📅 Хронология</button>
            <button class="topbar-btn btn-pdf" onclick="window.exportPDF && window.exportPDF()">📄 PDF</button>
            <div class="lang-switch">
                <button class="lang-btn active" data-lang="ru" onclick="window.setLanguage && window.setLanguage('ru')">RU</button>
                <button class="lang-btn" data-lang="en" onclick="window.setLanguage && window.setLanguage('en')">EN</button>
            </div>
        </div>
    </header>

    <!-- ===== 17 КНОПОК ДАШБОРДОВ ===== -->
    <nav class="nav-dashboards">
        <button class="nav-btn active" onclick="window.location.href='/dashboard-5in1'"><span class="icon">🎯</span>Центр аналитики</button>
        <button class="nav-btn" onclick="window.location.href='/dashboard-economic'"><span class="icon">📊</span>Экономика</button>
        <button class="nav-btn" onclick="window.location.href='/dashboard-financial'"><span class="icon">💰</span>Финансы</button>
        <button class="nav-btn" onclick="window.location.href='/dashboard-military'"><span class="icon">🛡️</span>Военный</button>
        <button class="nav-btn" onclick="window.location.href='/dashboard-geopolitical'"><span class="icon">🌍</span>Геополитика</button>
        <button class="nav-btn" onclick="window.location.href='/dashboard-ecological'"><span class="icon">🌿</span>Экология</button>
        <button class="nav-btn" onclick="window.location.href='/dashboard-cyber'"><span class="icon">🔒</span>Кибер</button>
        <button class="nav-btn" onclick="window.location.href='/dashboard-space'"><span class="icon">🚀</span>Космос</button>
        <button class="nav-btn" onclick="window.location.href='/dashboard-news'"><span class="icon">📰</span>Новости</button>
        <button class="nav-btn" onclick="window.location.href='/dashboard-ai'"><span class="icon">🧠</span>AI</button>
        <button class="nav-btn" onclick="window.location.href='/dashboard-scientific'"><span class="icon">🔬</span>Наука</button>
        <button class="nav-btn" onclick="window.location.href='/dashboard-esg'"><span class="icon">🌱</span>ESG</button>
        <button class="nav-btn" onclick="window.location.href='/dashboard-threats'"><span class="icon">⚡</span>Угрозы</button>
        <button class="nav-btn" onclick="window.location.href='/dashboard-health'"><span class="icon">🏥</span>Здоровье</button>
        <button class="nav-btn" onclick="window.location.href='/dashboard-energy'"><span class="icon">⛽</span>Энергетика</button>
        <button class="nav-btn" onclick="window.location.href='/dashboard-transport'"><span class="icon">🚛</span>Транспорт</button>
        <button class="nav-btn" onclick="window.location.href='/dashboard-regions'"><span class="icon">🌏</span>Регионы</button>
    </nav>
    <div style="height:2px; background: linear-gradient(90deg, transparent, rgba(91,192,248,0.3), transparent); margin:0;"></div>

    <!-- ===== ПАНЕЛЬ СЛОЁВ (справа) ===== -->
    <button class="panel-toggle-btn" id="panel-toggle-btn" onclick="window.toggleLayerPanel && window.toggleLayerPanel()">📋</button>

    <div class="layer-panel" id="layer-panel">
        <div class="layer-panel-header">
            <div style="display:flex; gap:6px; margin-top:4px; width:100%; justify-content:space-between;">
                <div>
                    <button onclick="window.enableAllLayers && window.enableAllLayers()" style="background:rgba(91,192,248,0.12); border:1px solid rgba(91,192,248,0.2); color:#5bc0f8; border-radius:3px; padding:2px 8px; font-size:9px; cursor:pointer;">Включить все</button>
                    <button onclick="window.disableAllLayers && window.disableAllLayers()" style="background:rgba(239,68,68,0.12); border:1px solid rgba(239,68,68,0.2); color:#ef4444; border-radius:3px; padding:2px 8px; font-size:9px; cursor:pointer;">Выключить все</button>
                </div>
                <span id="active-layers-count" style="font-size:9px; color:#4a5a6a; align-self:center;">0 активных</span>
            </div>
            <span class="layer-panel-title" id="layers-title">🔮 СЛОИ <span class="count" id="layer-count">0</span></span>
            <button class="layer-panel-toggle" onclick="window.toggleLayerPanel && window.toggleLayerPanel()">✕</button>
        </div>
        <input class="layer-search" id="layer-search" type="text" placeholder="🔍 Поиск слоёв..." oninput="window.filterLayers && window.filterLayers()" />
        <div id="layer-grid" class="layer-grid"></div>
    </div>

    <!-- ===== КАРТА ===== -->
    <div class="map-container" id="map-container">
        <div id="map"></div>
        <div class="loading-overlay" id="loading-overlay">
            <div class="spinner"></div>
            <div class="text" id="loading-text">ЗАГРУЗКА ПРОГНОЗНОЙ КАРТЫ...</div>
        </div>

        <div id="choropleth-legend"></div>

        <div class="stats" id="stats">
            <div class="count" id="marker-count">0</div>
            <div class="label" id="stats-label">объектов</div>
            <div class="countries-count" id="countries-count">🌍 0 стран</div>
        </div>

        <div class="ssi-panel" id="ssi-panel">
            <div class="ssi-title" id="ssi-title">📊 Индекс напряжённости (SSI)</div>
            <div class="ssi-bar"><div class="ssi-fill" id="ssi-fill"></div></div>
            <div class="ssi-value" id="ssi-label">0%</div>
        </div>

        <div class="timeline-panel" id="timeline-panel">
            <div class="timeline-title">
                <span>📅 Хронология прогнозов</span>
                <button class="close-btn" onclick="window.toggleTimeline && window.toggleTimeline()" style="background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.06);color:#8899aa;border-radius:4px;padding:2px 12px;font-size:12px;cursor:pointer;">✕ Закрыть</button>
            </div>
            <div class="timeline-track" id="timeline-track"></div>
            <div class="timeline-date" id="timeline-date">—</div>
            <div class="timeline-stats">
                <span>📊 <span id="timeline-events">0</span> прогнозов</span>
                <span>📅 <span id="timeline-days">0</span> дней</span>
            </div>
        </div>
    </div>

    <!-- ===== ЛОКАЛЬНЫЕ СКРИПТЫ ===== -->
    <script src="js/core.js"></script>
    <script src="js/countries.js"></script>
    <script src="js/layers.js"></script>
    <script src="js/maps-config.js"></script>
    <script src="js/forecast-adapter.js"></script>
    <script src="js/map-controls.js"></script>
    <script src="js/markers.js"></script>
    <script src="js/forecast-map.js"></script>
    <script src="js/copy-data.js"></script>
    <script src="js/heat-timeline.js"></script>
    <script src="js/ssi.js"></script>
    <script src="js/cii.js"></script>
    <script src="js/refresh.js"></script>
    <script src="js/logger.js"></script>
    <script src="js/topbar.js"></script>
    <script src="js/init.js"></script>
</body>
</html>
