<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Золото/Серебро — Crucix</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0a0f; color: #c8d0d8; font-family: -apple-system, 'Segoe UI', monospace; min-height: 100vh; }
        .topbar { position: fixed; top: 0; left: 0; right: 0; height: 60px; background: rgba(10,10,20,0.92); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(255,255,255,0.04); z-index: 100; display: flex; justify-content: space-between; align-items: center; padding: 0 20px; }
        .topbar-brand { font-size: 14px; font-weight: 700; color: #5bc0f8; text-transform: uppercase; letter-spacing: 2px; }
        .topbar-right { display: flex; align-items: center; gap: 6px; }
        .topbar-btn { height: 28px; padding: 0 12px; border: 1px solid rgba(255,255,255,0.08); border-radius: 4px; background: rgba(255,255,255,0.03); color: #888; font-size: 11px; font-weight: 500; cursor: pointer; transition: all 0.2s; }
        .topbar-btn:hover { background: rgba(255,255,255,0.06); transform: translateY(-1px); }
        .btn-home { color: #5bc0f8; border-color: rgba(91,192,248,0.2); background: rgba(91,192,248,0.06); }
        .btn-copy { color: #5bc0f8; border-color: rgba(91,192,248,0.15); background: rgba(91,192,248,0.06); }
        .lang-switch { display: flex; gap: 2px; padding: 2px; background: rgba(255,255,255,0.03); border-radius: 4px; border: 1px solid rgba(255,255,255,0.06); }
        .lang-btn { padding: 2px 8px; border: none; background: transparent; color: #666; font-size: 11px; font-weight: 500; cursor: pointer; border-radius: 3px; }
        .lang-btn.active { color: #5bc0f8; background: rgba(91,192,248,0.1); }
        .main-content { padding-top: 76px; max-width: 1200px; margin: 0 auto; padding-left: 20px; padding-right: 20px; padding-bottom: 40px; }
        .page-title { font-size: 24px; font-weight: 700; color: #e8f0f8; margin-bottom: 20px; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 24px; }
        .stat-card { background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.05); border-radius: 8px; padding: 14px 16px; }
        .stat-card .label { font-size: 11px; color: #8899aa; text-transform: uppercase; }
        .stat-card .value { font-size: 22px; font-weight: 700; margin-top: 4px; }
        .chart-container { background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.05); border-radius: 12px; padding: 16px; min-height: 300px; }
        .chart-container .title { font-size: 13px; font-weight: 600; color: #8899aa; margin-bottom: 12px; }
        .chart-bars { display: flex; align-items: flex-end; height: 200px; gap: 2px; }
        .chart-bars .bar { flex: 1; border-radius: 2px 2px 0 0; min-height: 4px; transition: all 0.3s; }
        .chart-labels { display: flex; justify-content: space-between; font-size: 9px; color: #4a5a6a; margin-top: 4px; }
        .notification { position: fixed; bottom: 60px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.85); color: #fff; padding: 8px 20px; border-radius: 6px; font-size: 13px; z-index: 100001; border: 1px solid rgba(255,255,255,0.1); animation: notif-fade 2.5s forwards; }
        @keyframes notif-fade { 0% { opacity: 0; transform: translateX(-50%) translateY(10px); } 10% { opacity: 1; transform: translateX(-50%) translateY(0); } 80% { opacity: 1; } 100% { opacity: 0; transform: translateX(-50%) translateY(-20px); } }
    </style>
</head>
<body>
<header class="topbar">
    <div class="topbar-left"><span class="topbar-brand">💰 GOLD/SILVER RATIO</span></div>
    <div class="topbar-right">
        <button class="topbar-btn btn-home" onclick="window.location.href='/jarvis'">← НА ГЛАВНУЮ</button>
        <button class="topbar-btn btn-copy" id="copy-btn">📋 КОПИРОВАТЬ</button>
        <button class="topbar-btn" onclick="window.location.href='/rss-feed'">📡 Список страниц</button>
        <div class="lang-switch">
            <button class="lang-btn active" data-lang="ru" onclick="switchLang('ru')">RU</button>
            <button class="lang-btn" data-lang="en" onclick="switchLang('en')">EN</button>
        </div>
    </div>
</header>
<main class="main-content">
    <div class="page-title">💰 Золото/Серебро — финансовый индикатор</div>
    <div class="stats-grid" id="statsGrid">
        <div class="stat-card"><div class="label">Текущий Ratio</div><div class="value" id="currentRatio">—</div></div>
        <div class="stat-card"><div class="label">Нефть WTI</div><div class="value" id="currentOil" style="color:#f59e0b;">—</div></div>
        <div class="stat-card"><div class="label">Газ Henry Hub</div><div class="value" id="currentGas" style="color:#5bc0f8;">—</div></div>
        <div class="stat-card"><div class="label">Данных</div><div class="value" id="dataCount">—</div></div>
    </div>
    <div class="chart-container">
        <div class="title">📈 Динамика индекса (30 дней)</div>
        <div class="chart-bars" id="chartBars"></div>
        <div class="chart-labels" id="chartLabels"></div>
    </div>
</main>
<script>
let currentLang = localStorage.getItem('crucix-lang') || 'ru';
function switchLang(lang) { currentLang = lang; localStorage.setItem('crucix-lang', lang); document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.dataset.lang === lang)); }
document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.dataset.lang === currentLang));
function showNotification(msg) { document.querySelectorAll('.notification').forEach(el => el.remove()); const el = document.createElement('div'); el.className = 'notification'; el.textContent = msg; document.body.appendChild(el); setTimeout(() => el.remove(), 2500); }
document.getElementById('copy-btn').addEventListener('click', function() { const text = document.body.innerText; navigator.clipboard.writeText(text).then(() => { this.textContent = '✅ Скопировано!'; setTimeout(() => { this.textContent = '📋 КОПИРОВАТЬ'; }, 3000); }).catch(() => { const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); this.textContent = '✅ Скопировано!'; setTimeout(() => { this.textContent = '📋 КОПИРОВАТЬ'; }, 3000); }); });
async function loadData() { try { const res = await fetch('/api/gold-silver/'); const json = await res.json(); return json.data || []; } catch { return []; } }
function render(data) {
    if (!data || data.length === 0) { document.getElementById('currentRatio').textContent = '—'; document.getElementById('currentOil').textContent = '—'; document.getElementById('currentGas').textContent = '—'; document.getElementById('dataCount').textContent = '0'; document.getElementById('chartBars').innerHTML = '<div style="color:#4a5a6a;padding:20px;">Нет данных</div>'; return; }
    const last = data[data.length - 1];
    document.getElementById('currentRatio').textContent = last.ratio.toFixed(2);
    document.getElementById('currentOil').textContent = '$' + last.oil.toFixed(2);
    document.getElementById('currentGas').textContent = '$' + last.gas.toFixed(2);
    document.getElementById('dataCount').textContent = data.length;
    const maxVal = Math.max(...data.map(d => d.ratio)) * 1.2 || 1;
    const bars = document.getElementById('chartBars');
    bars.innerHTML = data.map(d => { const h = Math.max((d.ratio / maxVal) * 180, 4); const color = d.ratio > 20 ? '#ef4444' : d.ratio > 15 ? '#f59e0b' : '#4ade80'; return `<div class="bar" style="height:${h}px;background:${color};"></div>`; }).join('');
    const labels = document.getElementById('chartLabels');
    const step = Math.max(1, Math.floor(data.length / 6));
    labels.innerHTML = data.map((d, i) => { if (i % step === 0 || i === data.length - 1) { return `<span>${d.date.slice(5)}</span>`; } return `<span></span>`; }).join('');
}
async function update() { const data = await loadData(); render(data); }
update();
setInterval(update, 60000);
</script>
</body>
</html>
