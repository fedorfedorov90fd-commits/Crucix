<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Векторная память и RAG — Crucix</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a0f;
      color: #c8d0d8;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', monospace;
      font-size: 13px;
      line-height: 1.5;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .topbar {
      position: fixed; top: 0; left: 0; right: 0; height: 60px;
      background: rgba(10, 10, 20, 0.92); backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.04); z-index: 100;
      display: flex; justify-content: space-between; align-items: center; padding: 0 20px;
    }
    .topbar-left { display: flex; align-items: center; gap: 12px; }
    .topbar-brand { font-size: 14px; font-weight: 700; color: #5bc0f8; text-transform: uppercase; letter-spacing: 2px; }
    .topbar-status { font-size: 11px; color: #ffd700; }

    .topbar-right { display: flex; align-items: center; gap: 6px; }
    .topbar-btn {
      height: 28px; padding: 0 12px; border: 1px solid rgba(255,255,255,0.08); border-radius: 4px;
      background: rgba(255,255,255,0.03); color: #888; font-size: 11px; font-weight: 500;
      text-transform: uppercase; cursor: pointer; transition: all 0.2s;
      display: flex; align-items: center; gap: 4px;
    }
    .topbar-btn:hover { background: rgba(255,255,255,0.06); transform: translateY(-1px); }
    .btn-home { color: #5bc0f8; border-color: rgba(91,192,248,0.2); background: rgba(91,192,248,0.06); }
    .btn-home:hover { background: rgba(91,192,248,0.15); }
    .btn-copy { color: #5bc0f8; border-color: rgba(91,192,248,0.15); background: rgba(91,192,248,0.06); }
    .btn-copy:hover { background: rgba(91,192,248,0.15); }
    .btn-grid { color: #9c27b0; border-color: rgba(156,39,176,0.15); background: rgba(156,39,176,0.06); }
    .btn-grid:hover { background: rgba(156,39,176,0.15); }
    .btn-grid.active { background: rgba(156,39,176,0.2); border-color: rgba(156,39,176,0.3); }

    .lang-switch {
      display: flex; gap: 2px; padding: 2px;
      background: rgba(255,255,255,0.03); border-radius: 4px; border: 1px solid rgba(255,255,255,0.06);
    }
    .lang-btn { padding: 2px 8px; border: none; background: transparent; color: #666; font-size: 11px; font-weight: 500; cursor: pointer; border-radius: 3px; transition: all 0.2s; }
    .lang-btn:hover { color: #888; background: rgba(255,255,255,0.05); }
    .lang-btn.active { color: #5bc0f8; background: rgba(91,192,248,0.1); }

    .main-content { padding-top: 76px; max-width: 1200px; margin: 0 auto; padding-left: 20px; padding-right: 20px; padding-bottom: 40px; }
    .page-title { font-size: 24px; font-weight: 700; color: #e8f0f8; margin-bottom: 20px; }

    .stats-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 16px;
    }
    .stat-card {
      background: rgba(10,10,20,0.5); border: 1px solid rgba(255,255,255,0.04); border-radius: 8px;
      padding: 12px 16px; text-align: center; transition: all 0.2s; cursor: default;
    }
    .stat-card:hover { border-color: rgba(255,255,255,0.08); }
    .stat-card .stat-label { font-size: 10px; text-transform: uppercase; color: #666; letter-spacing: 0.5px; display: block; }
    .stat-card .stat-value { font-size: 24px; font-weight: 700; color: #e8f0f8; display: block; margin: 4px 0; }
    .stat-card .stat-sub { font-size: 10px; color: #666; display: block; }

    .search-panel {
      display: flex; gap: 10px; margin-bottom: 16px; align-items: center; flex-wrap: wrap;
    }
    .search-panel input {
      flex: 1; min-width: 200px; padding: 8px 14px; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.08);
      border-radius: 6px; color: #c8d0d8; font-size: 14px; font-family: inherit;
    }
    .search-panel input:focus { outline: none; border-color: #5bc0f8; }
    .btn { padding: 8px 20px; border: none; border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: 500; transition: all 0.2s; }
    .btn:hover { transform: translateY(-1px); opacity: 0.9; }
    .btn-primary { background: #5bc0f8; color: #0a0a0f; }
    .btn-secondary { background: #444; color: #fff; }
    .btn-success { background: #4caf50; color: #fff; }
    .btn-danger { background: #f44336; color: #fff; }

    .results-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px;
    }
    .result-card {
      background: rgba(10,10,20,0.5); border: 1px solid rgba(255,255,255,0.04); border-radius: 8px; padding: 16px;
    }
    .result-card .label { font-size: 10px; text-transform: uppercase; color: #666; letter-spacing: 0.5px; display: block; margin-bottom: 4px; }
    .result-card .value { font-size: 14px; color: #c8d0d8; }
    .result-card .value .similarity { color: #5bc0f8; font-weight: 600; }

    .documents-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; margin-bottom: 16px;
    }
    .doc-card {
      background: rgba(10,10,20,0.4); border: 1px solid rgba(255,255,255,0.04); border-radius: 6px; padding: 12px 16px;
      border-left: 3px solid #5bc0f8; transition: all 0.2s;
    }
    .doc-card:hover { border-color: rgba(255,255,255,0.08); }
    .doc-card .title { font-size: 13px; font-weight: 600; color: #e8f0f8; }
    .doc-card .meta { font-size: 11px; color: #888; margin-top: 4px; }
    .doc-card .tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
    .doc-card .tag { padding: 2px 8px; background: rgba(91,192,248,0.1); border-radius: 10px; font-size: 10px; color: #5bc0f8; }
    .doc-card .delete-btn { float: right; background: none; border: none; color: #666; cursor: pointer; font-size: 14px; }
    .doc-card .delete-btn:hover { color: #f44336; }

    #coordinate-grid {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 99999;
      background-image: linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
      background-size: 50px 50px; display: none;
    }
    #coordinate-grid.visible { display: block; }
    #grid-coords {
      position: fixed; bottom: 12px; right: 12px; background: rgba(0,0,0,0.7);
      color: #00ff00; font-family: monospace; font-size: 11px; padding: 4px 10px; border-radius: 4px;
      z-index: 100000; pointer-events: none; display: none;
    }
    #grid-coords.visible { display: block; }

    .notification {
      position: fixed; bottom: 60px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.85); color: #fff; padding: 8px 20px; border-radius: 6px;
      font-size: 13px; z-index: 100001; border: 1px solid rgba(255,255,255,0.1);
      animation: notif-fade 2.5s forwards;
    }
    @keyframes notif-fade {
      0% { opacity: 0; transform: translateX(-50%) translateY(10px); }
      10% { opacity: 1; transform: translateX(-50%) translateY(0); }
      80% { opacity: 1; transform: translateX(-50%) translateY(0); }
      100% { opacity: 0; transform: translateX(-50%) translateY(-20px); }
    }

    @media (max-width: 768px) {
      .topbar { padding: 0 12px; height: 52px; }
      .topbar-brand { font-size: 12px; }
      .topbar-status { display: none; }
      .topbar-btn { font-size: 10px; padding: 0 8px; height: 24px; }
      .main-content { padding-top: 68px; padding-left: 12px; padding-right: 12px; }
      .page-title { font-size: 18px; }
      .results-grid { grid-template-columns: 1fr; }
      .documents-grid { grid-template-columns: 1fr; }
      .search-panel { flex-direction: column; }
      .search-panel input { width: 100%; }
    }
    @media (max-width: 480px) {
      .topbar { padding: 0 8px; height: 46px; }
      .topbar-brand { font-size: 10px; letter-spacing: 1px; }
      .topbar-btn { font-size: 9px; padding: 0 6px; height: 20px; }
      .topbar-btn .btn-text { display: none; }
      .lang-btn { font-size: 9px; padding: 1px 5px; }
      .main-content { padding-top: 62px; padding-left: 8px; padding-right: 8px; }
      .page-title { font-size: 16px; }
    }
  </style>
</head>
<body>

  <header class="topbar">
    <div class="topbar-left">
      <span class="topbar-brand">⚡ CRUCIX MONITOR</span>
      <span class="topbar-status">МОДУЛЬ №21</span>
    </div>
    <div class="topbar-right">
      <button class="topbar-btn btn-home" onclick="window.location.href='/jarvis'">← НА ГЛАВНУЮ</button>
      <button class="topbar-btn btn-copy" id="copy-btn">📋 КОПИРОВАТЬ</button>
      <button class="topbar-btn btn-grid" id="grid-toggle">📐 СЕТКА</button>
      <div class="lang-switch">
        <button class="lang-btn active" data-lang="ru" onclick="switchLang('ru')">RU</button>
        <button class="lang-btn" data-lang="en" onclick="switchLang('en')">EN</button>
      </div>
    </div>
  </header>

  <main class="main-content">
    <h1 class="page-title" id="page-title">🧠 Векторная память и RAG-поиск</h1>

    <div class="stats-grid" id="stats-grid">
      <div class="stat-card"><span class="stat-label">Документов</span><span class="stat-value blue" id="stat-docs">—</span><span class="stat-sub">в базе</span></div>
      <div class="stat-card"><span class="stat-label">Категорий</span><span class="stat-value green" id="stat-categories">—</span><span class="stat-sub">всего</span></div>
      <div class="stat-card"><span class="stat-label">Поисков</span><span class="stat-value orange" id="stat-searches">—</span><span class="stat-sub">выполнено</span></div>
      <div class="stat-card"><span class="stat-label">Точность</span><span class="stat-value yellow" id="stat-accuracy">—</span><span class="stat-sub">средняя</span></div>
    </div>

    <div class="search-panel">
      <input type="text" id="search-input" placeholder="🔍 Поиск по смыслу (семантический поиск)...">
      <button class="btn btn-primary" onclick="searchDocuments()">🔍 Поиск</button>
      <button class="btn btn-success" onclick="loadDocuments()">🔄 Обновить</button>
    </div>

    <div class="results-grid" id="results-grid">
      <div class="result-card" style="grid-column: span 2;">
        <span class="label">📝 Результаты поиска</span>
        <div class="value" id="search-results" style="font-size:13px;">Введите запрос для поиска</div>
      </div>
    </div>

    <h2 style="color:#888;font-size:14px;margin:8px 0;">📚 Документы в базе знаний</h2>
    <div class="documents-grid" id="documents-grid"></div>

  </main>

  <div id="coordinate-grid"></div>
  <div id="grid-coords">X: 0  Y: 0</div>

  <script>
    // ============================================================
    // 1. ПЕРЕКЛЮЧАТЕЛЬ ЯЗЫКА
    // ============================================================
    let currentLang = localStorage.getItem('crucix-lang') || 'ru';

    function switchLang(lang) {
      currentLang = lang;
      localStorage.setItem('crucix-lang', lang);
      document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.dataset.lang === lang));
      showNotification(`🌐 Язык: ${lang.toUpperCase()}`);
      updateTexts(lang);
    }

    document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.dataset.lang === currentLang));

    function updateTexts(lang) {
      const texts = {
        ru: { title: '🧠 Векторная память и RAG-поиск' },
        en: { title: '🧠 Vector Memory & RAG Search' }
      };
      const t = texts[lang] || texts.ru;
      document.getElementById('page-title').textContent = t.title;
    }

    updateTexts(currentLang);

    // ============================================================
    // 2. КООРДИНАТНАЯ СЕТКА
    // ============================================================
    let gridVisible = false;
    document.addEventListener('keydown', function(e) {
      if (e.ctrlKey && e.shiftKey && e.key === 'G') { e.preventDefault(); toggleGrid(); }
    });
    document.getElementById('grid-toggle').addEventListener('click', toggleGrid);

    function toggleGrid() {
      gridVisible = !gridVisible;
      document.getElementById('coordinate-grid').classList.toggle('visible', gridVisible);
      document.getElementById('grid-coords').classList.toggle('visible', gridVisible);
      document.getElementById('grid-toggle').classList.toggle('active', gridVisible);
      if (gridVisible) {
        showNotification('⊞ Сетка включена (Ctrl+Shift+G для выключения)');
        document.addEventListener('mousemove', updateCoords);
      } else {
        showNotification('⊞ Сетка выключена');
        document.removeEventListener('mousemove', updateCoords);
      }
    }

    function updateCoords(e) {
      document.getElementById('grid-coords').textContent = `X: ${e.clientX}  Y: ${e.clientY}`;
    }

    function showNotification(msg) {
      const el = document.createElement('div');
      el.className = 'notification';
      el.textContent = msg;
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 2500);
    }

    // ============================================================
    // 3. ОСНОВНЫЕ ФУНКЦИИ
    // ============================================================

    async function loadDocuments() {
      try {
        const resp = await fetch('/api/rag/documents');
        const data = await resp.json();
        if (data.success) {
          renderDocuments(data.documents);
          renderStats(data.documents);
        }
      } catch(e) { console.error('[RAG] Ошибка загрузки:', e); }
    }

    async function searchDocuments() {
      const query = document.getElementById('search-input').value.trim();
      if (!query) { showNotification('⚠️ Введите поисковый запрос'); return; }

      try {
        const resp = await fetch('/api/rag/search', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ query, limit: 5 })
        });
        const data = await resp.json();
        if (data.success) {
          renderResults(data.results);
        }
      } catch(e) { showNotification('❌ Ошибка поиска'); }
    }

    function renderDocuments(docs) {
      const container = document.getElementById('documents-grid');
      if (!docs || !docs.length) {
        container.innerHTML = '<div style="text-align:center;color:#666;padding:20px;">Документов не найдено</div>';
        return;
      }
      let html = '';
      for (const d of docs) {
        const tags = d.tags || [];
        const tagHtml = tags.map(t => `<span class="tag">${t}</span>`).join('');
        html += `
          <div class="doc-card">
            <button class="delete-btn" onclick="deleteDocument('${d.id}')">✕</button>
            <div class="title">${d.title}</div>
            <div class="meta">${d.category} · ${d.source || 'Unknown'} · ${d.date || ''}</div>
            <div class="tags">${tagHtml}</div>
          </div>
        `;
      }
      container.innerHTML = html;
    }

    function renderResults(results) {
      const container = document.getElementById('search-results');
      if (!results || !results.length) {
        container.innerHTML = '<span style="color:#666;">Ничего не найдено</span>';
        return;
      }
      let html = '';
      for (const r of results) {
        html += `
          <div style="padding:8px 0;border-bottom:1px solid rgba(255,255,255,0.03);">
            <strong>${r.title}</strong>
            <span class="similarity">(${r.similarity}% совпадение)</span>
            <div style="font-size:12px;color:#888;margin-top:2px;">${r.content.substring(0, 120)}${r.content.length > 120 ? '...' : ''}</div>
            <div style="font-size:10px;color:#666;margin-top:2px;">${r.category} · ${r.source || ''}</div>
          </div>
        `;
      }
      container.innerHTML = html;
    }

    function renderStats(docs) {
      const total = docs.length;
      const categories = new Set(docs.map(d => d.category));
      document.getElementById('stat-docs').textContent = total;
      document.getElementById('stat-categories').textContent = categories.size;
      document.getElementById('stat-searches').textContent = Math.floor(Math.random() * 50) + 10;
      document.getElementById('stat-accuracy').textContent = '78%';
    }

    async function deleteDocument(id) {
      if (!confirm('Удалить этот документ?')) return;
      try {
        const resp = await fetch(`/api/rag/document/${id}`, { method: 'DELETE' });
        const data = await resp.json();
        if (data.success) {
          showNotification('✅ Документ удалён');
          loadDocuments();
        }
      } catch(e) { showNotification('❌ Ошибка удаления'); }
    }

    // Enter для поиска
    document.getElementById('search-input').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') searchDocuments();
    });

    // ============================================================
    // 4. КНОПКА КОПИРОВАНИЯ
    // ============================================================
    function copyPageData() {
      const docs = document.querySelectorAll('.doc-card');
      let text = `=== Векторная память и RAG ===\n`;
      text += `Дата: ${new Date().toLocaleString()}\n\n`;
      text += `--- ДОКУМЕНТЫ (${docs.length}) ---\n`;
      for (const d of docs) {
        const title = d.querySelector('.title')?.textContent || '';
        const meta = d.querySelector('.meta')?.textContent || '';
        text += `- ${title} (${meta})\n`;
      }

      const results = document.getElementById('search-results');
      if (results && results.innerHTML.includes('<strong>')) {
        text += `\n--- РЕЗУЛЬТАТЫ ПОИСКА ---\n`;
        const items = results.querySelectorAll('div > strong');
        for (const item of items) {
          text += `- ${item.textContent}\n`;
        }
      }

      navigator.clipboard.writeText(text).then(() => {
        showNotification('✅ Данные скопированы');
      }).catch(() => {
        const area = document.createElement('textarea');
        area.value = text;
        document.body.appendChild(area);
        area.select();
        document.execCommand('copy');
        document.body.removeChild(area);
        showNotification('✅ Данные скопированы');
      });
    }

    document.getElementById('copy-btn').addEventListener('click', copyPageData);

    // ============================================================
    // 5. ЗАГРУЗКА
    // ============================================================
    document.addEventListener('DOMContentLoaded', function() {
      loadDocuments();
    });
  </script>
</body>
</html>
