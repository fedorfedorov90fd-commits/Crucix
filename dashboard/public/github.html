<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>github — Crucix</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a1a;
            color: #e0e0e0;
            font-family: -apple-system, 'Segoe UI', system-ui, sans-serif;
            min-height: 100vh;
        }
        .topbar {
            position: fixed; top: 0; left: 0; right: 0;
            height: 60px;
            background: rgba(10,10,20,0.95);
            backdrop-filter: blur(12px);
            border-bottom: 2px solid rgba(91,192,248,0.25);
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
        }
        .topbar-brand { font-size: 14px; font-weight: 700; color: #5bc0f8; text-transform: uppercase; letter-spacing: 2px; }
        .topbar-right { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
        .topbar-btn {
            height: 28px; padding: 0 12px;
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 4px;
            background: rgba(255,255,255,0.03);
            color: #888;
            font-size: 11px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 4px;
            font-family: inherit;
        }
        .topbar-btn:hover { background: rgba(255,255,255,0.06); }
        .btn-home { color: #5bc0f8; border-color: rgba(91,192,248,0.2); background: rgba(91,192,248,0.06); }
        .btn-copy { color: #5bc0f8; border-color: rgba(91,192,248,0.15); background: rgba(91,192,248,0.06); }
        .btn-help { color: #a78bfa; border-color: rgba(167,139,250,0.2); background: rgba(167,139,250,0.06); }
        .lang-switch { display: flex; gap: 2px; padding: 2px; background: rgba(255,255,255,0.03); border-radius: 4px; border: 1px solid rgba(255,255,255,0.06); }
        .lang-btn { padding: 2px 8px; border: none; background: transparent; color: #666; font-size: 11px; font-weight: 500; cursor: pointer; border-radius: 3px; font-family: inherit; }
        .lang-btn.active { color: #5bc0f8; background: rgba(91,192,248,0.1); }
        .nav-dashboards {
            position: fixed; top: 60px; left: 0; right: 0;
            height: 38px;
            background: rgba(6,10,18,0.92);
            backdrop-filter: blur(8px);
            border-bottom: 1px solid rgba(255,255,255,0.04);
            z-index: 99;
            display: flex;
            align-items: center;
            padding: 0 20px;
            gap: 4px;
            overflow-x: auto;
            scrollbar-width: none;
        }
        .nav-dashboards::-webkit-scrollbar { display: none; }
        .nav-btn {
            padding: 4px 10px;
            border: none;
            border-radius: 4px;
            background: transparent;
            color: #666;
            font-size: 10px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
            font-family: inherit;
        }
        .nav-btn:hover { color: #c8d0d8; background: rgba(255,255,255,0.04); }
        .nav-btn.active { color: #5bc0f8; background: rgba(91,192,248,0.08); border-color: rgba(91,192,248,0.15); }
        .main-content {
            padding-top: 114px;
            max-width: 1440px;
            margin: 0 auto;
            padding-left: 20px;
            padding-right: 20px;
            padding-bottom: 40px;
            min-height: calc(100vh - 114px);
        }
        .page-title { font-size: 24px; font-weight: 600; color: #5bc0f8; margin-bottom: 20px; }
        .module-info { background: rgba(255,255,255,0.03); border-radius: 8px; padding: 20px; border: 1px solid rgba(255,255,255,0.06); }
        .module-info h2 { font-size: 16px; color: #aaa; margin-bottom: 10px; }
        .module-info p { color: #888; font-size: 14px; line-height: 1.6; }
        .notification {
            position: fixed; bottom: 60px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.85); color: #fff; padding: 8px 20px;
            border-radius: 6px; font-size: 13px; z-index: 100001;
            border: 1px solid rgba(255,255,255,0.1);
            animation: notif-fade 2.5s forwards;
        }
        @keyframes notif-fade {
            0% { opacity: 0; transform: translateX(-50%) translateY(10px); }
            10% { opacity: 1; transform: translateX(-50%) translateY(0); }
            80% { opacity: 1; }
            100% { opacity: 0; transform: translateX(-50%) translateY(-20px); }
        }
        .status-badge {
            display: inline-block; padding: 2px 10px; border-radius: 4px;
            font-size: 11px; font-weight: 600;
        }
        .status-online { background: rgba(76,175,80,0.2); color: #4caf50; }
        .status-offline { background: rgba(244,67,54,0.2); color: #f44336; }
    </style>
</head>
<body>
<header class="topbar">
    <div class="topbar-left"><span class="topbar-brand">🎯 CRUCIX</span></div>
    <div class="topbar-right">
        <button class="topbar-btn btn-home" onclick="window.location.href='/jarvis'">← НА ГЛАВНУЮ</button>
        <button class="topbar-btn btn-copy" onclick="copyPageData()">📋 КОПИРОВАТЬ</button>
        <button class="topbar-btn btn-help" onclick="openHelp()">❓ HELP</button>
        <div class="lang-switch">
            <button class="lang-btn active" onclick="switchLang('ru')">RU</button>
            <button class="lang-btn" onclick="switchLang('en')">EN</button>
        </div>
    </div>
</header>
<nav class="nav-dashboards">
    <button class="nav-btn active" onclick="window.location.href='/github'">github</button>
</nav>
<main class="main-content">
    <h1 class="page-title">📊 github</h1>
    <div class="module-info">
        <h2>Статус: <span class="status-badge status-online">ONLINE</span></h2>
        <p>API-эндпоинт: /api/layers/github</p>
        <p>Данные загружаются из корзины data/basket/github.json</p>
        <button onclick="loadData()" style="margin-top:10px;padding:8px 16px;background:rgba(91,192,248,0.15);border:1px solid rgba(91,192,248,0.2);border-radius:4px;color:#5bc0f8;cursor:pointer;">🔄 Загрузить данные</button>
        <pre id="data-output" style="margin-top:10px;background:rgba(0,0,0,0.3);padding:10px;border-radius:4px;font-size:12px;max-height:400px;overflow-y:auto;color:#aaa;"></pre>
    </div>
</main>
<script>
let currentLang = localStorage.getItem('crucix-lang') || 'ru';
function switchLang(lang) {
    currentLang = lang; localStorage.setItem('crucix-lang', lang);
    document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.dataset.lang === lang));
}
function showNotification(msg) {
    document.querySelectorAll('.notification').forEach(el => el.remove());
    const el = document.createElement('div'); el.className = 'notification'; el.textContent = msg;
    document.body.appendChild(el); setTimeout(() => el.remove(), 2500);
}
function openHelp() {
    const pageId = window.location.pathname.replace(/^\/+/, "").replace(/\.html$/, "") || "jarvis";
    fetch(`/data/help/${currentLang}/${pageId}.txt`).then(r => r.text()).then(t => alert(t)).catch(() => alert("Справка не найдена"));
}
function copyPageData() {
    const report = `=== CRUCIX ===\nДата: ${new Date().toLocaleString()}\nСтраница: github\nURL: ${window.location.href}\n`;
    navigator.clipboard.writeText(report).then(() => showNotification('✅ Скопировано'));
}
function loadData() {
    const module = 'github';
    fetch(`/api/layers/${module}`).then(r => r.json()).then(data => {
        document.getElementById('data-output').textContent = JSON.stringify(data, null, 2);
        showNotification(`✅ Загружено ${data.features?.length || 0} записей`);
    }).catch(e => {
        document.getElementById('data-output').textContent = 'Ошибка: ' + e.message;
    });
}
document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.dataset.lang === currentLang));
</script>
</body>
</html>
