<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Профиль пользователя — Crucix</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a0f;
      color: #c8d0d8;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', monospace;
      font-size: 13px;
      line-height: 1.5;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .topbar {
      position: fixed; top: 0; left: 0; right: 0; height: 60px;
      background: rgba(10, 10, 20, 0.92); backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.04); z-index: 100;
      display: flex; justify-content: space-between; align-items: center; padding: 0 20px;
    }
    .topbar-left { display: flex; align-items: center; gap: 12px; }
    .topbar-brand { font-size: 14px; font-weight: 700; color: #5bc0f8; text-transform: uppercase; letter-spacing: 2px; }
    .topbar-status { font-size: 11px; color: #ffd700; }

    .topbar-right { display: flex; align-items: center; gap: 6px; }
    .topbar-btn {
      height: 28px; padding: 0 12px; border: 1px solid rgba(255,255,255,0.08); border-radius: 4px;
      background: rgba(255,255,255,0.03); color: #888; font-size: 11px; font-weight: 500;
      text-transform: uppercase; cursor: pointer; transition: all 0.2s;
      display: flex; align-items: center; gap: 4px;
    }
    .topbar-btn:hover { background: rgba(255,255,255,0.06); transform: translateY(-1px); }
    .btn-home { color: #5bc0f8; border-color: rgba(91,192,248,0.2); background: rgba(91,192,248,0.06); }
    .btn-home:hover { background: rgba(91,192,248,0.15); }
    .btn-copy { color: #5bc0f8; border-color: rgba(91,192,248,0.15); background: rgba(91,192,248,0.06); }
    .btn-copy:hover { background: rgba(91,192,248,0.15); }
    .btn-grid { color: #9c27b0; border-color: rgba(156,39,176,0.15); background: rgba(156,39,176,0.06); }
    .btn-grid:hover { background: rgba(156,39,176,0.15); }
    .btn-grid.active { background: rgba(156,39,176,0.2); border-color: rgba(156,39,176,0.3); }

    .lang-switch {
      display: flex; gap: 2px; padding: 2px;
      background: rgba(255,255,255,0.03); border-radius: 4px; border: 1px solid rgba(255,255,255,0.06);
    }
    .lang-btn { padding: 2px 8px; border: none; background: transparent; color: #666; font-size: 11px; font-weight: 500; cursor: pointer; border-radius: 3px; transition: all 0.2s; }
    .lang-btn:hover { color: #888; background: rgba(255,255,255,0.05); }
    .lang-btn.active { color: #5bc0f8; background: rgba(91,192,248,0.1); }

    .main-content { padding-top: 76px; max-width: 1000px; margin: 0 auto; padding-left: 20px; padding-right: 20px; padding-bottom: 40px; }
    .page-title { font-size: 24px; font-weight: 700; color: #e8f0f8; margin-bottom: 20px; }

    .profile-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 16px;
    }
    .profile-card {
      background: rgba(10,10,20,0.5); border: 1px solid rgba(255,255,255,0.04); border-radius: 8px; padding: 20px;
    }
    .profile-card h2 { font-size: 14px; color: #888; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 12px; }

    .field { margin-bottom: 12px; }
    .field label { display: block; font-size: 11px; text-transform: uppercase; color: #666; letter-spacing: 0.5px; margin-bottom: 2px; }
    .field input, .field select {
      width: 100%; padding: 8px 12px; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.08);
      border-radius: 4px; color: #c8d0d8; font-size: 13px; font-family: inherit;
    }
    .field input:focus, .field select:focus { outline: none; border-color: #5bc0f8; }
    .field select option { background: #1a1a2e; }

    .btn {
      padding: 8px 20px; border: none; border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: 500; transition: all 0.2s;
    }
    .btn:hover { transform: translateY(-1px); opacity: 0.9; }
    .btn-primary { background: #5bc0f8; color: #0a0a0f; }
    .btn-success { background: #4caf50; color: #fff; }
    .btn-secondary { background: #444; color: #fff; }
    .btn-danger { background: #f44336; color: #fff; }

    .toggle-group { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
    .toggle-item {
      display: flex; align-items: center; gap: 6px; padding: 4px 12px;
      background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.06); border-radius: 4px;
      cursor: pointer; font-size: 12px; transition: all 0.2s;
    }
    .toggle-item:hover { background: rgba(255,255,255,0.05); }
    .toggle-item.active { border-color: #5bc0f8; background: rgba(91,192,248,0.1); color: #5bc0f8; }
    .toggle-item input { display: none; }

    .activity-list { max-height: 300px; overflow-y: auto; }
    .activity-item {
      display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,0.03);
      font-size: 12px;
    }
    .activity-item .time { color: #666; }
    .activity-item .action { color: #c8d0d8; }

    .export-import { display: flex; gap: 8px; margin-top: 12px; }

    #coordinate-grid {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 99999;
      background-image: linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
      background-size: 50px 50px; display: none;
    }
    #coordinate-grid.visible { display: block; }
    #grid-coords {
      position: fixed; bottom: 12px; right: 12px; background: rgba(0,0,0,0.7);
      color: #00ff00; font-family: monospace; font-size: 11px; padding: 4px 10px; border-radius: 4px;
      z-index: 100000; pointer-events: none; display: none;
    }
    #grid-coords.visible { display: block; }

    .notification {
      position: fixed; bottom: 60px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.85); color: #fff; padding: 8px 20px; border-radius: 6px;
      font-size: 13px; z-index: 100001; border: 1px solid rgba(255,255,255,0.1);
      animation: notif-fade 2.5s forwards;
    }
    @keyframes notif-fade {
      0% { opacity: 0; transform: translateX(-50%) translateY(10px); }
      10% { opacity: 1; transform: translateX(-50%) translateY(0); }
      80% { opacity: 1; transform: translateX(-50%) translateY(0); }
      100% { opacity: 0; transform: translateX(-50%) translateY(-20px); }
    }

    @media (max-width: 768px) {
      .topbar { padding: 0 12px; height: 52px; }
      .topbar-brand { font-size: 12px; }
      .topbar-status { display: none; }
      .topbar-btn { font-size: 10px; padding: 0 8px; height: 24px; }
      .main-content { padding-top: 68px; padding-left: 12px; padding-right: 12px; }
      .page-title { font-size: 18px; }
      .profile-grid { grid-template-columns: 1fr; }
    }
    @media (max-width: 480px) {
      .topbar { padding: 0 8px; height: 46px; }
      .topbar-brand { font-size: 10px; letter-spacing: 1px; }
      .topbar-btn { font-size: 9px; padding: 0 6px; height: 20px; }
      .topbar-btn .btn-text { display: none; }
      .lang-btn { font-size: 9px; padding: 1px 5px; }
      .main-content { padding-top: 62px; padding-left: 8px; padding-right: 8px; }
      .page-title { font-size: 16px; }
      .toggle-group { gap: 4px; }
      .toggle-item { padding: 2px 8px; font-size: 10px; }
    }
  </style>
</head>
<body>

  <header class="topbar">
    <div class="topbar-left">
      <span class="topbar-brand">⚡ CRUCIX MONITOR</span>
      <span class="topbar-status">МОДУЛЬ №17</span>
    </div>
    <div class="topbar-right">
      <button class="topbar-btn btn-home" onclick="window.location.href='/jarvis'">← НА ГЛАВНУЮ</button>
      <button class="topbar-btn btn-help" onclick="showHelp()">❓ HELP</button>
    <button class="topbar-btn btn-copy" id="copy-btn">📋 КОПИРОВАТЬ</button>
      <button class="topbar-btn btn-grid" id="grid-toggle">📐 СЕТКА</button>
      <div class="lang-switch">
        <button class="lang-btn active" data-lang="ru" onclick="switchLang('ru')">RU</button>
        <button class="lang-btn" data-lang="en" onclick="switchLang('en')">EN</button>
      </div>
    </div>
  </header>

  <main class="main-content">
    <h1 class="page-title" id="page-title">👤 Цифровой двойник пользователя</h1>

    <div class="profile-grid">
      <!-- Профиль -->
      <div class="profile-card">
        <h2>👤 Профиль</h2>
        <div class="field">
          <label>Имя пользователя</label>
          <input type="text" id="username" value="Аналитик">
        </div>
        <div class="field">
          <label>Роль</label>
          <select id="role">
            <option value="analyst">Аналитик</option>
            <option value="researcher">Исследователь</option>
            <option value="viewer">Наблюдатель</option>
            <option value="admin">Администратор</option>
          </select>
        </div>
        <div class="field">
          <label>Email</label>
          <input type="email" id="email" placeholder="user@example.com">
        </div>
        <button class="btn btn-primary" onclick="saveProfile()">💾 Сохранить</button>
      </div>

      <!-- Настройки интерфейса -->
      <div class="profile-card">
        <h2>🎨 Настройки интерфейса</h2>
        <div class="field">
          <label>Тема</label>
          <select id="theme">
            <option value="dark">Тёмная</option>
            <option value="light">Светлая</option>
            <option value="auto">Авто</option>
          </select>
        </div>
        <div class="field">
          <label>Язык</label>
          <select id="language">
            <option value="ru">Русский</option>
            <option value="en">English</option>
            <option value="zh">中文</option>
            <option value="hi">हिन्दी</option>
          </select>
        </div>
        <div class="field">
          <label>Макет</label>
          <select id="layout">
            <option value="compact">Компактный</option>
            <option value="comfortable">Комфортный</option>
            <option value="spacious">Просторный</option>
          </select>
        </div>
        <div class="field">
          <label>Автообновление</label>
          <select id="autoRefresh">
            <option value="30s">30 секунд</option>
            <option value="60s">60 секунд</option>
            <option value="5min">5 минут</option>
            <option value="15min">15 минут</option>
            <option value="off">Выключено</option>
          </select>
        </div>
        <button class="btn btn-primary" onclick="saveSettings()">💾 Сохранить</button>
      </div>

      <!-- Источники данных -->
      <div class="profile-card">
        <h2>📡 Источники данных</h2>
        <div class="toggle-group" id="sources-group">
          <label class="toggle-item active" data-source="rss"><input type="checkbox" checked> RSS</label>
          <label class="toggle-item active" data-source="newsapi"><input type="checkbox" checked> NewsAPI</label>
          <label class="toggle-item active" data-source="satellite"><input type="checkbox" checked> Спутники</label>
          <label class="toggle-item active" data-source="aviation"><input type="checkbox" checked> Авиация</label>
          <label class="toggle-item active" data-source="shipping"><input type="checkbox" checked> Морской</label>
          <label class="toggle-item active" data-source="economy"><input type="checkbox" checked> Экономика</label>
          <label class="toggle-item active" data-source="cyber"><input type="checkbox" checked> Кибер</label>
          <label class="toggle-item active" data-source="thinktanks"><input type="checkbox" checked> Аналитика</label>
        </div>
        <button class="btn btn-primary" onclick="saveSources()">💾 Сохранить</button>
      </div>

      <!-- Активность -->
      <div class="profile-card">
        <h2>📜 История активности</h2>
        <div class="activity-list" id="activity-list">
          <div style="text-align:center;color:#666;padding:10px;">Загрузка...</div>
        </div>
        <div class="export-import">
          <button class="btn btn-secondary" onclick="exportProfile()">📤 Экспорт</button>
          <button class="btn btn-secondary" onclick="document.getElementById('import-file').click()">📥 Импорт</button>
          <input type="file" id="import-file" accept=".json" style="display:none" onchange="importProfile(event)">
        </div>
      </div>
    </div>

  </main>

  <div id="coordinate-grid"></div>
  <div id="grid-coords">X: 0  Y: 0</div>

  <script>
    // ============================================================
    // 1. ПЕРЕКЛЮЧАТЕЛЬ ЯЗЫКА
    // ============================================================
    let currentLang = localStorage.getItem('crucix-lang') || 'ru';

    function switchLang(lang) {
      currentLang = lang;
      localStorage.setItem('crucix-lang', lang);
      document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.dataset.lang === lang));
      showNotification(`🌐 Язык: ${lang.toUpperCase()}`);
      updateTexts(lang);
    }

    document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.dataset.lang === currentLang));

    function updateTexts(lang) {
      const texts = {
        ru: { title: '👤 Цифровой двойник пользователя' },
        en: { title: '👤 User Digital Twin' }
      };
      const t = texts[lang] || texts.ru;
      document.getElementById('page-title').textContent = t.title;
    }

    updateTexts(currentLang);

    // ============================================================
    // 2. КООРДИНАТНАЯ СЕТКА
    // ============================================================
    let gridVisible = false;
    document.addEventListener('keydown', function(e) {
      if (e.ctrlKey && e.shiftKey && e.key === 'G') { e.preventDefault(); toggleGrid(); }
    });
    document.getElementById('grid-toggle').addEventListener('click', toggleGrid);

    function toggleGrid() {
      gridVisible = !gridVisible;
      document.getElementById('coordinate-grid').classList.toggle('visible', gridVisible);
      document.getElementById('grid-coords').classList.toggle('visible', gridVisible);
      document.getElementById('grid-toggle').classList.toggle('active', gridVisible);
      if (gridVisible) {
        showNotification('⊞ Сетка включена (Ctrl+Shift+G для выключения)');
        document.addEventListener('mousemove', updateCoords);
      } else {
        showNotification('⊞ Сетка выключена');
        document.removeEventListener('mousemove', updateCoords);
      }
    }

    function updateCoords(e) {
      document.getElementById('grid-coords').textContent = `X: ${e.clientX}  Y: ${e.clientY}`;
    }

    function showNotification(msg) {
      const el = document.createElement('div');
      el.className = 'notification';
      el.textContent = msg;
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 2500);
    }

    // ============================================================
    // 3. ОСНОВНЫЕ ФУНКЦИИ
    // ============================================================

    async function loadProfile() {
      try {
        const resp = await fetch('/api/user/profile');
        const data = await resp.json();
        if (data.success) {
          const p = data.profile;
          document.getElementById('username').value = p.username || 'Аналитик';
          document.getElementById('role').value = p.role || 'analyst';
          document.getElementById('email').value = p.email || '';
          if (p.settings) {
            document.getElementById('theme').value = p.settings.theme || 'dark';
            document.getElementById('language').value = p.settings.language || 'ru';
            document.getElementById('layout').value = p.settings.layout || 'comfortable';
            document.getElementById('autoRefresh').value = p.settings.autoRefresh || '60s';
            // Источники
            if (p.settings.sources) {
              document.querySelectorAll('#sources-group .toggle-item').forEach(el => {
                const src = el.dataset.source;
                const checked = p.settings.sources[src] !== false;
                el.classList.toggle('active', checked);
                el.querySelector('input').checked = checked;
              });
            }
          }
        }
      } catch(e) { console.error('[Profile] Ошибка загрузки:', e); }
    }

    async function saveProfile() {
      const data = {
        username: document.getElementById('username').value,
        role: document.getElementById('role').value,
        email: document.getElementById('email').value
      };
      try {
        const resp = await fetch('/api/user/profile', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });
        const result = await resp.json();
        if (result.success) {
          showNotification('✅ Профиль сохранён');
          await addActivity('profile_update', 'Обновлён профиль');
        } else {
          showNotification('❌ Ошибка: ' + (result.error || 'Неизвестная ошибка'));
        }
      } catch(e) { showNotification('❌ Ошибка соединения'); }
    }

    async function saveSettings() {
      const data = {
        theme: document.getElementById('theme').value,
        language: document.getElementById('language').value,
        layout: document.getElementById('layout').value,
        autoRefresh: document.getElementById('autoRefresh').value
      };
      try {
        const resp = await fetch('/api/user/settings', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });
        const result = await resp.json();
        if (result.success) {
          showNotification('✅ Настройки сохранены');
          await addActivity('settings_update', 'Обновлены настройки');
        } else {
          showNotification('❌ Ошибка: ' + (result.error || 'Неизвестная ошибка'));
        }
      } catch(e) { showNotification('❌ Ошибка соединения'); }
    }

    async function saveSources() {
      const sources = {};
      document.querySelectorAll('#sources-group .toggle-item').forEach(el => {
        sources[el.dataset.source] = el.querySelector('input').checked;
      });
      try {
        const resp = await fetch('/api/user/settings', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ sources })
        });
        const result = await resp.json();
        if (result.success) {
          showNotification('✅ Источники сохранены');
          await addActivity('sources_update', 'Обновлены источники данных');
        } else {
          showNotification('❌ Ошибка: ' + (result.error || 'Неизвестная ошибка'));
        }
      } catch(e) { showNotification('❌ Ошибка соединения'); }
    }

    // Клик по toggle
    document.querySelectorAll('#sources-group .toggle-item').forEach(el => {
      el.addEventListener('click', function() {
        const cb = this.querySelector('input');
        cb.checked = !cb.checked;
        this.classList.toggle('active', cb.checked);
      });
    });

    async function loadActivity() {
      try {
        const resp = await fetch('/api/user/activity?limit=20');
        const data = await resp.json();
        if (data.success) {
          renderActivity(data.activity);
        }
      } catch(e) { console.error('[Profile] Ошибка загрузки активности:', e); }
    }

    function renderActivity(activity) {
      const container = document.getElementById('activity-list');
      if (!activity || !activity.length) {
        container.innerHTML = '<div style="text-align:center;color:#666;padding:10px;">История пуста</div>';
        return;
      }
      let html = '';
      for (const a of activity) {
        const time = new Date(a.timestamp).toLocaleString();
        const actionLabels = {
          'visit': 'Посещение',
          'profile_update': 'Обновление профиля',
          'settings_update': 'Обновление настроек',
          'sources_update': 'Обновление источников',
          'scenario_run': 'Запуск сценария',
          'login': 'Вход в систему'
        };
        const label = actionLabels[a.action] || a.action;
        html += `
          <div class="activity-item">
            <span class="action">${label} ${a.target ? '— ' + a.target : ''}</span>
            <span class="time">${time}</span>
          </div>
        `;
      }
      container.innerHTML = html;
    }

    async function addActivity(action, target) {
      try {
        await fetch('/api/user/activity', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action, target })
        });
        loadActivity();
      } catch(e) { console.error('[Profile] Ошибка добавления активности:', e); }
    }

    async function exportProfile() {
      window.location.href = '/api/user/export';
      showNotification('📤 Экспорт начат');
    }

    async function importProfile(event) {
      const file = event.target.files[0];
      if (!file) return;
      try {
        const text = await file.text();
        const data = JSON.parse(text);
        const resp = await fetch('/api/user/import', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });
        const result = await resp.json();
        if (result.success) {
          showNotification('✅ Профиль импортирован');
          loadProfile();
          loadActivity();
        } else {
          showNotification('❌ Ошибка импорта');
        }
      } catch(e) { showNotification('❌ Ошибка чтения файла'); }
      event.target.value = '';
    }

    // ============================================================
    // 4. КНОПКА КОПИРОВАНИЯ
    // ============================================================
    function copyPageData() {
      const username = document.getElementById('username').value || '—';
      const role = document.getElementById('role').value || '—';
      const theme = document.getElementById('theme').value || '—';
      const language = document.getElementById('language').value || '—';
      const layout = document.getElementById('layout').value || '—';
      const refresh = document.getElementById('autoRefresh').value || '—';

      let text = `=== Профиль пользователя ===\n`;
      text += `Дата: ${new Date().toLocaleString()}\n\n`;
      text += `--- ПРОФИЛЬ ---\n`;
      text += `Имя: ${username}\n`;
      text += `Роль: ${role}\n`;
      text += `Тема: ${theme}\n`;
      text += `Язык: ${language}\n`;
      text += `Макет: ${layout}\n`;
      text += `Обновление: ${refresh}\n\n`;
      text += `--- ИСТОЧНИКИ ---\n`;
      document.querySelectorAll('#sources-group .toggle-item').forEach(el => {
        const checked = el.querySelector('input').checked;
        text += `${el.dataset.source}: ${checked ? '✅' : '❌'}\n`;
      });

      navigator.clipboard.writeText(text).then(() => {
        showNotification('✅ Данные скопированы');
      }).catch(() => {
        const area = document.createElement('textarea');
        area.value = text;
        document.body.appendChild(area);
        area.select();
        document.execCommand('copy');
        document.body.removeChild(area);
        showNotification('✅ Данные скопированы');
      });
    }

    document.getElementById('copy-btn').addEventListener('click', copyPageData);

    // ============================================================
