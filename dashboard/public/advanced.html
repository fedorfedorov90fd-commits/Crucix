<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crucix · Advanced Analytics v3.0</title>
<style>
:root{--bg:#06080f;--surface:#0d1220;--surface2:#161d2e;--surface3:#1f2842;--border:#1a2540;--border2:#2b3a5c;--text:#e8edf5;--text-dim:#8fa1c2;--text-faint:#5a6b8a;--accent:#3b82f6;--accent2:#8b5cf6;--accent3:#ec4899;--green:#22c55e;--yellow:#eab308;--orange:#f97316;--red:#ef4444;--cyan:#06b6d4;--mono:'SF Mono',monospace}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,sans-serif;background:var(--bg);color:var(--text);padding:20px;min-height:100vh;font-size:13px}
.header{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;background:linear-gradient(90deg,var(--surface),rgba(139,92,246,0.08));border:1px solid var(--border);border-radius:14px;margin-bottom:20px;flex-wrap:wrap;gap:12px}
.header h1{font-size:20px;font-weight:800}
.header h1 span{color:var(--text-dim);font-weight:400;font-size:13px}
.badge{padding:4px 10px;background:var(--surface2);border:1px solid var(--border2);border-radius:6px;font-family:var(--mono);font-size:11px}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px;max-width:1900px;margin:0 auto}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px}
.card-title{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--text-dim);margin-bottom:14px}
.col-12{grid-column:span 12}.col-8{grid-column:span 8}.col-6{grid-column:span 6}.col-4{grid-column:span 4}
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.stat-card{background:var(--surface2);padding:12px;border-radius:10px;text-align:center}
.stat-value{font-family:var(--mono);font-size:24px;font-weight:800;color:var(--accent2)}
.stat-label{font-size:10px;color:var(--text-faint);text-transform:uppercase;margin-top:4px}
.empty{text-align:center;padding:40px;color:var(--text-faint);font-size:12px}
.row{padding:10px 12px;background:var(--surface2);border-radius:8px;margin-bottom:8px;border-left:3px solid var(--accent)}
.row-header{display:flex;justify-content:space-between;margin-bottom:4px}
.row-name{font-weight:600;font-size:12px}
.row-value{font-family:var(--mono);font-weight:700;font-size:13px}
.row-meta{font-size:10px;color:var(--text-faint);font-family:var(--mono)}
</style>
</head>
<body>

<div class="header">
<h1>Crucix <span>· Advanced Analytics v3.0</span></h1>
<div style="display:flex;gap:10px;font-family:var(--mono);font-size:11px">
<span class="badge" id="last-update">—</span>
<span class="badge" id="regime">regime: —</span>
</div>
</div>

<div class="grid">

<div class="card col-12">
<div class="stats-grid">
<div class="stat-card"><div class="stat-value" id="stat-causal">—</div><div class="stat-label">Causal Signal</div></div>
<div class="stat-card"><div class="stat-value" id="stat-warfare">—</div><div class="stat-label">Info Ops</div></div>
<div class="stat-card"><div class="stat-value" id="stat-resources">—</div><div class="stat-label">Resources</div></div>
<div class="stat-card"><div class="stat-value" id="stat-scenarios">—</div><div class="stat-label">Scenarios</div></div>
</div>
</div>

<div class="card col-6">
<div class="card-title">Temporal Causal</div>
<div id="temporal"><div class="empty">Загрузка...</div></div>
</div>

<div class="card col-6">
<div class="card-title">Multi-Layer Causal</div>
<div id="multilayer"><div class="empty">Загрузка...</div></div>
</div>

<div class="card col-6">
<div class="card-title">Narrative Warfare</div>
<div id="warfare"><div class="empty">Загрузка...</div></div>
</div>

<div class="card col-6">
<div class="card-title">Resource Exhaustion</div>
<div id="resources"><div class="empty">Загрузка...</div></div>
</div>

<div class="card col-6">
<div class="card-title">Meta-Ensemble</div>
<div id="meta"><div class="empty">Загрузка...</div></div>
</div>

<div class="card col-6">
<div class="card-title">Scenarios</div>
<div id="scenarios"><div class="empty">Загрузка...</div></div>
</div>

</div>

<script>
const $ = id => document.getElementById(id);

async function load() {
try {
const res = await fetch('../runs/predictions/latest_forecast.json');
if (!res.ok) throw new Error('HTTP ' + res.status);
const data = await res.json();
render(data);
} catch (e) {
document.querySelectorAll('.empty').forEach(el => el.textContent = 'Нет данных: ' + e.message);
}
}

function render(data) {
if (data.timestamp) $('last-update').textContent = new Date(data.timestamp).toLocaleTimeString('ru-RU');
if (data.metaEnsemble?.currentRegime) $('regime').textContent = 'regime: ' + data.metaEnsemble.currentRegime;

// Stats
$('stat-causal').textContent = data.combinedCausalSignal?.type || '—';
$('stat-warfare').textContent = data.narrativeWarfare?.campaignsDetected || 0;
$('stat-resources').textContent = data.resourceExhaustion?.overallStatus || '—';
$('stat-scenarios').textContent = data.scenarios?.scenarioCount || 0;

// Temporal
if (data.temporalCausal) {
const tc = data.temporalCausal;
const shifts = tc.shiftDetections || [];
$('temporal').innerHTML = '<div style="font-size:11px;color:var(--text-dim);margin-bottom:8px">Событий: ' + (tc.totalEvents || 0) + ' · Сдвигов: ' + shifts.length + '</div>' +
(shifts.length > 0 ? shifts.slice(0, 5).map(s =>
'<div class="row" style="border-left-color:' + (s.type === 'accelerating' ? '#ef4444' : '#06b6d4') + '">' +
'<div class="row-header"><span class="row-name">' + s.from + ' → ' + s.to + '</span>' +
'<span class="row-value" style="color:' + (s.type === 'accelerating' ? '#ef4444' : '#06b6d4') + '">' + s.shiftPct.toFixed(0) + '%</span></div>' +
'<div class="row-meta">' + s.type + ' · z=' + s.zScore.toFixed(2) + '</div></div>'
).join('') : '<div class="empty">Нет сдвигов</div>');
}

// Multi-layer
if (data.multiLayerCausal) {
const ml = data.multiLayerCausal;
const prop = ml.propagation || {};
$('multilayer').innerHTML = '<div style="font-size:11px;color:var(--text-dim);margin-bottom:8px">Узлов: ' + (ml.graphStats?.nodeCount || 0) + ' · Кросс-слойных: ' + (ml.graphStats?.crossLayerEdgeCount || 0) + '</div>' +
'<div style="font-size:11px;color:var(--text-dim)">Propagation updates: ' + (prop.totalUpdates || 0) + ' (cross-layer: ' + (prop.crossLayerUpdates || 0) + ')</div>';
}

// Warfare
if (data.narrativeWarfare) {
const nw = data.narrativeWarfare;
$('warfare').innerHTML = '<div style="font-size:13px;font-weight:700;color:var(--accent3);margin-bottom:8px">' + (nw.assessment || '—') + '</div>' +
'<div style="font-size:11px;color:var(--text-dim)">Кампаний: ' + (nw.campaignsDetected || 0) + ' · Угроза: ' + ((nw.threatLevel || 0) * 100).toFixed(0) + '%</div>';
}

// Resources
if (data.resourceExhaustion) {
const re = data.resourceExhaustion;
$('resources').innerHTML = '<div style="font-size:13px;font-weight:700;margin-bottom:8px">' + (re.overallStatus || '—') + '</div>' +
'<div style="font-size:11px;color:var(--text-dim)">Давление: ' + ((re.overallPressure || 0) * 100).toFixed(0) + '%</div>' +
(re.interpretation ? '<div style="font-size:10px;color:var(--text-faint);margin-top:6px">' + re.interpretation + '</div>' : '');
}

// Meta
if (data.metaEnsemble) {
const me = data.metaEnsemble;
const weights = Object.entries(me.modelWeights || {}).sort((a, b) => b[1] - a[1]).slice(0, 5);
$('meta').innerHTML = '<div style="font-size:13px;font-weight:700;color:var(--accent);margin-bottom:8px">Режим: ' + (me.currentRegime || '—') + '</div>' +
weights.map(([name, w]) =>
'<div style="display:flex;justify-content:space-between;padding:4px 0;font-size:11px">' +
'<span>' + name + '</span><span style="font-family:var(--mono);color:var(--accent)">' + (w * 100).toFixed(1) + '%</span></div>'
).join('');
}

// Scenarios
if (data.scenarios?.scenarios) {
$('scenarios').innerHTML = data.scenarios.scenarios.slice(0, 6).map(sc =>
'<div class="row">' +
'<div class="row-header"><span class="row-name">' + sc.name + '</span>' +
'<span class="row-value">' + ((sc.probability || 0) * 100).toFixed(0) + '%</span></div>' +
'<div class="row-meta">' + sc.severity + ' · ' + (sc.horizonHours || '?') + 'ч</div></div>'
).join('');
}
}

load();
setInterval(load, 60000);
</script>

</body>
</html>
