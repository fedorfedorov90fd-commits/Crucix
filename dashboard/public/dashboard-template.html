<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>[НАЗВАНИЕ СТРАНИЦЫ] — Crucix</title>
    <style>
        /* ============================================================
           БАЗОВЫЕ СТИЛИ (не менять — единый стиль всех дашбордов)
           ============================================================ */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a1a;
            color: #e0e0e0;
            font-family: -apple-system, 'Segoe UI', system-ui, sans-serif;
            min-height: 100vh;
        }

        /* ===== ТОПБАР (кнопки управления) ===== */
        .topbar {
            position: fixed; top: 0; left: 0; right: 0;
            height: 60px;
            background: rgba(10,10,20,0.95);
            backdrop-filter: blur(12px);
            border-bottom: 2px solid rgba(91,192,248,0.25);
            box-shadow: 0 2px 20px rgba(91,192,248,0.08);
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
        }
        .topbar::after {
            content: "";
            position: absolute;
            bottom: -2px; left: 0; right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, #5bc0f8, transparent);
            opacity: 0.6;
        }
        .topbar-left { display: flex; align-items: center; gap: 12px; }
        .topbar-brand { font-size: 14px; font-weight: 700; color: #5bc0f8; text-transform: uppercase; letter-spacing: 2px; }
        .topbar-right { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
        .topbar-btn {
            height: 28px; padding: 0 12px;
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 4px;
            background: rgba(255,255,255,0.03);
            color: #888;
            font-size: 11px;
            font-weight: 500;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .topbar-btn:hover { background: rgba(255,255,255,0.06); transform: translateY(-1px); }
        .btn-home { color: #5bc0f8; border-color: rgba(91,192,248,0.2); background: rgba(91,192,248,0.06); }
        .btn-home:hover { background: rgba(91,192,248,0.15); }
        .btn-copy { color: #5bc0f8; border-color: rgba(91,192,248,0.15); background: rgba(91,192,248,0.06); }
        .btn-copy.copied { background: rgba(76,175,80,0.2); border-color: #4caf50; color: #4caf50; }
        .btn-rss { color: #f26522; border-color: rgba(242,101,34,0.2); background: rgba(242,101,34,0.06); }
        .btn-rss:hover { background: rgba(242,101,34,0.15); }
        .btn-help { color: #a78bfa; border-color: rgba(167,139,250,0.2); background: rgba(167,139,250,0.06); }
        .btn-help:hover { background: rgba(167,139,250,0.15); }

        .lang-switch {
            display: flex; gap: 2px; padding: 2px;
            background: rgba(255,255,255,0.03);
            border-radius: 4px;
            border: 1px solid rgba(255,255,255,0.06);
        }
        .lang-btn {
            padding: 2px 8px; border: none; background: transparent;
            color: #666; font-size: 11px; font-weight: 500;
            cursor: pointer; border-radius: 3px; transition: all 0.2s;
        }
        .lang-btn:hover { color: #888; background: rgba(255,255,255,0.05); }
        .lang-btn.active { color: #5bc0f8; background: rgba(91,192,248,0.1); }

        .copy-dropdown { position: relative; display: inline-block; }
        .copy-dropdown-content {
            display: none;
            position: absolute;
            right: 0;
            top: 32px;
            background: #0a0a1a;
            min-width: 220px;
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 8px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.6);
            z-index: 200;
            padding: 6px 0;
        }
        .copy-dropdown-content.show { display: block; }
        .copy-dropdown-content button {
            display: block; width: 100%; padding: 8px 16px;
            background: transparent; border: none;
            color: #c8d0d8; font-size: 12px; text-align: left;
            cursor: pointer; transition: all 0.15s;
            font-family: inherit;
        }
        .copy-dropdown-content button:hover { background: rgba(91,192,248,0.08); color: #5bc0f8; }
        .copy-dropdown-content .divider { height: 1px; background: rgba(255,255,255,0.05); margin: 4px 12px; }
        .copy-dropdown-content .label { padding: 4px 16px; font-size: 10px; color: #4a5a6a; text-transform: uppercase; letter-spacing: 0.5px; }

        /* ===== НАВИГАЦИЯ ПО ДАШБОРДАМ ===== */
        .nav-dashboards {
            position: fixed;
            top: 60px;
            left: 0;
            right: 0;
            height: 38px;
            background: rgba(6,10,18,0.92);
            backdrop-filter: blur(8px);
            border-bottom: 1px solid rgba(255,255,255,0.04);
            z-index: 99;
            display: flex;
            align-items: center;
            padding: 0 20px;
            gap: 4px;
            overflow-x: auto;
            scrollbar-width: none;
        }
        .nav-dashboards::-webkit-scrollbar { display: none; }
        .nav-btn {
            padding: 4px 10px;
            border: none;
            border-radius: 4px;
            background: transparent;
            color: #666;
            font-size: 10px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
            font-family: inherit;
            border: 1px solid transparent;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 3px;
        }
        .nav-btn:hover { color: #c8d0d8; background: rgba(255,255,255,0.04); }
        .nav-btn.active { color: #5bc0f8; background: rgba(91,192,248,0.08); border-color: rgba(91,192,248,0.15); }
        .nav-btn .icon { margin-right: 3px; }

        /* ===== ОСНОВНОЙ КОНТЕНТ ===== */
        .main-content {
            padding-top: 114px;
            max-width: 1440px;
            margin: 0 auto;
            padding-left: 20px;
            padding-right: 20px;
            padding-bottom: 40px;
            min-height: calc(100vh - 114px);
        }
        .page-title {
            font-size: 28px;
            font-weight: 700;
            color: #e8f0f8;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .page-title .badge {
            font-size: 12px; font-weight: 400;
            background: rgba(251,191,36,0.15); color: #fbbf24;
            padding: 2px 12px; border-radius: 20px;
            border: 1px solid rgba(251,191,36,0.2);
        }
        .page-subtitle { color: #8899aa; font-size: 14px; margin-bottom: 24px; }
        .page-subtitle a { color: #5bc0f8; text-decoration: none; }
        .page-subtitle a:hover { text-decoration: underline; }

        /* ===== ОБЩИЕ КОМПОНЕНТЫ (карточки, графики, лента — можно переиспользовать) ===== */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 12px;
            margin-bottom: 24px;
        }
        .charts-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 24px;
        }
        .feed {
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 10px;
            padding: 16px;
            max-height: 300px;
            overflow-y: auto;
        }
        .feed .title {
            font-size: 13px;
            font-weight: 600;
            color: #8899aa;
            margin-bottom: 8px;
        }

        /* ===== УВЕДОМЛЕНИЯ ===== */
        .notification {
            position: fixed;
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.85);
            color: #ffffff;
            padding: 8px 20px;
            border-radius: 6px;
            font-size: 13px;
            z-index: 100001;
            border: 1px solid rgba(255,255,255,0.1);
            animation: notif-fade 2.5s forwards;
        }
        @keyframes notif-fade {
            0% { opacity: 0; transform: translateX(-50%) translateY(10px); }
            10% { opacity: 1; transform: translateX(-50%) translateY(0); }
            80% { opacity: 1; }
            100% { opacity: 0; transform: translateX(-50%) translateY(-20px); }
        }

        /* ===== АДАПТИВНОСТЬ ===== */
        @media (max-width: 1200px) { .cards-grid { grid-template-columns: repeat(4, 1fr); } }
        @media (max-width: 992px) { .cards-grid { grid-template-columns: repeat(3, 1fr); } }
        @media (max-width: 768px) {
            .cards-grid { grid-template-columns: repeat(2, 1fr); }
            .charts-row { grid-template-columns: 1fr; }
            .topbar { padding: 0 12px; height: 52px; }
            .topbar-brand { font-size: 12px; }
            .topbar-btn { font-size: 10px; padding: 0 8px; height: 24px; }
            .nav-dashboards { top: 52px; height: 34px; padding: 0 10px; gap: 2px; }
            .nav-btn { font-size: 9px; padding: 2px 6px; }
            .main-content { padding-top: 102px; padding-left: 12px; padding-right: 12px; }
            .page-title { font-size: 20px; }
        }
        @media (max-width: 480px) {
            .cards-grid { grid-template-columns: 1fr; }
            .topbar { padding: 0 8px; height: 46px; }
            .topbar-brand { font-size: 10px; letter-spacing: 1px; }
            .topbar-btn { font-size: 9px; padding: 0 6px; height: 20px; }
            .lang-btn { font-size: 9px; padding: 1px 5px; }
            .nav-dashboards { top: 46px; height: 30px; padding: 0 6px; gap: 2px; overflow-x: auto; }
            .nav-btn { font-size: 8px; padding: 2px 5px; }
            .main-content { padding-top: 92px; padding-left: 8px; padding-right: 8px; }
            .page-title { font-size: 16px; }
        }

        /* ============================================================
           СТИЛИ ДЛЯ КОНКРЕТНОЙ СТРАНИЦЫ (добавляй здесь)
           ============================================================ */
        /* .my-custom-widget { ... } */
    </style>
</head>
<body>

<main class="main-content">

<script>
// ============================================================
// БАЗОВЫЕ ФУНКЦИИ (не менять — единый стиль всех дашбордов)
// ============================================================

// 1. ПЕРЕКЛЮЧАТЕЛЬ ЯЗЫКА
let currentLang = localStorage.getItem('crucix-lang') || 'ru';
function switchLang(lang) {
    currentLang = lang;
    localStorage.setItem('crucix-lang', lang);
    document.querySelectorAll('.lang-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.lang === lang);
    });
    showNotification('🌐 Язык: ' + lang.toUpperCase());
}
document.querySelectorAll('.lang-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.lang === currentLang);
});

// 2. УВЕДОМЛЕНИЯ И HELP
function showNotification(msg) {
    document.querySelectorAll('.notification').forEach(el => el.remove());
    const el = document.createElement('div');
    el.className = 'notification';
    el.textContent = msg;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 2500);
}
function openHelp() {
    const pageId = window.location.pathname.replace(/^\/+/, "").replace(/\.html$/, "") || "jarvis";
    const lang = currentLang || "ru";
    const helpFile = `/data/help/${lang}/${pageId}.txt`;
    fetch(helpFile).then(res => res.text()).then(text => {
        alert(text || "Справка не найдена");
    }).catch(() => alert("Справка не найдена"));
}

// 3. КНОПКА КОПИРОВАТЬ (универсальный снапшот)
document.getElementById('copy-btn').addEventListener('click', function(e) {
    e.stopPropagation();
    document.getElementById('copyDropdown').classList.toggle('show');
});
document.addEventListener('click', function() {
    document.getElementById('copyDropdown').classList.remove('show');
});
function copyPageData(format) {
    const timestamp = new Date().toLocaleString();
    const pageTitle = document.querySelector('.page-title')?.textContent || document.title || 'Без заголовка';
    const url = window.location.href;
    const windowSize = window.innerWidth + '×' + window.innerHeight;

    let report = '=== CRUCIX — СНАПШОТ СТРАНИЦЫ ===\n';
    report += 'Дата: ' + timestamp + '\n';
    report += 'URL: ' + url + '\n';
    report += 'Размер окна: ' + windowSize + '\n';
    report += 'Страница: ' + pageTitle + '\n\n';

    // Карточки (если есть)
    const cards = document.querySelectorAll('.card-link');
    if (cards.length > 0) {
        report += '--- КАРТОЧКИ (' + cards.length + ') ---\n';
        cards.forEach(card => {
            const number = card.querySelector('.card-number')?.textContent || '—';
            const name = card.querySelector('.name')?.textContent || '—';
            const value = card.querySelector('.main-value')?.textContent || '—';
            const status = card.querySelector('.status-label')?.textContent || '—';
            report += number + ' ' + name + ': ' + value + ' (' + status + ')\n';
        });
    }

    // Глобальный индекс (если есть)
    const globalIdx = document.getElementById('globalIndex')?.textContent;
    if (globalIdx) {
        report += '\n--- ГЛОБАЛЬНЫЙ ИНДЕКС ---\n';
        report += 'Индекс: ' + globalIdx + '\n';
    }

    report += '\n--- CRUCIX OSINT TERMINAL ---\n';
    report += '🌐 ' + window.location.origin;

    navigator.clipboard.writeText(report).then(() => {
        const btn = document.getElementById('copy-btn');
        btn.textContent = '✅ ' + format.toUpperCase();
        btn.classList.add('copied');
        setTimeout(() => {
            btn.textContent = '📋 КОПИРОВАТЬ ▼';
            btn.classList.remove('copied');
        }, 3000);
        showNotification('✅ Скопировано в формате ' + format.toUpperCase());
    }).catch(() => {
        const textarea = document.createElement('textarea');
        textarea.value = report;
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand('copy');
        document.body.removeChild(textarea);
        showNotification('✅ Скопировано в формате ' + format.toUpperCase());
    });
}
document.querySelectorAll('#copyDropdown button[data-format]').forEach(btn => {
    btn.addEventListener('click', function(e) {
        e.stopPropagation();
        document.getElementById('copyDropdown').classList.remove('show');
        copyPageData(this.dataset.format);
    });
});
