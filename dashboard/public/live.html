<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Лента новостей — Crucix</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a0f; color: #c8d0d8;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', monospace;
      font-size: 13px; line-height: 1.5; min-height: 100vh; overflow-x: hidden;
    }
    .topbar {
      position: fixed; top: 0; left: 0; right: 0; height: 60px;
      background: rgba(10, 10, 20, 0.95); backdrop-filter: blur(12px);
      border-bottom: 2px solid rgba(91, 192, 248, 0.25);
      box-shadow: 0 2px 20px rgba(91, 192, 248, 0.08);
      z-index: 100; display: flex; justify-content: space-between; align-items: center; padding: 0 20px;
    }
    .topbar::after {
      content: ""; position: absolute; bottom: -2px; left: 0; right: 0; height: 2px;
      background: linear-gradient(90deg, transparent, #5bc0f8, transparent); opacity: 0.6;
    }
    .topbar-left { display: flex; align-items: center; gap: 12px; }
    .topbar-brand { font-size: 14px; font-weight: 700; color: #5bc0f8; text-transform: uppercase; letter-spacing: 2px; }
    .topbar-status { font-size: 11px; color: #ffd700; }
    .topbar-right { display: flex; align-items: center; gap: 6px; }
    .topbar-btn {
      height: 28px; padding: 0 12px; border: 1px solid rgba(255,255,255,0.08); border-radius: 4px;
      background: rgba(255,255,255,0.03); color: #888; font-size: 11px; font-weight: 500;
      text-transform: uppercase; cursor: pointer; transition: all 0.2s;
      display: flex; align-items: center; gap: 4px; font-family: inherit;
    }
    .topbar-btn:hover { background: rgba(255,255,255,0.06); transform: translateY(-1px); }
    .btn-home { color: #5bc0f8; border-color: rgba(91,192,248,0.2); background: rgba(91,192,248,0.06); }
    .btn-home:hover { background: rgba(91,192,248,0.15); }
    .btn-copy { color: #5bc0f8; border-color: rgba(91,192,248,0.15); background: rgba(91,192,248,0.06); }
    .btn-copy:hover { background: rgba(91,192,248,0.15); }
    .btn-grid { color: #9c27b0; border-color: rgba(156,39,176,0.15); background: rgba(156,39,176,0.06); }
    .btn-grid:hover { background: rgba(156,39,176,0.15); }
    .btn-grid.active { background: rgba(156,39,176,0.2); border-color: rgba(156,39,176,0.3); }
    .btn-help { color: #5bc0f8; border-color: rgba(91,192,248,0.15); background: rgba(91,192,248,0.06); }
    .btn-help:hover { background: rgba(91,192,248,0.15); }
    .btn-rss { color: #9c27b0; border-color: rgba(156,39,176,0.15); background: rgba(156,39,176,0.06); }
    .btn-rss:hover { background: rgba(156,39,176,0.15); }
    .lang-switch { display: flex; gap: 2px; padding: 2px; background: rgba(255,255,255,0.03); border-radius: 4px; border: 1px solid rgba(255,255,255,0.06); }
    .lang-btn { padding: 2px 8px; border: none; background: transparent; color: #666; font-size: 11px; font-weight: 500; cursor: pointer; border-radius: 3px; transition: all 0.2s; font-family: inherit; }
    .lang-btn:hover { color: #888; background: rgba(255,255,255,0.05); }
    .lang-btn.active { color: #5bc0f8; background: rgba(91,192,248,0.1); }

    .main-content { padding-top: 80px; max-width: 1400px; margin: 0 auto; padding-left: 20px; padding-right: 20px; padding-bottom: 40px; min-height: calc(100vh - 80px); }
    .page-title { font-size: 20px; color: #e8f0f8; margin-bottom: 16px; }
    .controls-panel {
      display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 12px 16px;
      background: rgba(10,10,20,0.5); border: 1px solid rgba(255,255,255,0.04); border-radius: 8px; margin-bottom: 16px;
    }
    .controls-panel select, .controls-panel input {
      padding: 6px 10px; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.08);
      border-radius: 4px; color: #c8d0d8; font-size: 12px; font-family: inherit;
    }
    .controls-panel select:focus, .controls-panel input:focus { outline: none; border-color: #5bc0f8; }
    .controls-panel .search-input { flex: 1; min-width: 150px; }
    .btn { padding: 6px 16px; border: none; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: 500; transition: all 0.2s; font-family: inherit; }
    .btn:hover { transform: translateY(-1px); opacity: 0.9; }
    .btn-primary { background: #5bc0f8; color: #0a0a0f; }
    .stats-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
    .stat-tag { padding: 4px 12px; background: rgba(10,10,20,0.3); border-radius: 12px; font-size: 11px; color: #888; }
    .stat-tag strong { color: #e8f0f8; }

    .feed-container { display: flex; flex-direction: column; gap: 8px; }
    .news-item {
      display: flex; flex-direction: column; gap: 4px; padding: 12px 16px;
      background: rgba(10,10,20,0.4); border: 1px solid rgba(255,255,255,0.04); border-radius: 6px;
      border-left: 3px solid #4caf50; transition: all 0.2s;
    }
    .news-item:hover { background: rgba(255,255,255,0.03); }
    .news-item .header { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
    .news-item .title { font-size: 14px; font-weight: 500; color: #e8f0f8; }
    .news-item .title a { color: #e8f0f8; text-decoration: none; }
    .news-item .title a:hover { color: #5bc0f8; }
    .news-item .summary { font-size: 12px; color: #888; }
    .news-item .meta { display: flex; flex-wrap: wrap; gap: 12px; font-size: 11px; color: #666; }
    .news-item .meta .source { color: #5bc0f8; }
    .news-item .badge { font-size: 10px; font-weight: 600; padding: 2px 8px; border-radius: 10px; text-transform: uppercase; }
    .badge-critical { background: rgba(244,67,54,0.2); color: #f44336; }
    .badge-high { background: rgba(242,101,34,0.2); color: #f26522; }
    .badge-medium { background: rgba(255,215,0,0.2); color: #ffd700; }
    .badge-low { background: rgba(76,175,80,0.2); color: #4caf50; }
    .badge-favorite { cursor: pointer; font-size: 16px; padding: 0 4px; user-select: none; }
    .badge-favorite:hover { transform: scale(1.2); }
    .badge-favorite.active { color: #ffd700; }
    .news-item .category-tag { font-size: 10px; color: #5bc0f8; }
    .favorites-btn { background: rgba(255,215,0,0.1); border: 1px solid rgba(255,215,0,0.2); color: #ffd700; }
    .favorites-btn:hover { background: rgba(255,215,0,0.2); }
    .fallback-banner {
      padding: 8px 12px; background: rgba(255,215,0,0.08); border: 1px solid rgba(255,215,0,0.2);
      border-radius: 6px; color: #ffd700; font-size: 12px; margin-bottom: 12px; display: none;
    }
    .fallback-banner.visible { display: block; }

    #coordinate-grid {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 99999;
      background-image: linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
      background-size: 50px 50px; display: none;
    }
    #coordinate-grid.visible { display: block; }
    #grid-coords {
      position: fixed; bottom: 12px; right: 12px; background: rgba(0,0,0,0.7);
      color: #00ff00; font-family: monospace; font-size: 11px; padding: 4px 10px; border-radius: 4px;
      z-index: 100000; pointer-events: none; display: none;
    }
    #grid-coords.visible { display: block; }
    .notification {
      position: fixed; bottom: 60px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.85); color: #fff; padding: 8px 20px; border-radius: 6px;
      font-size: 13px; z-index: 100001; border: 1px solid rgba(255,255,255,0.1);
      animation: notif-fade 2.5s forwards;
    }
    @keyframes notif-fade {
      0% { opacity: 0; transform: translateX(-50%) translateY(10px); }
      10% { opacity: 1; transform: translateX(-50%) translateY(0); }
      80% { opacity: 1; transform: translateX(-50%) translateY(0); }
      100% { opacity: 0; transform: translateX(-50%) translateY(-20px); }
    }
    @media (max-width: 768px) {
      .topbar-status { display: none; }
      .topbar-btn { font-size: 10px; padding: 0 8px; height: 24px; }
      .controls-panel { flex-direction: column; align-items: stretch; }
      .controls-panel .search-input { flex: 1; }
      .news-item .header { flex-direction: column; }
    }
    @media (max-width: 480px) {
      .topbar-btn { font-size: 9px; padding: 0 6px; height: 20px; }
      .topbar-btn .btn-text { display: none; }
      .lang-btn { font-size: 9px; padding: 1px 5px; }
    }
  </style>
</head>
<body>

  <header class="topbar">
    <div class="topbar-left">
      <span class="topbar-brand">⚡ CRUCIX MONITOR</span>
      <span class="topbar-status">МОДУЛЬ №19</span>
    </div>
    <div class="topbar-right">
      <button class="topbar-btn btn-home" onclick="window.location.href='/jarvis'">← НА ГЛАВНУЮ</button>
      <button class="topbar-btn btn-help" onclick="showHelp()">❓ HELP</button>
      <button class="topbar-btn btn-copy" id="copy-btn">📋 КОПИРОВАТЬ</button>
      <button class="topbar-btn btn-grid" id="grid-toggle">📐 СЕТКА</button>
      <button class="topbar-btn btn-rss" onclick="window.location.href='/registry'">📡 Список страниц</button>
      <div class="lang-switch">
        <button class="lang-btn active" data-lang="ru" onclick="switchLang('ru')">RU</button>
        <button class="lang-btn" data-lang="en" onclick="switchLang('en')">EN</button>
      </div>
    </div>
  </header>

  <main class="main-content">
    <h1 class="page-title" id="page-title">📰 Лента живых новостных потоков</h1>

    <div class="fallback-banner" id="fallback-banner">
      ⚠️ Источник данных: <strong>встроенные демо-данные</strong>. Запустите <code>scripts/collectors/collect-live.mjs</code> для реальных новостей.
    </div>

    <div class="controls-panel">
      <select id="category-filter">
        <option value="all">📰 Все категории</option>
        <option value="geopolitics">🌍 Геополитика</option>
        <option value="politics">🏛️ Политика</option>
        <option value="economy">💰 Экономика</option>
        <option value="military">⚔️ Военные</option>
        <option value="technology">💻 Технологии</option>
        <option value="environment">🌿 Экология</option>
        <option value="health">🏥 Здоровье</option>
        <option value="cyber">🛡️ Кибер</option>
        <option value="energy">⚡ Энергия</option>
        <option value="diplomacy">🤝 Дипломатия</option>
        <option value="disaster">🚨 Катастрофы</option>
      </select>
      <select id="region-filter">
        <option value="all">🌍 Все регионы</option>
      </select>
      <select id="importance-filter">
        <option value="all">⭐ Все</option>
        <option value="critical">🚨 Критические</option>
        <option value="high">🔥 Высокие</option>
        <option value="medium">📊 Средние</option>
        <option value="low">📌 Низкие</option>
      </select>
      <input type="text" id="search-input" class="search-input" placeholder="🔍 Поиск..." oninput="debouncedLoadFeed()">
      <button class="btn btn-primary" onclick="loadFeed()">🔄 Обновить</button>
      <button class="btn favorites-btn" id="favorites-btn" onclick="toggleFavoritesFilter()">⭐ Избранное</button>
      <span style="font-size:11px;color:#666;margin-left:auto;" id="feed-count"></span>
    </div>

    <div class="stats-row" id="stats-row">
      <span class="stat-tag">📰 Всего: <strong id="stat-total">0</strong></span>
      <span class="stat-tag">🚨 Критические: <strong id="stat-critical">0</strong></span>
      <span class="stat-tag">🔥 Высокие: <strong id="stat-high">0</strong></span>
      <span class="stat-tag">😊 Позитивные: <strong id="stat-positive">0</strong></span>
      <span class="stat-tag">😟 Негативные: <strong id="stat-negative">0</strong></span>
    </div>

    <div class="feed-container" id="feed-container">
      <div style="text-align:center;color:#666;padding:20px;">Загрузка новостей...</div>
    </div>
  </main>

  <div id="coordinate-grid"></div>
  <div id="grid-coords">X: 0  Y: 0</div>

  <script>
    // ============================================================
    //  CQRS: READ из /api/layers/live, WRITE в /api/services/favorites
    // ============================================================
    const API_FEED = '/api/layers/live';
    const API_FAVORITES = '/api/services/favorites';
    const FAVORITES_MODULE = 'live';
    const REFRESH_INTERVAL_MS = 30000;

    let currentLang = localStorage.getItem('crucix-lang') || 'ru';
    let showFavoritesOnly = false;
    let cachedRegions = new Set();
    let favoriteIds = new Set();

    // ============================================================
    //  ЯЗЫК
    // ============================================================
    function switchLang(lang) {
      currentLang = lang;
      localStorage.setItem('crucix-lang', lang);
      document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.dataset.lang === lang));
      showNotification(`🌐 Язык: ${lang.toUpperCase()}`);
      updateTexts(lang);
    }
    document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.dataset.lang === currentLang));
    function updateTexts(lang) {
      const texts = { ru: { title: '📰 Лента живых новостных потоков' }, en: { title: '📰 Live News Feed' } };
      const t = texts[lang] || texts.ru;
      document.getElementById('page-title').textContent = t.title;
    }
    updateTexts(currentLang);

    // ============================================================
    //  СЕТКА
    // ============================================================
    let gridVisible = false;
    document.addEventListener('keydown', function(e) {
      if (e.ctrlKey && e.shiftKey && e.key === 'G') { e.preventDefault(); toggleGrid(); }
    });
    document.getElementById('grid-toggle').addEventListener('click', toggleGrid);
    function toggleGrid() {
      gridVisible = !gridVisible;
      document.getElementById('coordinate-grid').classList.toggle('visible', gridVisible);
      document.getElementById('grid-coords').classList.toggle('visible', gridVisible);
      document.getElementById('grid-toggle').classList.toggle('active', gridVisible);
      if (gridVisible) {
        showNotification('⊞ Сетка включена');
        document.addEventListener('mousemove', updateCoords);
      } else {
        showNotification('⊞ Сетка выключена');
        document.removeEventListener('mousemove', updateCoords);
      }
    }
    function updateCoords(e) {
      document.getElementById('grid-coords').textContent = `X: ${e.clientX}  Y: ${e.clientY}`;
    }
    function showNotification(msg) {
      const el = document.createElement('div');
      el.className = 'notification';
      el.textContent = msg;
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 2500);
    }

    // ============================================================
    //  ИЗБРАННОЕ — отдельный API (CQRS write-модель)
    // ============================================================
    async function loadFavorites() {
      try {
        const resp = await fetch(`${API_FAVORITES}/list?module=${FAVORITES_MODULE}`);
        const data = await resp.json();
        if (data.success && Array.isArray(data.ids)) {
          favoriteIds = new Set(data.ids);
        }
      } catch (e) {
        console.error('[Favorites] Ошибка загрузки:', e);
      }
    }

    async function toggleFavorite(itemId, el) {
      try {
        const resp = await fetch(`${API_FAVORITES}/toggle`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ module: FAVORITES_MODULE, itemId })
        });
        const data = await resp.json();
        if (data.success) {
          if (data.action === 'added') { favoriteIds.add(itemId); showNotification('⭐ Добавлено'); }
          else if (data.action === 'removed') { favoriteIds.delete(itemId); showNotification('☆ Удалено'); }

          if (el) {
            el.textContent = favoriteIds.has(itemId) ? '★' : '☆';
            el.classList.toggle('active', favoriteIds.has(itemId));
          }
        }
      } catch (e) { console.error('[Favorites] Ошибка toggle:', e); }
    }

    function toggleFavoritesFilter() {
      showFavoritesOnly = !showFavoritesOnly;
      const btn = document.getElementById('favorites-btn');
      btn.style.borderColor = showFavoritesOnly ? '#ffd700' : 'rgba(255,215,0,0.2)';
      btn.style.background = showFavoritesOnly ? 'rgba(255,215,0,0.2)' : 'rgba(255,215,0,0.1)';
      loadFeed();
    }

    // ============================================================
    //  FEED — читаем из live Layer
    // ============================================================
    let loadTimer = null;
    function debouncedLoadFeed() {
      if (loadTimer) clearTimeout(loadTimer);
      loadTimer = setTimeout(loadFeed, 400);
    }

    async function loadFeed() {
      const category = document.getElementById('category-filter').value;
      const region = document.getElementById('region-filter').value;
      const importance = document.getElementById('importance-filter').value;
      const search = document.getElementById('search-input').value;

      try {
        const params = new URLSearchParams({ category, region, importance, search });
        const url = `${API_FEED}/feed?${params.toString()}`;
        const resp = await fetch(url);
        const data = await resp.json();

        if (data.success) {
          let feed = data.feed || data.news || [];
          if (showFavoritesOnly) feed = feed.filter(n => favoriteIds.has(n.id));

          updateRegionsFilter(feed);
          renderFeed(feed);
          renderStats(data.stats);
          updateFallbackBanner(data.source, data.hint);

          const countEl = document.getElementById('feed-count');
          if (countEl) countEl.textContent = `${feed.length} / ${data.total} новостей`;
        }
      } catch (e) {
        console.error('[Live] Ошибка загрузки:', e);
      }
    }

    function updateRegionsFilter(feed) {
      const sel = document.getElementById('region-filter');
      for (const n of feed) {
        if (n.region && !cachedRegions.has(n.region)) {
          cachedRegions.add(n.region);
          const opt = document.createElement('option');
          opt.value = n.region;
          opt.textContent = `📍 ${n.region}`;
          sel.appendChild(opt);
        }
      }
    }

    function updateFallbackBanner(source, hint) {
      const banner = document.getElementById('fallback-banner');
      if (!banner) return;
      if (source === 'fallback') {
        banner.classList.add('visible');
        if (hint) banner.innerHTML = `⚠️ Источник данных: <strong>встроенные демо-данные</strong>. ${hint}.`;
      } else {
        banner.classList.remove('visible');
      }
    }

    function renderFeed(feed) {
      const container = document.getElementById('feed-container');
      if (!feed || !feed.length) {
        container.innerHTML = '<div style="text-align:center;color:#666;padding:20px;">Новостей не найдено</div>';
        return;
      }

      const importanceLabels = { critical: '🚨 КРИТИЧЕСКИЙ', high: '🔥 ВЫСОКИЙ', medium: '📊 СРЕДНИЙ', low: '📌 НИЗКИЙ' };
      const importanceClasses = { critical: 'badge-critical', high: 'badge-high', medium: 'badge-medium', low: 'badge-low' };

      let html = '';
      for (const n of feed) {
        const time = n.timestamp ? new Date(n.timestamp).toLocaleString() : (n.time || '—');
        const importanceClass = importanceClasses[n.importance] || 'badge-medium';
        const importanceLabel = importanceLabels[n.importance] || n.importance;
        const isFav = favoriteIds.has(n.id);
        const favIcon = isFav ? '★' : '☆';
        const favClass = isFav ? ' active' : '';
        const sentEmoji = n.sentimentEmoji || '😐';
        const borderColor = n.importanceColor || '#4caf50';

        html += `
          <div class="news-item" style="border-left-color: ${borderColor}">
            <div class="header">
              <div class="title">
                <a href="${n.url || '#'}" target="_blank" rel="noopener">${escapeHtml(n.title)}</a>
                <span class="badge-favorite${favClass}" onclick="toggleFavorite('${n.id}', this)">${favIcon}</span>
              </div>
              <span class="badge ${importanceClass}">${importanceLabel}</span>
            </div>
            ${n.summary ? `<div class="summary">${escapeHtml(n.summary)}</div>` : ''}
            <div class="meta">
              <span class="source">${escapeHtml(n.source || 'Unknown')}</span>
              <span class="category-tag">${escapeHtml(n.categoryLabel || n.category || '')}</span>
              <span>${time}</span>
              <span>${sentEmoji}</span>
              ${n.region ? `<span>📍 ${escapeHtml(n.region)}</span>` : ''}
            </div>
          </div>
        `;
      }
      container.innerHTML = html;
    }

    function escapeHtml(s) {
      return String(s == null ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    function renderStats(stats) {
      if (!stats) return;
      document.getElementById('stat-total').textContent = stats.total || 0;
      document.getElementById('stat-critical').textContent = stats.byImportance?.critical || 0;
      document.getElementById('stat-high').textContent = stats.byImportance?.high || 0;
      document.getElementById('stat-positive').textContent = stats.bySentiment?.positive || 0;
      document.getElementById('stat-negative').textContent = stats.bySentiment?.negative || 0;
    }

    document.getElementById('category-filter').addEventListener('change', loadFeed);
    document.getElementById('region-filter').addEventListener('change', loadFeed);
    document.getElementById('importance-filter').addEventListener('change', loadFeed);

    // ============================================================
    //  КОПИРОВАНИЕ
    // ============================================================
    function copyPageData() {
      const items = document.querySelectorAll('.news-item');
      let text = `=== Лента новостей Crucix ===\n`;
      text += `Дата: ${new Date().toLocaleString()}\n`;
      text += `URL: ${location.href}\n`;
      text += `Всего: ${items.length}\n\n`;
      for (const el of items) {
        const title = el.querySelector('.title')?.textContent?.trim() || '';
        const summary = el.querySelector('.summary')?.textContent?.trim() || '';
        const meta = el.querySelector('.meta')?.textContent?.trim() || '';
        text += `📰 ${title}\n`;
        if (summary) text += `   ${summary}\n`;
        text += `   ${meta}\n\n`;
      }
      const MAX = 200000;
      if (text.length > MAX) text = text.slice(0, MAX - 2000) + '\n\n[... ОБРЕЗАНО ДО ЛИМИТА ЧАТА ...]\n';
      navigator.clipboard.writeText(text).then(() => {
        showNotification(`✅ Скопировано ${(text.length / 1024).toFixed(1)} КБ`);
      }).catch(() => {
        const area = document.createElement('textarea');
        area.value = text;
        document.body.appendChild(area);
        area.select();
        document.execCommand('copy');
        document.body.removeChild(area);
        showNotification(`✅ Скопировано ${(text.length / 1024).toFixed(1)} КБ`);
      });
    }
    document.getElementById('copy-btn').addEventListener('click', copyPageData);

    // ============================================================
    //  СТАРТ
    // ============================================================
    document.addEventListener('DOMContentLoaded', async function() {
      await loadFavorites();
      await loadFeed();
      setInterval(loadFeed, REFRESH_INTERVAL_MS);
    });
  </script>
  <script src="/js/help.js"></script>
</body>
</html>
