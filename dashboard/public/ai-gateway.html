<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Gateway — Crucix</title>
  <link rel="stylesheet" href="/css/ai-gateway.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-left">
      <span class="topbar-brand">⚡ CRUCIX MONITOR</span>
      <span class="topbar-status">AI GATEWAY</span>
    </div>
    <div class="topbar-right">
      <span class="topbar-time" id="topbar-date">Загрузка...</span>
      <button class="topbar-btn btn-home" onclick="window.location.href='/jarvis'">← НА ГЛАВНУЮ</button>
      <button class="topbar-btn btn-help" onclick="showHelp()">❓ HELP</button>
    <button class="topbar-btn btn-copy" id="copy-btn">📋 КОПИРОВАТЬ</button>
      <button class="topbar-btn btn-grid" id="grid-toggle">📐 СЕТКА</button>
    </div>
  </header>

  <main class="main-content">
    <h1 class="page-title">🤖 AI Gateway</h1>
    <p class="page-subtitle">Единый шлюз для OpenAI, Anthropic, Groq, DeepSeek</p>

    <div class="stats-row" id="stats-row">
      <div class="stat-item">
        <div class="stat-label">Запросов</div>
        <div class="stat-value blue" id="stat-requests">0</div>
      </div>
      <div class="stat-item">
        <div class="stat-label">Токенов</div>
        <div class="stat-value green" id="stat-tokens">0</div>
      </div>
      <div class="stat-item">
        <div class="stat-label">Активный</div>
        <div class="stat-value" id="stat-active">—</div>
      </div>
      <div class="stat-item">
        <div class="stat-label">Кэш</div>
        <div class="stat-value orange" id="stat-cache">0</div>
      </div>
    </div>

    <div class="chat-panel">
      <div class="chat-messages" id="chat-messages">
        <div class="message system">💬 Выберите модель и напишите сообщение</div>
      </div>
      <div class="chat-controls">
        <select id="provider-select">
          <option value="openai">OpenAI (GPT-4o)</option>
          <option value="anthropic">Anthropic (Claude 3.5)</option>
          <option value="groq">Groq (Llama 3 70B)</option>
          <option value="deepseek">DeepSeek Chat</option>
        </select>
        <select id="model-select">
          <option value="gpt-4o">GPT-4o</option>
          <option value="gpt-4-turbo">GPT-4 Turbo</option>
          <option value="gpt-3.5-turbo">GPT-3.5 Turbo</option>
        </select>
        <input type="text" id="chat-input" placeholder="Введите сообщение..." />
        <button class="btn btn-primary" id="chat-send">➤</button>
        <button class="btn btn-secondary" id="chat-clear">✕</button>
      </div>
    </div>

    <div class="providers-grid" id="providers-grid">
      <div class="loading">Загрузка провайдеров...</div>
    </div>

    <div class="config-panel">
      <h3>🔑 Настройка API-ключей</h3>
      <div class="config-row">
        <label>OpenAI:</label>
        <input type="password" id="key-openai" placeholder="sk-..." />
        <button class="btn btn-success" onclick="saveKey('openai')">Сохранить</button>
      </div>
      <div class="config-row">
        <label>Anthropic:</label>
        <input type="password" id="key-anthropic" placeholder="sk-ant-..." />
        <button class="btn btn-success" onclick="saveKey('anthropic')">Сохранить</button>
      </div>
      <div class="config-row">
        <label>Groq:</label>
        <input type="password" id="key-groq" placeholder="gsk_..." />
        <button class="btn btn-success" onclick="saveKey('groq')">Сохранить</button>
      </div>
      <div class="config-row">
        <label>DeepSeek:</label>
        <input type="password" id="key-deepseek" placeholder="sk-..." />
        <button class="btn btn-success" onclick="saveKey('deepseek')">Сохранить</button>
      </div>
      <div class="config-row">
        <label>
          <input type="checkbox" id="cache-toggle" checked /> Кэширование
        </label>
        <button class="btn btn-secondary" onclick="clearCache()">Очистить кэш</button>
        <button class="btn btn-primary" onclick="healthCheck()">Проверить провайдеров</button>
      </div>
      <div id="health-result" class="health-result"></div>
    </div>
  </main>

  <div id="coordinate-grid"></div>
  <div id="grid-coords">X: 0  Y: 0</div>

  <script src="/js/ai-gateway.js"></script>
<script src="/js/help.js"></script>
</body>
</html>
