    document.getElementById('copy-btn').addEventListener('click', function() {
      const text = document.querySelector('.main-content').textContent;
      navigator.clipboard.writeText(text).then(() => {
        this.textContent = '✅ Скопировано!';
        setTimeout(() => { this.textContent = '📋 КОПИРОВАТЬ'; }, 3000);
        showNotification('✅ Скопировано');
      });
    });

    async function loadData() {
      try {
        const response = await fetch('/api/basket/global-price-latest.json');
        if (!response.ok) throw new Error('Data not found');
        const data = await response.json();

        const commodities = data.commodities || [];

        const grid = document.getElementById('commoditiesGrid');
        grid.innerHTML = '';
        commodities.forEach(c => {
          const card = document.createElement('div');
          card.className = 'commodity-card';
          const change = c.change || '';
          const changeClass = change.includes('+') ? 'change-up' : (change.includes('-') ? 'change-down' : '');
          card.innerHTML = `
            <div class="name">${c.name || 'Unknown'}</div>
            <div class="price">${c.price !== undefined ? c.price : '—'}</div>
            <div class="unit">${c.unit || ''}</div>
            <div class="change ${changeClass}">${change}</div>
          `;
          grid.appendChild(card);
        });
      } catch (e) {
        document.getElementById('commoditiesGrid').innerHTML = `<div style="color:#ef5350;padding:20px;">❌ Ошибка загрузки данных</div>`;
      }
    }

    loadData();
