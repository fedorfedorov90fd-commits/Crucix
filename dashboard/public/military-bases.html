<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Военные базы — Crucix</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
  </script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a0f;
      color: #c8d0d8;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', monospace;
      font-size: 13px;
      line-height: 1.5;
      min-height: 100vh;
      overflow: hidden;
    }

    /* ===== ВЕРХНЯЯ ПАНЕЛЬ ===== */
    .topbar {
      position: fixed; top: 0; left: 0; right: 0;
      height: 60px;
      background: rgba(10,10,20,0.95);
      backdrop-filter: blur(12px);
      border-bottom: 2px solid rgba(91,192,248,0.25);
      box-shadow: 0 2px 20px rgba(91,192,248,0.08);
      z-index: 100;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 20px;
    }
    .topbar::after {
      content: "";
      position: absolute;
      bottom: -2px; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, #5bc0f8, transparent);
      opacity: 0.6;
    }
    .topbar-left { display: flex; align-items: center; gap: 12px; }
    .topbar-brand { font-size: 14px; font-weight: 700; color: #5bc0f8; text-transform: uppercase; letter-spacing: 2px; }
    .topbar-right { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .topbar-btn {
      height: 28px; padding: 0 12px;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 4px;
      background: rgba(255,255,255,0.03);
      color: #888;
      font-size: 11px;
      font-weight: 500;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .topbar-btn:hover { background: rgba(255,255,255,0.06); transform: translateY(-1px); }
    .btn-home { color: #5bc0f8; border-color: rgba(91,192,248,0.2); background: rgba(91,192,248,0.06); }
    .btn-home:hover { background: rgba(91,192,248,0.15); }
    .btn-copy { color: #5bc0f8; border-color: rgba(91,192,248,0.15); background: rgba(91,192,248,0.06); }
    .btn-copy.copied { background: rgba(76,175,80,0.2); border-color: #4caf50; color: #4caf50; }
    .btn-rss { color: #f26522; border-color: rgba(242,101,34,0.2); background: rgba(242,101,34,0.06); }
    .btn-rss:hover { background: rgba(242,101,34,0.15); }
    .btn-help { color: #a78bfa; border-color: rgba(167,139,250,0.2); background: rgba(167,139,250,0.06); }
    .btn-help:hover { background: rgba(167,139,250,0.15); }

    .lang-switch {
      display: flex; gap: 2px; padding: 2px;
      background: rgba(255,255,255,0.03);
      border-radius: 4px;
      border: 1px solid rgba(255,255,255,0.06);
    }
    .lang-btn {
      padding: 2px 8px; border: none; background: transparent;
      color: #666; font-size: 11px; font-weight: 500;
      cursor: pointer; border-radius: 3px; transition: all 0.2s;
    }
    .lang-btn:hover { color: #888; background: rgba(255,255,255,0.05); }
    .lang-btn.active { color: #5bc0f8; background: rgba(91,192,248,0.1); }

    /* ===== ВТОРОЙ БЛОК: НАВИГАЦИЯ ПО ДАШБОРДАМ ===== */
    .nav-dashboards {
      position: fixed;
      top: 60px;
      left: 0;
      right: 0;
      height: 38px;
      background: rgba(6,10,18,0.92);
      backdrop-filter: blur(8px);
      border-bottom: 2px solid rgba(91,192,248,0.25);
      z-index: 99;
      display: flex;
      align-items: center;
      padding: 0 20px;
      gap: 4px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .nav-dashboards::after {
      content: "";
      position: absolute;
      bottom: -2px;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, #5bc0f8, transparent);
      opacity: 0.6;
    }
    .nav-dashboards::-webkit-scrollbar { display: none; }
    .nav-btn {
      padding: 4px 10px; border: none; border-radius: 4px;
      background: transparent; color: #666; font-size: 10px; font-weight: 500;
      cursor: pointer; transition: all 0.2s;
      white-space: nowrap; font-family: inherit;
      border: 1px solid transparent;
      display: inline-flex;
      align-items: center;
      gap: 3px;
    }
    .nav-btn:hover { color: #c8d0d8; background: rgba(255,255,255,0.04); }
    .nav-btn.active { color: #5bc0f8; background: rgba(91,192,248,0.08); border-color: rgba(91,192,248,0.15); }
    .nav-btn .icon { margin-right: 3px; }

    /* ===== КАРТА ===== */
    .map-container {
      padding-top: 98px;
      height: 100vh;
      width: 100%;
      position: relative;
    }
    #map {
      height: 100%;
      width: 100%;
      background: #0a0a0f;
    }

    .stats {
      position: absolute;
      top: 120px;
      right: 20px;
      z-index: 1000;
      background: rgba(10,10,30,0.92);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 8px;
      padding: 12px 16px;
      backdrop-filter: blur(10px);
      min-width: 130px;
      color: #ccc;
      text-align: center;
    }
    .stats .count { font-size: 28px; font-weight: 700; color: #44ccff; }
    .stats .label { font-size: 11px; color: #888; }

    .notification {
      position: fixed;
      bottom: 60px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.85);
      color: #ffffff;
      padding: 8px 20px;
      border-radius: 6px;
      font-size: 13px;
      z-index: 100001;
      border: 1px solid rgba(255,255,255,0.1);
      animation: notif-fade 2.5s forwards;
    }
    @keyframes notif-fade {
      0% { opacity: 0; transform: translateX(-50%) translateY(10px); }
      10% { opacity: 1; transform: translateX(-50%) translateY(0); }
      80% { opacity: 1; }
      100% { opacity: 0; transform: translateX(-50%) translateY(-20px); }
    }

    @media (max-width: 768px) {
      .topbar { padding: 0 12px; height: 52px; }
      .topbar-brand { font-size: 12px; }
      .topbar-btn { font-size: 10px; padding: 0 8px; height: 24px; }
      .nav-dashboards { top: 52px; height: 34px; padding: 0 10px; gap: 2px; }
      .nav-btn { font-size: 9px; padding: 2px 6px; }
      .map-container { padding-top: 86px; }
      .stats { top: 100px; right: 10px; padding: 8px 12px; min-width: 100px; }
      .stats .count { font-size: 20px; }
    }
    @media (max-width: 480px) {
      .topbar { padding: 0 8px; height: 46px; }
      .topbar-brand { font-size: 10px; letter-spacing: 1px; }
      .topbar-btn { font-size: 9px; padding: 0 6px; height: 20px; }
      .lang-btn { font-size: 9px; padding: 1px 5px; }
      .nav-dashboards { top: 46px; height: 30px; padding: 0 6px; gap: 2px; }
      .nav-btn { font-size: 8px; padding: 2px 5px; }
      .map-container { padding-top: 76px; }
      .stats { top: 90px; right: 10px; padding: 6px 10px; min-width: 80px; }
      .stats .count { font-size: 18px; }
    }
  </style>
</head>
<body>

  <!-- ===== ПЕРВЫЙ БЛОК: ТОПБАР ===== -->
  <header class="topbar">
    <div class="topbar-left"><span class="topbar-brand">🏛️ ВОЕННЫЕ БАЗЫ</span></div>
    <div class="topbar-right">
      <button class="topbar-btn btn-home" onclick="window.location.href='/jarvis'">← НА ГЛАВНУЮ</button>
      <button class="topbar-btn btn-copy" id="copy-btn" onclick="copyData()">📋 КОПИРОВАТЬ</button>
      <button class="topbar-btn btn-rss" onclick="window.location.href='/registry'">📡 Реестр</button>
      <button class="topbar-btn btn-help" onclick="openHelp()">❓ HELP</button>
      <div class="lang-switch">
        <button class="lang-btn active" data-lang="ru" onclick="switchLang('ru')">RU</button>
        <button class="lang-btn" data-lang="en" onclick="switchLang('en')">EN</button>
      </div>
    </div>
  </header>

  <!-- ===== ВТОРОЙ БЛОК: НАВИГАЦИЯ ПО ДАШБОРДАМ ===== -->
  <nav class="nav-dashboards">
    <button class="nav-btn" onclick="window.location.href='/dashboard-5in1'"><span class="icon">🎯</span>Центр аналитики</button>
    <button class="nav-btn" onclick="window.location.href='/dashboard-economic'"><span class="icon">📊</span>Экономика</button>
    <button class="nav-btn" onclick="window.location.href='/dashboard-financial'"><span class="icon">💰</span>Финансы</button>
    <button class="nav-btn" onclick="window.location.href='/dashboard-military'"><span class="icon">🛡️</span>Военный</button>
    <button class="nav-btn" onclick="window.location.href='/dashboard-geopolitical'"><span class="icon">🌍</span>Геополитика</button>
    <button class="nav-btn" onclick="window.location.href='/dashboard-ecological'"><span class="icon">🌿</span>Экология</button>
    <button class="nav-btn" onclick="window.location.href='/dashboard-cyber'"><span class="icon">🔒</span>Кибер</button>
    <button class="nav-btn" onclick="window.location.href='/dashboard-space'"><span class="icon">🚀</span>Космос</button>
    <button class="nav-btn" onclick="window.location.href='/dashboard-news'"><span class="icon">📰</span>Новости</button>
    <button class="nav-btn" onclick="window.location.href='/dashboard-ai'"><span class="icon">🧠</span>AI</button>
    <button class="nav-btn" onclick="window.location.href='/dashboard-scientific'"><span class="icon">🔬</span>Наука</button>
    <button class="nav-btn" onclick="window.location.href='/dashboard-esg'"><span class="icon">🌱</span>ESG</button>
    <button class="nav-btn" onclick="window.location.href='/dashboard-threats'"><span class="icon">⚡</span>Угрозы</button>
    <button class="nav-btn" onclick="window.location.href='/dashboard-health'"><span class="icon">🏥</span>Здоровье</button>
    <button class="nav-btn" onclick="window.location.href='/dashboard-energy'"><span class="icon">⛽</span>Энергетика</button>
    <button class="nav-btn" onclick="window.location.href='/dashboard-transport'"><span class="icon">🚛</span>Транспорт</button>
    <button class="nav-btn" onclick="window.location.href='/dashboard-regions'"><span class="icon">🌏</span>Регионы</button>
  </nav>

  <!-- ===== КАРТА ===== -->
  <div class="map-container" id="map-container">
    <div id="map"></div>
    <div class="stats" id="stats">
      <div class="count" id="base-count">0</div>
      <div class="label">военных баз</div>
    </div>
  </div>

  <script>
    // ============================================================
    // 1. ЯЗЫК
    // ============================================================
    let currentLang = localStorage.getItem('crucix-lang') || 'ru';

    function switchLang(lang) {
      currentLang = lang;
      localStorage.setItem('crucix-lang', lang);
      document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.dataset.lang === lang));
      showNotification('🌐 Язык: ' + lang.toUpperCase());
    }

    document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.dataset.lang === currentLang));

    // ============================================================
    // 2. УВЕДОМЛЕНИЯ
    // ============================================================
    function showNotification(msg) {
      document.querySelectorAll('.notification').forEach(el => el.remove());
      const el = document.createElement('div');
      el.className = 'notification';
      el.textContent = msg;
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 2500);
    }

    function openHelp() {
      alert('🏛️ Военные базы мира\n\nОтображение военных баз, штабов и авиабаз.\n\nИсточники: GlobalSecurity.org, Wikipedia');
    }

    // ============================================================
    // 3. КОПИРОВАНИЕ
    // ============================================================
    function copyData() {
      const timestamp = new Date().toLocaleString();
      let report = '=== CRUCIX — ВОЕННЫЕ БАЗЫ ===\n';
      report += 'Дата: ' + timestamp + '\n';
      report += 'URL: ' + window.location.href + '\n\n';
      report += '--- БАЗЫ ---\n';
      const markers = document.querySelectorAll('.leaflet-marker-icon');
      document.querySelectorAll('.leaflet-popup-content').forEach(p => {
        report += '  ' + p.textContent.trim() + '\n';
      });
      navigator.clipboard.writeText(report).then(() => {
        const btn = document.getElementById('copy-btn');
        btn.textContent = '✅ Скопировано!';
        btn.classList.add('copied');
        setTimeout(() => { btn.textContent = '📋 КОПИРОВАТЬ'; btn.classList.remove('copied'); }, 3000);
        showNotification('✅ Данные скопированы');
      });
    }

    // ============================================================
    // 4. КАРТА
    // ============================================================
    let map = null;

    function initMap() {
      map = L.map('map', {
        center: [30, 20],
        zoom: 2.5,
        zoomControl: true,
        minZoom: 1.5,
        maxZoom: 10
      });

      L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
        attribution: '© OpenStreetMap, © CartoDB',
        maxZoom: 19,
        opacity: 0.9
      }).addTo(map);

      loadBases();
    }

    async function loadBases() {
      try {
        const res = await fetch('/api/military-bases/');
        const data = await res.json();

        if (!data.success || !data.data || data.data.length === 0) {
          document.getElementById('base-count').textContent = '0';
          return;
        }

        const bases = data.data;
        document.getElementById('base-count').textContent = bases.length;

        const branchColors = {
          'Армия': '#ef4444',
          'ВМС': '#3b82f6',
          'ВВС': '#f59e0b',
          'Армия РФ': '#ef4444',
          'ВМФ РФ': '#3b82f6',
          'ВКС РФ': '#f59e0b',
          'НОАК': '#ef4444',
          'ВМС НОАК': '#3b82f6',
          'Королевский ВМФ': '#3b82f6',
          'ВМС Франции': '#3b82f6',
          'ВМС Германии': '#3b82f6',
          'ВС Индии': '#ef4444',
          'ВМС Индии': '#3b82f6',
          'ВС Турции': '#ef4444',
          'ЦАХАЛ': '#ef4444',
          'ВС Ирана': '#ef4444',
          'ВС Японии': '#ef4444',
          'ВС РК': '#ef4444',
          'ВС КСА': '#ef4444'
        };

        const typeSizes = {
          'штаб': 18,
          'база': 14,
          'военно-морская': 16,
          'авиабаза': 14
        };

        for (const base of bases) {
          const color = branchColors[base.branch] || '#f97316';
          const size = typeSizes[base.type] || 14;

          const icon = L.divIcon({
            className: 'military-marker',
            html: `
              <div style="position:relative;width:${size}px;height:${size}px;">
                <div style="position:absolute;top:0;left:0;width:100%;height:100%;background:${color};border-radius:50%;border:2px solid rgba(255,255,255,0.6);box-shadow:0 0 20px ${color}60;"></div>
                <div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:${size/2}px;color:#fff;font-weight:700;">✦</div>
              </div>
            `,
            iconSize: [size, size],
            iconAnchor: [size / 2, size / 2]
          });

          L.marker([base.lat, base.lng], { icon })
            .addTo(map)
            .bindPopup(`
              <div style="padding:4px 0;">
                <strong style="color:#e8f0f8;font-size:15px;">${base.name}</strong><br>
                <span style="color:#f59e0b;font-weight:600;">${base.country}</span><br>
                <span style="color:#888;font-size:11px;">${base.type} · ${base.branch}</span>
              </div>
            `);
        }

      } catch (e) {
        console.error('[Military Bases] Ошибка:', e);
        document.getElementById('base-count').textContent = '❌';
      }
    }

    // ============================================================
    // 5. ЗАПУСК
    // ============================================================
    document.addEventListener('DOMContentLoaded', function() {
      if (typeof L !== 'undefined') {
        initMap();
      } else {
        document.getElementById('map').innerHTML = '❌ Leaflet не загружен';
      }
    });
  </script>
</body>
</html>
