<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>НАЗВАНИЕ — Crucix</title>
  <link rel="stylesheet" href="/css/НАЗВАНИЕ.css">
  <style>
    /* ============================================================
       БАЗОВЫЙ ШАБЛОН CRUCIX С КНОПКОЙ HELP
       ============================================================ */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a0f;
      color: #c8d0d8;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', monospace;
      font-size: 13px;
      line-height: 1.5;
      min-height: 100vh;
    }
    .topbar {
      position: fixed; top: 0; left: 0; right: 0; height: 60px;
      background: rgba(10,10,20,0.92); backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255,255,255,0.04); z-index: 100;
      display: flex; justify-content: space-between; align-items: center; padding: 0 20px;
    }
    .topbar-left { display: flex; align-items: center; gap: 12px; }
    .topbar-brand { font-size: 14px; font-weight: 700; color: #5bc0f8; text-transform: uppercase; letter-spacing: 2px; }
    .topbar-status { font-size: 11px; color: #ffd700; }
    .topbar-right { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .topbar-btn {
      height: 28px; padding: 0 12px;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 4px;
      background: rgba(255,255,255,0.03);
      color: #888;
      font-size: 11px;
      font-weight: 500;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center; gap: 4px;
    }
    .topbar-btn:hover { background: rgba(255,255,255,0.06); transform: translateY(-1px); }
    .btn-home { color: #5bc0f8; border-color: rgba(91,192,248,0.2); background: rgba(91,192,248,0.06); }
    .btn-home:hover { background: rgba(91,192,248,0.15); }
    .btn-copy { color: #5bc0f8; border-color: rgba(91,192,248,0.15); background: rgba(91,192,248,0.06); }
    .btn-copy:hover { background: rgba(91,192,248,0.15); }
    .btn-help { color: #8b5cf6; border-color: rgba(139,92,246,0.2); background: rgba(139,92,246,0.06); }
    .btn-help:hover { background: rgba(139,92,246,0.15); }
    .btn-grid { color: #9c27b0; border-color: rgba(156,39,176,0.15); background: rgba(156,39,176,0.06); }
    .btn-grid:hover { background: rgba(156,39,176,0.15); }
    .topbar-time { font-size: 11px; color: #666; }

    .main-content { padding-top: 76px; max-width: 1200px; margin: 0 auto; padding: 76px 20px 40px; }
    .page-title { font-size: 28px; font-weight: 700; color: #e8f0f8; margin-bottom: 8px; }
    .page-subtitle { color: #666; font-size: 14px; margin-bottom: 24px; }
    .panel { background: rgba(10,10,20,0.5); border: 1px solid rgba(255,255,255,0.04); border-radius: 8px; padding: 16px; margin-bottom: 16px; }
    .panel-title { font-size: 12px; font-weight: 600; text-transform: uppercase; color: #666; letter-spacing: 0.5px; margin-bottom: 12px; }
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 16px; margin-bottom: 24px; }
    .stat-card { background: rgba(10,10,20,0.5); border: 1px solid rgba(255,255,255,0.04); border-radius: 8px; padding: 16px; text-align: center; }
    .stat-card .stat-label { font-size: 11px; text-transform: uppercase; color: #666; letter-spacing: 0.5px; }
    .stat-card .stat-value { font-size: 28px; font-weight: 700; color: #5bc0f8; margin: 6px 0; }
    .stat-card .stat-sub { font-size: 12px; color: #555; }

    .notification { position: fixed; bottom: 60px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.85); color: #fff; padding: 8px 20px; border-radius: 6px; font-size: 13px; z-index: 100001; border: 1px solid rgba(255,255,255,0.1); animation: notif-fade 2.5s forwards; }
    @keyframes notif-fade { 0% { opacity: 0; transform: translateX(-50%) translateY(10px); } 10% { opacity: 1; transform: translateX(-50%) translateY(0); } 80% { opacity: 1; } 100% { opacity: 0; transform: translateX(-50%) translateY(-20px); } }

    .loading { color: #666; text-align: center; padding: 20px; }

    #coordinate-grid {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none; z-index: 99999;
      background-image: linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
      background-size: 50px 50px; display: none;
    }
    #coordinate-grid.visible { display: block; }
    #grid-coords {
      position: fixed; bottom: 12px; right: 12px;
      background: rgba(0,0,0,0.7); color: #00ff00;
      font-family: monospace; font-size: 11px; padding: 4px 10px;
      border-radius: 4px; z-index: 100000; pointer-events: none; display: none;
    }
    #grid-coords.visible { display: block; }

    @media (max-width: 768px) {
      .topbar { padding: 0 12px; height: 52px; }
      .topbar-brand { font-size: 12px; }
      .topbar-status { display: none; }
      .topbar-btn { font-size: 10px; padding: 0 8px; height: 24px; }
      .main-content { padding-top: 68px; padding-left: 12px; padding-right: 12px; }
      .page-title { font-size: 22px; }
    }
    @media (max-width: 480px) {
      .topbar { padding: 0 8px; height: 46px; }
      .topbar-brand { font-size: 10px; }
      .topbar-btn { font-size: 9px; padding: 0 6px; height: 20px; }
      .main-content { padding-top: 62px; padding-left: 8px; padding-right: 8px; }
      .page-title { font-size: 18px; }
    }
  </style>
</head>
<body>

<header class="topbar">
  <div class="topbar-left">
    <span class="topbar-brand">⚡ CRUCIX MONITOR</span>
    <span class="topbar-status">СТАТУС</span>
  </div>
  <div class="topbar-right">
    <span class="topbar-time" id="topbar-date"></span>
    <button class="topbar-btn btn-home" onclick="window.location.href='/jarvis'">← НА ГЛАВНУЮ</button>
    <button class="topbar-btn btn-copy" id="copy-btn">📋 КОПИРОВАТЬ</button>
    <button class="topbar-btn btn-help" onclick="showHelp()">❓ HELP</button>
    <button class="topbar-btn btn-grid" id="grid-toggle">📐 СЕТКА</button>
  </div>
</header>

<main class="main-content">
  <h1 class="page-title" id="page-title">📄 НАЗВАНИЕ СТРАНИЦЫ</h1>
  <p class="page-subtitle" id="page-subtitle">Описание страницы</p>

  <!-- Содержимое страницы -->
  <div class="stats-grid" id="stats-grid">
    <div class="stat-card"><div class="stat-label">Показатель 1</div><div class="stat-value" id="stat1">—</div></div>
    <div class="stat-card"><div class="stat-label">Показатель 2</div><div class="stat-value" id="stat2">—</div></div>
    <div class="stat-card"><div class="stat-label">Показатель 3</div><div class="stat-value" id="stat3">—</div></div>
  </div>

  <div class="panel">
    <div class="panel-title">📋 Данные</div>
    <div id="data-list"><div class="loading">Загрузка...</div></div>
  </div>
</main>

<div id="coordinate-grid"></div>
<div id="grid-coords">X: 0  Y: 0</div>

<script src="/js/help.js"></script>
<script>
// Время
function updateTime() {
  const now = new Date();
  document.getElementById('topbar-date').textContent =
    now.toLocaleDateString('ru-RU', { month: 'short', day: 'numeric', year: 'numeric' }).toUpperCase() +
    ' ' + now.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
}
updateTime();
setInterval(updateTime, 60000);

// Сетка
let gridVisible = false;
document.addEventListener('keydown', function(e) {
  if (e.ctrlKey && e.shiftKey && e.key === 'G') { e.preventDefault(); toggleGrid(); }
});
document.getElementById('grid-toggle').addEventListener('click', toggleGrid);

function toggleGrid() {
  gridVisible = !gridVisible;
  document.getElementById('coordinate-grid').classList.toggle('visible', gridVisible);
  document.getElementById('grid-coords').classList.toggle('visible', gridVisible);
  document.getElementById('grid-toggle').classList.toggle('active', gridVisible);
  if (gridVisible) {
    document.addEventListener('mousemove', function(e) {
      document.getElementById('grid-coords').textContent = 'X: ' + e.clientX + '  Y: ' + e.clientY;
    });
  }
}

// Копирование
document.getElementById('copy-btn').addEventListener('click', function() {
  let text = '=== ' + document.title + ' ===\n';
  text += 'Дата: ' + new Date().toLocaleString() + '\n';
  document.querySelectorAll('.stat-card, .panel').forEach(function(el) {
    const label = el.querySelector('.stat-label, .panel-title');
    const value = el.querySelector('.stat-value, .panel-value');
    if (label && value) {
      text += label.textContent.trim() + ': ' + value.textContent.trim() + '\n';
    }
  });
  text += '\n--- CRUCIX OSINT TERMINAL ---\n';
  text += '🌐 http://localhost:3117\n';

  navigator.clipboard.writeText(text).then(function() {
    showNotif('✅ Данные скопированы');
  }).catch(function() {
    const area = document.createElement('textarea');
    area.value = text;
    document.body.appendChild(area);
    area.select();
    document.execCommand('copy');
    document.body.removeChild(area);
    showNotif('✅ Данные скопированы');
  });
});

function showNotif(msg) {
  document.querySelectorAll('.notification').forEach(function(el) { el.remove(); });
  const el = document.createElement('div');
  el.className = 'notification';
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(function() { el.remove(); }, 2500);
}
</script>
</body>
</html>
