# Crucix Core · Final docker-compose
# Полный production-стек

version: '3.9'

x-common-env: &common-env
  NODE_ENV: production
  LOG_LEVEL: info
  TZ: UTC

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:

  crucix-core:
    build:
      context: ..
      dockerfile: docker/Dockerfile.crucix-final
    image: crucix-core:3.0.0
    container_name: crucix-core
    hostname: crucix-core
    restart: unless-stopped
    ports:
      - "3117:3117"
      - "3118:3118"
    environment:
      <<: *common-env
      CRUCIX_MODE: full
      WS_PORT: "3118"
      API_PORT: "3117"
      FL_PORT: "3120"
      FL_ENABLED: "true"
      PREDICTION_LOOP_ENABLED: "true"
      PREDICTION_INTERVAL_MINUTES: "15"
      PYTHON_SERVICE_URL: "http://crucix-python:8090"
      OTEL_ENABLED: "${OTEL_ENABLED:-false}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://crucix-jaeger:4318"
    volumes:
      - crucix-runs:/app/runs
      - crucix-logs:/app/logs
    networks:
      - crucix-net
    logging: *logging
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 1G
    healthcheck:
      test: ["CMD", "/app/healthcheck.sh"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    depends_on:
      crucix-jaeger:
        condition: service_started
      crucix-python:
        condition: service_started
        required: false

  crucix-fl-coordinator:
    image: crucix-core:3.0.0
    container_name: crucix-fl-coordinator
    hostname: fl-coordinator
    restart: unless-stopped
    ports:
      - "3120:3120"
    environment:
      <<: *common-env
      CRUCIX_MODE: fl
    volumes:
      - crucix-runs:/app/runs
      - crucix-logs:/app/logs
    networks:
      - crucix-net
    logging: *logging
    depends_on:
      - crucix-core

  crucix-python:
    build:
      context: ../python_service
      dockerfile: Dockerfile
    image: crucix-python:1.0.0
    container_name: crucix-python
    hostname: crucix-python
    restart: unless-stopped
    ports:
      - "8090:8090"
    environment:
      PYTHONUNBUFFERED: "1"
      LOG_LEVEL: info
    volumes:
      - crucix-runs:/app/runs:ro
      - crucix-python-models:/app/models
    networks:
      - crucix-net
    logging: *logging
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/health"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3

  crucix-proxy:
    image: nginx:alpine
    container_name: crucix-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ../dashboard:/usr/share/nginx/html:ro
      - ./certs:/etc/nginx/certs:ro
    networks:
      - crucix-net
    logging: *logging
    depends_on:
      - crucix-core

  crucix-jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: crucix-jaeger
    restart: unless-stopped
    ports:
      - "16686:16686"
      - "4318:4318"
      - "4317:4317"
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    networks:
      - crucix-net
    logging: *logging

  crucix-prometheus:
    image: prom/prometheus:latest
    container_name: crucix-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - crucix-prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
    networks:
      - crucix-net
    logging: *logging

  crucix-grafana:
    image: grafana/grafana:latest
    container_name: crucix-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-crucix-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_INSTALL_PLUGINS: grafana-clock-panel
    volumes:
      - crucix-grafana-data:/var/lib/grafana
      - ../observability/dashboards/grafana:/etc/grafana/provisioning/dashboards:ro
      - ../observability/datasources:/etc/grafana/provisioning/datasources:ro
    networks:
      - crucix-net
    logging: *logging
    depends_on:
      - crucix-prometheus

networks:
  crucix-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  crucix-runs:
    driver: local
  crucix-logs:
    driver: local
  crucix-python-models:
    driver: local
  crucix-prometheus-data:
    driver: local
  crucix-grafana-data:
    driver: local
