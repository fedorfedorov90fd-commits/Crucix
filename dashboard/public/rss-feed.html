function setLanguage(lang) {
    currentLang = lang;
    localStorage.setItem('rss-lang', lang);
    document.querySelectorAll('.lang-selector .lang-btn').forEach(b => b.classList.toggle('active', b.dataset.lang === lang));
    updateLanguage();
}

function updateLanguage() {
    const d = langData[currentLang];
    if (!d) return;
    document.getElementById('feed-title').textContent = d.title;
    document.getElementById('label-news-count').textContent = d.newsLabel;
    document.getElementById('btn-home').textContent = d.home;
    document.getElementById('btn-manage').textContent = d.manage;
    document.getElementById('legend-critical').textContent = d.critical;

        if (el && f[id]) el.textContent = f[id];

}

// ======== КАРТА РЕГИОНОВ ========
function detectRegion(source) {
    if (!source) return 'world';
    const s = source.toLowerCase();
    if (s.includes('bbc') || s.includes('guardian') || s.includes('economist') || s.includes('ft')) return 'uk';
    if (s.includes('cnn') || s.includes('bloomberg') || s.includes('washington post') || s.includes('wall street journal')) return 'us';
    if (s.includes('france 24') || s.includes('le monde')) return 'france';
    if (s.includes('deutsche welle') || s.includes('spiegel')) return 'germany';
    if (s.includes('al jazeera') || s.includes('alarabiya')) return 'middle-east';
    if (s.includes('nikkei') || s.includes('kyodo')) return 'japan';
    if (s.includes('xinhua') || s.includes('scmp') || s.includes('cgtn')) return 'china';
    if (s.includes('yonhap') || s.includes('chosun')) return 'south-korea';
    if (s.includes('kcna')) return 'north-korea';
    if (s.includes('irna') || s.includes('mehr')) return 'iran';
    if (s.includes('haaretz') || s.includes('times of israel')) return 'israel';
    if (s.includes('hurriyet') || s.includes('sabah')) return 'turkey';
    if (s.includes('ukrinform')) return 'ukraine';
    if (s.includes('tass') || s.includes('ria') || s.includes('interfax')) return 'russia';
    return 'world';
}

        'think-tanks':'🧠','forecasts':'📊','russia':'🇷🇺','china':'🇨🇳',
        'india':'🇮🇳','japan':'🇯🇵','south-korea':'🇰🇷','north-korea':'🇰🇵',
        'iran':'🇮🇷','israel':'🇮🇱','turkey':'🇹🇷','ukraine':'🇺🇦',
        'uk':'🇬🇧','germany':'🇩🇪','france':'🇫🇷'
    };
    return m[r] || '📰';
}

function getScoreClass(s) {
    if (s === null || s === undefined) return 'unknown';
    if (s >= 8) return 'critical';
    if (s >= 5) return 'important';
    return 'normal';
}

function getScoreDisplay(s) {
    if (s === null || s === undefined) return '⏳';
    return s;
}

function openArticle(url) {
    if (url && url !== '#') window.open(url, '_blank');
    else alert('Ссылка на статью отсутствует');
}

// ======== ОСНОВНАЯ ЛОГИКА ========
const track = document.getElementById('feed-track');
const counter = document.getElementById('feed-counter');
let allNews = [], currentRegion = 'all', maxItems = 20;
let aiRated = false;

function renderNews() {
    let filtered = allNews;
    if (currentRegion === 'critical') {
        filtered = allNews.filter(i => i.ai_score !== null && i.ai_score >= 7);
    } else if (currentRegion !== 'all') {
        filtered = allNews.filter(i => i.region === currentRegion);
        if (filtered.length === 0) filtered = allNews;
    }
    const display = filtered.slice(0, maxItems);
    if (display.length === 0) {
        track.innerHTML = `<div class="feed-empty">${langData[currentLang].empty}</div>`;
        return;
    }
    let html = '';
    for (const item of display) {
        const score = item.ai_score;
        const scoreClass = getScoreClass(score);
        const scoreDisplay = getScoreDisplay(score);
        const regionEmoji = getRegionEmoji(item.region);
        const time = new Date(item.date);
        const timeStr = time.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
        const url = item.url || '#';
        html += `<div class="feed-item ${scoreClass}" onclick="openArticle('${url}')">
            <span class="feed-icon">${regionEmoji}</span>
            <span class="feed-title">${item.title}</span>
            <span class="feed-source">${item.source}</span>
            <span class="feed-time">${timeStr}</span>
            <span class="feed-score">${scoreDisplay}</span>
        </div>`;
    }
    track.innerHTML = html;
    updateCounter();
}

function updateCounter() {
    const today = new Date().toISOString().slice(0, 10);
    const todayItems = allNews.filter(i => i.date && i.date.startsWith(today));
    const data = langData[currentLang];
    counter.textContent = `${data.counter} ${todayItems.length}`;
}

// ======== ЗАГРУЗКА НОВОСТЕЙ ========
console.log('📡 Загрузка новостей...');
fetch('/api/news/latest?limit=80')
    .then(r => r.json())
    .then(data => {
        console.log('📰 Получено:', data.total);
        if (data.news && data.news.length > 0) {
            allNews = data.news.slice(0, 50).map(item => {
                let date = item.collectedAt || item.pubDate || new Date().toISOString();
                if (item.pubDate) {
                    try {
                        const d = new Date(item.pubDate);
                        if (!isNaN(d)) date = d.toISOString();
                    } catch(e) {}
                }
                return {
                    id: item.id || 'news-' + Math.random(),
                    title: item.title || 'Без заголовка',
                    source: item.source || 'Источник',
                    region: detectRegion(item.source),
                    date: date,
                    url: item.link || '#',
                    summary: item.description || '',
                    ai_score: null
                };
            });
            
            // Сначала показываем новости без оценок
            renderNews();
            
            // Запрашиваем AI оценки для первых 15 новостей
            const toRate = allNews.slice(0, 15);
            console.log('🤖 Запрос AI оценок для', toRate.length, 'новостей...');
            
            fetch('/api/ai/rate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ news: toRate })
            })
            .then(r => r.json())
            .then(aiData => {
                console.log('📊 Ответ от AI:', aiData);
                if (aiData.success && aiData.news) {
                    for (const rated of aiData.news) {
                        const item = allNews.find(i => i.id === rated.id);
                        if (item) {
                            item.ai_score = rated.ai_score;
                            console.log('📊 Оценка для', item.title.slice(0, 30), ':', rated.ai_score);
                        }
                    }
                    renderNews();
                    console.log('✅ AI оценки получены и применены!');
                } else {
                    console.warn('⚠️ AI не вернул оценки');
                }
            })
            .catch(e => {
                console.warn('⚠️ Ошибка AI:', e);
            });
        }
    })
    .catch(e => {
        console.error('❌ Ошибка загрузки:', e);
        track.innerHTML = '<div class="feed-empty">Ошибка загрузки</div>';
    });

// ======== ФИЛЬТРЫ ========
document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', function() {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        this.classList.add('active');
        currentRegion = this.dataset.region;
        renderNews();
    });
});

document.getElementById('feed-count').addEventListener('change', function() {
    maxItems = parseInt(this.value);
    renderNews();
});

// ======== ИНИЦИАЛИЗАЦИЯ ========
document.querySelectorAll('.lang-selector .lang-btn').forEach(b => b.classList.toggle('active', b.dataset.lang === currentLang));
updateLanguage();
</script>
<script src="/js/export.js"></script>
