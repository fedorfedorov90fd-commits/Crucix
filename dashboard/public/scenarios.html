<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Симулятор сценариев — Crucix</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a0f;
      color: #c8d0d8;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', monospace;
      font-size: 13px;
      line-height: 1.5;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .topbar {
      position: fixed; top: 0; left: 0; right: 0; height: 60px;
      background: rgba(10, 10, 20, 0.92); backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.04); z-index: 100;
      display: flex; justify-content: space-between; align-items: center; padding: 0 20px;
    }
    .topbar-left { display: flex; align-items: center; gap: 12px; }
    .topbar-brand { font-size: 14px; font-weight: 700; color: #5bc0f8; text-transform: uppercase; letter-spacing: 2px; }
    .topbar-status { font-size: 11px; color: #ffd700; }

    .topbar-right { display: flex; align-items: center; gap: 6px; }
    .topbar-btn {
      height: 28px; padding: 0 12px; border: 1px solid rgba(255,255,255,0.08); border-radius: 4px;
      background: rgba(255,255,255,0.03); color: #888; font-size: 11px; font-weight: 500;
      text-transform: uppercase; cursor: pointer; transition: all 0.2s;
      display: flex; align-items: center; gap: 4px;
    }
    .topbar-btn:hover { background: rgba(255,255,255,0.06); transform: translateY(-1px); }
    .btn-home { color: #5bc0f8; border-color: rgba(91,192,248,0.2); background: rgba(91,192,248,0.06); }
    .btn-home:hover { background: rgba(91,192,248,0.15); }
    .btn-copy { color: #5bc0f8; border-color: rgba(91,192,248,0.15); background: rgba(91,192,248,0.06); }
    .btn-copy:hover { background: rgba(91,192,248,0.15); }
    .btn-grid { color: #9c27b0; border-color: rgba(156,39,176,0.15); background: rgba(156,39,176,0.06); }
    .btn-grid:hover { background: rgba(156,39,176,0.15); }
    .btn-grid.active { background: rgba(156,39,176,0.2); border-color: rgba(156,39,176,0.3); }

    .lang-switch {
      display: flex; gap: 2px; padding: 2px;
      background: rgba(255,255,255,0.03); border-radius: 4px; border: 1px solid rgba(255,255,255,0.06);
    }
    .lang-btn { padding: 2px 8px; border: none; background: transparent; color: #666; font-size: 11px; font-weight: 500; cursor: pointer; border-radius: 3px; transition: all 0.2s; }
    .lang-btn:hover { color: #888; background: rgba(255,255,255,0.05); }
    .lang-btn.active { color: #5bc0f8; background: rgba(91,192,248,0.1); }

    .main-content { padding-top: 76px; max-width: 1200px; margin: 0 auto; padding-left: 20px; padding-right: 20px; padding-bottom: 40px; }
    .page-title { font-size: 24px; font-weight: 700; color: #e8f0f8; margin-bottom: 20px; }

    .presets-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; margin-bottom: 16px;
    }
    .preset-card {
      background: rgba(10,10,20,0.5); border: 1px solid rgba(255,255,255,0.04); border-radius: 8px; padding: 12px 16px;
      cursor: pointer; transition: all 0.2s; border-left: 3px solid #4caf50;
    }
    .preset-card:hover { border-color: rgba(255,255,255,0.12); transform: translateY(-2px); }
    .preset-card .name { font-size: 14px; font-weight: 600; color: #e8f0f8; }
    .preset-card .desc { font-size: 11px; color: #888; margin: 4px 0; }
    .preset-card .impact { font-size: 12px; font-weight: 700; }
    .preset-card .impact.positive { color: #4caf50; }
    .preset-card .impact.negative { color: #f44336; }
    .preset-card .impact.high { color: #f26522; }

    .controls-panel {
      background: rgba(10,10,20,0.5); border: 1px solid rgba(255,255,255,0.04); border-radius: 8px; padding: 16px; margin-bottom: 16px;
    }
    .controls-panel .row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-top: 8px; }
    .controls-panel label { font-size: 11px; text-transform: uppercase; color: #666; letter-spacing: 0.5px; }
    .controls-panel input[type="range"] { width: 120px; accent-color: #5bc0f8; }
    .controls-panel .value { font-size: 14px; color: #e8f0f8; min-width: 30px; display: inline-block; }

    .btn { padding: 8px 20px; border: none; border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: 500; transition: all 0.2s; }
    .btn:hover { transform: translateY(-1px); opacity: 0.9; }
    .btn-primary { background: #5bc0f8; color: #0a0a0f; }
    .btn-success { background: #4caf50; color: #fff; }
    .btn-danger { background: #f44336; color: #fff; }
    .btn-secondary { background: #444; color: #fff; }

    .results-grid {
      display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; margin-bottom: 16px;
    }
    .result-card {
      background: rgba(10,10,20,0.5); border: 1px solid rgba(255,255,255,0.04); border-radius: 8px; padding: 16px; text-align: center;
    }
    .result-card .label { font-size: 10px; text-transform: uppercase; color: #666; letter-spacing: 0.5px; }
    .result-card .value { font-size: 28px; font-weight: 700; color: #e8f0f8; margin: 4px 0; }
    .result-card .value.critical { color: #f44336; }
    .result-card .value.high { color: #f26522; }
    .result-card .value.medium { color: #ffd700; }
    .result-card .value.normal { color: #4caf50; }
    .result-card .sub { font-size: 12px; color: #888; }

    .chart-container {
      background: rgba(10,10,20,0.5); border: 1px solid rgba(255,255,255,0.04); border-radius: 8px; padding: 16px; height: 220px; margin-bottom: 16px;
    }
    .chart-container canvas { width: 100% !important; height: calc(100% - 30px) !important; }
    .chart-container .title { font-size: 12px; color: #666; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }

    .history-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
    .history-item {
      display: flex; align-items: center; gap: 12px; padding: 8px 16px;
      background: rgba(10,10,20,0.3); border: 1px solid rgba(255,255,255,0.03); border-radius: 4px;
    }
    .history-item .time { font-size: 11px; color: #666; min-width: 140px; }
    .history-item .desc { flex: 1; font-size: 13px; color: #c8d0d8; }
    .history-item .impact { font-size: 13px; font-weight: 700; }
    .history-item .impact.positive { color: #4caf50; }
    .history-item .impact.negative { color: #f44336; }

    #coordinate-grid {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 99999;
      background-image: linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
      background-size: 50px 50px; display: none;
    }
    #coordinate-grid.visible { display: block; }
    #grid-coords {
      position: fixed; bottom: 12px; right: 12px; background: rgba(0,0,0,0.7);
      color: #00ff00; font-family: monospace; font-size: 11px; padding: 4px 10px; border-radius: 4px;
      z-index: 100000; pointer-events: none; display: none;
    }
    #grid-coords.visible { display: block; }

    .notification {
      position: fixed; bottom: 60px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.85); color: #fff; padding: 8px 20px; border-radius: 6px;
      font-size: 13px; z-index: 100001; border: 1px solid rgba(255,255,255,0.1);
      animation: notif-fade 2.5s forwards;
    }
    @keyframes notif-fade {
      0% { opacity: 0; transform: translateX(-50%) translateY(10px); }
      10% { opacity: 1; transform: translateX(-50%) translateY(0); }
      80% { opacity: 1; transform: translateX(-50%) translateY(0); }
      100% { opacity: 0; transform: translateX(-50%) translateY(-20px); }
    }

    @media (max-width: 768px) {
      .topbar { padding: 0 12px; height: 52px; }
      .topbar-brand { font-size: 12px; }
      .topbar-status { display: none; }
      .topbar-btn { font-size: 10px; padding: 0 8px; height: 24px; }
      .main-content { padding-top: 68px; padding-left: 12px; padding-right: 12px; }
      .page-title { font-size: 18px; }
      .presets-grid { grid-template-columns: 1fr 1fr; }
      .results-grid { grid-template-columns: 1fr; }
      .controls-panel .row { flex-direction: column; align-items: stretch; }
    }
    @media (max-width: 480px) {
      .topbar { padding: 0 8px; height: 46px; }
      .topbar-brand { font-size: 10px; letter-spacing: 1px; }
      .topbar-btn { font-size: 9px; padding: 0 6px; height: 20px; }
      .topbar-btn .btn-text { display: none; }
      .lang-btn { font-size: 9px; padding: 1px 5px; }
      .main-content { padding-top: 62px; padding-left: 8px; padding-right: 8px; }
      .page-title { font-size: 16px; }
      .presets-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <header class="topbar">
    <div class="topbar-left">
      <span class="topbar-brand">⚡ CRUCIX MONITOR</span>
      <span class="topbar-status">МОДУЛЬ №16</span>
    </div>
    <div class="topbar-right">
      <button class="topbar-btn btn-home" onclick="window.location.href='/jarvis'">← НА ГЛАВНУЮ</button>
      <button class="topbar-btn btn-copy" id="copy-btn">📋 КОПИРОВАТЬ</button>
      <button class="topbar-btn btn-grid" id="grid-toggle">📐 СЕТКА</button>
      <div class="lang-switch">
        <button class="lang-btn active" data-lang="ru" onclick="switchLang('ru')">RU</button>
        <button class="lang-btn" data-lang="en" onclick="switchLang('en')">EN</button>
      </div>
    </div>
  </header>

  <main class="main-content">
    <h1 class="page-title" id="page-title">🎲 Симулятор сценариев «Что-если»</h1>

    <div class="presets-grid" id="presets-grid"></div>

    <div class="controls-panel">
      <div style="font-size:13px;color:#888;margin-bottom:4px;">⚙️ Ручная настройка сценария</div>
      <div class="row">
        <div>
          <label>Военная активность</label>
          <input type="range" id="military" min="0" max="10" value="5" oninput="updateValue('military', this.value)">
          <span class="value" id="military-val">5</span>
        </div>
        <div>
          <label>Экономическое влияние</label>
          <input type="range" id="economic" min="0" max="10" value="5" oninput="updateValue('economic', this.value)">
          <span class="value" id="economic-val">5</span>
        </div>
        <div>
          <label>Дипломатическая напряжённость</label>
          <input type="range" id="diplomatic" min="0" max="10" value="5" oninput="updateValue('diplomatic', this.value)">
          <span class="value" id="diplomatic-val">5</span>
        </div>
        <div>
          <label>Гуманитарное влияние</label>
          <input type="range" id="humanitarian" min="0" max="10" value="5" oninput="updateValue('humanitarian', this.value)">
          <span class="value" id="humanitarian-val">5</span>
        </div>
        <button class="btn btn-primary" onclick="runCustomScenario()">▶ Запустить</button>
      </div>
    </div>

    <div class="results-grid" id="results">
      <div class="result-card">
        <span class="label">📊 Текущий индекс</span>
        <div class="value" id="base-index">37</div>
        <span class="sub">базовый</span>
      </div>
      <div class="result-card">
        <span class="label">📈 Новый индекс</span>
        <div class="value" id="new-index">—</div>
        <span class="sub" id="impact-label">ожидание</span>
      </div>
      <div class="result-card">
        <span class="label">📌 Уровень</span>
        <div class="value" id="level-result">—</div>
        <span class="sub" id="level-label">—</span>
      </div>
    </div>

    <div class="chart-container">
      <div class="title">📊 Сравнение сценариев</div>
      <canvas id="comparison-chart"></canvas>
    </div>

    <h2 style="color:#888;font-size:14px;margin:8px 0;">📜 История запусков</h2>
    <div class="history-list" id="history-list"></div>

  </main>

  <div id="coordinate-grid"></div>
  <div id="grid-coords">X: 0  Y: 0</div>

  <script>
    // ============================================================
    // 1. ПЕРЕКЛЮЧАТЕЛЬ ЯЗЫКА
    // ============================================================
    let currentLang = localStorage.getItem('crucix-lang') || 'ru';

    function switchLang(lang) {
      currentLang = lang;
      localStorage.setItem('crucix-lang', lang);
      document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.dataset.lang === lang));
      showNotification(`🌐 Язык: ${lang.toUpperCase()}`);
      updateTexts(lang);
    }

    document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.dataset.lang === currentLang));

    function updateTexts(lang) {
      const texts = {
        ru: { title: '🎲 Симулятор сценариев «Что-если»' },
        en: { title: '🎲 What-If Scenario Simulator' }
      };
      const t = texts[lang] || texts.ru;
      document.getElementById('page-title').textContent = t.title;
    }

    updateTexts(currentLang);

    // ============================================================
    // 2. КООРДИНАТНАЯ СЕТКА
    // ============================================================
    let gridVisible = false;
    document.addEventListener('keydown', function(e) {
      if (e.ctrlKey && e.shiftKey && e.key === 'G') { e.preventDefault(); toggleGrid(); }
    });
    document.getElementById('grid-toggle').addEventListener('click', toggleGrid);

    function toggleGrid() {
      gridVisible = !gridVisible;
      document.getElementById('coordinate-grid').classList.toggle('visible', gridVisible);
      document.getElementById('grid-coords').classList.toggle('visible', gridVisible);
      document.getElementById('grid-toggle').classList.toggle('active', gridVisible);
      if (gridVisible) {
        showNotification('⊞ Сетка включена (Ctrl+Shift+G для выключения)');
        document.addEventListener('mousemove', updateCoords);
      } else {
        showNotification('⊞ Сетка выключена');
        document.removeEventListener('mousemove', updateCoords);
      }
    }

    function updateCoords(e) {
      document.getElementById('grid-coords').textContent = `X: ${e.clientX}  Y: ${e.clientY}`;
    }

    function showNotification(msg) {
      const el = document.createElement('div');
      el.className = 'notification';
      el.textContent = msg;
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 2500);
    }

    // ============================================================
    // 3. ОСНОВНЫЕ ФУНКЦИИ
    // ============================================================
    let chart = null;
    let historyData = [];

    function updateValue(id, val) {
      document.getElementById(`${id}-val`).textContent = val;
    }

    async function loadPresets() {
      try {
        const resp = await fetch('/api/scenarios/presets');
        const data = await resp.json();
        if (data.success) {
          renderPresets(data.presets);
        }
      } catch(e) { console.error('[Scenarios] Ошибка загрузки пресетов:', e); }
    }

    function renderPresets(presets) {
      const container = document.getElementById('presets-grid');
      let html = '';
      for (const p of presets) {
        const impact = p.parameters.globalIndexImpact || 0;
        const impactClass = impact > 0 ? 'negative' : 'positive';
        const sign = impact > 0 ? '+' : '';
        const severityClass = Math.abs(impact) > 20 ? 'high' : '';
        html += `
          <div class="preset-card" onclick="runPreset('${p.id}')">
            <div class="name">${p.name}</div>
            <div class="desc">${p.description}</div>
            <div class="impact ${impactClass} ${severityClass}">${sign}${impact} пунктов</div>
          </div>
        `;
      }
      container.innerHTML = html;
    }

    async function runPreset(presetId) {
      try {
        const resp = await fetch('/api/scenarios/run', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ presetId })
        });
        const data = await resp.json();
        if (data.success) {
          displayResult(data.result);
          loadHistory();
          showNotification(`✅ Сценарий запущен!`);
        }
      } catch(e) { console.error('[Scenarios] Ошибка запуска:', e); }
    }

    async function runCustomScenario() {
      const params = {
        militaryActivity: parseInt(document.getElementById('military').value),
        economicImpact: parseInt(document.getElementById('economic').value),
        diplomaticTension: parseInt(document.getElementById('diplomatic').value),
        humanitarianImpact: parseInt(document.getElementById('humanitarian').value)
      };
      try {
        const resp = await fetch('/api/scenarios/run', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ params })
        });
        const data = await resp.json();
        if (data.success) {
          displayResult(data.result);
          loadHistory();
          showNotification(`✅ Сценарий запущен!`);
        }
      } catch(e) { console.error('[Scenarios] Ошибка запуска:', e); }
    }

    function displayResult(result) {
      document.getElementById('base-index').textContent = result.baseIndex;
      document.getElementById('new-index').textContent = result.newIndex;

      const levelEl = document.getElementById('level-result');
      const levelLabels = { critical: 'КРИТИЧЕСКИЙ', high: 'ВЫСОКИЙ', medium: 'СРЕДНИЙ', normal: 'НОРМАЛЬНЫЙ' };
      levelEl.textContent = levelLabels[result.level] || result.level;
      levelEl.className = 'value ' + result.level;

      const labelMap = { critical: '🚨 Срочные действия', high: '⚠️ Повышенное внимание', medium: '📊 Мониторинг', normal: '✅ Штатный режим' };
      document.getElementById('level-label').textContent = labelMap[result.level] || '';

      const impact = result.impact;
      const sign = impact > 0 ? '+' : '';
      document.getElementById('impact-label').textContent = `${sign}${impact} пунктов`;

      // Добавляем в историю
      historyData.unshift(result);
      renderComparison();
    }

    async function loadHistory() {
      try {
        const resp = await fetch('/api/scenarios/history?limit=10');
        const data = await resp.json();
        if (data.success) {
          historyData = data.history || [];
          renderHistory();
          renderComparison();
        }
      } catch(e) { console.error('[Scenarios] Ошибка загрузки истории:', e); }
    }

    function renderHistory() {
      const container = document.getElementById('history-list');
      if (!historyData.length) {
        container.innerHTML = '<div style="text-align:center;color:#666;padding:10px;">История пуста</div>';
        return;
      }
      let html = '';
      for (const h of historyData) {
        const time = new Date(h.timestamp).toLocaleString();
        const impactClass = h.impact > 0 ? 'negative' : 'positive';
        const sign = h.impact > 0 ? '+' : '';
        html += `
          <div class="history-item">
            <span class="time">${time}</span>
            <span class="desc">${h.summary || 'Сценарий'}</span>
            <span class="impact ${impactClass}">${sign}${h.impact}</span>
          </div>
        `;
      }
      container.innerHTML = html;
    }

    function renderComparison() {
      const ctx = document.getElementById('comparison-chart').getContext('2d');
      if (chart) { chart.destroy(); }

      const labels = historyData.slice(0, 7).map((h, i) => `#${i+1}`).reverse();
      const values = historyData.slice(0, 7).map(h => h.newIndex).reverse();
      const impacts = historyData.slice(0, 7).map(h => h.impact).reverse();

      if (!labels.length) {
        ctx.canvas.parentElement.innerHTML = '<div style="text-align:center;color:#666;padding:20px;">Запустите сценарий для отображения графика</div>';
        return;
      }

      chart = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: labels,
          datasets: [
            {
              label: 'Новый индекс',
              data: values,
              backgroundColor: values.map(v => v >= 70 ? '#f44336' : v >= 50 ? '#f26522' : v >= 30 ? '#ffd700' : '#4caf50'),
              borderColor: '#5bc0f8',
              borderWidth: 1
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { display: false }
          },
          scales: {
            y: {
              min: 0,
              max: 100,
              ticks: { color: '#666', font: { size: 9 } },
              grid: { color: 'rgba(255,255,255,0.03)' }
            },
            x: {
              ticks: { color: '#666', font: { size: 9 } },
              grid: { display: false }
            }
          }
        }
      });
    }

    // ============================================================
    // 4. КНОПКА КОПИРОВАНИЯ
    // ============================================================
    function copyPageData() {
      const base = document.getElementById('base-index').textContent || '—';
      const newIdx = document.getElementById('new-index').textContent || '—';
      const level = document.getElementById('level-result').textContent || '—';
      const impact = document.getElementById('impact-label').textContent || '—';

      let text = `=== Симулятор сценариев ===\n`;
      text += `Дата: ${new Date().toLocaleString()}\n\n`;
      text += `--- РЕЗУЛЬТАТЫ ---\n`;
      text += `Текущий индекс: ${base}\n`;
      text += `Новый индекс: ${newIdx}\n`;
      text += `Уровень: ${level}\n`;
      text += `Изменение: ${impact}\n\n`;
      text += `--- ИСТОРИЯ (${historyData.length}) ---\n`;
      for (const h of historyData) {
        const sign = h.impact > 0 ? '+' : '';
        text += `${h.summary || 'Сценарий'}: ${sign}${h.impact} → ${h.newIndex}\n`;
      }

      navigator.clipboard.writeText(text).then(() => {
        showNotification('✅ Данные скопированы');
      }).catch(() => {
        const area = document.createElement('textarea');
        area.value = text;
        document.body.appendChild(area);
        area.select();
        document.execCommand('copy');
        document.body.removeChild(area);
        showNotification('✅ Данные скопированы');
      });
    }

    document.getElementById('copy-btn').addEventListener('click', copyPageData);

    // ============================================================
    // 5. ЗАГРУЗКА
    // ============================================================
    document.addEventListener('DOMContentLoaded', function() {
      loadPresets();
      loadHistory();
    });
  </script>
</body>
</html>
