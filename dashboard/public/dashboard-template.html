<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Новая страница — Crucix</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a0f;
      color: #c8d0d8;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', monospace;
      font-size: 13px;
      line-height: 1.5;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ===== ВЕРХНЯЯ ПАНЕЛЬ ===== */
    .topbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 60px;
      background: rgba(10, 10, 20, 0.95);
      backdrop-filter: blur(12px);
      border-bottom: 2px solid rgba(91, 192, 248, 0.25);
      box-shadow: 0 2px 20px rgba(91, 192, 248, 0.08);
      z-index: 100;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 20px;
    }
    .topbar::after {
      content: "";
      position: absolute;
      bottom: -2px;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, #5bc0f8, transparent);
      opacity: 0.6;
    }
    .topbar-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .topbar-brand {
      font-size: 14px;
      font-weight: 700;
      color: #5bc0f8;
      text-transform: uppercase;
      letter-spacing: 2px;
      text-shadow: 0 0 20px rgba(91, 192, 248, 0.15);
    }
    .topbar-right {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .topbar-btn {
      height: 28px;
      padding: 0 12px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.03);
      color: #888;
      font-size: 11px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .topbar-btn:hover {
      background: rgba(255, 255, 255, 0.06);
      transform: translateY(-1px);
    }
    .btn-home { color: #5bc0f8; border-color: rgba(91, 192, 248, 0.2); background: rgba(91, 192, 248, 0.06); }
    .btn-home:hover { background: rgba(91, 192, 248, 0.15); }
    .btn-copy { color: #5bc0f8; border-color: rgba(91, 192, 248, 0.15); background: rgba(91, 192, 248, 0.06); }
    .btn-copy:hover { background: rgba(91, 192, 248, 0.15); }
    .btn-copy.copied { background: rgba(76, 175, 80, 0.2); border-color: #4caf50; color: #4caf50; }
    .btn-rss { color: #f26522; border-color: rgba(242, 101, 34, 0.2); background: rgba(242, 101, 34, 0.06); }
    .btn-rss:hover { background: rgba(242, 101, 34, 0.15); }
    .btn-help { color: #a78bfa; border-color: rgba(167, 139, 250, 0.2); background: rgba(167, 139, 250, 0.06); }
    .btn-help:hover { background: rgba(167, 139, 250, 0.15); }

    .lang-switch {
      display: flex;
      gap: 2px;
      padding: 2px;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 4px;
      border: 1px solid rgba(255, 255, 255, 0.06);
    }
    .lang-btn {
      padding: 2px 8px;
      border: none;
      background: transparent;
      color: #666;
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      border-radius: 3px;
      transition: all 0.2s;
    }
    .lang-btn:hover { color: #888; background: rgba(255, 255, 255, 0.05); }
    .lang-btn.active { color: #5bc0f8; background: rgba(91, 192, 248, 0.1); }

    /* ===== КНОПКА С КОПИРОВАНИЕМ (ВЫПАДАЮЩЕЕ МЕНЮ) ===== */
    .copy-dropdown {
      position: relative;
      display: inline-block;
    }
    .copy-dropdown-content {
      display: none;
      position: absolute;
      right: 0;
      top: 32px;
      background: #0a0a1a;
      min-width: 220px;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 8px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.6);
      z-index: 200;
      padding: 6px 0;
    }
    .copy-dropdown-content.show {
      display: block;
    }
    .copy-dropdown-content button {
      display: block;
      width: 100%;
      padding: 8px 16px;
      background: transparent;
      border: none;
      color: #c8d0d8;
      font-size: 12px;
      text-align: left;
      cursor: pointer;
      transition: all 0.15s;
      font-family: inherit;
    }
    .copy-dropdown-content button:hover {
      background: rgba(91, 192, 248, 0.08);
      color: #5bc0f8;
    }
    .copy-dropdown-content .divider {
      height: 1px;
      background: rgba(255,255,255,0.05);
      margin: 4px 12px;
    }
    .copy-dropdown-content .label {
      padding: 4px 16px;
      font-size: 10px;
      color: #4a5a6a;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* ===== ОСНОВНОЙ КОНТЕНТ ===== */
    .main-content {
      padding-top: 80px;
      max-width: 1400px;
      margin: 0 auto;
      padding-left: 20px;
      padding-right: 20px;
      padding-bottom: 40px;
      min-height: calc(100vh - 80px);
    }
    .page-title {
      font-size: 24px;
      font-weight: 700;
      color: #e8f0f8;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
      text-shadow: 0 0 30px rgba(91, 192, 248, 0.05);
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .page-title .badge {
      font-size: 12px; font-weight: 400;
      background: rgba(74,222,128,0.15); color: #4ade80;
      padding: 2px 12px; border-radius: 20px;
      border: 1px solid rgba(74,222,128,0.2);
    }
    .page-subtitle {
      color: #8899aa;
      font-size: 14px;
      margin-bottom: 24px;
    }

    /* ===== ДОПОЛНИТЕЛЬНЫЕ СТИЛИ ДЛЯ ДАШБОРДА ===== */

    /* ГЛОБАЛЬНЫЙ ИНДЕКС */
    .global-index {
      background: rgba(255,255,255,0.02);
      border: 1px solid rgba(255,255,255,0.05);
      border-radius: 12px;
      padding: 20px 24px;
      margin-bottom: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
    }
    .global-index .value {
      font-size: 36px;
      font-weight: 700;
      color: #f59e0b;
    }
    .global-index .label { font-size: 14px; color: #8899aa; }
    .global-index .status {
      font-size: 14px;
      font-weight: 600;
      padding: 4px 16px;
      border-radius: 20px;
    }
    .global-index .stats { display: flex; gap: 24px; font-size: 14px; color: #8899aa; }
    .global-index .stats strong { color: #e0e0e0; }
    .global-index .stats .num-normal { color: #4ade80; }
    .global-index .stats .num-medium { color: #fbbf24; }
    .global-index .stats .num-high { color: #f59e0b; }
    .global-index .stats .num-critical { color: #ef4444; }

    /* СЕТКА КАРТОЧЕК (5×6 = 30) */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 12px;
      margin-bottom: 24px;
    }
    .card {
      background: rgba(255,255,255,0.02);
      border: 1px solid rgba(255,255,255,0.05);
      border-radius: 10px;
      padding: 14px;
      cursor: pointer;
      transition: all 0.2s;
      position: relative;
      min-height: 150px;
      display: flex;
      flex-direction: column;
    }
    .card:hover {
      background: rgba(255,255,255,0.04);
      transform: translateY(-2px);
      border-color: rgba(255,255,255,0.1);
    }
    .card .card-number {
      position: absolute;
      top: 4px; left: 6px;
      font-size: 9px;
      font-weight: 700;
      color: #4a5a6a;
      background: rgba(255,255,255,0.04);
      padding: 0 6px;
      border-radius: 4px;
      font-family: monospace;
    }
    .card .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
      margin-top: 6px;
    }
    .card .header .icon { font-size: 18px; }
    .card .header .name { font-size: 12px; font-weight: 600; color: #c0d0e0; }
    .card .header .status-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      display: inline-block;
      flex-shrink: 0;
    }
    .card .main-value {
      font-size: 22px;
      font-weight: 700;
      margin: 2px 0;
    }
    .card .change {
      font-size: 12px;
      font-weight: 600;
      margin-left: 4px;
    }
    .card .change.up { color: #4ade80; }
    .card .change.down { color: #ef4444; }
    .card .change.neutral { color: #f59e0b; }
    .card .status-label {
      font-size: 11px;
      font-weight: 600;
      padding: 1px 8px;
      border-radius: 12px;
      display: inline-block;
      margin: 2px 0;
    }
    .card .status-label.critical { background: rgba(239,68,68,0.15); color: #ef4444; border: 1px solid rgba(239,68,68,0.2); }
    .card .status-label.high { background: rgba(245,158,11,0.15); color: #f59e0b; border: 1px solid rgba(245,158,11,0.2); }
    .card .status-label.medium { background: rgba(251,191,36,0.15); color: #fbbf24; border: 1px solid rgba(251,191,36,0.2); }
    .card .status-label.normal { background: rgba(74,222,128,0.15); color: #4ade80; border: 1px solid rgba(74,222,128,0.2); }
    .card .source {
      font-size: 9px;
      color: #4a5a6a;
      margin-top: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .card .source .src { color: #5bc0f8; }
    .card .source .updated { color: #4a5a6a; }
    .card .click-hint {
      font-size: 8px;
      color: #4a5a6a;
      text-align: center;
      margin-top: 2px;
    }

    .bg-critical { background: #ef4444; }
    .bg-high { background: #f59e0b; }
    .bg-medium { background: #fbbf24; }
    .bg-low { background: #4ade80; }
    .bg-online { background: #4ade80; }
    .bg-offline { background: #ef4444; }

    /* ГРАФИКИ */
    .charts-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 24px;
    }
    .chart-box {
      background: rgba(255,255,255,0.02);
      border: 1px solid rgba(255,255,255,0.05);
      border-radius: 10px;
      padding: 16px;
      min-height: 200px;
    }
    .chart-box .title {
      font-size: 13px;
      font-weight: 600;
      color: #8899aa;
      margin-bottom: 8px;
    }
    .chart-box .chart-placeholder {
      display: flex;
      align-items: flex-end;
      justify-content: center;
      height: 140px;
      gap: 2px;
      padding: 4px 0;
    }
    .chart-box .chart-placeholder .bar {
      flex: 1;
      border-radius: 2px 2px 0 0;
      min-width: 4px;
      min-height: 4px;
      transition: all 0.3s;
    }
    .chart-box .labels {
      display: flex;
      justify-content: space-between;
      font-size: 9px;
      color: #4a5a6a;
      margin-top: 4px;
    }

    /* ЛЕНТА СОБЫТИЙ */
    .feed {
      background: rgba(255,255,255,0.02);
      border: 1px solid rgba(255,255,255,0.05);
      border-radius: 10px;
      padding: 16px;
      max-height: 300px;
      overflow-y: auto;
    }
    .feed .title {
      font-size: 13px;
      font-weight: 600;
      color: #8899aa;
      margin-bottom: 8px;
    }
    .feed-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 6px 0;
      border-bottom: 1px solid rgba(255,255,255,0.03);
      font-size: 13px;
    }
    .feed-item .source {
      font-weight: 600;
      font-size: 10px;
      padding: 1px 8px;
      border-radius: 4px;
      min-width: 60px;
      text-align: center;
    }
    .feed-item .msg { flex: 1; color: #c0d0e0; }
    .feed-item .time { font-size: 11px; color: #4a5a6a; }

    /* ===== УВЕДОМЛЕНИЯ ===== */
    .notification {
      position: fixed;
      bottom: 60px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.85);
      color: #ffffff;
      padding: 8px 20px;
      border-radius: 6px;
      font-size: 13px;
      z-index: 100001;
      border: 1px solid rgba(255, 255, 255, 0.1);
      animation: notif-fade 2.5s forwards;
    }
    @keyframes notif-fade {
      0% { opacity: 0; transform: translateX(-50%) translateY(10px); }
      10% { opacity: 1; transform: translateX(-50%) translateY(0); }
      80% { opacity: 1; transform: translateX(-50%) translateY(0); }
      100% { opacity: 0; transform: translateX(-50%) translateY(-20px); }
    }

    /* ===== АДАПТИВНОСТЬ ===== */
    @media (max-width: 768px) {
      .topbar { padding: 0 12px; height: 52px; }
      .topbar-brand { font-size: 12px; }
      .topbar-btn { font-size: 10px; padding: 0 8px; height: 24px; }
      .main-content { padding-top: 68px; padding-left: 12px; padding-right: 12px; }
      .page-title { font-size: 18px; }
      .cards-grid { grid-template-columns: repeat(3, 1fr); }
      .charts-row { grid-template-columns: 1fr; }
    }
    @media (max-width: 480px) {
      .topbar { padding: 0 8px; height: 46px; }
      .topbar-brand { font-size: 10px; letter-spacing: 1px; }
      .topbar-btn { font-size: 9px; padding: 0 6px; height: 20px; }
      .lang-btn { font-size: 9px; padding: 1px 5px; }
      .main-content { padding-top: 62px; padding-left: 8px; padding-right: 8px; }
      .page-title { font-size: 16px; }
      .cards-grid { grid-template-columns: repeat(2, 1fr); }
      .global-index { flex-direction: column; align-items: flex-start; gap: 12px; }
      .global-index .stats { flex-wrap: wrap; gap: 8px; }
    }
    @media (max-width: 1200px) {
      .cards-grid { grid-template-columns: repeat(4, 1fr); }
    }
    @media (max-width: 992px) {
      .cards-grid { grid-template-columns: repeat(3, 1fr); }
    }
  </style>
</head>
<body>

  <!-- ===== ВЕРХНЯЯ ПАНЕЛЬ ===== -->
  <header class="topbar">
    <div class="topbar-left">
      <span class="topbar-brand">⚡ CRUCIX MONITOR</span>
    </div>
    <div class="topbar-right">
      <button class="topbar-btn btn-home" onclick="window.location.href='/jarvis'">← НА ГЛАВНУЮ</button>

      <!-- Кнопка копирования с выпадающим меню -->
      <div class="copy-dropdown">
        <button class="topbar-btn btn-copy" id="copy-btn" title="Копировать данные страницы">📋 КОПИРОВАТЬ ▼</button>
        <div class="copy-dropdown-content" id="copyDropdown">
          <div class="label">ФОРМАТЫ КОПИРОВАНИЯ</div>
          <button data-format="text">📄 Как текст (полный снапшот)</button>
          <button data-format="markdown">📝 Как Markdown</button>
          <button data-format="json">📊 Как JSON</button>
          <button data-format="csv">📋 Как CSV (таблицы)</button>
          <div class="divider"></div>
          <button data-format="dom">🌳 DOM-дерево</button>
          <button data-format="storage">💾 localStorage + sessionStorage</button>
          <button data-format="api">📡 API-запросы страницы</button>
          <div class="divider"></div>
          <button data-format="all">📦 ВСЁ В ОДНОМ</button>
        </div>
      </div>

      <button class="topbar-btn btn-rss" onclick="window.location.href='/registry'">📡 Список страниц</button>
      <button class="topbar-btn btn-help" onclick="openHelp()" title="Справка по странице">❓ HELP</button>
      <div class="lang-switch">
        <button class="lang-btn active" data-lang="ru" onclick="switchLang('ru')">RU</button>
        <button class="lang-btn" data-lang="en" onclick="switchLang('en')">EN</button>
      </div>
    </div>
  </header>

  <!-- ===== ОСНОВНОЙ КОНТЕНТ ===== -->
  <main class="main-content">
    <div class="page-title">
      <span id="pageIcon">📊</span> [НАЗВАНИЕ ДАШБОРДА]
      <span class="badge" id="statusBadge">🟢 ONLINE</span>
    </div>
    <div class="page-subtitle">[ОПИСАНИЕ ДАШБОРДА] — все ключевые индикаторы в реальном времени</div>

    <!-- ГЛОБАЛЬНЫЙ ИНДЕКС -->
    <div class="global-index" id="globalIndexBlock">
      <div>
        <div class="label">🌍 Глобальный индекс [категория]</div>
        <div class="value" id="globalIndex">—</div>
      </div>
      <div class="stats">
        <span>🟢 Нормально: <strong id="normalCount" class="num-normal">0</strong></span>
        <span>🟡 Средний: <strong id="mediumCount" class="num-medium">0</strong></span>
        <span>🟠 Высокий: <strong id="highCount" class="num-high">0</strong></span>
        <span>🔴 Критический: <strong id="criticalCount" class="num-critical">0</strong></span>
      </div>
      <div>
        <span class="status" id="globalStatus">🟢 НОРМАЛЬНО</span>
      </div>
    </div>

    <!-- 30 КАРТОЧЕК -->
    <div class="cards-grid" id="cardsGrid">
      <!-- Карточки будут сгенерированы JavaScript -->
    </div>

    <!-- ГРАФИКИ -->
    <div class="charts-row">
      <div class="chart-box">
        <div class="title" id="chart1Title">📈 График 1</div>
        <div class="chart-placeholder" id="chart1"></div>
        <div class="labels" id="chart1Labels"></div>
      </div>
      <div class="chart-box">
        <div class="title" id="chart2Title">📈 График 2</div>
        <div class="chart-placeholder" id="chart2"></div>
        <div class="labels" id="chart2Labels"></div>
      </div>
    </div>

    <!-- ЛЕНТА СОБЫТИЙ -->
    <div class="feed">
      <div class="title">📋 Поток событий</div>
      <div id="feedList"></div>
    </div>
  </main>

  <!-- ===== JAVASCRIPT ===== -->
  <script>
    // ============================================================
    // 1. ПЕРЕКЛЮЧАТЕЛЬ ЯЗЫКА
    // ============================================================
    let currentLang = localStorage.getItem('crucix-lang') || 'ru';

    function switchLang(lang) {
      currentLang = lang;
      localStorage.setItem('crucix-lang', lang);
      document.querySelectorAll('.lang-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.lang === lang);
      });
      showNotification(`🌐 Язык: ${lang.toUpperCase()}`);
    }

    document.querySelectorAll('.lang-btn').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.lang === currentLang);
    });

    // ============================================================
    // 2. ВЫПАДАЮЩЕЕ МЕНЮ КОПИРОВАНИЯ
    // ============================================================
    const copyBtn = document.getElementById('copy-btn');
    const copyDropdown = document.getElementById('copyDropdown');

    copyBtn.addEventListener('click', function(e) {
      e.stopPropagation();
      copyDropdown.classList.toggle('show');
    });

    document.addEventListener('click', function() {
      copyDropdown.classList.remove('show');
    });

    document.querySelectorAll('#copyDropdown button[data-format]').forEach(btn => {
      btn.addEventListener('click', function(e) {
        e.stopPropagation();
        const format = this.dataset.format;
        copyDropdown.classList.remove('show');
        copyPageData(format);
      });
    });

    // ============================================================
    // 3. УНИВЕРСАЛЬНАЯ ФУНКЦИЯ КОПИРОВАНИЯ
    // ============================================================
    function copyPageData(format = 'text') {
      const timestamp = new Date().toLocaleString();
      const pageTitle = document.querySelector('.page-title')?.textContent || document.title || 'Без заголовка';
      const url = window.location.href;
      const windowSize = `${window.innerWidth}×${window.innerHeight}`;

      let report = '';

      switch(format) {
        case 'text':
          report = generateTextReport(timestamp, pageTitle, url, windowSize);
          break;
        case 'markdown':
          report = generateMarkdownReport(timestamp, pageTitle, url, windowSize);
          break;
        case 'json':
          report = generateJSONReport(timestamp, pageTitle, url, windowSize);
          break;
        case 'csv':
          report = generateCSVReport(timestamp, pageTitle, url, windowSize);
          break;
        case 'dom':
          report = generateDOMReport(timestamp, pageTitle, url, windowSize);
          break;
        case 'storage':
          report = generateStorageReport(timestamp, pageTitle, url, windowSize);
          break;
        case 'api':
          report = generateAPIReport(timestamp, pageTitle, url, windowSize);
          break;
        case 'all':
          report = generateAllReport(timestamp, pageTitle, url, windowSize);
          break;
        default:
          report = generateTextReport(timestamp, pageTitle, url, windowSize);
      }

      navigator.clipboard.writeText(report).then(() => {
        const btn = document.getElementById('copy-btn');
        btn.textContent = `✅ ${format.toUpperCase()}`;
        btn.classList.add('copied');
        setTimeout(() => {
          btn.textContent = '📋 КОПИРОВАТЬ ▼';
          btn.classList.remove('copied');
        }, 3000);
        showNotification(`✅ Скопировано в формате ${format.toUpperCase()}`);
      }).catch(() => {
        const textarea = document.createElement('textarea');
        textarea.value = report;
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand('copy');
        document.body.removeChild(textarea);
        showNotification(`✅ Скопировано в формате ${format.toUpperCase()}`);
      });
    }

    // ============================================================
    // 4. ГЕНЕРАТОРЫ ОТЧЁТОВ (из шаблона — полная версия)
    // ============================================================

    // ——— 4.1. ТЕКСТОВЫЙ ОТЧЁТ (полный снапшот) ———
    function generateTextReport(timestamp, pageTitle, url, windowSize) {
      const elements = collectAllElements();
      const buttons = collectButtonDistances();

      let report = `=== CRUCIX — ПОЛНЫЙ СНАПШОТ СТРАНИЦЫ ===\n`;
      report += `Дата: ${timestamp}\n`;
      report += `URL: ${url}\n`;
      report += `Размер окна: ${windowSize}\n`;
      report += `Всего элементов: ${elements.length}\n`;
      report += `Кнопок: ${buttons.buttonCount}\n\n`;
      report += `--- ЗАГОЛОВОК ---\n${pageTitle}\n\n`;
      report += `--- ВСЕ ЭЛЕМЕНТЫ (${elements.length} шт.) ---\n`;

      for (const el of elements) {
        report += `\n[${el.index}] ${el.selector}\n`;
        report += `  Текст: ${el.text || '—'}\n`;
        report += `  Координаты: X=${el.coords.x} Y=${el.coords.y} (${el.coords.width}×${el.coords.height})\n`;
        report += `  Цвет: ${el.styles.color || '—'}\n`;
        report += `  Фон: ${el.styles.backgroundColor || '—'}\n`;
        report += `  Шрифт: ${el.styles.fontFamily || '—'} ${el.styles.fontSize || '—'}\n`;
        report += `  Отступы: ${el.styles.padding || '—'}\n`;
        report += `  Граница: ${el.styles.border || '—'}\n`;
        report += `  Скругление: ${el.styles.borderRadius || '—'}\n`;
        report += `  Тень: ${el.styles.boxShadow || '—'}\n`;
        report += `  Display: ${el.styles.display || '—'}\n`;
        report += `  Position: ${el.styles.position || '—'}\n`;
      }

      if (buttons.distances.length > 0) {
        report += `\n--- ДИСТАНЦИИ МЕЖДУ КНОПКАМИ (${buttons.distances.length}) ---\n`;
        for (const d of buttons.distances) {
          report += `  ${d.from} → ${d.to}: ${d.distance}px\n`;
        }
      }

      report += `\n--- CRUCIX OSINT TERMINAL ---\n🌐 ${url}`;
      return report;
    }

    // ——— 4.2. MARKDOWN ОТЧЁТ ———
    function generateMarkdownReport(timestamp, pageTitle, url, windowSize) {
      const elements = collectAllElements();

      let md = `# CRUCIX — СНАПШОТ СТРАНИЦЫ\n\n`;
      md += `**Дата:** ${timestamp}\n`;
      md += `**URL:** ${url}\n`;
      md += `**Размер окна:** ${windowSize}\n`;
      md += `**Всего элементов:** ${elements.length}\n\n`;
      md += `## ${pageTitle}\n\n`;
      md += `| № | Элемент | Текст | Координаты | Цвет | Фон |\n`;
      md += `|---|---------|-------|------------|------|-----|\n`;

      for (const el of elements.slice(0, 100)) {
        const text = (el.text || '').replace(/\|/g, '\\|').slice(0, 50);
        md += `| ${el.index} | \`${el.selector}\` | ${text} | ${el.coords.x},${el.coords.y} | ${el.styles.color || '—'} | ${el.styles.backgroundColor || '—'} |\n`;
      }

      if (elements.length > 100) {
        md += `\n*... и ещё ${elements.length - 100} элементов*`;
      }

      md += `\n\n---\n🌐 ${url}`;
      return md;
    }

    // ——— 4.3. JSON ОТЧЁТ ———
    function generateJSONReport(timestamp, pageTitle, url, windowSize) {
      const elements = collectAllElements();
      const buttons = collectButtonDistances();

      const data = {
        meta: {
          timestamp,
          url,
          windowSize,
          pageTitle,
          elementCount: elements.length,
          buttonCount: buttons.buttonCount
        },
        elements: elements.map(el => ({
          index: el.index,
          selector: el.selector,
          tag: el.tag,
          id: el.id,
          classes: el.classes,
          text: el.text,
          coords: el.coords,
          styles: {
            color: el.styles.color,
            backgroundColor: el.styles.backgroundColor,
            fontSize: el.styles.fontSize,
            fontWeight: el.styles.fontWeight,
            padding: el.styles.padding,
            margin: el.styles.margin,
            border: el.styles.border,
            borderRadius: el.styles.borderRadius,
            boxShadow: el.styles.boxShadow,
            display: el.styles.display,
            position: el.styles.position
          }
        })),
        buttonDistances: buttons.distances,

    // ——— 4.4. CSV ОТЧЁТ (для таблиц) ———
    function generateCSVReport(timestamp, pageTitle, url, windowSize) {
      const elements = collectAllElements();

      let csv = `"Index","Selector","Text","X","Y","Width","Height","Color","Background","FontSize","Display","Position"\n`;
      for (const el of elements) {
        const text = (el.text || '').replace(/"/g, '""').slice(0, 100);
        csv += `"${el.index}","${el.selector}","${text}","${el.coords.x}","${el.coords.y}","${el.coords.width}","${el.coords.height}","${el.styles.color || ''}","${el.styles.backgroundColor || ''}","${el.styles.fontSize || ''}","${el.styles.display || ''}","${el.styles.position || ''}"\n`;
      }

      return csv;
    }

    // ——— 4.5. DOM-ДЕРЕВО ———
    function generateDOMReport(timestamp, pageTitle, url, windowSize) {
      function getDOMTree(node, depth = 0) {
        if (node.nodeType === Node.TEXT_NODE) {
          const text = node.textContent.trim();
          if (text) return '  '.repeat(depth) + `"${text.slice(0, 80)}"`;
          return null;
        }
        if (node.nodeType !== Node.ELEMENT_NODE) return null;

        const tag = node.tagName.toLowerCase();
        let attrs = '';
        if (node.id) attrs += ` id="${node.id}"`;
        if (node.className && typeof node.className === 'string') {
          const classes = node.className.split(' ').filter(c => c).join('.');
          if (classes) attrs += ` class="${classes}"`;
        }

        let result = '  '.repeat(depth) + `<${tag}${attrs}>`;
        const children = Array.from(node.childNodes);
        for (const child of children) {
          const childResult = getDOMTree(child, depth + 1);
          if (childResult) {
            result += '\n' + childResult;
          }
        }
        if (children.some(c => c.nodeType === Node.ELEMENT_NODE || (c.nodeType === Node.TEXT_NODE && c.textContent.trim()))) {
          result += '\n' + '  '.repeat(depth) + `</${tag}>`;
        } else {
          result += `</${tag}>`;
        }
        return result;
      }

      const tree = getDOMTree(document.body);
      return `=== DOM-ДЕРЕВО СТРАНИЦЫ ===\nДата: ${timestamp}\nURL: ${url}\n\n${tree}`;
    }

    // ——— 4.6. STORAGE ОТЧЁТ ———
    function generateStorageReport(timestamp, pageTitle, url, windowSize) {
      let report = `=== STORAGE ДАННЫЕ ===\nДата: ${timestamp}\nURL: ${url}\n\n`;
      report += `--- localStorage (${localStorage.length} записей) ---\n`;
      for (let i = 0; i < localStorage.length; i++) {
        const key = localStorage.key(i);
        const value = localStorage.getItem(key);
        report += `  ${key}: ${value}\n`;
      }
      report += `\n--- sessionStorage (${sessionStorage.length} записей) ---\n`;
      for (let i = 0; i < sessionStorage.length; i++) {
        const key = sessionStorage.key(i);
        const value = sessionStorage.getItem(key);
        report += `  ${key}: ${value}\n`;
      }
      report += `\n--- Cookies ---\n${document.cookie || 'нет'}`;
      return report;
    }

    // ——— 4.7. API-ЗАПРОСЫ ———
    function generateAPIReport(timestamp, pageTitle, url, windowSize) {
      let report = `=== API-ЗАПРОСЫ СТРАНИЦЫ ===\nДата: ${timestamp}\nURL: ${url}\n\n`;
      report += 'Для перехвата API-запросов обновите страницу и нажмите копировать снова.\n';
      report += 'В текущей версии перехват работает только при активной странице.\n';
      return report;
    }

    // ——— 4.8. ВСЁ В ОДНОМ ———
    function generateAllReport(timestamp, pageTitle, url, windowSize) {
      let report = '=== CRUCIX — ПОЛНЫЙ ЭКСПОРТ ВСЕХ ДАННЫХ ===\n\n';
      report += generateTextReport(timestamp, pageTitle, url, windowSize);
      report += '\n\n--- STORAGE ---\n';
      report += generateStorageReport(timestamp, pageTitle, url, windowSize);
      report += '\n\n--- DOM ДЕРЕВО ---\n';
      report += generateDOMReport(timestamp, pageTitle, url, windowSize);
      return report;
    }

    // ============================================================
    // 5. ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ
    // ============================================================

    function collectAllElements() {
      const allElements = document.querySelectorAll('*');
      let elements = [];
      let index = 0;
      const excludeIds = ['copy-btn', 'copyDropdown', 'notification'];

      for (const el of allElements) {
        if (excludeIds.includes(el.id)) continue;
        if (el.tagName === 'SCRIPT' || el.tagName === 'STYLE') continue;
        if (el.tagName === 'HTML' || el.tagName === 'BODY') continue;

        const rect = el.getBoundingClientRect();
        const computed = window.getComputedStyle(el);

        if (rect.width === 0 && rect.height === 0) continue;
        if (computed.display === 'none') continue;

        let textContent = '';
        for (const node of el.childNodes) {
          if (node.nodeType === Node.TEXT_NODE) {
            textContent += node.textContent.trim();
          }
        }
        if (!textContent && el.textContent) {
          textContent = el.textContent.trim().slice(0, 200);
        }
        if (!textContent && !el.id && !el.className) continue;

        let selector = el.tagName.toLowerCase();
        if (el.id) selector += '#' + el.id;
        if (el.className && typeof el.className === 'string') {
          const classes = el.className.split(' ').filter(c => c).join('.');
          if (classes) selector += '.' + classes;
        }

        elements.push({
          index: ++index,
          selector: selector,
          tag: el.tagName.toLowerCase(),
          id: el.id || null,
          classes: el.className || null,
          text: textContent || null,
          coords: {
            x: Math.round(rect.left + window.pageXOffset),
            y: Math.round(rect.top + window.pageYOffset),
            width: Math.round(rect.width),
            height: Math.round(rect.height)
          },
          styles: {
            color: computed.color,
            backgroundColor: computed.backgroundColor,
            fontFamily: computed.fontFamily,
            fontSize: computed.fontSize,
            fontWeight: computed.fontWeight,
            fontStyle: computed.fontStyle,
            textAlign: computed.textAlign,
            padding: computed.padding,
            margin: computed.margin,
            border: computed.border,
            borderRadius: computed.borderRadius,
            boxShadow: computed.boxShadow,
            display: computed.display,
            position: computed.position,
            top: computed.top,
            left: computed.left,
            width: computed.width,
            height: computed.height,
            opacity: computed.opacity,
            zIndex: computed.zIndex,
            transform: computed.transform
          }
        });
      }
      return elements;
    }

    function collectButtonDistances() {
      const allButtons = document.querySelectorAll('.topbar-btn, .lang-btn, .btn-copy');
      const positions = [];
      const distances = [];

      allButtons.forEach(btn => {
        const rect = btn.getBoundingClientRect();
        if (rect.width > 0 && rect.height > 0) {
          positions.push({
            text: btn.textContent.trim().slice(0, 30),
            x: Math.round(rect.left + rect.width / 2),
            y: Math.round(rect.top + rect.height / 2)
          });
        }
      });

      for (let i = 0; i < positions.length; i++) {
        for (let j = i + 1; j < positions.length; j++) {
          const dx = positions[i].x - positions[j].x;
          const dy = positions[i].y - positions[j].y;
          distances.push({
            from: positions[i].text,
            to: positions[j].text,
            distance: Math.round(Math.sqrt(dx * dx + dy * dy))
          });
        }
      }

      return { buttonCount: positions.length, distances };
    }

    function showNotification(msg) {
      document.querySelectorAll('.notification').forEach(el => el.remove());
      const el = document.createElement('div');
      el.className = 'notification';
      el.textContent = msg;
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 2500);
    }

    // ============================================================
    // 6. ФУНКЦИЯ ОТКРЫТИЯ СПРАВКИ
    // ============================================================

      const lang = currentLang || "ru";
      const helpFile = `/data/help/${lang}/${pageId}.txt`;

      fetch(helpFile)
        .then(res => {

          return res.text();

        .then(text => {
          const modal = document.createElement("div");

            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.85); z-index: 100000;
            display: flex; align-items: center; justify-content: center;
            padding: 20px; backdrop-filter: blur(6px);
          `;
          modal.onclick = (e) => { if (e.target === modal) modal.remove(); };

          const content = document.createElement("div");
          content.style.cssText = `
            background: #0b0e17; color: #e0e6f0;
            padding: 30px 40px; border-radius: 16px;
            max-width: 700px; max-height: 80vh; overflow-y: auto;
            border: 1px solid #1e2a3a;
            box-shadow: 0 20px 60px rgba(0,0,0,0.8);
            font-family: "Segoe UI", system-ui, sans-serif;
            font-size: 14px; line-height: 1.6;
            white-space: pre-wrap; width: 100%;
          `;

          const headerDiv = document.createElement("div");
          headerDiv.style.cssText = `
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 12px; flex-wrap: wrap; gap: 8px;
          `;

          const copyBtn2 = document.createElement("button");
          copyBtn2.textContent = "📋 Копировать текст";
          copyBtn2.style.cssText = `
            background: #4ade80; color: #0b0e17; border: none;
            padding: 8px 18px; border-radius: 6px; cursor: pointer;
            font-weight: 600; font-size: 13px;
          `;
          copyBtn2.onclick = () => {
            navigator.clipboard.writeText(text).then(() => {
              copyBtn2.textContent = "✅ Скопировано!";
              setTimeout(() => { copyBtn2.textContent = "📋 Копировать текст"; }, 2000);
            });
          };

          const closeBtn = document.createElement("button");
          closeBtn.textContent = "✕ Закрыть";
          closeBtn.style.cssText = `
            background: #1e2a3a; color: #e0e6f0; border: none;
            padding: 8px 18px; border-radius: 6px; cursor: pointer;
            font-weight: 600; font-size: 13px;
          `;
          closeBtn.onclick = () => modal.remove();

          headerDiv.appendChild(copyBtn2);
          headerDiv.appendChild(closeBtn);

          const textDiv = document.createElement("div");
          textDiv.style.cssText = `
            white-space: pre-wrap; font-family: monospace;
            font-size: 13px; background: #111b26; padding: 16px;
            border-radius: 8px; border: 1px solid #1e2a3a;
            max-height: 50vh; overflow-y: auto;
          `;
          textDiv.textContent = text;

          content.appendChild(headerDiv);
          content.appendChild(textDiv);
          modal.appendChild(content);
          document.body.appendChild(modal);
        })
        .catch(() => {
          alert(`Справка не найдена для страницы "${pageId}"\nПроверьте файл: /data/help/${currentLang || "ru"}/${pageId}.txt`);
        });
    }

    // ============================================================
    // 7. ДАШБОРД: КОНФИГУРАЦИЯ КАРТОЧЕК
    // ============================================================

    // КОНФИГУРАЦИЯ КАРТОЧЕК (до 30 шт.)
    // Каждый объект: { id, number, icon, name, source, url, api, key }
    const CARD_CONFIG = [
      // Пример:
      // { id: 'vix', number: '01', icon: '📈', name: 'VIX (страх)', source: 'CBOE', url: '/vix', api: '/api/vix/', key: 'value' },
      // ... добавить свои карточки
    ];

    // ============================================================
    // 8. ДАШБОРД: ЗАГРУЗКА ДАННЫХ
    // ============================================================

    async function fetchData(url) {
      try {
        const res = await fetch(url);
        const data = await res.json();
        return data.data || [];
      } catch { return []; }
    }

    function getSeverityCount(data, severity) {
      return data.filter(d => d.severity === severity || d.intensity === severity).length;
    }

    // ============================================================
    // 9. ДАШБОРД: ОТОБРАЖЕНИЕ КАРТОЧЕК
    // ============================================================

    function renderCards(cardsData) {
      const container = document.getElementById('cardsGrid');
      let html = '';

      for (const card of CARD_CONFIG) {
        const data = cardsData[card.id] || [];
        const last = data.length > 0 ? data[data.length - 1] : null;
        const value = last ? last[card.key] : null;

        let statusClass = 'normal';
        let statusLabel = '🟢 НОРМАЛЬНО';

        if (value !== null) {
          if (value > 70) { statusClass = 'critical'; statusLabel = '🔴 КРИТИЧЕСКИЙ'; }
          else if (value > 50) { statusClass = 'high'; statusLabel = '🟠 ВЫСОКИЙ'; }
          else if (value > 30) { statusClass = 'medium'; statusLabel = '🟡 СРЕДНИЙ'; }
        }

        let change = '';
        let changeClass = 'neutral';
        if (data.length > 1) {
          const prev = data[data.length - 2];
          if (prev && value !== null) {
            const diff = value - prev[card.key];
            const pct = prev[card.key] !== 0 ? (diff / Math.abs(prev[card.key]) * 100) : 0;
            change = `${diff > 0 ? '+' : ''}${diff.toFixed(2)} (${pct > 0 ? '+' : ''}${pct.toFixed(1)}%)`;
            changeClass = diff > 0 ? 'up' : diff < 0 ? 'down' : 'neutral';
          }
        }

        const displayValue = value !== null ? value : '—';
        const updateTime = data.length > 0 && data[data.length-1].date ? new Date(data[data.length-1].date).toLocaleTimeString('ru-RU') : '—';

        html += `
          <div class="card" onclick="window.location.href='${card.url}'">
            <span class="card-number">${card.number}</span>
            <div class="header">
              <span class="icon">${card.icon}</span>
              <span class="name">${card.name}</span>
              <span class="status-dot ${statusClass === 'critical' ? 'bg-critical' : statusClass === 'high' ? 'bg-high' : statusClass === 'medium' ? 'bg-medium' : 'bg-low'}"></span>
            </div>
            <div class="main-value">${typeof displayValue === 'number' ? displayValue.toFixed(2) : displayValue}</div>
            <div class="change ${changeClass}">${change}</div>
            <div class="status-label ${statusClass}">${statusLabel}</div>
            <div class="source">
              <span class="src">📌 ${card.source}</span>
              <span class="updated">🔄 ${updateTime}</span>
            </div>
            <div class="click-hint">🔗 клик для деталей</div>
          </div>
        `;
      }

      container.innerHTML = html;
    }

    // ============================================================
    // 10. ДАШБОРД: ГРАФИКИ
    // ============================================================

    function renderChart(containerId, labelsId, data, key, colorGood, colorBad) {
      const container = document.getElementById(containerId);
      const labelsContainer = document.getElementById(labelsId);

      if (!data || data.length < 2) {
        container.innerHTML = '<span style="color:#4a5a6a;font-size:13px;">Недостаточно данных</span>';
        labelsContainer.innerHTML = '';
        return;
      }

      const values = data.map(d => d[key]);
      const maxVal = Math.max(...values) * 1.1 || 1;
      const minVal = Math.min(...values) * 0.9 || 0;
      const range = maxVal - minVal || 1;

      container.innerHTML = data.map(d => {
        const height = ((d[key] - minVal) / range) * 130 + 10;
        const color = d[key] < 0 ? colorBad : colorGood;
        return `<div class="bar" style="height:${height}px;background:${color};"></div>`;
      }).join('');

      const step = Math.max(1, Math.floor(data.length / 6));
      labelsContainer.innerHTML = data.map((d, i) => {
        if (i % step === 0 || i === data.length - 1) {
          return `<span>${d.date.slice(5)}</span>`;
        }
        return `<span></span>`;
      }).join('');
    }

    // ============================================================
    // 11. ДАШБОРД: ЛЕНТА СОБЫТИЙ
    // ============================================================

    function renderFeed(events) {
      const feed = document.getElementById('feedList');
      if (!events || events.length === 0) {
        feed.innerHTML = '<div style="color:#4a5a6a;padding:12px;">Нет событий</div>';
        return;
      }
      feed.innerHTML = events.map(e => `
        <div class="feed-item">
          <span class="source" style="background:rgba(91,192,248,0.2);color:#5bc0f8;">${e.source}</span>
          <span class="msg">${e.msg}</span>
          <span class="time">${e.time || ''}</span>
        </div>
      `).join('');
    }

    // ============================================================
    // 12. ДАШБОРД: ОБНОВЛЕНИЕ
    // ============================================================

    async function updateDashboard() {
      try {
        const allData = {};
        for (const card of CARD_CONFIG) {
          allData[card.id] = await fetchData(card.api);
        }

        renderCards(allData);

        // Глобальный индекс (упрощённо)
        let totalCritical = 0, totalHigh = 0, totalMedium = 0, totalNormal = 0;
        // ... логика расчёта

        document.getElementById('globalIndex').textContent = 48;

        // Графики (пример — заполнить позже)
        // renderChart('chart1', 'chart1Labels', data, 'value', '#4ade80', '#ef4444');

        // Лента событий
        renderFeed([]);

      } catch (e) {
        console.error('[Dashboard] Ошибка обновления:', e);
      }
    }

    // ============================================================
    // 13. ЗАПУСК
    // ============================================================

    // Инициализация
    document.addEventListener('DOMContentLoaded', function() {
      const savedLang = localStorage.getItem('crucix-lang') || 'ru';
      switchLang(savedLang);
      updateDashboard();
      setInterval(updateDashboard, 30000);
    });
  </script>
