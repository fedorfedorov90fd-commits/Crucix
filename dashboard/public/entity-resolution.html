<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Разрешение сущностей — Crucix</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0a1a; color: #e0e0e0; font-family: -apple-system, 'Segoe UI', system-ui, sans-serif; min-height: 100vh; }
        .topbar { position: fixed; top: 0; left: 0; right: 0; height: 60px; background: rgba(10,10,20,0.95); backdrop-filter: blur(12px); border-bottom: 2px solid rgba(91,192,248,0.25); box-shadow: 0 2px 20px rgba(91,192,248,0.08); z-index: 100; display: flex; justify-content: space-between; align-items: center; padding: 0 20px; }
        .topbar::after { content: ""; position: absolute; bottom: -2px; left: 0; right: 0; height: 2px; background: linear-gradient(90deg, transparent, #5bc0f8, transparent); opacity: 0.6; }
        .topbar-left { display: flex; align-items: center; gap: 12px; }
        .topbar-brand { font-size: 14px; font-weight: 700; color: #5bc0f8; text-transform: uppercase; letter-spacing: 2px; }
        .topbar-right { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
        .topbar-btn { height: 28px; padding: 0 12px; border: 1px solid rgba(255,255,255,0.08); border-radius: 4px; background: rgba(255,255,255,0.03); color: #888; font-size: 11px; font-weight: 500; text-transform: uppercase; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; gap: 4px; font-family: inherit; }
        .topbar-btn:hover { background: rgba(255,255,255,0.06); transform: translateY(-1px); }
        .btn-home { color: #5bc0f8; border-color: rgba(91,192,248,0.2); background: rgba(91,192,248,0.06); }
        .btn-home:hover { background: rgba(91,192,248,0.15); }
        .btn-copy { color: #5bc0f8; border-color: rgba(91,192,248,0.15); background: rgba(91,192,248,0.06); }
        .btn-copy.copied { background: rgba(76,175,80,0.2); border-color: #4caf50; color: #4caf50; }
        .btn-rss { color: #f26522; border-color: rgba(242,101,34,0.2); background: rgba(242,101,34,0.06); }
        .btn-rss:hover { background: rgba(242,101,34,0.15); }
        .btn-help { color: #a78bfa; border-color: rgba(167,139,250,0.2); background: rgba(167,139,250,0.06); }
        .btn-help:hover { background: rgba(167,139,250,0.15); }
        .lang-switch { display: flex; gap: 2px; padding: 2px; background: rgba(255,255,255,0.03); border-radius: 4px; border: 1px solid rgba(255,255,255,0.06); }
        .lang-btn { padding: 2px 8px; border: none; background: transparent; color: #666; font-size: 11px; font-weight: 500; cursor: pointer; border-radius: 3px; transition: all 0.2s; font-family: inherit; }
        .lang-btn:hover { color: #888; background: rgba(255,255,255,0.05); }
        .lang-btn.active { color: #5bc0f8; background: rgba(91,192,248,0.1); }
        .copy-dropdown { position: relative; display: inline-block; }
        .copy-dropdown-content { display: none; position: absolute; right: 0; top: 32px; background: #0a0a1a; min-width: 220px; border: 1px solid rgba(255,255,255,0.08); border-radius: 8px; box-shadow: 0 12px 40px rgba(0,0,0,0.6); z-index: 200; padding: 6px 0; }
        .copy-dropdown-content.show { display: block; }
        .copy-dropdown-content button { display: block; width: 100%; padding: 8px 16px; background: transparent; border: none; color: #c8d0d8; font-size: 12px; text-align: left; cursor: pointer; transition: all 0.15s; font-family: inherit; }
        .copy-dropdown-content button:hover { background: rgba(91,192,248,0.08); color: #5bc0f8; }
        .copy-dropdown-content .divider { height: 1px; background: rgba(255,255,255,0.05); margin: 4px 12px; }
        .copy-dropdown-content .label { padding: 4px 16px; font-size: 10px; color: #4a5a6a; text-transform: uppercase; letter-spacing: 0.5px; }
        .nav-dashboards { position: fixed; top: 60px; left: 0; right: 0; height: 38px; background: rgba(6,10,18,0.92); backdrop-filter: blur(8px); border-bottom: 1px solid rgba(255,255,255,0.04); z-index: 99; display: flex; align-items: center; padding: 0 20px; gap: 4px; overflow-x: auto; scrollbar-width: none; }
        .nav-dashboards::-webkit-scrollbar { display: none; }
        .nav-btn { padding: 4px 10px; border: none; border-radius: 4px; background: transparent; color: #666; font-size: 10px; font-weight: 500; cursor: pointer; transition: all 0.2s; white-space: nowrap; font-family: inherit; border: 1px solid transparent; text-decoration: none; display: inline-flex; align-items: center; gap: 3px; }
        .nav-btn:hover { color: #c8d0d8; background: rgba(255,255,255,0.04); }
        .nav-btn.active { color: #5bc0f8; background: rgba(91,192,248,0.08); border-color: rgba(91,192,248,0.15); }
        .main-content { padding-top: 114px; max-width: 1440px; margin: 0 auto; padding-left: 20px; padding-right: 20px; padding-bottom: 40px; min-height: calc(100vh - 114px); }
        .notification { position: fixed; bottom: 60px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.85); color: #ffffff; padding: 8px 20px; border-radius: 6px; font-size: 13px; z-index: 100001; border: 1px solid rgba(255,255,255,0.1); animation: notif-fade 2.5s forwards; }
        @keyframes notif-fade { 0% { opacity: 0; transform: translateX(-50%) translateY(10px); } 10% { opacity: 1; transform: translateX(-50%) translateY(0); } 80% { opacity: 1; } 100% { opacity: 0; transform: translateX(-50%) translateY(-20px); } }
        @media (max-width: 768px) { .topbar { padding: 0 12px; height: 52px; } .topbar-brand { font-size: 12px; } .topbar-btn { font-size: 10px; padding: 0 8px; height: 24px; } .nav-dashboards { top: 52px; height: 34px; padding: 0 10px; gap: 2px; } .nav-btn { font-size: 9px; padding: 2px 6px; } .main-content { padding-top: 102px; padding-left: 12px; padding-right: 12px; } }
        @media (max-width: 480px) { .topbar { padding: 0 8px; height: 46px; } .topbar-brand { font-size: 10px; letter-spacing: 1px; } .topbar-btn { font-size: 9px; padding: 0 6px; height: 20px; } .lang-btn { font-size: 9px; padding: 1px 5px; } .nav-dashboards { top: 46px; height: 30px; padding: 0 6px; gap: 2px; overflow-x: auto; } .nav-btn { font-size: 8px; padding: 2px 5px; } .main-content { padding-top: 92px; padding-left: 8px; padding-right: 8px; } }
        .entity-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; margin-top: 16px; }
        .entity-card { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06); border-radius: 8px; padding: 14px; }
        .entity-card .name { font-size: 16px; font-weight: 600; color: #e0e0e0; }
        .entity-card .type { display: inline-block; padding: 1px 10px; border-radius: 12px; font-size: 11px; background: rgba(91,192,248,0.1); color: #5bc0f8; margin-left: 8px; }
        .entity-card .mentions { font-size: 13px; color: #8892b0; margin-top: 4px; }
        .page-title { font-size: 24px; font-weight: 700; color: #e0e0e0; margin-bottom: 8px; }
        .page-subtitle { font-size: 14px; color: #8892b0; margin-bottom: 20px; }
        .stats-row { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; margin: 16px 0; }
        .stat-item { background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.04); border-radius: 6px; padding: 12px; text-align: center; }
        .stat-item .val { font-size: 20px; font-weight: 600; color: #5bc0f8; }
        .stat-item .lbl { font-size: 11px; color: #8892b0; }
        .search-row { display: flex; gap: 10px; margin-bottom: 20px; }
        .search-row input { flex: 1; padding: 8px 14px; border: 1px solid rgba(255,255,255,0.1); border-radius: 6px; background: rgba(255,255,255,0.03); color: #e0e0e0; font-family: inherit; font-size: 14px; }
        .search-row input:focus { outline: none; border-color: #5bc0f8; }
        .search-row button { padding: 8px 20px; border: none; border-radius: 6px; background: #5bc0f8; color: #0a0a1a; font-weight: 600; cursor: pointer; font-family: inherit; font-size: 14px; }
        .search-row button:hover { opacity: 0.8; }
    </style>
</head>
<body>

<header class="topbar">
    <div class="topbar-left"><span class="topbar-brand">🧩 РАЗРЕШЕНИЕ СУЩНОСТЕЙ</span></div>
    <div class="topbar-right">
        <button class="topbar-btn btn-home" onclick="window.location.href='/jarvis'">← НА ГЛАВНУЮ</button>
        <div class="copy-dropdown">
            <button class="topbar-btn btn-copy" id="copy-btn">📋 КОПИРОВАТЬ ▼</button>
            <div class="copy-dropdown-content" id="copyDropdown">
                <div class="label">ФОРМАТЫ КОПИРОВАНИЯ</div>
                <button data-format="text">📄 Как текст</button>
                <button data-format="markdown">📝 Как Markdown</button>
                <button data-format="json">📊 Как JSON</button>
                <button data-format="csv">📋 Как CSV</button>
                <div class="divider"></div>
                <button data-format="dom">🌳 DOM-дерево</button>
                <button data-format="storage">💾 localStorage</button>
                <button data-format="api">📡 API-запросы</button>
                <div class="divider"></div>
                <button data-format="all">📦 ВСЁ В ОДНОМ</button>
            </div>
        </div>
        <button class="topbar-btn btn-rss" onclick="window.location.href='/registry'">📡 Реестр</button>
        <button class="topbar-btn btn-help" onclick="openHelp()">❓ HELP</button>
        <div class="lang-switch">
            <button class="lang-btn active" data-lang="ru" onclick="switchLang('ru')">RU</button>
            <button class="lang-btn" data-lang="en" onclick="switchLang('en')">EN</button>
        </div>
    </div>
</header>

<nav class="nav-dashboards">
    <button class="nav-btn" onclick="window.location.href='/dashboard-5in1'"><span class="icon">🎯</span>Центр аналитики</button>
    <button class="nav-btn" onclick="window.location.href='/dashboard-economic'"><span class="icon">📊</span>Экономика</button>
    <button class="nav-btn" onclick="window.location.href='/dashboard-financial'"><span class="icon">💰</span>Финансы</button>
    <button class="nav-btn" onclick="window.location.href='/dashboard-military'"><span class="icon">🛡️</span>Военный</button>
    <button class="nav-btn" onclick="window.location.href='/dashboard-geopolitical'"><span class="icon">🌍</span>Геополитика</button>
    <button class="nav-btn" onclick="window.location.href='/dashboard-ecological'"><span class="icon">🌿</span>Экология</button>
    <button class="nav-btn" onclick="window.location.href='/dashboard-cyber'"><span class="icon">🔒</span>Кибер</button>
    <button class="nav-btn" onclick="window.location.href='/dashboard-space'"><span class="icon">🚀</span>Космос</button>
    <button class="nav-btn" onclick="window.location.href='/dashboard-news'"><span class="icon">📰</span>Новости</button>
    <button class="nav-btn" onclick="window.location.href='/dashboard-ai'"><span class="icon">🧠</span>AI</button>
    <button class="nav-btn" onclick="window.location.href='/dashboard-scientific'"><span class="icon">🔬</span>Наука</button>
    <button class="nav-btn" onclick="window.location.href='/dashboard-esg'"><span class="icon">🌱</span>ESG</button>
    <button class="nav-btn" onclick="window.location.href='/dashboard-threats'"><span class="icon">⚡</span>Угрозы</button>
    <button class="nav-btn" onclick="window.location.href='/dashboard-health'"><span class="icon">🏥</span>Здоровье</button>
    <button class="nav-btn" onclick="window.location.href='/dashboard-energy'"><span class="icon">⛽</span>Энергетика</button>
    <button class="nav-btn" onclick="window.location.href='/dashboard-transport'"><span class="icon">🚛</span>Транспорт</button>
    <button class="nav-btn" onclick="window.location.href='/dashboard-regions'"><span class="icon">🌏</span>Регионы</button>
    <button class="nav-btn active" onclick="window.location.href='/entity-resolution'"><span class="icon">🧩</span>Сущности</button>
</nav>

<main class="main-content">
    <div id="page-content">
        <h1 class="page-title">🧩 Разрешение сущностей</h1>
        <p class="page-subtitle">Объединение упоминаний одной сущности из разных источников</p>

        <div class="stats-row" id="statsRow">
            <div class="stat-item"><div class="val" id="totalRaw">--</div><div class="lbl">Всего упоминаний</div></div>
            <div class="stat-item"><div class="val" id="totalResolved">--</div><div class="lbl">Разрешённых</div></div>
            <div class="stat-item"><div class="val" id="personCount">--</div><div class="lbl">Персон</div></div>
            <div class="stat-item"><div class="val" id="orgCount">--</div><div class="lbl">Организаций</div></div>
        </div>

        <div class="search-row">
            <input type="text" id="searchInput" placeholder="Поиск сущности..." onkeydown="if(event.key==='Enter') searchEntities()" />
            <button onclick="searchEntities()">🔍 Найти</button>
            <button onclick="loadStats()" style="background:transparent;border:1px solid rgba(255,255,255,0.1);color:#e0e0e0;">🔄 Обновить</button>
        </div>

        <div id="resultsContainer"></div>
    </div>
</main>

<script>
let currentLang = localStorage.getItem('crucix-lang') || 'ru';

function switchLang(lang) {
    currentLang = lang;
    localStorage.setItem('crucix-lang', lang);
    document.querySelectorAll('.lang-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.lang === lang);
    });
    showNotification('🌐 Язык: ' + lang.toUpperCase());
}

document.querySelectorAll('.lang-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.lang === currentLang);
});

function showNotification(msg) {
    document.querySelectorAll('.notification').forEach(el => el.remove());
    const el = document.createElement('div');
    el.className = 'notification';
    el.textContent = msg;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 2500);
}

function openHelp() {
    alert('🧩 Разрешение сущностей\n\nОбъединяет упоминания одной сущности.\nAPI: /api/entities/stats, /api/entities/search');
}

document.getElementById('copy-btn').addEventListener('click', function(e) {
    e.stopPropagation();
    document.getElementById('copyDropdown').classList.toggle('show');
});

document.addEventListener('click', function() {
    document.getElementById('copyDropdown').classList.remove('show');
});

function copyPageData(format) {
    const timestamp = new Date().toLocaleString();
    const pageTitle = document.querySelector('.page-title')?.textContent || document.title || 'Без заголовка';
    let report = '=== CRUCIX — СНАПШОТ СТРАНИЦЫ ===\n';
    report += 'Дата: ' + timestamp + '\n';
    report += 'Страница: ' + pageTitle + '\n\n';
    report += document.getElementById('page-content')?.innerText || '';
    navigator.clipboard.writeText(report).then(() => {
        const btn = document.getElementById('copy-btn');
        btn.textContent = '✅ ' + format.toUpperCase();
        btn.classList.add('copied');
        setTimeout(() => {
            btn.textContent = '📋 КОПИРОВАТЬ ▼';
            btn.classList.remove('copied');
        }, 3000);
        showNotification('✅ Скопировано в формате ' + format.toUpperCase());
    }).catch(() => {
        const textarea = document.createElement('textarea');
        textarea.value = report;
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand('copy');
        document.body.removeChild(textarea);
        showNotification('✅ Скопировано в формате ' + format.toUpperCase());
    });
}

document.querySelectorAll('#copyDropdown button[data-format]').forEach(btn => {
    btn.addEventListener('click', function(e) {
        e.stopPropagation();
        document.getElementById('copyDropdown').classList.remove('show');
        copyPageData(this.dataset.format);
    });
});

document.addEventListener('DOMContentLoaded', function() {
    const currentPath = window.location.pathname;
    document.querySelectorAll('.nav-btn').forEach(btn => {
        const href = btn.getAttribute('onclick');
        if (href && href.includes(currentPath)) {
            btn.classList.add('active');
        } else {
            btn.classList.remove('active');
        }
    });
});

async function loadStats() {
    try {
        const r = await fetch('/api/entities/stats');
        const d = await r.json();
        if (d.success && d.stats) {
            document.getElementById('totalRaw').textContent = d.stats.totalRaw || 0;
            document.getElementById('totalResolved').textContent = d.stats.totalResolved || 0;
            document.getElementById('personCount').textContent = d.stats.byType?.person || 0;
            document.getElementById('orgCount').textContent = d.stats.byType?.organization || 0;
        }
    } catch(e) { console.error(e); }
}

async function searchEntities() {
    const q = document.getElementById('searchInput').value.trim();
    if (!q) return;
    try {
        const r = await fetch('/api/entities/search?q=' + encodeURIComponent(q));
        const d = await r.json();
        const c = document.getElementById('resultsContainer');
        if (d.success && d.results && d.results.length > 0) {
            let h = '<div style="color:#8892b0;margin-bottom:8px;">Найдено: ' + d.count + '</div><div class="entity-grid">';
            for (const e of d.results) {
                h += '<div class="entity-card"><div><span class="name">📍 ' + e.canonicalName + '</span><span class="type">' + e.type + '</span></div><div class="mentions">Упоминаний: ' + (e.count || e.mentions?.length || 1) + '</div></div>';
            }
            h += '</div>';
            c.innerHTML = h;
        } else {
            c.innerHTML = '<div style="color:#8892b0;margin-top:12px;">Ничего не найдено</div>';
        }
    } catch(e) { console.error(e); }
}

document.addEventListener('DOMContentLoaded', loadStats);
</script>

</body>
</html>
