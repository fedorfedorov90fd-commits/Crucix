<!DOCTYPE html>
<html lang="ru">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>CISA — Киберугрозы</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0f;color:#c8d0d8;font-family:sans-serif;font-size:13px}
.topbar{position:fixed;top:0;left:0;right:0;height:60px;background:rgba(10,10,20,0.92);backdrop-filter:blur(12px);border-bottom:1px solid rgba(255,255,255,0.04);z-index:100;display:flex;justify-content:space-between;align-items:center;padding:0 20px}
.topbar-brand{font-size:14px;font-weight:700;color:#5bc0f8;text-transform:uppercase;letter-spacing:2px}
.topbar-btn{height:28px;padding:0 12px;border:1px solid rgba(255,255,255,0.08);border-radius:4px;background:rgba(255,255,255,0.03);color:#888;font-size:11px;font-weight:500;text-transform:uppercase;cursor:pointer;transition:all 0.2s}
.topbar-btn:hover{background:rgba(255,255,255,0.06)}
.btn-home{color:#5bc0f8;border-color:rgba(91,192,248,0.2)}
.btn-copy{color:#5bc0f8;border-color:rgba(91,192,248,0.15)}
.main-content{padding-top:76px;max-width:1200px;margin:0 auto;padding:76px 20px 40px}
.page-title{font-size:28px;font-weight:700;color:#e8f0f8;margin-bottom:8px}
.page-subtitle{color:#666;font-size:14px;margin-bottom:24px}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:16px;margin-bottom:24px}
.stat-card{background:rgba(10,10,20,0.5);border:1px solid rgba(255,255,255,0.04);border-radius:8px;padding:16px;text-align:center}
.stat-card .stat-label{font-size:11px;text-transform:uppercase;color:#666}
.stat-card .stat-value{font-size:28px;font-weight:700;color:#5bc0f8;margin:6px 0}
.panel{background:rgba(10,10,20,0.5);border:1px solid rgba(255,255,255,0.04);border-radius:8px;padding:16px;margin-bottom:16px}
.panel-title{font-size:12px;font-weight:600;text-transform:uppercase;color:#666;margin-bottom:12px}
.vuln-item{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid rgba(255,255,255,0.03)}
.vuln-item .name{color:#c8d0d8}
.vuln-item .vendor{color:#888;font-size:11px}
.vuln-item .badge{font-size:10px;padding:2px 8px;border-radius:10px}
.vuln-item .badge.critical{background:rgba(239,68,68,0.2);color:#ef4444}
.vuln-item .badge.high{background:rgba(249,115,22,0.2);color:#f97316}
.loading{color:#666;text-align:center;padding:20px}
.notification{position:fixed;bottom:60px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.85);color:#fff;padding:8px 20px;border-radius:6px;font-size:13px;z-index:100001;border:1px solid rgba(255,255,255,0.1);animation:notif-fade 2.5s forwards}
@keyframes notif-fade{0%{opacity:0;transform:translateX(-50%) translateY(10px)}10%{opacity:1;transform:translateX(-50%) translateY(0)}80%{opacity:1}100%{opacity:0;transform:translateX(-50%) translateY(-20px)}}
</style>
</head>
<body>
<header class="topbar"><div class="topbar-left"><span class="topbar-brand">🛡️ CISA</span></div><div class="topbar-right"><button class="topbar-btn btn-home" onclick="window.location.href='/jarvis'">← НА ГЛАВНУЮ</button><button class="topbar-btn btn-help" onclick="showHelp()">❓ HELP</button>
    <button class="topbar-btn btn-copy" id="copy-btn">📋 КОПИРОВАТЬ</button></div></header>
<main class="main-content">
<h1 class="page-title">🛡️ Киберугрозы (CISA-KEV)</h1>
<p class="page-subtitle">Мониторинг известных эксплуатируемых уязвимостей</p>
<div class="stats-grid"><div class="stat-card"><div class="stat-label">Всего</div><div class="stat-value" id="total">—</div></div><div class="stat-card"><div class="stat-label">Критических</div><div class="stat-value" id="critical">—</div></div><div class="stat-card"><div class="stat-label">Высоких</div><div class="stat-value" id="high">—</div></div></div>
<div class="panel"><div class="panel-title">📋 Уязвимости</div><div id="vulns-list"><div class="loading">Загрузка...</div></div></div>
</main>
<script>
document.addEventListener('DOMContentLoaded',function(){fetch('/api/cisa/data').then(r=>r.json()).then(d=>{if(d.success){render(d.data);}else{document.getElementById('vulns-list').innerHTML='<div class="loading">❌ Нет данных</div>';}}).catch(()=>{document.getElementById('vulns-list').innerHTML='<div class="loading">❌ Ошибка загрузки</div>';});});
function render(d){document.getElementById('total').textContent=d.summary.total||'—';document.getElementById('critical').textContent=d.summary.bySeverity?.CRITICAL||0;document.getElementById('high').textContent=d.summary.bySeverity?.HIGH||0;var html='';for(var v of d.vulnerabilities){var cls=v.severity.toLowerCase();html+='<div class="vuln-item"><span><span class="name">'+v.name+'</span> <span class="vendor">'+v.vendor+' / '+v.product+'</span></span><span><span class="badge '+cls+'">'+v.severity+'</span> <span style="color:#555;font-size:11px;">'+v.dateAdded+'</span></span></div>';}document.getElementById('vulns-list').innerHTML=html;}
document.getElementById('copy-btn').addEventListener('click',function(){var t='=== CISA ===\nДата: '+new Date().toLocaleString()+'\n';document.querySelectorAll('.vuln-item').forEach(function(el){t+=el.textContent.trim()+'\n';});navigator.clipboard.writeText(t).then(function(){showNotif('✅ Данные скопированы');}).catch(function(){var a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();document.execCommand('copy');document.body.removeChild(a);showNotif('✅ Данные скопированы');});});
function showNotif(m){var e=document.createElement('div');e.className='notification';e.textContent=m;document.body.appendChild(e);setTimeout(function(){e.remove();},2500);}
</script>
<script src="/js/help.js"></script>
</body></html>
