<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>COVID-19 — Crucix</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a0f;
      color: #c8d0d8;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', monospace;
      font-size: 13px;
      line-height: 1.5;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .topbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 60px;
      background: rgba(10, 10, 20, 0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
      z-index: 100;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 20px;
    }
    .topbar-left { display: flex; align-items: center; gap: 12px; }
    .topbar-brand { font-size: 14px; font-weight: 700; color: #5bc0f8; text-transform: uppercase; letter-spacing: 2px; }
    .topbar-right { display: flex; align-items: center; gap: 6px; }
    .topbar-btn {
      height: 28px; padding: 0 12px; border: 1px solid rgba(255,255,255,0.08);
      border-radius: 4px; background: rgba(255,255,255,0.03); color: #888;
      font-size: 11px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.5px;
      cursor: pointer; transition: all 0.2s; display: flex; align-items: center; gap: 4px;
    }
    .topbar-btn:hover { background: rgba(255,255,255,0.06); transform: translateY(-1px); }
    .btn-home { color: #5bc0f8; border-color: rgba(91,192,248,0.2); background: rgba(91,192,248,0.06); }
    .btn-home:hover { background: rgba(91,192,248,0.15); }
    .btn-copy { color: #5bc0f8; border-color: rgba(91,192,248,0.15); background: rgba(91,192,248,0.06); }
    .btn-copy:hover { background: rgba(91,192,248,0.15); }
    .btn-rss { color: #f26522; border-color: rgba(242,101,34,0.2); background: rgba(242,101,34,0.06); }
    .btn-rss:hover { background: rgba(242,101,34,0.15); }

    .lang-switch { display: flex; gap: 2px; padding: 2px; background: rgba(255,255,255,0.03); border-radius: 4px; border: 1px solid rgba(255,255,255,0.06); }
    .lang-btn { padding: 2px 8px; border: none; background: transparent; color: #666; font-size: 11px; font-weight: 500; cursor: pointer; border-radius: 3px; transition: all 0.2s; }
    .lang-btn:hover { color: #888; background: rgba(255,255,255,0.05); }
    .lang-btn.active { color: #5bc0f8; background: rgba(91,192,248,0.1); }

    .main-content { padding-top: 76px; max-width: 1400px; margin: 0 auto; padding-left: 20px; padding-right: 20px; padding-bottom: 40px; min-height: calc(100vh - 76px); }
    .page-title { font-size: 24px; font-weight: 700; color: #e8f0f8; margin-bottom: 20px; }

    /* Статистика */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
      margin-bottom: 24px;
    }
    .stat-card {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 8px;
      padding: 16px 20px;
    }
    .stat-card .label { font-size: 11px; color: #666; text-transform: uppercase; letter-spacing: 0.5px; }
    .stat-card .value { font-size: 26px; font-weight: 700; color: #e8f0f8; margin-top: 4px; }
    .stat-card .sub { font-size: 12px; color: #666; margin-top: 4px; }

    /* Таблица */
    .table-wrap {
      background: rgba(255,255,255,0.02);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 8px;
      overflow: auto;
    }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th { text-align: left; padding: 10px 14px; color: #666; font-weight: 500; font-size: 11px; text-transform: uppercase; letter-spacing: 0.3px; border-bottom: 1px solid rgba(255,255,255,0.06); }
    td { padding: 8px 14px; border-bottom: 1px solid rgba(255,255,255,0.03); }
    tr:hover td { background: rgba(255,255,255,0.02); }
    .text-right { text-align: right; }
    .text-center { text-align: center; }
    .badge {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 600;
    }
    .badge-red { background: rgba(244,67,54,0.15); color: #ef5350; }
    .badge-green { background: rgba(76,175,80,0.15); color: #66bb6a; }
    .badge-yellow { background: rgba(255,193,7,0.15); color: #ffd54f; }
    .badge-blue { background: rgba(33,150,243,0.15); color: #42a5f5; }

    .notification {
      position: fixed;
      bottom: 60px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.85);
      color: #fff;
      padding: 8px 20px;
      border-radius: 6px;
      font-size: 13px;
      z-index: 100001;
      border: 1px solid rgba(255,255,255,0.1);
      animation: notif-fade 2.5s forwards;
    }
    @keyframes notif-fade {
      0% { opacity: 0; transform: translateX(-50%) translateY(10px); }
      10% { opacity: 1; transform: translateX(-50%) translateY(0); }
      80% { opacity: 1; transform: translateX(-50%) translateY(0); }
      100% { opacity: 0; transform: translateX(-50%) translateY(-20px); }
    }

    @media (max-width: 768px) {
      .topbar { padding: 0 12px; height: 52px; }
      .topbar-btn { font-size: 10px; padding: 0 8px; height: 24px; }
      .main-content { padding-top: 68px; padding-left: 12px; padding-right: 12px; }
      .page-title { font-size: 18px; }
      .stat-card .value { font-size: 20px; }
    }
  </style>
</head>
<body>

  <header class="topbar">
    <div class="topbar-left">
      <span class="topbar-brand">⚡ CRUCIX MONITOR</span>
    </div>
    <div class="topbar-right">
      <button class="topbar-btn btn-home" onclick="window.location.href='/jarvis'">← НА ГЛАВНУЮ</button>
      <button class="topbar-btn btn-copy" id="copy-btn">📋 КОПИРОВАТЬ</button>
      <button class="topbar-btn btn-rss" onclick="window.location.href='/kartochki'">📡 Список страниц</button>
      <div class="lang-switch">
        <button class="lang-btn active" data-lang="ru" onclick="switchLang('ru')">RU</button>
        <button class="lang-btn" data-lang="en" onclick="switchLang('en')">EN</button>
      </div>
    </div>
  </header>

  <main class="main-content">
    <h1 class="page-title">🦠 COVID-19 Статистика</h1>

    <div class="stats-grid" id="statsGrid">
      <div class="stat-card"><div class="label">Всего случаев</div><div class="value" id="totalCases">—</div></div>
      <div class="stat-card"><div class="label">Смертей</div><div class="value" id="totalDeaths">—</div></div>
      <div class="stat-card"><div class="label">Выздоровело</div><div class="value" id="totalRecovered">—</div></div>
      <div class="stat-card"><div class="label">Активных</div><div class="value" id="totalActive">—</div></div>
      <div class="stat-card"><div class="label">Стран</div><div class="value" id="totalCountries">—</div></div>
      <div class="stat-card"><div class="label">Обновлено</div><div class="value" id="lastUpdate" style="font-size:14px;">—</div></div>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Страна</th>
            <th class="text-right">Случаи</th>
            <th class="text-right">Смерти</th>
            <th class="text-right">Выздоровело</th>
            <th class="text-right">Активные</th>
            <th class="text-right">Критические</th>
            <th class="text-center">Население</th>
          </tr>
        </thead>
        <tbody id="covidTable">
          <tr><td colspan="7" class="text-center" style="color:#666;padding:20px;">Загрузка данных...</td></tr>
        </tbody>
      </table>
    </div>
  </main>

  <script>
    let currentLang = localStorage.getItem('crucix-lang') || 'ru';

    function switchLang(lang) {
      currentLang = lang;
      localStorage.setItem('crucix-lang', lang);
      document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.dataset.lang === lang));
      showNotification(`🌐 Язык: ${lang.toUpperCase()}`);
    }

    document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.dataset.lang === currentLang));

    function showNotification(msg) {
      document.querySelectorAll('.notification').forEach(e => e.remove());
      const el = document.createElement('div');
      el.className = 'notification';
      el.textContent = msg;
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 2500);
    }

    // КОПИРОВАНИЕ
    document.getElementById('copy-btn').addEventListener('click', function() {
      const data = document.querySelector('table').textContent;
      navigator.clipboard.writeText(`COVID-19 Statistics\n${data}`).then(() => {
        this.textContent = '✅ Скопировано!';
        setTimeout(() => { this.textContent = '📋 КОПИРОВАТЬ'; }, 3000);
        showNotification('✅ Скопировано');
      });
    });

    // ЗАГРУЗКА ДАННЫХ
    async function loadData() {
      try {
        const response = await fetch('/data/basket/covid-latest.json');
        if (!response.ok) throw new Error('Data not found');
        const data = await response.json();

        const countries = data.countries || [];

        // Статистика
        let totalCases = 0, totalDeaths = 0, totalRecovered = 0, totalActive = 0, totalCritical = 0;
        countries.forEach(c => {
          totalCases += c.cases || 0;
          totalDeaths += c.deaths || 0;
          totalRecovered += c.recovered || 0;
          totalActive += c.active || 0;
          totalCritical += c.critical || 0;
        });

        document.getElementById('totalCases').textContent = totalCases.toLocaleString();
        document.getElementById('totalDeaths').textContent = totalDeaths.toLocaleString();
        document.getElementById('totalRecovered').textContent = totalRecovered.toLocaleString();
        document.getElementById('totalActive').textContent = totalActive.toLocaleString();
        document.getElementById('totalCountries').textContent = countries.length;
        document.getElementById('lastUpdate').textContent = new Date(data.lastUpdated).toLocaleString();

        // Таблица
        const tbody = document.getElementById('covidTable');
        tbody.innerHTML = '';
        const sorted = [...countries].sort((a, b) => (b.cases || 0) - (a.cases || 0));
        sorted.slice(0, 50).forEach(c => {
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td><strong>${c.country || 'Unknown'}</strong></td>
            <td class="text-right">${(c.cases || 0).toLocaleString()}</td>
            <td class="text-right">${(c.deaths || 0).toLocaleString()}</td>
            <td class="text-right">${(c.recovered || 0).toLocaleString()}</td>
            <td class="text-right">${(c.active || 0).toLocaleString()}</td>
            <td class="text-right">${(c.critical || 0).toLocaleString()}</td>
            <td class="text-center">${(c.population || 0).toLocaleString()}</td>
          `;
          tbody.appendChild(tr);
        });
      } catch (e) {
        document.getElementById('covidTable').innerHTML = `<tr><td colspan="7" class="text-center" style="color:#ef5350;padding:20px;">❌ Ошибка загрузки данных</td></tr>`;
      }
    }

    loadData();
  </script>
</body>
</html>
