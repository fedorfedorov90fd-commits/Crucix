apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: crucix-core-hpa
  namespace: crucix
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: crucix-core
  minReplicas: 2
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
    - type: Pods
      pods:
        metric:
          name: crucix_ws_connections
        target:
          type: AverageValue
          averageValue: "100"
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
        - type: Pods
          value: 4
          periodSeconds: 15
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: crucix-core-pdb
  namespace: crucix
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: crucix-core
