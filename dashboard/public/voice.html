<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voice Intelligence — Crucix</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0a0a1a;
      color: #e0e0e0;
      min-height: 100vh;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 20px;
      background: rgba(10, 10, 30, 0.95);
      border-bottom: 1px solid rgba(255,255,255,0.06);
      z-index: 100;
      height: 48px;
    }
    .header h1 { font-size: 18px; font-weight: 700; color: #fff; }
    .header h1 span { color: #44ccff; }
    .header .nav-links {
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .header .nav-links a {
      color: #888;
      text-decoration: none;
      font-size: 13px;
      padding: 4px 12px;
      border-radius: 4px;
      transition: all 0.2s;
    }
    .header .nav-links a:hover { background: rgba(255,255,255,0.05); color: #e0e0e0; }
    .header .nav-links a.home { color: #2196f3; }
    .header .nav-links a.active { color: #44ccff; background: rgba(68,204,255,0.1); }
    .btn-copy {
      padding: 4px 12px;
      background: rgba(33,150,243,0.2);
      border: 1px solid rgba(33,150,243,0.3);
      border-radius: 4px;
      color: #2196f3;
      cursor: pointer;
      font-size: 12px;
      transition: all 0.2s;
    }
    .btn-copy:hover { background: rgba(33,150,243,0.3); }

    .main-content {
      padding: 16px 20px;
      max-width: 1400px;
      margin: 0 auto;
    }
    .page-title { font-size: 24px; font-weight: 700; color: #e8f0f8; margin-bottom: 4px; }
    .page-subtitle { color: #666; font-size: 14px; margin-bottom: 16px; }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 12px;
      margin-bottom: 16px;
    }
    .stat-card {
      background: rgba(10,10,20,0.5);
      border: 1px solid rgba(255,255,255,0.04);
      border-radius: 8px;
      padding: 12px 16px;
      text-align: center;
    }
    .stat-card .label { font-size: 10px; text-transform: uppercase; color: #666; letter-spacing: 0.5px; }
    .stat-card .value { font-size: 22px; font-weight: 700; color: #e8f0f8; margin-top: 2px; }
    .stat-card .value.green { color: #4caf50; }
    .stat-card .value.blue { color: #5bc0f8; }
    .stat-card .value.orange { color: #f97316; }
    .stat-card .value.red { color: #ef4444; }
    .stat-card .value.purple { color: #a855f7; }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 16px;
    }
    .btn {
      padding: 6px 14px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
      transition: all 0.2s;
    }
    .btn:hover { transform: translateY(-1px); opacity: 0.9; }
    .btn-primary { background: #2196f3; color: #fff; }
    .btn-secondary { background: #444; color: #fff; }
    .btn-success { background: #22c55e; color: #fff; }
    .status-label {
      padding: 4px 12px;
      border-radius: 4px;
      font-size: 12px;
      background: rgba(255,255,255,0.05);
      color: #888;
      margin-left: auto;
    }

    .grid-2col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 16px;
    }

    .panel {
      background: rgba(10,10,20,0.5);
      border: 1px solid rgba(255,255,255,0.04);
      border-radius: 8px;
      padding: 16px;
    }
    .panel .title { font-size: 14px; font-weight: 600; color: #e8f0f8; margin-bottom: 8px; }

    .recording-item {
      padding: 8px 10px;
      border-bottom: 1px solid rgba(255,255,255,0.03);
      margin-bottom: 4px;
      background: rgba(255,255,255,0.02);
      border-radius: 4px;
    }
    .recording-item .title { font-weight: 500; color: #e8f0f8; }
    .recording-item .meta { font-size: 11px; color: #666; }
    .recording-item .status-pending { color: #eab308; }
    .recording-item .status-analyzed { color: #22c55e; }
    .recording-item .sentiment-negative { color: #ef4444; }
    .recording-item .sentiment-positive { color: #22c55e; }
    .recording-item .sentiment-neutral { color: #eab308; }

    .analysis-item {
      padding: 8px 10px;
      border-left: 3px solid #a855f7;
      margin-bottom: 4px;
      background: rgba(168,85,247,0.05);
      border-radius: 2px;
    }
    .analysis-item .transcript { font-size: 12px; color: #c8d0d8; margin-top: 4px; }
    .analysis-item .emotion { font-size: 11px; color: #888; }

    .form-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 8px;
    }
    .form-row input, .form-row select {
      padding: 6px 10px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 4px;
      color: #e0e0e0;
      font-size: 12px;
      flex: 1;
      min-width: 80px;
    }
    .form-row input:focus, .form-row select:focus {
      outline: none;
      border-color: #a855f7;
    }

    .loading { padding: 20px; text-align: center; color: #666; font-size: 14px; }
    .notification {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.85);
      color: #fff;
      padding: 8px 20px;
      border-radius: 6px;
      font-size: 13px;
      z-index: 100001;
      border: 1px solid rgba(255,255,255,0.1);
      animation: notif-fade 2.5s forwards;
    }
    @keyframes notif-fade {
      0% { opacity: 0; transform: translateX(-50%) translateY(10px); }
      10% { opacity: 1; transform: translateX(-50%) translateY(0); }
      80% { opacity: 1; transform: translateX(-50%) translateY(0); }
      100% { opacity: 0; transform: translateX(-50%) translateY(-20px); }
    }

    @media (max-width: 768px) {
      .grid-2col { grid-template-columns: 1fr; }
      .header { padding: 6px 12px; height: 42px; }
      .header h1 { font-size: 15px; }
      .main-content { padding: 10px; }
      .stats-grid { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>
  <header class="header">
    <h1>🎙️ <span>Voice</span> Intelligence</h1>
    <div class="nav-links">
      <a href="/jarvis" class="home">🏠 Главная</a>
      <a href="/voice" class="active">🎙️ Голос</a>
      <button class="btn-copy" id="copy-btn">📋 Копировать</button>
    </div>
  </header>

  <div class="main-content">
    <h1 class="page-title">🎙️ Voice Intelligence</h1>
    <p class="page-subtitle">Анализ голосовых сообщений — распознавание, тональность, эмоции, дипфейки</p>

    <div class="stats-grid" id="stats-grid">
      <div class="stat-card">
        <div class="label">Записей</div>
        <div class="value blue" id="stat-recordings">0</div>
      </div>
      <div class="stat-card">
        <div class="label">Проанализировано</div>
        <div class="value green" id="stat-analyzed">0</div>
      </div>
      <div class="stat-card">
        <div class="label">Дипфейков</div>
        <div class="value red" id="stat-fake">0</div>
      </div>
      <div class="stat-card">
        <div class="label">Уверенность</div>
        <div class="value purple" id="stat-confidence">0%</div>
      </div>
    </div>

    <div class="controls">
      <button class="btn btn-primary" id="btn-analyze">🔍 Анализировать все</button>
      <button class="btn btn-secondary" id="btn-refresh">🔄 Обновить</button>
      <span class="status-label" id="status-label">⏹ Готов</span>
    </div>

    <div class="grid-2col">
      <div class="panel">
        <div class="title">🎙️ Записи</div>
        <div id="recordings-content">
          <div class="loading">Загрузка...</div>
        </div>
        <div class="form-row">
          <input type="text" id="rec-title" placeholder="Название">
          <select id="rec-source">
            <option value="telegram">Telegram</option>
            <option value="podcast">Podcast</option>
            <option value="news">Новости</option>
            <option value="leak">Утечка</option>
            <option value="official">Официальное</option>
          </select>
          <select id="rec-language">
            <option value="ru">Русский</option>
            <option value="en">English</option>
          </select>
          <button class="btn btn-success" id="btn-add">➕ Добавить</button>
        </div>
      </div>
      <div class="panel">
        <div class="title">📊 Анализ</div>
        <div id="analyses-content">
          <div class="loading">Загрузка...</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    console.log('🎙️ Voice Intelligence загружается...');

    async function loadData() {
      await Promise.all([loadStats(), loadRecordings(), loadAnalyses()]);
    }

    async function loadStats() {
      try {
        const res = await fetch('/api/voice/status');
        const data = await res.json();
        if (data.success) {
          document.getElementById('stat-recordings').textContent = data.stats.total_recordings || 0;
          document.getElementById('stat-analyzed').textContent = data.stats.analyzed || 0;
          document.getElementById('stat-fake').textContent = data.stats.fake_detected || 0;
          document.getElementById('stat-confidence').textContent = (data.stats.avg_confidence || 0) + '%';
        }
      } catch (e) { console.error('[Voice] Ошибка загрузки статистики:', e); }
    }

    async function loadRecordings() {
      try {
        const res = await fetch('/api/voice/recordings');
        const data = await res.json();
        if (data.success) {
          const container = document.getElementById('recordings-content');
          if (data.recordings.length === 0) {
            container.innerHTML = '<div class="loading">Нет записей</div>';
            return;
          }
          let html = '';
          for (const rec of data.recordings) {
            const statusClass = rec.status === 'pending' ? 'status-pending' : 'status-analyzed';
            const statusText = rec.status === 'pending' ? '⏳ Ожидает' : '✅ Проанализирован';
            html += `
              <div class="recording-item">
                <div class="title">${rec.title}</div>
                <div class="meta">${rec.source} · ${rec.duration}с · ${rec.language} · <span class="${statusClass}">${statusText}</span></div>
              </div>
            `;
          }
          container.innerHTML = html;
        }
      } catch (e) { console.error('[Voice] Ошибка загрузки записей:', e); }
    }

    async function loadAnalyses() {
      try {
        const res = await fetch('/api/voice/analyses?limit=5');
        const data = await res.json();
        if (data.success) {
          const container = document.getElementById('analyses-content');
          if (data.analyses.length === 0) {
            container.innerHTML = '<div class="loading">Нет анализов</div>';
            return;
          }
          let html = '';
          for (const analysis of data.analyses) {
            const sentiment = analysis.sentiment?.label || 'neutral';
            const sentimentClass = sentiment === 'negative' ? 'sentiment-negative' :
                                  sentiment === 'positive' ? 'sentiment-positive' : 'sentiment-neutral';
            const emotions = analysis.emotions || {};
            const topEmotion = Object.entries(emotions).sort((a, b) => b[1] - a[1])[0]?.[0] || '—';
            html += `
              <div class="analysis-item">
                <div style="display:flex;justify-content:space-between;">
                  <span style="font-weight:500;color:#e8f0f8;">${analysis.recording_id || '—'}</span>
                  <span class="${sentimentClass}">${sentiment.toUpperCase()} (${analysis.sentiment?.score || 0}%)</span>
                </div>
                <div class="transcript">${analysis.transcript?.slice(0, 80)}...</div>
                <div class="emotion">😊 ${topEmotion} · ${analysis.confidence || 0}%</div>
                ${analysis.authenticity?.is_fake ? '<span style="color:#ef4444;">🚫 ДИПФЕЙК</span>' : '<span style="color:#22c55e;">✅ Подлинный</span>'}
              </div>
            `;
          }
          container.innerHTML = html;
        }
      } catch (e) { console.error('[Voice] Ошибка загрузки анализов:', e); }
    }

    async function analyzeAll() {
      const btn = document.getElementById('btn-analyze');
      const label = document.getElementById('status-label');
      btn.textContent = '⏳ Анализ...';
      btn.disabled = true;
      label.textContent = '⏳ Анализ голоса...';
      label.className = 'status-label';

      try {
        const res = await fetch('/api/voice/analyze-all', { method: 'POST' });
        const data = await res.json();
        if (data.success) {
          showNotification(`✅ Проанализировано: ${data.result.analyzed}`);
          await loadData();
        }
      } catch (e) {
        showNotification('❌ Ошибка: ' + e.message);
      } finally {
        btn.textContent = '🔍 Анализировать все';
        btn.disabled = false;
        label.textContent = '⏹ Готов';
        label.className = 'status-label';
      }
    }

    async function addRecording() {
      const title = document.getElementById('rec-title').value.trim();
      const source = document.getElementById('rec-source').value;
      const language = document.getElementById('rec-language').value;

      if (!title) { showNotification('❌ Введите название'); return; }

      try {
        const res = await fetch('/api/voice/recordings', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ title, source, language, duration: 30 + Math.floor(Math.random() * 150) })
        });
        const data = await res.json();
        if (data.success) {
          showNotification('✅ Запись добавлена!');
          document.getElementById('rec-title').value = '';
          await loadData();
        }
      } catch (e) {
        showNotification('❌ Ошибка: ' + e.message);
      }
    }

    function showNotification(msg) {
      document.querySelectorAll('.notification').forEach(el => el.remove());
      const el = document.createElement('div');
      el.className = 'notification';
      el.textContent = msg;
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 2500);
    }

    document.getElementById('copy-btn').addEventListener('click', function() {
      const text = `=== CRUCIX — VOICE INTELLIGENCE ===
Дата: ${new Date().toLocaleString()}

--- СТАТИСТИКА ---
Записей: ${document.getElementById('stat-recordings').textContent}
Проанализировано: ${document.getElementById('stat-analyzed').textContent}
Дипфейков: ${document.getElementById('stat-fake').textContent}
Уверенность: ${document.getElementById('stat-confidence').textContent}

--- ЗАПИСИ ---
${document.getElementById('recordings-content').textContent}

--- АНАЛИЗ ---
${document.getElementById('analyses-content').textContent}

--- CRUCIX OSINT TERMINAL ---
🌐 http://localhost:3117/voice`;

      navigator.clipboard.writeText(text).then(() => {
        showNotification('✅ Данные скопированы');
      }).catch(() => {
        const area = document.createElement('textarea');
        area.value = text;
        document.body.appendChild(area);
        area.select();
        document.execCommand('copy');
        document.body.removeChild(area);
        showNotification('✅ Данные скопированы');
      });
    });

    document.addEventListener('DOMContentLoaded', function() {
      document.getElementById('btn-analyze').addEventListener('click', analyzeAll);
      document.getElementById('btn-refresh').addEventListener('click', loadData);
      document.getElementById('btn-add').addEventListener('click', addRecording);
      loadData();
    });
  </script>
</body>
</html>
