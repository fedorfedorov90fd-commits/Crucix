<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SafeCast — Crucix</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0a0a0f; color: #c8d0d8; font-family: sans-serif; font-size: 13px; }
    .topbar {
      position: fixed; top: 0; left: 0; right: 0; height: 60px;
      background: rgba(10,10,20,0.92); backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255,255,255,0.04); z-index: 100;
      display: flex; justify-content: space-between; align-items: center; padding: 0 20px;
    }
    .topbar-brand { font-size: 14px; font-weight: 700; color: #5bc0f8; text-transform: uppercase; letter-spacing: 2px; }
    .topbar-btn { height: 28px; padding: 0 12px; border: 1px solid rgba(255,255,255,0.08); border-radius: 4px; background: rgba(255,255,255,0.03); color: #888; font-size: 11px; font-weight: 500; text-transform: uppercase; cursor: pointer; transition: all 0.2s; }
    .topbar-btn:hover { background: rgba(255,255,255,0.06); transform: translateY(-1px); }
    .btn-home { color: #5bc0f8; border-color: rgba(91,192,248,0.2); background: rgba(91,192,248,0.06); }
    .btn-copy { color: #5bc0f8; border-color: rgba(91,192,248,0.15); background: rgba(91,192,248,0.06); }
    .main-content { padding-top: 76px; max-width: 1200px; margin: 0 auto; padding: 76px 20px 40px; }
    .page-title { font-size: 28px; font-weight: 700; color: #e8f0f8; margin-bottom: 8px; }
    .page-subtitle { color: #666; font-size: 14px; margin-bottom: 24px; }
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 16px; margin-bottom: 24px; }
    .stat-card { background: rgba(10,10,20,0.5); border: 1px solid rgba(255,255,255,0.04); border-radius: 8px; padding: 16px; text-align: center; }
    .stat-card .stat-label { font-size: 11px; text-transform: uppercase; color: #666; letter-spacing: 0.5px; }
    .stat-card .stat-value { font-size: 28px; font-weight: 700; color: #5bc0f8; margin: 6px 0; }
    .stat-card .stat-sub { font-size: 12px; color: #555; }
    .panel { background: rgba(10,10,20,0.5); border: 1px solid rgba(255,255,255,0.04); border-radius: 8px; padding: 16px; margin-bottom: 16px; }
    .panel-title { font-size: 12px; font-weight: 600; text-transform: uppercase; color: #666; letter-spacing: 0.5px; margin-bottom: 12px; }
    .site-item { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,0.03); }
    .site-item .name { color: #c8d0d8; }
    .site-item .reading { font-weight: 600; }
    .site-item .normal { color: #4caf50; }
    .site-item .elevated { color: #f97316; }
    .site-item .critical { color: #ef4444; }
    .site-item .unknown { color: #666; }
    .notification { position: fixed; bottom: 60px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.85); color: #fff; padding: 8px 20px; border-radius: 6px; font-size: 13px; z-index: 100001; border: 1px solid rgba(255,255,255,0.1); animation: notif-fade 2.5s forwards; }
    @keyframes notif-fade { 0% { opacity: 0; transform: translateX(-50%) translateY(10px); } 10% { opacity: 1; transform: translateX(-50%) translateY(0); } 80% { opacity: 1; } 100% { opacity: 0; transform: translateX(-50%) translateY(-20px); } }
    #coordinate-grid { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 99999; background-image: linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px); background-size: 50px 50px; display: none; }
    #coordinate-grid.visible { display: block; }
    #grid-coords { position: fixed; bottom: 12px; right: 12px; background: rgba(0,0,0,0.7); color: #00ff00; font-family: monospace; font-size: 11px; padding: 4px 10px; border-radius: 4px; z-index: 100000; pointer-events: none; display: none; }
    #grid-coords.visible { display: block; }
    .loading { color: #666; text-align: center; padding: 20px; }
  </style>
</head>
<body>

<header class="topbar">
  <div class="topbar-left">
    <span class="topbar-brand">☢️ SAFECAST</span>
  </div>
  <div class="topbar-right">
    <button class="topbar-btn btn-home" onclick="window.location.href='/jarvis'">← НА ГЛАВНУЮ</button>
    <button class="topbar-btn btn-help" onclick="showHelp()">❓ HELP</button>
    <button class="topbar-btn btn-copy" id="copy-btn">📋 КОПИРОВАТЬ</button>
    <button class="topbar-btn btn-grid" id="grid-toggle">📐 СЕТКА</button>
  </div>
</header>

<main class="main-content">
  <h1 class="page-title">☢️ Радиационный мониторинг (SafeCast)</h1>
  <p class="page-subtitle">Мониторинг радиационного фона по всему миру</p>

  <div class="stats-grid" id="stats-grid">
    <div class="stat-card"><div class="stat-label">Всего объектов</div><div class="stat-value" id="total">—</div></div>
    <div class="stat-card"><div class="stat-label">🟢 Норма</div><div class="stat-value" id="normal">—</div></div>
    <div class="stat-card"><div class="stat-label">🟠 Повышен</div><div class="stat-value" id="elevated">—</div></div>
    <div class="stat-card"><div class="stat-label">🔴 Критично</div><div class="stat-value" id="critical">—</div></div>
    <div class="stat-card"><div class="stat-label">⚪ Неизвестно</div><div class="stat-value" id="unknown">—</div></div>
  </div>

  <div class="panel">
    <div class="panel-title">📍 Объекты мониторинга</div>
    <div id="sites-list"><div class="loading">Загрузка...</div></div>
  </div>

  <div class="panel">
    <div class="panel-title">⚠️ Аномалии</div>
    <div id="anomalies-list"><div class="loading">Загрузка...</div></div>
  </div>
</main>

<div id="coordinate-grid"></div>
<div id="grid-coords">X: 0  Y: 0</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
  loadData();
});

async function loadData() {
  try {
    const res = await fetch('/api/safecast/data');
    const data = await res.json();
    if (data.success) {
      renderStats(data.data);
      renderSites(data.data.sites);
      renderAnomalies(data.data.anomalies);
    } else {
      showError(data.error || 'Нет данных');
    }
  } catch (e) {
    showError('Ошибка загрузки');
  }
}

function renderStats(d) {
  document.getElementById('total').textContent = d.summary.total || '—';
  document.getElementById('normal').textContent = d.summary.byLevel?.normal || 0;
  document.getElementById('elevated').textContent = d.summary.byLevel?.elevated || 0;
  document.getElementById('critical').textContent = d.summary.byLevel?.critical || 0;
  document.getElementById('unknown').textContent = d.summary.byLevel?.unknown || 0;
}

function renderSites(sites) {
  const container = document.getElementById('sites-list');
  if (!sites || sites.length === 0) {
    container.innerHTML = '<div class="loading">Нет данных</div>';
    return;
  }
  let html = '';
  for (const s of sites) {
    const cls = s.level || 'unknown';
    const reading = s.reading !== null ? s.reading + ' CPM' : '—';
    html += `<div class="site-item"><span class="name">${s.name}</span><span class="reading ${cls}">${reading}</span></div>`;
  }
  container.innerHTML = html;
}

function renderAnomalies(anomalies) {
  const container = document.getElementById('anomalies-list');
  if (!anomalies || anomalies.length === 0) {
    container.innerHTML = '<div class="loading">✅ Аномалий не обнаружено</div>';
    return;
  }
  let html = '';
  for (const a of anomalies) {
    html += `<div class="site-item"><span class="name">${a.site}</span><span class="reading elevated">${a.reading} CPM — ${a.description}</span></div>`;
  }
  container.innerHTML = html;
}

function showError(msg) {
  document.getElementById('sites-list').innerHTML = '<div class="loading">❌ ' + msg + '</div>';
}

let gridVisible = false;
document.getElementById('grid-toggle').addEventListener('click', function() {
  gridVisible = !gridVisible;
  document.getElementById('coordinate-grid').classList.toggle('visible', gridVisible);
  document.getElementById('grid-coords').classList.toggle('visible', gridVisible);
  if (gridVisible) {
    document.addEventListener('mousemove', function(e) {
      document.getElementById('grid-coords').textContent = 'X: ' + e.clientX + '  Y: ' + e.clientY;
    });
  }
});

document.getElementById('copy-btn').addEventListener('click', function() {
  let text = '=== SAFECAST ===\nДата: ' + new Date().toLocaleString() + '\n';
  document.querySelectorAll('.site-item').forEach(function(el) {
    text += el.textContent.trim() + '\n';
  });
  navigator.clipboard.writeText(text).then(function() {
    showNotif('✅ Данные скопированы');
  }).catch(function() {
    const area = document.createElement('textarea');
    area.value = text;
    document.body.appendChild(area);
    area.select();
    document.execCommand('copy');
    document.body.removeChild(area);
    showNotif('✅ Данные скопированы');
  });
});

function showNotif(msg) {
  const el = document.createElement('div');
  el.className = 'notification';
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(function() { el.remove(); }, 2500);
}
</script>
<script src="/js/help.js"></script>
</body>
</html>
