<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Аналитический дашборд — Crucix</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a1a;
            color: #e0e0e0;
            font-family: -apple-system, 'Segoe UI', system-ui, sans-serif;
            min-height: 100vh;
        }
        .topbar {
            position: fixed; top: 0; left: 0; right: 0;
            height: 60px;
            background: rgba(10,10,20,0.95);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255,255,255,0.05);
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
        }
        .topbar-left { display: flex; align-items: center; gap: 12px; }
        .topbar-brand { font-size: 14px; font-weight: 700; color: #5bc0f8; text-transform: uppercase; letter-spacing: 2px; }
        .topbar-right { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
        .topbar-btn {
            height: 28px; padding: 0 12px; border: 1px solid rgba(255,255,255,0.08);
            border-radius: 4px; background: rgba(255,255,255,0.03); color: #888;
            font-size: 11px; font-weight: 500; text-transform: uppercase;
            cursor: pointer; transition: all 0.2s;
        }
        .topbar-btn:hover { background: rgba(255,255,255,0.06); transform: translateY(-1px); }
        .btn-home { color: #5bc0f8; border-color: rgba(91,192,248,0.2); background: rgba(91,192,248,0.06); }
        .btn-home:hover { background: rgba(91,192,248,0.15); }
        .btn-copy { color: #5bc0f8; border-color: rgba(91,192,248,0.15); background: rgba(91,192,248,0.06); }
        .btn-copy.copied { background: rgba(76,175,80,0.2); border-color: #4caf50; color: #4caf50; }
        .lang-switch {
            display: flex; gap: 2px; padding: 2px;
            background: rgba(255,255,255,0.03); border-radius: 4px;
            border: 1px solid rgba(255,255,255,0.06);
        }
        .lang-btn {
            padding: 2px 8px; border: none; background: transparent;
            color: #666; font-size: 11px; font-weight: 500;
            cursor: pointer; border-radius: 3px; transition: all 0.2s;
        }
        .lang-btn:hover { color: #888; background: rgba(255,255,255,0.05); }
        .lang-btn.active { color: #5bc0f8; background: rgba(91,192,248,0.1); }

        .main-content {
            padding-top: 76px;
            max-width: 1440px;
            margin: 0 auto;
            padding-left: 20px;
            padding-right: 20px;
            padding-bottom: 40px;
        }
        .page-title {
            font-size: 28px;
            font-weight: 700;
            color: #e8f0f8;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .page-title .badge {
            font-size: 12px; font-weight: 400;
            background: rgba(74,222,128,0.15); color: #4ade80;
            padding: 2px 12px; border-radius: 20px;
            border: 1px solid rgba(74,222,128,0.2);
        }
        .page-subtitle { color: #8899aa; font-size: 14px; margin-bottom: 24px; }
        .page-subtitle a { color: #5bc0f8; text-decoration: none; }
        .page-subtitle a:hover { text-decoration: underline; }

        .global-index {
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 12px;
            padding: 20px 24px;
            margin-bottom: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }
        .global-index .value {
            font-size: 36px;
            font-weight: 700;
            color: #f59e0b;
        }
        .global-index .label { font-size: 14px; color: #8899aa; }
        .global-index .status {
            font-size: 14px;
            font-weight: 600;
            padding: 4px 16px;
            border-radius: 20px;
        }
        .global-index .stats { display: flex; gap: 24px; font-size: 14px; color: #8899aa; }
        .global-index .stats strong { color: #e0e0e0; }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 12px;
            margin-bottom: 24px;
        }
        .card-link {
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
            height: 100%;
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 10px;
            padding: 14px;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
            min-height: 160px;
        }
        .card-link:hover {
            background: rgba(255,255,255,0.04);
            transform: translateY(-2px);
            border-color: rgba(255,255,255,0.1);
        }
        .card-link .card-number {
            position: absolute;
            top: 4px;
            left: 6px;
            font-size: 9px;
            font-weight: 700;
            color: #4a5a6a;
            background: rgba(255,255,255,0.04);
            padding: 0 6px;
            border-radius: 4px;
            font-family: monospace;
        }
        .card-link .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
            margin-top: 6px;
        }
        .card-link .header .icon { font-size: 18px; }
        .card-link .header .name { font-size: 12px; font-weight: 600; color: #c0d0e0; }
        .card-link .header .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
            flex-shrink: 0;
        }
        .card-link .main-value {
            font-size: 22px;
            font-weight: 700;
            margin: 2px 0;
        }
        .card-link .change {
            font-size: 12px;
            font-weight: 600;
            margin-left: 4px;
        }
        .card-link .change.up { color: #4ade80; }
        .card-link .change.down { color: #ef4444; }
        .card-link .change.neutral { color: #f59e0b; }

        .card-link .status-label {
            font-size: 11px;
            font-weight: 600;
            padding: 1px 8px;
            border-radius: 12px;
            display: inline-block;
            margin: 2px 0;
        }
        .card-link .status-label.critical { background: rgba(239,68,68,0.15); color: #ef4444; border: 1px solid rgba(239,68,68,0.2); }
        .card-link .status-label.high { background: rgba(245,158,11,0.15); color: #f59e0b; border: 1px solid rgba(245,158,11,0.2); }
        .card-link .status-label.medium { background: rgba(251,191,36,0.15); color: #fbbf24; border: 1px solid rgba(251,191,36,0.2); }
        .card-link .status-label.normal { background: rgba(74,222,128,0.15); color: #4ade80; border: 1px solid rgba(74,222,128,0.2); }

        .card-link .forecast {
            font-size: 11px;
            color: #8899aa;
            margin: 2px 0;
        }
        .card-link .source {
            font-size: 9px;
            color: #4a5a6a;
            margin-top: auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .card-link .source .src { color: #5bc0f8; }
        .card-link .source .updated { color: #4a5a6a; }
        .card-link .click-hint {
            font-size: 8px;
            color: #4a5a6a;
            text-align: center;
            margin-top: 2px;
        }

        .bg-critical { background: #ef4444; }
        .bg-high { background: #f59e0b; }
        .bg-medium { background: #fbbf24; }
        .bg-low { background: #4ade80; }
        .bg-online { background: #4ade80; }
        .bg-offline { background: #ef4444; }

        .charts-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 24px;
        }
        .chart-box {
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 10px;
            padding: 16px;
            min-height: 200px;
        }
        .chart-box .title {
            font-size: 13px;
            font-weight: 600;
            color: #8899aa;
            margin-bottom: 8px;
        }
        .chart-box .chart-placeholder {
            display: flex;
            align-items: flex-end;
            justify-content: center;
            height: 140px;
            gap: 2px;
            padding: 4px 0;
        }
        .chart-box .chart-placeholder .bar {
            flex: 1;
            border-radius: 2px 2px 0 0;
            min-width: 4px;
            min-height: 4px;
            transition: all 0.3s;
        }
        .chart-box .labels {
            display: flex;
            justify-content: space-between;
            font-size: 9px;
            color: #4a5a6a;
            margin-top: 4px;
        }

        .feed {
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 10px;
            padding: 16px;
            max-height: 300px;
            overflow-y: auto;
        }
        .feed .title {
            font-size: 13px;
            font-weight: 600;
            color: #8899aa;
            margin-bottom: 8px;
        }
        .feed-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 6px 0;
            border-bottom: 1px solid rgba(255,255,255,0.03);
            font-size: 13px;
        }
        .feed-item .source {
            font-weight: 600;
            font-size: 10px;
            padding: 1px 8px;
            border-radius: 4px;
            min-width: 60px;
            text-align: center;
        }
        .feed-item .msg { flex: 1; color: #c0d0e0; }
        .feed-item .time { font-size: 11px; color: #4a5a6a; }

        .source-notam { background: rgba(239,68,68,0.2); color: #ef4444; }
        .source-gps { background: rgba(245,158,11,0.2); color: #f59e0b; }
        .source-trends { background: rgba(91,192,248,0.2); color: #5bc0f8; }
        .source-vix { background: rgba(239,68,68,0.2); color: #ef4444; }
        .source-yield { background: rgba(74,222,128,0.2); color: #4ade80; }

        .notification {
            position: fixed;
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.85);
            color: #fff;
            padding: 8px 20px;
            border-radius: 6px;
            font-size: 13px;
            z-index: 100001;
            border: 1px solid rgba(255,255,255,0.1);
            animation: notif-fade 2.5s forwards;
        }
        @keyframes notif-fade {
            0% { opacity: 0; transform: translateX(-50%) translateY(10px); }
            10% { opacity: 1; transform: translateX(-50%) translateY(0); }
            80% { opacity: 1; }
            100% { opacity: 0; transform: translateX(-50%) translateY(-20px); }
        }

        @media (max-width: 1200px) {
            .cards-grid { grid-template-columns: repeat(4, 1fr); }
        }
        @media (max-width: 992px) {
            .cards-grid { grid-template-columns: repeat(3, 1fr); }
        }
        @media (max-width: 768px) {
            .cards-grid { grid-template-columns: repeat(2, 1fr); }
            .charts-row { grid-template-columns: 1fr; }
            .topbar { padding: 0 12px; height: 52px; }
            .topbar-brand { font-size: 12px; }
            .page-title { font-size: 20px; }
            .main-content { padding-top: 68px; padding-left: 12px; padding-right: 12px; }
        }
        @media (max-width: 480px) {
            .cards-grid { grid-template-columns: 1fr; }
            .topbar { padding: 0 8px; height: 46px; }
            .topbar-brand { font-size: 10px; }
            .topbar-btn { font-size: 9px; padding: 0 6px; height: 20px; }
            .main-content { padding-top: 62px; padding-left: 8px; padding-right: 8px; }
            .page-title { font-size: 18px; }
            .global-index { flex-direction: column; align-items: flex-start; gap: 12px; }
            .global-index .stats { flex-wrap: wrap; gap: 8px; }
        }
    </style>
</head>
<body>

<header class="topbar">
    <div class="topbar-left"><span class="topbar-brand">📊 АНАЛИТИЧЕСКИЙ ДАШБОРД</span></div>
    <div class="topbar-right">
        <button class="topbar-btn btn-home" onclick="window.location.href='/jarvis'">← НА ГЛАВНУЮ</button>
        <button class="topbar-btn btn-copy" id="copy-btn">📋 КОПИРОВАТЬ</button>
        <button class="topbar-btn" onclick="window.location.href='/registry'">📋 РЕЕСТР</button>
        <div class="lang-switch">
            <button class="lang-btn active" data-lang="ru" onclick="switchLang('ru')">RU</button>
            <button class="lang-btn" data-lang="en" onclick="switchLang('en')">EN</button>
        </div>
    </div>
</header>

<main class="main-content">
    <div class="page-title">
        📊 Аналитический дашборд
        <span class="badge" id="statusBadge">🟢 ONLINE</span>
    </div>
    <div class="page-subtitle">
        25 ключевых индикаторов в реальном времени
        <span style="margin-left:12px;font-size:12px;color:#4a5a6a;">
            <a href="/registry" target="_blank">📋 Полный реестр</a>
        </span>
    </div>

    <!-- ГЛОБАЛЬНЫЙ ИНДЕКС -->
    <div class="global-index" id="globalIndexBlock">
        <div>
            <div class="label">🌍 Глобальный индекс напряженности</div>
            <div class="value" id="globalIndex">—</div>
        </div>
        <div class="stats">
            <span>🟢 Нормально: <strong id="normalCount">0</strong></span>
            <span>🟡 Средний: <strong id="mediumCount">0</strong></span>
            <span>🟠 Высокий: <strong id="highCount">0</strong></span>
            <span>🔴 Критический: <strong id="criticalCount">0</strong></span>
        </div>
        <div>
            <span class="status" id="globalStatus">🟢 НОРМАЛЬНО</span>
        </div>
    </div>

    <!-- 25 КАРТОЧЕК (ССЫЛКИ С target="_blank") -->
    <div class="cards-grid" id="cardsGrid"></div>

    <!-- ГРАФИКИ -->
    <div class="charts-row">
        <div class="chart-box">
            <div class="title">📉 Кривая доходности (10Y-2Y)</div>
            <div class="chart-placeholder" id="yieldChart"></div>
            <div class="labels" id="yieldLabels"></div>
        </div>
        <div class="chart-box">
            <div class="title">📈 Индекс VIX (30 дней)</div>
            <div class="chart-placeholder" id="vixChart"></div>
            <div class="labels" id="vixLabels"></div>
        </div>
    </div>

    <!-- ПОТОК СОБЫТИЙ -->
    <div class="feed">
        <div class="title">📋 Поток событий</div>
        <div id="feedList"></div>
    </div>
</main>

<script>
// ============================================================
// 1. КОНФИГУРАЦИЯ КАРТОЧЕК (25 шт.)
// ============================================================

const CARD_CONFIG = [
    { id: 'notam', number: '01', icon: '🛩️', name: 'NOTAM', source: 'ICAO', url: '/notam-monitor', api: '/api/notam/', key: 'total', statusKey: 'severity' },
    { id: 'gps', number: '02', icon: '📡', name: 'GPS-глушение', source: 'OpenSky', url: '/gps-jamming', api: '/api/gps-jamming/', key: 'total', statusKey: 'severity' },
    { id: 'trends', number: '03', icon: '📊', name: 'Google Trends', source: 'Google', url: '/google-trends', api: '/api/google-trends/', key: 'total', statusKey: 'severity' },
    { id: 'vix', number: '04', icon: '📈', name: 'VIX (страх)', source: 'CBOE', url: '/vix', api: '/api/vix/', key: 'value', statusKey: 'value' },
    { id: 'yield', number: '05', icon: '📉', name: 'Кривая доходности', source: 'FRED', url: '/yield-curve', api: '/api/yield-curve/', key: 'spread', statusKey: 'spread' },
    { id: 'gold-oil', number: '06', icon: '💰', name: 'Золото/Нефть', source: 'FRED', url: '/gold-oil-ratio', api: '/api/gold-oil-ratio/', key: 'ratio', statusKey: 'ratio' },
    { id: 'copper-gold', number: '07', icon: '🏗️', name: 'Медь/Золото', source: 'FRED', url: '/copper-gold', api: '/api/copper-gold/', key: 'ratio', statusKey: 'ratio' },
    { id: 'bdi', number: '08', icon: '🚢', name: 'BDI', source: 'Baltic Ex.', url: '/bdi', api: '/api/bdi/', key: 'value', statusKey: 'value' },
    { id: 'viirs', number: '09', icon: '🌃', name: 'Ночные огни', source: 'NASA', url: '/viirs', api: '/api/viirs/', key: 'value', statusKey: 'value' },
    { id: 'uranium', number: '10', icon: '☢️', name: 'Уран', source: 'UxC', url: '/uranium', api: '/api/uranium/', key: 'value', statusKey: 'value' },
    { id: 'big-mac', number: '11', icon: '🍔', name: 'Биг-Мак', source: 'Economist', url: '/big-mac', api: '/api/big-mac/', key: 'price', statusKey: 'price' },
    { id: 'debt-gdp', number: '12', icon: '📊', name: 'ВВП/Долг', source: 'IMF', url: '/debt-gdp', api: '/api/debt-gdp/', key: 'value', statusKey: 'value' },
    { id: 'sp500-vix', number: '13', icon: '📈', name: 'S&P/VIX', source: 'S&P', url: '/sp500-vix', api: '/api/sp500-vix/', key: 'value', statusKey: 'value' },
    { id: 'crypto-fear', number: '14', icon: '📊', name: 'Крипто-страх', source: 'CoinMarketCap', url: '/crypto-fear', api: '/api/crypto-fear/', key: 'value', statusKey: 'value' },
    { id: 'oil-gas', number: '15', icon: '🛢️', name: 'Нефть/Газ', source: 'EIA', url: '/oil-gas', api: '/api/oil-gas/', key: 'ratio', statusKey: 'ratio' },
    { id: 'gold-silver', number: '16', icon: '💰', name: 'Золото/Серебро', source: 'FRED', url: '/gold-silver', api: '/api/gold-silver/', key: 'ratio', statusKey: 'ratio' },
    { id: 'happiness', number: '17', icon: '😊', name: 'Индекс счастья', source: 'UN', url: '/happiness', api: '/api/happiness/', key: 'score', statusKey: 'score' },
    { id: 'big-mac-alt', number: '18', icon: '🍔', name: 'Биг-Мак Alt', source: 'World Bank', url: '/big-mac-alt', api: '/api/big-mac-alt/', key: 'price', statusKey: 'price' },
    { id: 'big-mac-main', number: '19', icon: '🍔', name: 'Биг-Мак (осн.)', source: 'Economist', url: '/big-mac-main', api: '/api/big-mac-main/', key: 'price', statusKey: 'price' },
    { id: 'vxx', number: '20', icon: '📊', name: 'VXX (страх)', source: 'CBOE', url: '/vxx', api: '/api/vxx/', key: 'value', statusKey: 'value' },
    { id: 'happiness-alt', number: '21', icon: '😊', name: 'Счастье Alt', source: 'WHO', url: '/happiness-alt', api: '/api/happiness-alt/', key: 'score', statusKey: 'score' },
    { id: 'inflation', number: '22', icon: '📈', name: 'Инфляция', source: 'BLS', url: '/inflation', api: '/api/inflation/', key: 'value', statusKey: 'value' },
    { id: 'unemployment', number: '23', icon: '📊', name: 'Безработица', source: 'BLS', url: '/unemployment', api: '/api/unemployment/', key: 'value', statusKey: 'value' },
    { id: 'pmi', number: '24', icon: '🏭', name: 'PMI', source: 'S&P Global', url: '/pmi', api: '/api/pmi/', key: 'value', statusKey: 'value' },
    { id: 'recession', number: '25', icon: '⚠️', name: 'Рецессия', source: 'ФРС', url: '/recession', api: '/api/recession/', key: 'value', statusKey: 'value' }
];

// ============================================================
// 2. ПЕРЕКЛЮЧАТЕЛЬ ЯЗЫКА
// ============================================================
let currentLang = localStorage.getItem('crucix-lang') || 'ru';

function switchLang(lang) {
    currentLang = lang;
    localStorage.setItem('crucix-lang', lang);
    document.querySelectorAll('.lang-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.lang === lang);
    });
    showNotification('🌐 Язык: ' + lang.toUpperCase());
}

document.querySelectorAll('.lang-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.lang === currentLang);
});

// ============================================================
// 3. УВЕДОМЛЕНИЯ
// ============================================================
function showNotification(msg) {
    document.querySelectorAll('.notification').forEach(el => el.remove());
    const el = document.createElement('div');
    el.className = 'notification';
    el.textContent = msg;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 2500);
}

// ============================================================
// 4. КНОПКА КОПИРОВАТЬ
// ============================================================
document.getElementById('copy-btn').addEventListener('click', function() {
    copyAllData();
});

function copyAllData() {
    const timestamp = new Date().toLocaleString();
    const pageTitle = document.querySelector('.page-title')?.textContent || document.title || 'Без заголовка';

    const allElements = document.querySelectorAll('*');
    let elementsReport = [];
    let elementIndex = 0;
    const excludeIds = ['copy-btn', 'notification'];

    allElements.forEach(el => {
        if (excludeIds.includes(el.id)) return;
        if (el.tagName === 'SCRIPT' || el.tagName === 'STYLE') return;
        if (el.tagName === 'HTML' || el.tagName === 'BODY') return;

        const rect = el.getBoundingClientRect();
        const computed = window.getComputedStyle(el);

        if (rect.width === 0 && rect.height === 0) return;
        if (computed.display === 'none') return;

        let textContent = '';
        for (const node of el.childNodes) {
            if (node.nodeType === Node.TEXT_NODE) {
                textContent += node.textContent.trim();
            }
        }
        if (!textContent && el.textContent) {
            textContent = el.textContent.trim().slice(0, 200);
        }
        if (!textContent && !el.id && !el.className) return;

        let selector = el.tagName.toLowerCase();
        if (el.id) selector += '#' + el.id;
        if (el.className && typeof el.className === 'string') {
            const classes = el.className.split(' ').filter(c => c).join('.');
            if (classes) selector += '.' + classes;
        }

        const coords = {
            x: Math.round(rect.left + window.pageXOffset),
            y: Math.round(rect.top + window.pageYOffset),
            width: Math.round(rect.width),
            height: Math.round(rect.height),
            viewX: Math.round(rect.left),
            viewY: Math.round(rect.top)
        };

        const styles = {
            color: computed.color,
            backgroundColor: computed.backgroundColor,
            fontFamily: computed.fontFamily,
            fontSize: computed.fontSize,
            fontWeight: computed.fontWeight,
            fontStyle: computed.fontStyle,
            textAlign: computed.textAlign,
            lineHeight: computed.lineHeight,
            letterSpacing: computed.letterSpacing,
            padding: computed.padding,
            margin: computed.margin,
            border: computed.border,
            borderRadius: computed.borderRadius,
            boxShadow: computed.boxShadow,
            display: computed.display,
            position: computed.position,
            top: computed.top,
            left: computed.left,
            width: computed.width,
            height: computed.height,
            opacity: computed.opacity,
            zIndex: computed.zIndex,
            transform: computed.transform,
            transition: computed.transition
        };

        elementsReport.push({
            index: ++elementIndex,
            selector: selector,
            tag: el.tagName.toLowerCase(),
            id: el.id || null,
            classes: el.className || null,
            text: textContent || null,
            coords: coords,
            styles: styles
        });
    });

    const distances = [];
    const allButtons = document.querySelectorAll('.topbar-btn, .lang-btn, .btn-copy');
    const buttonPositions = [];

    allButtons.forEach(btn => {
        const rect = btn.getBoundingClientRect();
        if (rect.width > 0 && rect.height > 0) {
            buttonPositions.push({
                text: btn.textContent.trim().slice(0, 30),
                x: Math.round(rect.left + rect.width / 2),
                y: Math.round(rect.top + rect.height / 2),
                width: Math.round(rect.width),
                height: Math.round(rect.height)
            });
        }
    });

    for (let i = 0; i < buttonPositions.length; i++) {
        for (let j = i + 1; j < buttonPositions.length; j++) {
            const dx = buttonPositions[i].x - buttonPositions[j].x;
            const dy = buttonPositions[i].y - buttonPositions[j].y;
            const distance = Math.round(Math.sqrt(dx * dx + dy * dy));
            distances.push({
                from: buttonPositions[i].text,
                to: buttonPositions[j].text,
                distance: distance,
                dx: dx,
                dy: dy
            });
        }
    }

    let report = '=== CRUCIX — ПОЛНЫЙ СНАПШОТ СТРАНИЦЫ ===\n';
    report += 'Дата: ' + timestamp + '\n';
    report += 'URL: ' + window.location.href + '\n';
    report += 'Размер окна: ' + window.innerWidth + '×' + window.innerHeight + '\n';
    report += 'Всего элементов: ' + elementsReport.length + '\n';
    report += 'Кнопок: ' + allButtons.length + '\n\n';
    report += '--- ЗАГОЛОВОК ---\n' + pageTitle + '\n\n';
    report += '--- ВСЕ ЭЛЕМЕНТЫ (' + elementsReport.length + ' шт.) ---\n';
    for (const el of elementsReport) {
        report += '\n[' + el.index + '] ' + el.selector + '\n';
        report += '  Текст: ' + (el.text || '—') + '\n';
        report += '  Координаты: X=' + el.coords.x + ' Y=' + el.coords.y + ' (ширина=' + el.coords.width + ' высота=' + el.coords.height + ')\n';
        report += '  Цвет: ' + (el.styles.color || '—') + '\n';
        report += '  Фон: ' + (el.styles.backgroundColor || '—') + '\n';
        report += '  Шрифт: ' + (el.styles.fontFamily || '—') + ' размер=' + (el.styles.fontSize || '—') + ' вес=' + (el.styles.fontWeight || '—') + '\n';
        report += '  Отступы: ' + (el.styles.padding || '—') + '\n';
        report += '  Граница: ' + (el.styles.border || '—') + '\n';
        report += '  Скругление: ' + (el.styles.borderRadius || '—') + '\n';
        report += '  Тень: ' + (el.styles.boxShadow || '—') + '\n';
        report += '  Display: ' + (el.styles.display || '—') + '\n';
        report += '  Position: ' + (el.styles.position || '—') + ' top=' + (el.styles.top || '—') + ' left=' + (el.styles.left || '—') + '\n';
        report += '  Размер: ' + (el.styles.width || '—') + '×' + (el.styles.height || '—') + '\n';
        report += '  Прозрачность: ' + (el.styles.opacity || '—') + '\n';
        report += '  Z-индекс: ' + (el.styles.zIndex || '—') + '\n';
        report += '  Transform: ' + (el.styles.transform || '—') + '\n';
    }

    if (distances.length > 0) {
        report += '\n--- ДИСТАНЦИИ МЕЖДУ КНОПКАМИ (' + distances.length + ') ---\n';
        for (const d of distances) {
            report += '  ' + d.from + ' → ' + d.to + ': ' + d.distance + 'px (dx=' + d.dx + ' dy=' + d.dy + ')\n';
        }
    }

    report += '\n--- CRUCIX OSINT TERMINAL ---\n';
    report += '🌐 ' + (window.location.origin || window.location.href);

    navigator.clipboard.writeText(report).then(() => {
        const btn = document.getElementById('copy-btn');
        btn.textContent = '✅ Скопировано!';
        btn.classList.add('copied');
        setTimeout(() => {
            btn.textContent = '📋 КОПИРОВАТЬ';
            btn.classList.remove('copied');
        }, 3000);
        showNotification('✅ Скопировано ' + elementsReport.length + ' элементов');
    }).catch(() => {
        const textarea = document.createElement('textarea');
        textarea.value = report;
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand('copy');
        document.body.removeChild(textarea);
        const btn = document.getElementById('copy-btn');
        btn.textContent = '✅ Скопировано!';
        btn.classList.add('copied');
        setTimeout(() => {
            btn.textContent = '📋 КОПИРОВАТЬ';
            btn.classList.remove('copied');
        }, 3000);
        showNotification('✅ Скопировано ' + elementsReport.length + ' элементов');
    });
}

// ============================================================
// 5. ЗАГРУЗКА ДАННЫХ
// ============================================================
async function fetchData(url) {
    try {
        const res = await fetch(url);
        const data = await res.json();
        return data.data || [];
    } catch { return []; }
}

function getSeverityCount(data, severity) {
    return data.filter(d => d.severity === severity || d.intensity === severity).length;
}

// ============================================================
// 6. ОТОБРАЖЕНИЕ КАРТОЧЕК
// ============================================================
function renderCards(cardsData) {
    const container = document.getElementById('cardsGrid');
    let html = '';

    for (const card of CARD_CONFIG) {
        const data = cardsData[card.id] || [];
        const last = data.length > 0 ? data[data.length - 1] : null;
        const value = last ? last[card.key] : null;

        let statusClass = 'normal';
        let statusLabel = '🟢 НОРМАЛЬНО';

        if (card.id === 'vix') {
            if (value > 30) { statusClass = 'critical'; statusLabel = '🔴 ВЫСОКИЙ'; }
            else if (value > 20) { statusClass = 'high'; statusLabel = '🟠 СРЕДНИЙ'; }
        } else if (card.id === 'yield') {
            if (value < 0) { statusClass = 'critical'; statusLabel = '🔴 ИНВЕРСИЯ'; }
            else if (value < 0.5) { statusClass = 'high'; statusLabel = '🟡 ПРЕДУПРЕЖДЕНИЕ'; }
        } else if (card.id === 'gold-oil') {
            if (value > 30) { statusClass = 'critical'; statusLabel = '🔴 ВЫСОКИЙ РИСК'; }
            else if (value > 25) { statusClass = 'high'; statusLabel = '🟡 СРЕДНИЙ РИСК'; }
        } else if (card.id === 'copper-gold') {
            if (value > 15) { statusClass = 'critical'; statusLabel = '🔴 РЕЦЕССИЯ'; }
            else if (value > 10) { statusClass = 'high'; statusLabel = '🟡 ПРЕДУПРЕЖДЕНИЕ'; }
        } else if (card.id === 'bdi') {
            if (value > 3000) { statusClass = 'high'; statusLabel = '🟠 ВЫСОКИЙ'; }
            else if (value > 1500) { statusClass = 'normal'; statusLabel = '🟢 НОРМАЛЬНО'; }
        } else if (card.id === 'viirs') {
            if (value < 50) { statusClass = 'critical'; statusLabel = '🔴 КРИТИЧЕСКАЯ'; }
            else if (value < 70) { statusClass = 'high'; statusLabel = '🟡 СНИЖЕНИЕ'; }
        } else if (card.id === 'debt-gdp') {
            if (value > 200) { statusClass = 'critical'; statusLabel = '🔴 КРИТИЧЕСКИЙ'; }
            else if (value > 100) { statusClass = 'high'; statusLabel = '🟡 ВЫСОКИЙ'; }
        } else if (card.id === 'inflation') {
            if (value > 5) { statusClass = 'critical'; statusLabel = '🔴 КРИТИЧЕСКАЯ'; }
            else if (value > 3) { statusClass = 'high'; statusLabel = '🟡 ВЫСОКАЯ'; }
        } else if (card.id === 'unemployment') {
            if (value > 6) { statusClass = 'critical'; statusLabel = '🔴 ВЫСОКАЯ'; }
            else if (value > 4) { statusClass = 'high'; statusLabel = '🟡 СРЕДНЯЯ'; }
        } else if (card.id === 'pmi') {
            if (value < 50) { statusClass = 'critical'; statusLabel = '🔴 СЖАТИЕ'; }
            else if (value < 55) { statusClass = 'high'; statusLabel = '🟡 СТАБИЛЬНОСТЬ'; }
        } else if (card.id === 'recession') {
            if (value > 50) { statusClass = 'critical'; statusLabel = '🔴 ВЫСОКАЯ'; }
            else if (value > 30) { statusClass = 'high'; statusLabel = '🟡 СРЕДНЯЯ'; }
        }

        let change = '';
        let changeClass = 'neutral';
        if (data.length > 1) {
            const prev = data[data.length - 2];
            if (prev && value !== null) {
                const diff = value - prev[card.key];
                const pct = prev[card.key] !== 0 ? (diff / Math.abs(prev[card.key]) * 100) : 0;
                change = `${diff > 0 ? '+' : ''}${diff.toFixed(2)} (${pct > 0 ? '+' : ''}${pct.toFixed(1)}%)`;
                changeClass = diff > 0 ? 'up' : diff < 0 ? 'down' : 'neutral';
            }
        }

        let forecast = '—';
        if (value !== null) {
            const low = Math.round(value * 0.95 * 100) / 100;
            const high = Math.round(value * 1.05 * 100) / 100;
            forecast = `${low} - ${high}`;
        }

        const displayValue = value !== null ? value : '—';
        const updateTime = data.length > 0 && data[data.length-1].date ? new Date(data[data.length-1].date).toLocaleTimeString('ru-RU') : '—';

        html += `
            <a href="${card.url}" target="_blank" class="card-link">
                <span class="card-number">${card.number}</span>
                <div class="header">
                    <span class="icon">${card.icon}</span>
                    <span class="name">${card.name}</span>
                    <span class="status-dot ${statusClass === 'critical' ? 'bg-critical' : statusClass === 'high' ? 'bg-high' : statusClass === 'medium' ? 'bg-medium' : 'bg-low'}"></span>
                </div>
                <div class="main-value">${typeof displayValue === 'number' ? displayValue.toFixed(2) : displayValue}</div>
                <div class="change ${changeClass}">${change}</div>
                <div class="status-label ${statusClass}">${statusLabel}</div>
                <div class="forecast">📊 ${forecast}</div>
                <div class="source">
                    <span class="src">📌 ${card.source}</span>
                    <span class="updated">🔄 ${updateTime}</span>
                </div>
                <div class="click-hint">🔗 клик для деталей (новая вкладка)</div>
            </a>
        `;
    }

    container.innerHTML = html;
}

// ============================================================
// 7. ГРАФИКИ
// ============================================================
function renderChart(containerId, labelsId, data, key, colorGood, colorBad) {
    const container = document.getElementById(containerId);
    const labelsContainer = document.getElementById(labelsId);

    if (!data || data.length < 2) {
        container.innerHTML = '<span style="color:#4a5a6a;font-size:13px;">Недостаточно данных</span>';
        labelsContainer.innerHTML = '';
        return;
    }

    const values = data.map(d => d[key]);
    const maxVal = Math.max(...values) * 1.1 || 1;
    const minVal = Math.min(...values) * 0.9 || 0;
    const range = maxVal - minVal || 1;

    container.innerHTML = data.map(d => {
        const height = ((d[key] - minVal) / range) * 130 + 10;
        const color = d[key] < 0 ? colorBad : colorGood;
        return `<div class="bar" style="height:${height}px;background:${color};"></div>`;
    }).join('');

    const step = Math.max(1, Math.floor(data.length / 6));
    labelsContainer.innerHTML = data.map((d, i) => {
        if (i % step === 0 || i === data.length - 1) {
            return `<span>${d.date.slice(5)}</span>`;
        }
        return `<span></span>`;
    }).join('');
}

// ============================================================
// 8. ЛЕНТА СОБЫТИЙ
// ============================================================
function renderFeed(notam, gps, trends, vixData, yieldData) {
    const feed = document.getElementById('feedList');
    const events = [];

    for (const n of notam.slice(0, 2)) {
        events.push({ source: 'NOTAM', msg: `${n.region || '—'}: ${n.label || '—'}`, timestamp: n.start || '' });
    }
    for (const n of gps.slice(0, 2)) {
        events.push({ source: 'GPS', msg: `${n.region || '—'}: ${n.label || '—'}`, timestamp: n.start || '' });
    }
    for (const n of trends.slice(0, 2)) {
        events.push({ source: 'TRENDS', msg: `${n.region || '—'}: "${n.keyword || ''}" +${n.change || 0}%`, timestamp: n.start || '' });
    }
    if (vixData.length > 0) {
        const last = vixData[vixData.length - 1];
        events.push({ source: 'VIX', msg: `${last.value.toFixed(2)} (${last.value > 30 ? '🔴 кризис' : '🟢 спокойствие'})`, timestamp: last.date || '' });
    }
    if (yieldData.length > 0) {
        const last = yieldData[yieldData.length - 1];
        events.push({ source: 'YIELD', msg: `${last.spread.toFixed(2)}% (${last.spread < 0 ? '🔴 инверсия' : '🟢 нормально'})`, timestamp: last.date || '' });
    }

    const sourceColors = {
        'NOTAM': 'source-notam',
        'GPS': 'source-gps',
        'TRENDS': 'source-trends',
        'VIX': 'source-vix',
        'YIELD': 'source-yield'
    };

    feed.innerHTML = events.slice(0, 10).map(e => {
        const sourceClass = sourceColors[e.source] || 'source-notam';
        const time = e.timestamp ? new Date(e.timestamp).toLocaleTimeString('ru-RU') : '';
        return `
            <div class="feed-item">
                <span class="source ${sourceClass}">${e.source}</span>
                <span class="msg">${e.msg}</span>
                <span class="time">${time}</span>
            </div>
        `;
    }).join('') || '<div style="color:#4a5a6a;padding:12px;">Нет событий</div>';
}

// ============================================================
// 9. ОБНОВЛЕНИЕ ВСЕХ ДАННЫХ
// ============================================================
async function updateDashboard() {
    try {
        const [notam, gps, trends, vixData, yieldData,
               goldOilData, copperGoldData, bdiData, viirsData, uraniumData,
               bigMacData, debtGdpData, sp500VixData, cryptoFearData,
               oilGasData, goldSilverData, happinessData,
               bigMacAltData, bigMacMainData, vxxData, happinessAltData,
               inflationData, unemploymentData, pmiData, recessionData] = await Promise.all([
            fetchData('/api/notam/'),
            fetchData('/api/gps-jamming/'),
            fetchData('/api/google-trends/'),
            fetchData('/api/vix/'),
            fetchData('/api/yield-curve/'),
            fetchData('/api/gold-oil-ratio/'),
            fetchData('/api/copper-gold/'),
            fetchData('/api/bdi/'),
            fetchData('/api/viirs/'),
            fetchData('/api/uranium/'),
            fetchData('/api/big-mac/'),
            fetchData('/api/debt-gdp/'),
            fetchData('/api/sp500-vix/'),
            fetchData('/api/crypto-fear/'),
            fetchData('/api/oil-gas/'),
            fetchData('/api/gold-silver/'),
            fetchData('/api/happiness/'),
            fetchData('/api/big-mac-alt/'),
            fetchData('/api/big-mac-main/'),
            fetchData('/api/vxx/'),
            fetchData('/api/happiness-alt/'),
            fetchData('/api/inflation/'),
            fetchData('/api/unemployment/'),
            fetchData('/api/pmi/'),
            fetchData('/api/recession/')
        ]);

        const allData = {
            notam, gps, trends, vixData, yieldData,
            goldOilData, copperGoldData, bdiData, viirsData, uraniumData,
            bigMacData, debtGdpData, sp500VixData, cryptoFearData,
            oilGasData, goldSilverData, happinessData,
            bigMacAltData, bigMacMainData, vxxData, happinessAltData,
            inflationData, unemploymentData, pmiData, recessionData
        };

        renderCards(allData);

        const totalCritical = getSeverityCount(notam, 'critical') + getSeverityCount(gps, 'critical') + getSeverityCount(trends, 'critical');
        const totalHigh = getSeverityCount(notam, 'high') + getSeverityCount(gps, 'high') + getSeverityCount(trends, 'high');
        const totalMedium = getSeverityCount(notam, 'medium') + getSeverityCount(gps, 'medium') + getSeverityCount(trends, 'medium');

        document.getElementById('criticalCount').textContent = totalCritical;
        document.getElementById('highCount').textContent = totalHigh;
        document.getElementById('mediumCount').textContent = totalMedium;
        document.getElementById('normalCount').textContent = notam.length + gps.length + trends.length - totalCritical - totalHigh - totalMedium;

        const totalEvents = notam.length + gps.length + trends.length;
        const index = totalEvents > 0 ? Math.round((totalCritical * 70 + totalHigh * 40 + totalMedium * 20) / totalEvents) : 0;
        document.getElementById('globalIndex').textContent = index;

        renderChart('yieldChart', 'yieldLabels', yieldData, 'spread', '#4ade80', '#ef4444');
        renderChart('vixChart', 'vixLabels', vixData, 'value', '#5bc0f8', '#ef4444');

        renderFeed(notam, gps, trends, vixData, yieldData);

    } catch (e) {
        console.error('[Dashboard] Ошибка обновления:', e);
    }
}

// ============================================================
// 10. АВТООБНОВЛЕНИЕ
// ============================================================
updateDashboard();
setInterval(updateDashboard, 30000);
</script>
