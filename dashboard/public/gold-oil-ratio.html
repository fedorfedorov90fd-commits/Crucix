<body>
<header class="topbar">
    <div class="topbar-left"><span class="topbar-brand">💰 ЗОЛОТО/НЕФТЬ</span></div>
    <div class="topbar-right">
        <button class="topbar-btn btn-home" onclick="window.location.href='/jarvis'">← НА ГЛАВНУЮ</button>
        <button class="topbar-btn btn-copy" id="copy-btn">📋 КОПИРОВАТЬ</button>
        <button class="topbar-btn" onclick="window.location.href='/rss-feed'">📡 СПИСОК СТРАНИЦ</button>
      <button class="topbar-btn btn-help" onclick="openHelp()" title="Справка по странице">❓ HELP</button>
      <button class="topbar-btn btn-rss" onclick="window.location.href='/registry'">📡 Список страниц</button>
        <div class="lang-switch">
            <button class="lang-btn active" data-lang="ru" onclick="switchLang('ru')">RU</button>
            <button class="lang-btn" data-lang="en" onclick="switchLang('en')">EN</button>
        </div>
    </div>
</header>
<main class="main-content">
    <div class="page-title">
        💰 Золото / Нефть (WTI)
        <span class="badge" id="statusBadge">🟢 ONLINE</span>
    </div>
    <div class="page-subtitle">Исторический индикатор геополитического риска</div>

    <div class="ratio-display">
        <div class="ratio-value" id="ratioValue">—</div>
        <div class="ratio-label">Соотношение цен на золото и нефть</div>
        <div class="ratio-status" id="ratioStatus">Загрузка...</div>
        <div class="ratio-details">
            <span>Золото: <strong id="goldPrice">—</strong> $/унц</span>
            <span>Нефть WTI: <strong id="oilPrice">—</strong> $/барр</span>
        </div>
    </div>

    <div class="stats-grid" id="statsGrid">
        <div class="stat-card"><div class="label">Записей</div><div class="value" id="totalCount">—</div></div>
        <div class="stat-card"><div class="label">Минимум</div><div class="value" id="minRatio">—</div></div>
        <div class="stat-card"><div class="label">Максимум</div><div class="value" id="maxRatio">—</div></div>
        <div class="stat-card"><div class="label">Среднее</div><div class="value" id="avgRatio">—</div></div>
    </div>

    <div class="chart-container">
        <div class="chart-placeholder" id="chartPlaceholder">📊 График соотношения загружается...</div>
    </div>
</main>
<script>
let currentLang = localStorage.getItem('crucix-lang') || 'ru';
function switchLang(lang) {
    currentLang = lang;
    localStorage.setItem('crucix-lang', lang);
    document.querySelectorAll('.lang-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.lang === lang);
    });
}
document.querySelectorAll('.lang-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.lang === currentLang);
});

document.getElementById('copy-btn').addEventListener('click', function() {
    const text = document.body.innerText;
    navigator.clipboard.writeText(text).then(() => {
        this.textContent = '✅ Скопировано!';
        this.classList.add('copied');
        setTimeout(() => {
            this.textContent = '📋 КОПИРОВАТЬ';
            this.classList.remove('copied');
        }, 3000);
    });
});

async function loadData() {
    try {
        const res = await fetch('/api/gold-oil-ratio/');
        const data = await res.json();
        return data.data || data;
    } catch (e) {
        console.error('[GOLD-OIL] Ошибка:', e);
        return null;
    }
}

function render(data) {
    if (!data || !data.currentRatio) {
        document.getElementById('ratioValue').textContent = '—';
        document.getElementById('ratioStatus').textContent = 'Нет данных';
        return;
    }

    const ratio = data.currentRatio;
    document.getElementById('ratioValue').textContent = ratio.toFixed(2);
    document.getElementById('goldPrice').textContent = data.metrics?.gold?.toFixed(2) || '—';
    document.getElementById('oilPrice').textContent = data.metrics?.oil?.toFixed(2) || '—';

    let status, color;
    if (ratio > 25) {
        status = '🔴 ВЫСОКИЙ РИСК (война)';
        color = '#ef4444';
    } else if (ratio > 20) {
        status = '🟡 СРЕДНИЙ РИСК';
        color = '#f59e0b';
    } else {
        status = '🟢 НОРМАЛЬНО';
        color = '#4ade80';
    }

    const statusEl = document.getElementById('ratioStatus');
    statusEl.textContent = status;
    statusEl.style.background = color + '22';
    statusEl.style.color = color;
    statusEl.style.border = '1px solid ' + color + '33';

    const history = data.history || [];
    if (history.length > 0) {
        const ratios = history.map(d => d.ratio);
        const min = Math.min(...ratios);
        const max = Math.max(...ratios);
        const avg = ratios.reduce((a,b) => a + b, 0) / ratios.length;
        document.getElementById('totalCount').textContent = history.length;
        document.getElementById('minRatio').textContent = min.toFixed(2);
        document.getElementById('maxRatio').textContent = max.toFixed(2);
        document.getElementById('avgRatio').textContent = avg.toFixed(2);
        renderChart(history);
    }
}

function renderChart(history) {
    const container = document.getElementById('chartPlaceholder');
    if (history.length < 2) {
        container.innerHTML = '📊 Недостаточно данных для графика';
        return;
    }

    const values = history.map(d => d.ratio);
    const maxVal = Math.max(...values) * 1.1 || 1;
    const minVal = Math.min(...values) * 0.9 || 0;
    const range = maxVal - minVal || 1;

    let bars = history.map((d, i) => {
        const height = ((d.ratio - minVal) / range) * 150 + 20;
        const color = d.ratio > 25 ? '#ef4444' : d.ratio > 20 ? '#f59e0b' : '#4ade80';
        return `<div style="display:flex;flex-direction:column;align-items:center;flex:1;">
            <div style="width:100%;height:${height}px;background:${color};border-radius:3px 3px 0 0;min-height:4px;"></div>
            <div style="font-size:9px;color:#4a5a6a;margin-top:4px;transform:rotate(-45deg);white-space:nowrap;">${d.date.slice(5)}</div>
        </div>`;
    }).join('');

    container.innerHTML = `
        <div style="display:flex;height:200px;gap:2px;align-items:flex-end;padding:8px 4px;width:100%;overflow-x:auto;">
            ${bars}
        </div>
        <div style="display:flex;justify-content:space-between;font-size:10px;color:#4a5a6a;padding:0 4px;">
            <span>${history[0].date}</span>
            <span>${history[history.length-1].date}</span>
        </div>
    `;
}

async function update() {
    const data = await loadData();
    render(data);
}

update();
setInterval(update, 60000);
</script>
